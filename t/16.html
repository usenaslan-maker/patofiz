<style>
/* Layout: title → type tabs → one-line legend → pathogenesis map on a 5-column grid + explanation panel (docked ≥1100px, bottom sheet below) → comparison table */
:root{
  --bg:#FAFAF7; --node:#FFFFFF; --fg:#2B2B2B; --fg2:#6B6B6B; --line:#D9D9D4; --arrow:#6B6B6B;
  --t-etio:#8C8C8C; --t-main:#3B5BA9; --t-damage:#C8553D; --t-protect:#4E8F6A;
  --t-loop:#C8553D; --t-cross:#9A9A9A; --t-clinic:#B07D2B;
  --d-hemo:#3B7EA1; --d-neuro:#7A5BA6; --d-metab:#C08A2E; --d-immune:#B5536B; --d-cell:#4A8C8C; --d-organ:#6B7B3A;
  --font:"Noto Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1F1C; --node:#2A2B27; --fg:#ECECE8; --fg2:#A9A9A3; --line:#3D3E39; --arrow:#8F908A;
    --t-etio:#989898; --t-main:#4F6BB2; --t-damage:#CE6650; --t-protect:#609A79;
    --t-loop:#CE6650; --t-cross:#A5A5A5; --t-clinic:#B88A40;
    --d-hemo:#4F8BAA; --d-neuro:#876BAF; --d-metab:#C69643; --d-immune:#BC647A; --d-cell:#5C9898; --d-organ:#7A884E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1F1C; --node:#2A2B27; --fg:#ECECE8; --fg2:#A9A9A3; --line:#3D3E39; --arrow:#8F908A;
  --t-etio:#989898; --t-main:#4F6BB2; --t-damage:#CE6650; --t-protect:#609A79;
  --t-loop:#CE6650; --t-cross:#A5A5A5; --t-clinic:#B88A40;
  --d-hemo:#4F8BAA; --d-neuro:#876BAF; --d-metab:#C69643; --d-immune:#BC647A; --d-cell:#5C9898; --d-organ:#7A884E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
.page{max-width:1600px;margin:0 auto;padding-inline:16px;padding-block:24px 40px}
@media (min-width:700px){.page{padding-inline:24px}}
h1{font-size:20px;font-weight:600;margin:0 0 12px;text-wrap:balance}
.lead{font-size:15px;color:var(--fg2);max-width:76ch;margin:0 0 14px;line-height:1.6}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tab{font:inherit;text-align:left;cursor:pointer;background:var(--node);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tab .tn{font-size:15px;font-weight:500;line-height:1.35}
.tab .tv{font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{border:1.5px solid var(--t-main);background:color-mix(in srgb,var(--t-main) 8%,var(--node))}
.tab[aria-selected="true"] .tn{font-weight:600}
.tab:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.legend{display:flex;align-items:center;gap:16px;overflow-x:auto;white-space:nowrap;padding-block:10px;margin-bottom:16px;border-block:1px solid var(--line);font-size:13px;color:var(--fg2)}
.lg{display:inline-flex;align-items:center;gap:6px;flex:none}
.lg-sep{width:1px;height:18px;background:var(--line);flex:none}
.tag{display:inline-block;font-size:13px;font-weight:600;line-height:18px;padding:0 5px;border-radius:6px;color:var(--fg);border:1px solid var(--d);background:color-mix(in srgb,var(--d) 8%,transparent);flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--t);flex:none}
.lg svg{flex:none}

.layout{display:block}
@media (min-width:1100px){.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.canvas{position:relative;margin:0 auto}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

.node{position:absolute;top:0;width:200px;background:var(--node);color:var(--fg);border:1.5px solid var(--d);border-radius:10px;padding:9px 12px 10px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.node.main{border-width:2px}
.node[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--d);background:color-mix(in srgb,var(--d) 8%,var(--node))}
.node:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.node .meta{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;font-weight:500;color:var(--fg2);line-height:18px}
.node .ty{display:inline-flex;align-items:center;gap:6px;min-width:0}
.node .ttl{font-size:14px;font-weight:500;line-height:1.4}
.node .term,.term-txt{font-size:13px;font-style:italic;color:var(--fg2);line-height:1.4}
.faded{opacity:.3}

.e-main path.ln{stroke:var(--arrow)} .e-main .hd{fill:var(--arrow)}
.e-loop path.ln{stroke:var(--t-loop)} .e-loop .hd{fill:var(--t-loop)}
.e-cross path.ln{stroke:var(--t-cross);stroke-dasharray:5 4} .e-cross .hd{fill:var(--t-cross)}
.e-inh path.ln,.e-inh .bar{stroke:var(--t-protect)}
path.ln{fill:none;stroke-width:1.5}
.elabel{font-family:var(--font);font-size:13px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.loop-ic{fill:none;stroke:var(--t-loop);stroke-width:1.5}
.loop-hd{fill:var(--t-loop)}
.loop-lb{font-family:var(--font);font-size:13px;font-weight:500;fill:var(--t-loop);paint-order:stroke;stroke:var(--bg);stroke-width:5px}

.panel{--pd:var(--t-main);position:relative;background:var(--node);border:1px solid var(--line);border-radius:10px;padding:20px 22px 22px 26px;display:none}
.panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pd);border-radius:10px 0 0 10px}
@media (min-width:1100px){
  .panel{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow-y:auto}
  .panel-close{display:none!important}
}
@media (max-width:1099px){
  .panel.open{display:block;position:fixed;left:0;right:0;bottom:0;max-height:60vh;overflow-y:auto;z-index:20;border-radius:10px 10px 0 0;border-bottom:0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .panel.open::before{border-radius:10px 0 0 0}
}
.p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel h2{font-size:20px;font-weight:600;margin:0;line-height:1.35;text-wrap:balance}
.panel-close{font:inherit;font-size:13px;font-weight:600;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:10px;padding:4px 10px;cursor:pointer;flex:none}
.p-dir{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;font-weight:600}
.p-type{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--fg2)}
.p-sec{margin-top:16px}
.p-sec h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);margin:0 0 4px}
.p-sec p{font-size:15px;font-weight:400;line-height:1.6;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:inherit;font-size:13px;color:var(--fg);background:var(--node);border:1px solid var(--d);border-radius:10px;padding:3px 9px;cursor:pointer;text-align:left}
.chip:focus-visible,.panel-close:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.chip-lb{font-size:13px;color:var(--fg2);margin-top:8px}

.cmp{margin-top:28px}
.cmp h2{font-size:15px;font-weight:600;margin:0 0 10px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--node)}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);line-height:1.5}
thead th{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
tbody th{font-weight:600;width:20%}
td{font-weight:400}
.cur{background:color-mix(in srgb,var(--t-main) 8%,transparent)}
thead th.cur{color:var(--fg)}
tbody tr:last-child>*{border-bottom:0}
.groups{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.gtab{font:inherit;font-size:15px;font-weight:500;cursor:pointer;background:transparent;color:var(--fg2);border:1px solid var(--line);border-radius:10px;padding:6px 14px}
.gtab[aria-selected="true"]{color:var(--fg);font-weight:600;border-color:var(--fg);background:var(--node)}
.gtab:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
</style>

/* geometry helpers used by the scheme data */
const hm=(a,b)=>(Math.max(a.t,b.t)+Math.min(a.b,b.b))/2;
const vm=(a,b)=>(Math.max(a.l,b.l)+Math.min(a.r,b.r))/2;
const D=(a,b)=>{const x=vm(a,b);return [[x,a.b],[x,b.t]]};
const Rt=(a,b)=>{const y=hm(a,b);return [[a.r,y],[b.l,y]]};
const Lf=(a,b)=>{const y=hm(a,b);return [[a.l,y],[b.r,y]]};
const BT=(s,t,fo)=>{const x=s.l+s.w*fo,y=t.t-24;return [[x,s.b],[x,y],[t.cx,y],[t.cx,t.t]]};
const ST=(s,t,side,fo)=>{const x=side==='l'?s.l:s.r,y=fo==null?s.cy:s.t+s.h*fo;return [[x,y],[t.cx,y],[t.cx,t.t]]};
const BS=(s,t,side)=>[[s.cx,s.b],[s.cx,t.cy],[side==='l'?t.l:t.r,t.cy]];
const BTo=(s,t,tx)=>[[s.cx,s.b],[s.cx,t.t-20],[tx,t.t-20],[tx,t.t]];
const GX=c=>20+c*236+218; /* vertical corridor between column c and c+1 */
const UPL=(s,t)=>[[s.cx,s.t],[s.cx,t.cy],[t.l,t.cy]];               /* up from s, then right into t's left side */
const RUP=(s,t)=>{const x=GX(3),y=t.t+t.h*.3;return [[s.r,s.cy],[x,s.cy],[x,y],[t.r,y]]}; /* right corridor back up to t */
const LR=(s,t,fo)=>{const y=t.t+t.h*(fo==null?.5:fo);return [[s.cx,s.t],[s.cx,y],[t.l,y]]}; /* up from s, right into t */
const SC=(s,t,c,fo)=>{const y=s.t+s.h*fo,x=GX(c);return [[s.r,y],[x,y],[x,t.cy],[t.l,t.cy]]}; /* from s right side, down corridor c, into t left */
const LUP=(s,t,c,fo)=>{const x=GX(c),y=t.t+t.h*(fo==null?.5:fo);return [[s.l,s.cy],[x,s.cy],[x,y],[t.r,y]]}; /* from s left side, up corridor c, into t right */
</script>

const SCHEMES={
naHyper:{name:"Гипернатриемия",full:"Гипернатриемия",vals:"Na⁺ > 145 ммоль/л · осмолярность ↑",lead:"Na⁺ выше 145 ммоль/л. Чаще всего натрия не больше, а воды меньше. Внеклеточная жидкость становится гиперосмолярной, вода выходит из клеток; наиболее чувствительны клетки мозга.",
nodes:[{"id":"e1","c":0,"r":0,"dir":"metab","type":"etio","t":"Дефицит свободной воды: нарушение жажды, нет доступа к воде","term":"water deprivation","s":["Организм теряет воду или недостаточно пьёт, а количество натрия не меняется.","Жажда — главная защита от гипернатриемии. Пожилые, младенцы и больные без сознания не ощущают жажду или не могут попросить воды.","Растут концентрация Na⁺ и осмолярность плазмы.","Потеря массы тела, сухость слизистых; при сохранённом сознании сильная жажда.","Давать воду; контролировать питьевой режим пожилых и младенцев.","deficit of free water; water deprivation"]},{"id":"e2","c":1,"r":0,"dir":"neuro","type":"etio","t":"Несахарный диабет: центральный и нефрогенный","term":"diabetes insipidus","s":["Почки не реабсорбируют воду и выделяют много разведённой мочи.","При центральной форме не выделяется АДГ. При нефрогенной не отвечают V2-рецепторы (литий, гиперкальциемия, гипокалиемия), поэтому аквапорин-2 не встраивается в собирательную трубку.","Потеря воды превышает потерю солей; при недостаточной жажде развивается гипернатриемия.","Полиурия (более 3 л в сутки), полидипсия, плотность мочи ниже 1005.","Центральная форма: десмопрессин; нефрогенная: тиазиды, ограничение соли и белка.","diabetes insipidus centralis et nephrogenes"]},{"id":"e3","c":3,"r":0,"dir":"hemo","type":"etio","t":"Потеря гипотонической жидкости: пот, осмотический диурез, диарея","term":"hypotonic fluid loss","s":["Воды теряется больше, чем натрия.","Концентрация Na⁺ в поте, кишечном содержимом и моче при осмотическом диурезе (глюкозурия, маннитол) ниже, чем в плазме.","Одновременно развиваются гиповолемия и гипернатриемия.","Потливость, учащённое дыхание, полиурия или диарея; тахикардия.","Устранить причину; сначала восполнить объём, затем дефицит воды.","hypotonic fluid loss"]},{"id":"e4","c":4,"r":0,"dir":"metab","type":"etio","t":"Избыток Na⁺: гипертонический NaCl, NaHCO₃","term":"sodium excess","s":["Натрий поступает без воды или почки задерживают его в избытке.","Введение гипертонического NaCl и NaHCO₃, питьё морской воды; первичный гиперальдостеронизм.","Na⁺ остаётся во внеклеточном пространстве и вытягивает воду из клеток; гипернатриемия сочетается с гиперволемией.","Отёки, артериальная гипертензия, отёк лёгких.","Петлевой диуретик и 5% глюкоза.","hypervolaemic hypernatraemia"]},{"id":"main","c":2,"r":1,"dir":"metab","type":"main","t":"Внеклеточная гиперосмолярность: Na⁺ > 145","term":"hyperosmolality","s":["Осмолярность внеклеточной жидкости превышает 295 мОсм/кг.","Na⁺ — эффективный осмоль, который не проходит свободно через мембрану клеток, поэтому он притягивает воду к себе.","Вода по осмотическому градиенту выходит из клеток: клеточная дегидратация.","Na⁺ > 145 ммоль/л, осмолярность > 295 мОсм/кг.","Дефицит воды = масса × 0,6 × (Na⁺/140 − 1). Na⁺ снижают не быстрее 10–12 ммоль/л в сутки.","hypernatraemia"]},{"id":"osm","c":0,"r":2,"dir":"cell","type":"protect","t":"Клетки мозга накапливают идиогенные осмоли","term":"idiogenic osmoles","s":["За 1–3 суток клетки мозга накапливают осмолиты: миоинозитол, таурин, глутамин.","Чтобы повысить внутриклеточную осмолярность и вернуть воду в клетку.","При хронической гипернатриемии объём мозга восстанавливается, неврологические симптомы смягчаются.","При медленном развитии гипернатриемии сознание может сохраняться даже при высоком Na⁺.","Осмоли удаляются медленно, поэтому Na⁺ снижают медленно.","idiogenic osmoles; organic osmolytes"]},{"id":"bed","c":0,"r":3,"dir":"organ","type":"damage","t":"Отёк мозга при быстрой коррекции","term":"cerebral oedema","s":["Во время лечения развивается отёк мозга.","Если внешняя осмолярность быстро падает, а осмоли остаются в клетках, вода стремительно входит в клетки.","Судороги, нарушение сознания; возможна смерть.","Внезапные судороги у больного, которому до этого становилось лучше.","Снижать Na⁺ не быстрее 0,5 ммоль/л в час и 10–12 ммоль/л в сутки.","oedema cerebri"]},{"id":"shr","c":2,"r":2,"dir":"cell","type":"main","t":"Вода выходит из клеток, клетки сморщиваются","term":"cellular dehydration","s":["Объём клеток уменьшается, цитоплазма сгущается.","Осмолярность наружной среды высокая, вода выходит из клеток.","Нарушается работа ферментов и цитоскелета; наиболее чувствительны нейроны.","Язык и слизистые очень сухие.","Постепенно восполнять дефицит воды.","dehydratio intracellularis"]},{"id":"brn","c":2,"r":3,"dir":"organ","type":"damage","t":"Мозг уменьшается, сознание угнетается","term":"hyperosmolar encephalopathy","s":["Объём мозга уменьшается, нарушается функция нейронов.","Клетки мозга теряют воду; мозг отходит от костей черепа, мостовые вены натягиваются.","Угнетение сознания. При разрыве вен — субдуральные, субарахноидальные и внутримозговые кровоизлияния.","Возбуждение, сонливость, гиперрефлексия, судороги, кома.","Неврологический контроль, медленная коррекция Na⁺.","encephalopathia hyperosmolaris"]},{"id":"nth","c":1,"r":3,"dir":"neuro","type":"damage","t":"Жажда не ощущается, вода не выпивается","term":"hypodipsia","s":["Больной не испытывает жажды или не может попросить воды.","При угнетении сознания ослабевают центр жажды и питьевое поведение.","Дефицит воды углубляется, гипернатриемия нарастает сама собой: порочный круг.","Часто у пожилых в стационаре: жалоб на жажду нет, Na⁺ продолжает расти.","Активное введение воды (внутрь или в/в) разрывает круг.","hypodipsia"]},{"id":"osr","c":3,"r":2,"dir":"neuro","type":"protect","t":"Осморецепторы: жажда, АДГ ↑","term":"osmotic thirst","s":["Осморецепторы гипоталамуса вызывают жажду и усиливают выделение АДГ.","При росте осмолярности на 1–2% клетки-рецепторы сморщиваются и подают сигнал.","Человек пьёт воду, почки её задерживают: главная компенсация.","При сохранённом сознании сильная жажда.","Обеспечить возможность пить.","osmoreceptors; vasopressin"]},{"id":"ret","c":3,"r":3,"dir":"neuro","type":"protect","t":"Почки задерживают воду: моча концентрированная","term":"antidiuresis","s":["Почки выделяют мало концентрированной мочи.","АДГ → V2-реце оль/л глюкозы прибавлять к Na⁺ 1,6–2,4 ммоль/л.","pseudohyponatraemia; translocational hyponatraemia"]},{"id":"main","c":2,"r":1,"dir":"metab","type":"main","t":"Гипоосмолярность плазмы: Na⁺ < 135","term":"hypo-osmolality","s":["Внеклеточная жидкость становится гипотонической.","Свободной воды задерживается больше, чем натрия, или натрия теряется больше.","Вода входит в клетки: клеточная гипергидратация.","Na⁺ < 135 ммоль/л, осмолярность < 275 мОсм/кг.","По причине: восполнение объёма, ограничение воды или гипертонический NaCl. Na⁺ повышают не быстрее 8–10 ммоль/л в сутки.","hyponatraemia"]},{"id":"osl","c":0,"r":2,"dir":"cell","type":"protect","t":"Клетки мозга выводят осмолиты","term":"regulatory volume decrease","s":["Клетки мозга сначала выводят K⁺ и Cl⁻, затем за 24–48 часов органические осмолиты.","Чтобы снизить внутриклеточную осмолярность и вывести воду из клетки.","При хронической гипонатриемии отёк мозга невелик.","При медленном развитии симптомы могут быть лёгкими.","Осмолиты восстанавливаются медленно, поэтому Na⁺ повышают медленно.","regulatory volume decrease"]},{"id":"ods","c":0,"r":3,"dir":"organ","type":"damage","t":"Осмотическая демиелинизация при быстрой коррекции","term":"osmotic demyelination syndrome","s":["Во время лечения повреждается миелин ствола мозга.","Клетки, бедные осмолитами, при быстром росте Na⁺ стремительно теряют воду.","Гибнут олигодендроциты, развивается центральный понтинный миелинолиз; часто необратимо.","Через 2–6 дней после лечения дизартрия, дисфагия, тетрапарез.","Повышать Na⁺ не быстрее 8–10 ммоль/л в сутки; при слишком быстром росте — десмопрессин и 5% глюкоза.","myelinolysis pontina centralis"]},{"id":"swl","c":2,"r":2,"dir":"cell","type":"main","t":"Вода входит в клетки, клетки набухают","term":"cellular overhydration","s":["Клетки наполняются водой, объём их увеличивается.","Осмотический градиент направляет воду в клетку.","Мембраны и органеллы растягиваются, их функция нарушается.","Мышечные судороги, слабость.","Пос overview:[["Что происходит","Свободной воды задерживается больше, чем натрия, или натрия теряется больше. Плазма становится гипоосмолярной, вода входит в клетки."],["Главное звено","Гипоосмолярность плазмы и клеточная гипергидратация; самое опасное — отёк мозга."],["Компенсация","Клетки мозга за 24–48 часов выводят осмолиты и уменьшают отёк. Но эта адаптация при быстрой коррекции ведёт к демиелинизации."],["Порочный круг","Отёк мозга вызывает рвоту, теряется соль, больной пьёт пресную воду, гипонатриемия углубляется. При гиперволемической форме неосмотический АДГ продолжает задерживать воду."],["Точка лечения","При гиповолемии 0,9% NaCl; при СНСАДГ ограничение воды; при тяжёлых симптомах 3% NaCl. Na⁺ повышают не быстрее 8–10 ммоль/л в сутки."]]},
kHyper:{name:"Гиперкалиемия",full:"Гиперкалиемия",vals:"K⁺ > 5,0–5,5 ммоль/л · деполяризация",lead:"K⁺ плазмы выше 5,0–5,5 ммоль/л. Мембраны клеток деполяризуются: возбудимость сначала растёт, затем исчезает. Самое опасное электролитное нарушение для сердца: асистолия может развиться внезапно.",
nodes:[{"id":"e1","c":0,"r":0,"dir":"organ","type":"etio","t":"Экскреция почками ↓: ОПП, ХБП, гипоальдостеронизм","term":"reduced renal excretion","s":["Почки не могут вывести достаточно калия.","Выведение K⁺ зависит от альдостерона в собирательной трубке и от потока Na⁺ и жидкости в дистальный отдел. При СКФ ниже 15–20 мл/мин или дефиците альдостерона этот путь слабеет.","Ежедневно поступающий K⁺ накапливается.","Олигурия, азотемия; при ПКА IV типа гиперхлоремический ацидоз.","Связывающие K⁺ препараты, петлевой диуретик, диализ.","reduced renal potassium excretion"]},{"id":"e2","c":1,"r":0,"dir":"neuro","type":"etio","t":"Лекарства: иАПФ, БРА, спиронолактон, НПВС","term":"drug-induced hyperkalaemia","s":["Препараты тормозят РААС или каналы ENaC собирательной трубки.","Когда действие альдостерона и реабсорбция Na⁺ снижаются, отрицательный заряд просвета слабеет и секреция K⁺ падает. Триметоприм и амилорид блокируют ENaC напрямую.","Гиперкалиемия, особенно при ХБП и сахарном диабете.","Часто бессимптомно; выявляется по анализу.","Отменить препарат или снизить дозу, контролировать K⁺.","drug-induced hyperkalaemia"]},{"id":"e3","c":3,"r":0,"dir":"cell","type":"etio","t":"Выход из клеток: ацидоз, дефицит инсулина, распад клеток","term":"transcellular shift","s":["Внутриклеточный K⁺ (98% всего запаса) переходит наружу.","Тормозится Na⁺/K⁺-АТФаза (дефицит инсулина, β-блокаторы, дигоксин), идёт обмен H⁺/K⁺, разрушаются клетки (рабдомиолиз, лизис опухоли, гемолиз).","Даже при малом общем запасе K⁺ в плазме может быть высоким (диабетический кетоацидоз).","Признаки основного заболевания.","Лечить причину: инсулин, коррекция ацидоза, профилактика лизиса опухоли.","transcellular potassium shift"]},{"id":"e4","c":4,"r":0,"dir":"metab","type":"etio","t":"Ложная гиперкалиемия: гемолиз, тромбоцитоз","term":"pseudohyperkalaemia","s":["K⁺ выходит из клеток в пробирке.","Сжатие кулака при заборе крови, гемолиз, большое число тромбоцитов и лейкоцитов.","В организме гиперкалиемии нет.","ЭКГ не изменена.","Повторить анализ; оценить ЭКГ.","pseudohyperkalaemia"]},{"id":"main","c":2,"r":1,"dir":"cell","type":"main","t":"Деполяризация мембран: K⁺ > 5,5","term":"membrane depolarisation","s":["Мембранный потенциал покоя приближается к нулю (например, с −90 до −80 мВ).","По уравнению Нернста потенциал покоя определяется в основном градиентом K⁺; при росте наружного K⁺ градиент уменьшается.","Возбудимость сначала растёт, затем Na⁺-каналы инактивируются и она исчезает.","K⁺ > 5,5 ммоль/л; выше 6,5 — угроза жизни.","Глюконат кальция повышает пороговый потенциал и стабилизирует мембрану (уровень K⁺ не меняет).","hyperkalaemia"]},{"id":"nai","c":0,"r":2,"dir":"cell","type":"damage","t":"Инактивация Na⁺-каналов","term":"Na⁺ channel inactivation","s":["При длительной деполяризации инактивационные ворота Na⁺-каналов остаются закрытыми.","Каналы не возвращаются в состояние покоя.","Потенциал действия слабый и медленный: деполяризационный блок.","Мышечная слабость, замедление проведения.","Глюконат кальция временно восстанавливает работу Na⁺-каналов.","depolarisation block"]},{"id":"wk","c":0,"r":3,"dir":"organ","type":"damage","t":"Нервно-мышечная слабость, паралич","term":"flaccid paralysis","s":["Восходящая слабость, начинающаяся с ног, вялый паралич.","Деполяризационный блок скелетных мышц и периферических нервов.","В тяжёлых случаях слабеют дыхательные мышцы.","Парестезии, снижение рефлексов.","Срочно снизить K⁺.","paralysis flaccida ascendens"]},{"id":"amm","c":2,"r":2,"dir":"metab","type":"damage","t":"В почках тормозится аммониогенез","term":"suppressed ammoniagenesis","s":["В проксимальном канальце уменьшается образование NH₄⁺ из глутамина.","Гиперкалиемия тормозит ферменты аммониогенеза.","Почки выводят меньше кислоты.","В моче мало NH₄⁺.","При снижении K⁺ аммониогенез восстанавливается.","suppressed renal ammoniagenesis"]},{"id":"acd","c":2,"r":3,"dir":"metab","type":"damage","t":"Метаболический ацидоз","term":"metabolic acidosis","s":["HCO₃⁻ крови уменьшается, pH падает.","Почки не выводят H⁺ в виде NH₄⁺.","Ацидоз выводит K⁺ из клеток: порочный круг.","Ацидоз с нормальной анионной разницей, дыхание Куссмауля.","При тяжёлом ацидозе NaHCO₃.","acidosis metabolica; renal tubular acidosis type IV"]},{"id":"hk","c":1,"r":3,"dir":"cell","type":"damage","t":"H⁺ входит в клетки, K⁺ выходит","term":"H⁺/K⁺ exchange","s":["При ацидозе ионы водорода входят в клетки, взамен выходит K⁺.","Сохраняется электронейтральность; при минеральном ацидозе этот обмен выражен.","K⁺ плазмы растёт ещё больше: гиперкалиемия усиливается.","При снижении pH на 0,1 K⁺ может вырасти примерно на 0,6 ммоль/л.","Коррекция ацидоза разрывает круг.","transmineralisation in acidosis"]},{"id":"rep","c":3,"r":2,"dir":"cell","type":"damage","t":"Реполяризация ускоряется, проведение замедляется","term":"accelerated repolarisation","s":["В кардиомиоцитах усиливаются калиевые токи (IKr).","При высоком наружном K⁺ проводимость K⁺-каналов растёт; инактивация Na⁺-каналов замедляет деполяризацию.","Потенциал действия укорачивается, импульс проводится медленно.","На ЭКГ высокий заострённый зубец T.","Глюконат кальция 10% 10 мл в/в.","accelerated repolarisation"]},{"id":"hrt","c":3,"r":3,"dir":"organ","type":"damage","t":"Сердце: острый T, расширение QRS, асистолия","term":"conduction disturbances","s":["Стадии ЭКГ: острый T → удлинение PR, исчезновение P → расширение QRS → синусоида → фибрилляция желудочков или асистолия.","Деполяризация кардиомиоцитов и инактивация Na⁺-каналов.","Возможна внезапная остановка сердца.","Брадикардия, AV-блокада.","При изменениях ЭКГ немедленно глюконат кальция, затем перемещение K⁺ в клетки.","sine wave pattern; asystolia"]},{"id":"ald","c":4,"r":2,"dir":"neuro","type":"protect","t":"Выделение альдостерона и инсулина ↑","term":"aldosterone, insulin","s":["K⁺ стимулирует клубочковую зону надпочечников и β-клетки поджелудочной железы.","Клетки клубочковой зоны деполяризуются, входит Ca²⁺, синтез альдостерона растёт.","Почки выводят больше K⁺, инсулин перемещает K⁺ в клетки.","При гипоальдостеронизме и диабете это звено слабое.","Инсулин 10 ЕД + глюкоза в/в; ингаляция сальбутамола.","aldosterone and insulin release"]},{"id":"shf","c":4,"r":3,"dir":"neuro","type":"protect","t":"K⁺ выводится с мочой и уходит в клетки","term":"potassium elimination","s":["В собирательной трубке активируются ENaC и ROMK; Na⁺/K⁺-АТФаза закачивает K⁺ в клетки.","Действие альдостерона и инсулина.","K⁺ плазмы снижается.","K⁺ мочи растёт.","Петлевой диуретик, циклосиликат циркония натрия, гемодиализ.","kaliuresis; intracellular potassium shift"]},{"id":"k1","c":0,"r":4,"dir":"organ","type":"clinic","t":"Слабость, парестезии, вялый паралич","term":"neuromuscular signs","s":["Нервно-мышечные признаки.","Деполяризационный блок.","Обычно при K⁺ выше 7 ммоль/л.","Восходящая слабость, снижение рефлексов.","Снизить K⁺.","neuromuscular disturbances"]},{"id":"k2","c":2,"r":4,"dir":"metab","type":"clinic","t":"Ацидоз: дыхание Куссмауля","term":"Kussmaul breathing","s":["Признаки ацидоза.","Дыхательный центр реагирует на рост H⁺.","Глубокое шумное дыхание.","pH < 7,35, HCO₃⁻ снижен.","Коррекция ацидоза.","Kussmaul respiration"]},{"id":"k3","c":3,"r":4,"dir":"organ","type":"clinic","t":"Брадикардия, AV-блокада, остановка сердца","term":"cardiac signs","s":["Сердечные признаки.","Нарушение проведения.","Асистолия или фибрилляция желудочков.","Изменения ЭКГ не всегда соответствуют уровню K⁺.","Порядок: 1) глюконат кальция; 2) инсулин + глюкоза, сальбутамол; 3) диуретик, связывающий K⁺ препарат, диализ.","cardiac arrest"]}],

overview:[["Что происходит","Внеклеточный K⁺ растёт, мембраны деполяризуются. Нарушается возбудимость нервов, мышц и миокарда."],["Главное звено","Деполяризация мембран и инактивация Na⁺-каналов."],["Компенсация","K⁺ стимулирует выделение альдостерона и инсулина: почки выводят K⁺, клетки его поглощают."],["Порочный круг","Гиперкалиемия тормозит аммониогенез и вызывает ацидоз; ацидоз выводит K⁺ из клеток."],["Точка лечения","1) Глюконат кальция — защита мембран; 2) инсулин + глюкоза, сальбутамол — перемещение в клетки; 3) диуретик, связывающие K⁺ препараты, диализ — выведение."]]},
kHypo:{name:"Гипокалиемия",full:"Гипокалиемия",vals:"K⁺ < 3,5 ммоль/л · гиперполяризация",lead:"K⁺ плазмы ниже 3,5 ммоль/л. Мембраны мышц гиперполяризуются, возбудимость падает, а в сердце удлиняется реполяризация и растёт риск аритмий. Самые частые причины — диуретики и потери через ЖКТ.",
nodes:[{"id":"e1","c":0,"r":0,"dir":"organ","type":"etio","t":"Потери почками: диуретики, гипомагниемия","term":"renal potassium loss","s":["С мочой выводится более 20 ммоль K⁺ в сутки.","При диуретиках в дистальный отдел поступает много Na⁺ и воды: Na⁺ входит через ENaC, K⁺ выходит через ROMK. При дефиците Mg²⁺ снимается Mg²⁺-блок ROMK. Так же действуют синдромы Барттера и Гительмана.","Общий запас K⁺ уменьшается.","Полиурия, мышечная слабость.","Калийсберегающие диуретики, коррекция дефицита Mg²⁺.","renal potassium wasting"]},{"id":"e2","c":1,"r":0,"dir":"neuro","type":"etio","t":"Избыток минералокортикоидов: синдромы Конна, Кушинга","term":"hyperaldosteronism","s":["Альдостерон или сходное действие усиливают выведение K⁺ в собирательной трубке.","При синдроме Конна аденома бесконтрольно выделяет альдостерон; глицирризин солодки тормозит 11β-ГСД2 и позволяет кортизолу активировать минералокортикоидный рецептор.","Гипокалиемия, артериальная гипертензия и метаболический алкалоз.","Гипертензия, слабость, полиурия.","Спиронолактон, эплеренон; удаление аденомы.","hyperaldosteronismus primarius (Conn syndrome)"]},{"id":"e3","c":3,"r":0,"dir":"organ","type":"etio","t":"Потери через ЖКТ: рвота, диарея","term":"gastrointestinal loss","s":["При диарее K⁺ теряется прямо с калом.","В желудочном соке K⁺ мало; при рвоте основная потеря идёт через почки, потому что алкалоз и гиповолемия повышают альдостерон.","При диарее гипокалиемия сочетается с ацидозом, при рвоте — с алкалозом.","Рвота, диарея, дегидратация.","Восполнение жидкости и KCl.","gastrointestinal potassium loss"]},{"id":"e4","c":4,"r":0,"dir":"cell","type":"etio","t":"Переход в клетки: алкалоз, инсулин, β2-агонисты","term":"transcellular shift","s":["K⁺ переходит из внеклеточного пространства в клетки.","Активируется Na⁺/K⁺-АТФаза: инсулин (лечение ДКА), β2-агонисты, тиреотоксикоз; при алкалозе H⁺ выходит из клеток, K⁺ входит.","Общий запас нормален, но K⁺ плазмы низкий.","Приступы периодического паралича.","Устранить причину; при лечении ДКА контролировать K⁺.","transcellular potassium shift"]},{"id":"main","c":2,"r":1,"dir":"cell","type":"main","t":"Гиперполяризация мембран: K⁺ < 3,5","term":"membrane hyperpolarisation","s":["Потенциал покоя клеток скелетных и гладких мышц становится более отрицательным.","По уравнению Нернста градиент K⁺ увеличивается.","Достичь порога труднее, возбудимость мышц падает. В сердце проводимость K⁺ снижается и реполяризация удлиняется.","K⁺ < 3,5 ммоль/л; ниже 2,5 — тяжёлая форма.","KCl внутрь или в/в; одновременно корригировать дефицит Mg²⁺.","hypokalaemia"]},{"id":"exc","c":0,"r":2,"dir":"cell","type":"damage","t":"Возбудимость мышц ↓","term":"reduced excitability","s":["Клетки скелетных и гладких мышц плохо возбуждаются.","Гиперполяризация: разница между потенциалом покоя и порогом растёт.","Сокращение мышц ослабевает.","Гипорефлексия.","Восполнение K⁺.","hyperpolarisation block"]},{"id":"msc","c":0,"r":3,"dir":"organ","type":"damage","t":"Мышечная слабость, парез кишечника","term":"myopathy, paralytic ileus","s":["Слабость скелетных мышц, угнетение моторики кишечника.","Гиперполяризация и снижение кровотока в мышцах (K⁺ — местный вазодилататор).","При K⁺ < 2,5 ммоль/л рабдомиолиз, слабость дыхательных мышц.","Слабость, миалгии, запор, вздутие живота.","Восполнение K⁺; в тяжёлых случаях мониторинг.","myopathia hypokalaemica; ileus paralyticus"]},{"id":"hs","c":2,"r":2,"dir":"metab","type":"damage","t":"Секреция H⁺ и реабсорбция HCO₃⁻ в канальцах ↑","term":"increased H⁺ secretion","s":["Почки выводят H⁺ вместо K⁺.","Гипокалиемия активирует H⁺/K⁺-АТФазу собирательной трубки и усиливает аммониогенез в проксимальном канальце.","На каждый выведенный H⁺ в кровь возвращается один HCO₃⁻.","Кислая моча, несмотря на алкалоз.","Восполнение K⁺.","increased renal acidification"]},{"id":"alk","c":2,"r":3,"dir":"metab","type":"damage","t":"Метаболический алкалоз","term":"metabolic alkalosis","s":["HCO₃⁻ крови растёт, pH повышается.","Почки задерживают HCO₃⁻ и теряют H⁺.","Алкалоз перемещает K⁺ в клетки: порочный круг.","pH > 7,45, HCO₃⁻ > 26 ммоль/л.","KCl одновременно восполняет дефицит K⁺ и Cl⁻.","alkalosis metabolica"]},{"id":"kin","c":1,"r":3,"dir":"cell","type":"damage","t":"K⁺ входит в клетки, почки теряют K⁺","term":"potassium redistribution","s":["При алкалозе H⁺ выходит из клеток, K⁺ входит; почки выводят больше K⁺.","Электронейтральность; алкалоз усиливает секрецию K⁺ в дистальном канальце.","K⁺ плазмы снижается ещё больше.","Если алкалоз сохраняется, K⁺ быстро падает даже после восполнения.","Корригировать алкалоз и дефицит K⁺ вместе.","transmineralisation in alkalosis"]},{"id":"rep","c":3,"r":2,"dir":"cell","type":"damage","t":"В кардиомиоцитах реполяризация замедляется","term":"delayed repolarisation","s":["Проводимость K⁺-каналов кардиомиоцитов снижается.","Каналы IKr плохо работают при низком наружном K⁺.","Потенциал действия удлиняется; ранние и поздние следовые деполяризации вызывают эктопический ритм.","Интервал QT(U) удлиняется.","Мониторинг; избегать препаратов, удлиняющих QT.","delayed repolarisation; triggered activity"]},{"id":"arr","c":3,"r":3,"dir":"organ","type":"damage","t":"Аритмии: зубец U, удлинение QT(U)","term":"arrhythmias","s":["ЭКГ: T уплощается, появляется зубец U, ST снижается, QT(U) удлиняется.","Удлинение реполяризации и эктопическая активность.","Экстрасистолы, тахикардия типа «пируэт», фибрилляция желудочков.","Перебои в работе сердца, головокружение.","У принимающих дигоксин держать K⁺ > 4,0 ммоль/л: гипокалиемия усиливает токсичность гликозидов.","U wave; torsades de pointes"]},{"id":"sav","c":4,"r":2,"dir":"neuro","type":"protect","t":"Почки сберегают K⁺: альдостерон ↓","term":"renal potassium conservation","s":["Альдостерон снижается, в собирательной трубке активируется H⁺/K⁺-АТФаза.","Гипокалиемия тормозит клубочковую зону.","При внепочечной причине K⁺ мочи меньше 20 ммоль в сутки.","K⁺ в моче низкий.","K⁺ мочи — первый тест для поиска причины.","renal potassium conservation"]},{"id":"nep","c":4,"r":3,"dir":"organ","type":"damage","t":"Калиопеническая нефропатия","term":"kaliopenic nephropathy","s":["Почки не могут концентрировать мочу.","Снижаются экспрессия аквапорина-2 и чувствительность к АДГ.","Нефрогенный несахарный диабет; при длительной гипокалиемии интерстициальный фиброз, кисты.","Полиурия, полидипсия, никтурия.","Восполнение K⁺; функция восстанавливается постепенно.","nephropathia kaliopenica"]},{"id":"k1","c":0,"r":4,"dir":"organ","type":"clinic","t":"Слабость, судороги, запор","term":"muscular signs","s":["Мышечные признаки.","Гиперполяризация и ишемия мышц.","В тяжёлой форме паралич и рабдомиолиз.","Слабость мышц ног, миалгии, вздутие живота.","Восполнение K⁺.","muscle weakness; constipation"]},{"id":"k2","c":2,"r":4,"dir":"metab","type":"clinic","t":"Алкалоз: HCO₃⁻ ↑, pH > 7,45","term":"alkalosis","s":["Изменение кислотно-основного состояния.","Почки задерживают HCO₃⁻.","В порядке компенсации дыхание замедляется.","pH > 7,45, HCO₃⁻ высокий, PaCO₂ слегка повышен.","KCl.","alkalosis metabolica"]},{"id":"k3","c":3,"r":4,"dir":"organ","type":"clinic","t":"Экстрасистолия, тахикардия «пируэт»","term":"rhythm disturbances","s":["Нарушения ритма сердца.","Реполяризация удлиняется, появляются эктопические очаги.","Риск внезапной смерти.","ЭКГ: зубец U, удлинение QT(U).","KCl в/в в периферическую вену не быстрее 10–20 ммоль/ч; сульфат магния.","arrhythmia"]},{"id":"k4","c":4,"r":4,"dir":"organ","type":"clinic","t":"Полиурия, полидипсия","term":"polyuria","s":["Обильное мочеиспускание, жажда.","Снижение концентрационной способности почек.","Риск дегидратации.","Низкая плотность мочи.","Восполнение K⁺.","polyuria; polydipsia"]}],

overview:[["Что происходит","Внеклеточный K⁺ снижается, мембраны мышц гиперполяризуются; в сердце удлиняется реполяризация."],["Главное звено","Гиперполяризация мембран и увеличение градиента K⁺."],["Компенсация","Альдостерон снижается, почки сберегают K⁺ через H⁺/K⁺-АТФазу."],["Порочный круг","Гипокалиемия усиливает выведение H⁺ почками и вызывает алкалоз; алкалоз перемещает K⁺ в клетки и усиливает его потерю почками."],["Точка лечения","KCl внутрь или в/в (в периферическую вену ≤ 10–20 ммоль/ч), коррекция дефицита Mg²⁺, калийсберегающие диуретики."]]},

nodes:[{"id":"e1","c":0,"r":0,"dir":"hemo","type":"etio","t":"Массивная инфузия 0,9% NaCl","term":"saline infusion","s":["При введении больших объёмов физраствора в плазму поступает избыток Cl⁻.","В растворе 154 ммоль/л Cl⁻, примерно в 1,5 раза больше, чем в плазме; его разница сильных ионов (SID) равна нулю.","SID плазмы уменьшается, развивается дилюционный гиперхлоремический ацидоз.","Часто у больных в реанимации и хирургии.","Сбалансированные кристаллоиды (Рингер-лактат, Плазма-Лит).","dilutional hyperchloraemic acidosis"]},{"id":"e2","c":1,"r":0,"dir":"metab","type":"etio","t":"Потеря HCO₃⁻: диарея, свищи, ПКА II типа","term":"bicarbonate loss","s":["Организм теряет бикарбонат.","При диарее, кишечных и панкреатических свищах HCO₃⁻ уходит с кишечным содержимым, при проксимальном ПКА и ацетазоламиде — с мочой.","Для сохранения электронейтральности почки задерживают Cl⁻ вместо HCO₃⁻.","Диарея, дегидратация.","Лечение причины; бикарбонат или цитрат.","bicarbonate loss; proximal RTA"]},{"id":"e3","c":3,"r":0,"dir":"organ","type":"etio","t":"Почки не выводят кислоту: ПКА I и IV типа","term":"renal tubular acidosis","s":["Почки недостаточно выводят H⁺ и NH₄⁺.","При I типе нарушена H⁺-АТФаза собирательной трубки; при IV типе не хватает альдостерона или он не действует; в ранней стадии ХБП снижается аммониогенез.","Ацидоз с нормальной анионной разницей; анионная разница мочи положительная.","Нефрокальциноз (I тип), гиперкалиемия (IV тип).","Цитрат, бикарбонат; при IV типе флудрокортизон, ограничение K⁺.","renal tubular acidosis"]},{"id":"e4","c":4,"r":0,"dir":"metab","type":"etio","t":"Дегидратация; компенсация респираторного алкалоза","term":"haemoconcentration","s":["Вода теряется и Cl⁻ концентрируется, или почки выводят HCO₃⁻ и задерживают Cl⁻.","При дефиците свободной воды концентрируются все ионы; при хронической гипервентиляции почки выводят HCO₃⁻, чтобы нормализовать pH.","Cl⁻ растёт вместе с Na⁺ или замещает HCO₃⁻.","Признаки гипернатриемии или гипервентиляция.","Восполнить воду; устранить причину гипервентиляции.","haemoconcentration; compensated respiratory alkalosis"]},{"id":"main","c":2,"r":1,"dir":"metab","type":"main","t":"Cl⁻ > 107: HCO₃⁻ вытесняется, ацидоз","term":"hyperchloraemic acidosis","s":["При росте Cl⁻ в плазме снижается HCO₃⁻.","Закон электронейтральности: сумма катионов равна сумме анионов. По концепции Стюарта при уменьшении SID (Na⁺ + K⁺ − Cl⁻) растёт H⁺.","pH снижается; анионная разница (Na⁺ − Cl⁻ − HCO₃⁻) нормальная, 8–12 ммоль/л.","Cl⁻ > 107 ммоль/л, HCO₃⁻ < 22 ммоль/л.","Лечение причины; ограничить растворы, богатые хлором.","hyperchloraemic normal anion gap acidosis"]},{"id":"buf","c":0,"r":2,"dir":"metab","type":"damage","t":"Расходуются буферы, pH ↓","term":"buffer depletion","s":["Бикарбонатный, белковый и фосфатный буферы связывают H⁺.","Ёмкость буферов ограничена.","При pH < 7,2 нарушается работа клеточных ферментов и рецепторов.","BE отрицательный.","При pH < 7,1 или HCO₃⁻ < 10–12 ммоль/л — NaHCO₃.","buffer depletion"]},{"id":"kout","c":0,"r":3,"dir":"hemo","type":"damage","t":"K⁺ выходит из клеток, миокард угнетается","term":"hyperkalaemia, myocardial depression","s":["При минеральном ацидозе H⁺ входит в клетки, K⁺ выходит; сократимость миокарда снижается.","Cl⁻ плохо проникает в клетки, поэтому H⁺ обменивается на K⁺. H⁺ конкурирует с Ca²⁺ за связывание с тропонином.","Гиперкалиемия, снижение сердечного выброса и ответа на катехоламины.","Гипотензия, аритмии.","Коррекция ацидоза, контроль K⁺.","hyperkalaemia in acidosis; myocardial depression"]},{"id":"tgf","c":2,"r":2,"dir":"cell","type":"damage","t":"Плотное пятно: сужение афферентной артериолы","term":"tubuloglomerular feedback","s":["Клетки плотного пятна (macula densa) воспринимают рост Cl⁻.","Cl⁻ входит через NKCC2, выделяется аденозин, афферентная артериола сужается.","Почечный кровоток и СКФ снижаются.","Диурез уменьшается.","Ограничить растворы, богатые хлором.","tubuloglomerular feedback"]},{"id":"olg","c":2,"r":3,"dir":"hemo","type":"damage","t":"Перфузия почек ↓, олигурия, гипотензия","term":"oliguria","s":["Перфузия коры почек падает, мочи выделяется мало.","Почечная вазоконстрикция и действие ацидоза на сосуды.","Растёт риск ОПП.","Олигурия, рост креатинина, гипотензия.","Сбалансированный раствор, контроль гемодинамики.","renal vasoconstriction; oliguria"]},{"id":"mor","c":1,"r":3,"dir":"hemo","type":"damage","t":"Олигурию считают нехваткой жидкости и снова вводят NaCl","term":"iatrogenic vicious circle","s":["Врач принимает олигурию и гипотензию за гиповолемию и вводит ещё физраствор.","Олигурия от действия хлора похожа на дефицит объёма.","Cl⁻ растёт дальше, ацидоз углубляется: ятрогенный порочный круг.","Несмотря на инфузию, диурез не растёт.","Перейти на сбалансированные растворы, контролировать КОС.","iatrogenic vicious circle"]},{"id":"chm","c":3,"r":2,"dir":"neuro","type":"protect","t":"Хеморецепторы: гипервентиляция","term":"respiratory compensation","s":["Периферические и центральные хеморецепторы воспринимают рост H⁺ и углубляют дыхание.","Дыхательный центр реагирует на снижение pH.","CO₂ выводится больше.","Глубокое шумное дыхание Куссмауля.","Для оценки компенсации измерять PaCO₂.","respiratory compensation"]},{"id":"pco","c":3,"r":3,"dir":"neuro","type":"protect","t":"PaCO₂ ↓: pH частично выравнивается","term":"hypocapnia","s":["PaCO₂ крови снижается.","Гипервентиляция.","pH приближается к норме, но полностью не выравнивается.","Ожидаемый PaCO₂ = 1,5 × HCO₃⁻ + 8 ± 2 (формула Винтерса).","Если PaCO₂ отличается от ожидаемого, искать смешанное нарушение.","Winters formula"]},{"id":"amm","c":4,"r":2,"dir":"cell","type":"protect","t":"Аммониогенез в почках ↑: выводится NH₄Cl","term":"ammoniagenesis","s":["В проксимальном канальце из глутамина образуются NH₄⁺ и новый HCO₃⁻.","Ацидоз усиливает транспорт глутамина и активность глутаминазы.","NH₄Cl выводится с мочой, Cl⁻ снижается.","При внепочечной причине (диарея) анионная разница мочи отрицательная.","Анионная разница мочи различает причины.","ammoniagenesis; urine anion gap"]},{"id":"inf","c":4,"r":3,"dir":"immune","type":"damage","t":"Медиаторы воспаления: IL-6, NO","term":"pro-inflammatory mediators","s":["В экспериментах гиперхлоремический ацидоз повышает IL-6 и NO.","Ацидоз активирует макрофаги.","Сосуды расширяются, воспаление усиливается.","При сепсисе усугубляются гипотензия и органная недостаточность.","При сепсисе выбирать сбалансированные растворы.","pro-inflammatory mediators"]},{"id":"k1","c":0,"r":4,"dir":"hemo","type":"clinic","t":"Гипотензия, аритмии","term":"haemodynamic disturbances","s":["Нарушение гемодинамики.","Снижение сократимости миокарда и гиперкалиемия.","При тяжёлом ацидозе шок.","Низкое АД, на ЭКГ признаки гиперкалиемии.","Коррекция ацидоза и K⁺.","hypotensio; arrhythmia"]},{"id":"k2","c":2,"r":4,"dir":"organ","type":"clinic","t":"Олигурия, риск ОПП","term":"oliguria","s":["Снижение функции почек.","Почечная вазоконстрикция.","Креатинин растёт.","Диурез меньше 0,5 мл/кг в час.","Контроль диуреза и креатинина.","acute kidney injury"]},{"id":"k3","c":3,"r":4,"dir":"neuro","type":"clinic","t":"Дыхание Куссмауля","term":"Kussmaul breathing","s":["Глубокое шумное дыхание.","Дыхательная компенсация ацидоза.","Больной ощущает одышку и усталость.","Дыхание частое и глубокое.","Коррекция ацидоза.","Kussmaul respiration"]},{"id":"k4","c":4,"r":4,"dir":"immune","type":"clinic","t":"При сепсисе гипотензия тяжелее","term":"severe sepsis","s":["Утяжеление течения сепсиса.","Медиаторы воспаления и расширение сосудов.","Растёт потребность в вазопрессорах.","Лактат и Cl⁻ растут одновременно.","Сбалансированные растворы.","sepsis gravis"]}],

clHypo:{name:"Гипохлоремия",full:"Гипохлоремия",vals:"Cl⁻ < 98 ммоль/л · алкалоз",lead:"Cl⁻ плазмы ниже 98 ммоль/л. При потере хлора растёт HCO₃⁻ и развивается гипохлоремический метаболический алкалоз; он не исчезает, пока хлор не восполнен.",
nodes:[{"id":"e1","c":0,"r":0,"dir":"organ","type":"etio","t":"Потеря желудочного сока: рвота, зонд","term":"gastric fluid loss","s":["Теряется HCl.","Париетальные клетки желудка на каждый выделенный H⁺ отдают в кровь один HCO₃⁻ («щелочная волна»). При рвоте H⁺ и Cl⁻ уходят наружу, HCO₃⁻ остаётся в крови.","Гипохлоремия, метаболический алкалоз и гиповолемия.","Повторная рвота, пилоростеноз, желудочный зонд.","0,9% NaCl и KCl.","loss of gastric juice; alkaline tide"]},{"id":"e2","c":1,"r":0,"dir":"neuro","type":"etio","t":"Диуретики: петлевые, тиазидные","term":"diuretics","s":["С мочой выводится много Cl⁻ в виде NaCl.","Петлевые диуретики блокируют NKCC2, тиазиды — NCC; синдромы Барттера и Гительмана сходны.","Потеря хлорида, контракционный алкалоз, гипокалиемия.","Полиурия, слабость.","Снизить дозу, KCl, калийсберегающий диуретик.","contraction alkalosis"]},{"id":"e3","c":3,"r":0,"dir":"metab","type":"etio","t":"Редкие: хлоридная диарея, муковисцидоз","term":"chloride diarrhoea","s":["Cl⁻ теряется через кишечник или с потом.","Дефект кишечного обменника Cl⁻/HCO₃⁻ (SLC26A3) или канала CFTR.","Врождённый гипохлоремический алкалоз.","Хроническая диарея у младенца, потеря соли с потом.","Замещение NaCl и KCl.","congenital chloride diarrhoea; cystic fibrosis"]},{"id":"e4","c":4,"r":0,"dir":"hemo","type":"etio","t":"Разведение: СНСАДГ, СН; компенсация респираторного ацидоза","term":"dilutional hypochloraemia","s":["Cl⁻ разводится избытком воды или почки задерживают HCO₃⁻ и выводят Cl⁻.","Задерживается свободная вода; при хронической гиперкапнии почки накапливают HCO₃⁻ для коррекции pH.","Гипонатриемия и гипохлоремия идут вместе.","Признаки гипонатриемии или хронической болезни лёгких.","Лечение основной причины.","dilutional hypochloraemia"]},{"id":"main","c":2,"r":1,"dir":"metab","type":"main","t":"Cl⁻ < 98: хлорзависимый метаболический алкалоз","term":"chloride-responsive alkalosis","s":["HCO₃⁻ плазмы повышается, pH > 7,45.","Электронейтральность: место Cl⁻ занимает HCO₃⁻. Пендрин (обменник Cl⁻/HCO₃⁻) собирательной трубки может выводить HCO₃⁻ только при наличии Cl⁻ в просвете.","При дефиците Cl⁻ алкалоз сохраняется.","Cl⁻ < 98 ммоль/л, HCO₃⁻ > 26 ммоль/л.","Если Cl⁻ мочи < 20 ммоль/л, алкалоз хлорчувствительный и лечится NaCl.","chloride-responsive metabolic alkalosis; pendrin"]},{"id":"bohr","c":0,"r":2,"dir":"metab","type":"damage","t":"Сродство Hb к O₂ ↑","term":"Bohr effect","s":["Кривая диссоциации оксигемоглобина смещается влево.","Эффект Бора: при росте pH гемоглобин прочнее удерживает кислород.","Отдача O₂ тканям снижается.","Тканевая гипоксия при нормальной сатурации.","Коррекция алкалоза.","left shift of oxyhaemoglobin dissociation curve"]},{"id":"cer","c":0,"r":3,"dir":"organ","type":"damage","t":"Тканевая гипоксия, сужение сосудов мозга","term":"tissue hypoxia","s":["Мозг и миокард получают меньше кислорода.","Снижение отдачи O₂ и сужение сосудов мозга при алкалозе.","Нарушается работа мозга и сердца.","Головокружение, спутанность, судороги.","Коррекция алкалоза, кислород.","hypoxia textuum"]},{"id":"raa","c":2,"r":2,"dir":"neuro","type":"damage","t":"Дефицит объёма и Cl⁻: РААС, альдостерон ↑","term":"secondary hyperaldosteronism","s":["Много выделяется ренина, ангиотензина II и альдостерона.","Гиповолемия стимулирует барорецепторы; плотное пятно воспринимает снижение Cl⁻ и повышает ренин.","Сначала сохраняет объём, но на фоне алкалоза вредит.","Тахикардия, гипотензия, жажда.","0,9% NaCl восполняет объём и подавляет РААС.","hyperaldosteronismus secundarius"]},{"id":"hk","c":2,"r":3,"dir":"metab","type":"damage","t":"H⁺ и K⁺ теряются с мочой: гипокалиемия","term":"paradoxical aciduria","s":["Альдостерон усиливает задержку Na⁺ и выведение K⁺ и H⁺.","Реабсорбция Na⁺ создаёт отрицательный заряд просвета и усиливает секрецию K⁺ и H⁺.","Кислая моча, несмотря на алкалоз (парадоксальная ацидурия), гипокалиемия.","Слабость, аритмии.","KCl.","paradoxical aciduria; hypokalaemia"]},{"id":"hco","c":1,"r":3,"dir":"cell","type":"damage","t":"Реабсорбция HCO₃⁻ ↑, пендрин не выводит HCO₃⁻","term":"bicarbonate retention","s":["Почки не могут вывести избыток HCO₃⁻.","Гипокалиемия и гиповолемия усиливают реабсорбцию HCO₃⁻ в проксимальном канальце; из-за малого Cl⁻ в просвете пендрин не работает.","HCO₃⁻ накапливается в крови, алкалоз сохраняется: порочный круг.","Cl⁻ мочи < 20 ммоль/л.","Совместное введение NaCl и KCl разрывает круг.","maintenance of metabolic alkalosis"]},{"id":"ica","c":3,"r":2,"dir":"metab","type":"damage","t":"Ионизированный Ca²⁺ ↓","term":"reduced ionised calcium","s":["Альбумин сильнее связывает Ca²⁺.","При алкалозе с альбумина уходят H⁺ и освобождаются отрицательно заряженные участки.","При нормальном общем Ca ионизированный Ca²⁺ снижается.","Парестезии.","Коррекция алкалоза; измерить ионизированный Ca²⁺.","reduced ionised calcium"]},{"id":"exc","c":3,"r":3,"dir":"cell","type":"damage","t":"Нервно-мышечная возбудимость ↑","term":"increased excitability","s":["Нервы и мышцы легко возбуждаются.","При снижении ионизированного Ca²⁺ падает порог Na⁺-каналов.","Тетания, судороги.","Симптомы Хвостека и Труссо.","Коррекция алкалоза и гипокалиемии.","tetania in alkalosis"]},{"id":"hyv","c":4,"r":2,"dir":"neuro","type":"protect","t":"Хеморецепторы: гиповентиляция","term":"compensatory hypoventilation","s":["Хеморецепторы воспринимают рост pH и ослабляют дыхание.","Ответ дыхательного центра на H⁺ снижается.","CO₂ задерживается.","Поверхностное редкое дыхание.","При гипоксемии кислород.","compensatory hypoventilation"]},{"id":"pco","c":4,"r":3,"dir":"neuro","type":"protect","t":"PaCO₂ ↑: pH частично выравнивается","term":"hypercapnia","s":["PaCO₂ растёт, pH приближается к норме.","Гиповентиляция.","На каждый 1 ммоль/л прироста HCO₃⁻ PaCO₂ растёт примерно на 0,7 мм рт. ст.; гипоксемия ограничивает эту компенсацию.","PaCO₂ редко превышает 55 мм рт. ст.","Оценка компенсации.","respiratory compensation"]},{"id":"k1","c":0,"r":4,"dir":"organ","type":"clinic","t":"Спутанность, судороги","term":"neurological signs","s":["Неврологические признаки.","Гипоксия мозга и сужение его сосудов.","При тяжёлом алкалозе (pH > 7,6) нарушение сознания.","Головокружение, апатия, судороги.","Коррекция алкалоза.","neurological signs of alkalosis"]},{"id":"k2","c":2,"r":4,"dir":"organ","type":"clinic","t":"Слабость, аритмии","term":"hypokalaemia","s":["Признаки гипокалиемии.","K⁺ теряется с мочой.","Растёт риск аритмий.","Зубец U, мышечная слабость.","KCl.","hypokalaemia"]},{"id":"k3","c":3,"r":4,"dir":"organ","type":"clinic","t":"Тетания, парестезии","term":"tetany","s":["Мышечные судороги.","Снижение ионизированного Ca²⁺.","Карпопедальный спазм.","Симптомы Хвостека и Труссо.","Коррекция алкалоза.","tetania"]},{"id":"k4","c":4,"r":4,"dir":"neuro","type":"clinic","t":"Поверхностное редкое дыхание","term":"hypoventilation","s":["Дыхание ослабевает.","Компенсаторная гиповентиляция.","Возможна гипоксемия.","Частота дыхания снижена.","Кислород, коррекция алкалоза.","hypoventilatio"]}],

overview:[["Что происходит","Хлор теряется, HCO₃⁻ растёт. Развивается хлорзависимый метаболический алкалоз."],["Главное звено","Дефицит Cl⁻: почки не могут вывести избыток HCO₃⁻."],["Компенсация","Гиповентиляция повышает PaCO₂; но гипоксемия её ограничивает."],["Порочный круг","Дефицит объёма и Cl⁻ повышает альдостерон, теряются H⁺ и K⁺; гипокалиемия усиливает реабсорбцию HCO₃⁻ и поддерживает алкалоз."],["Точка лечения","0,9% NaCl и KCl; при гиперволемии ацетазоламид; при pH > 7,6 разведённая HCl."]]},
caHypo:{name:"Гипокальциемия",full:"Гипокальциемия",vals:"Ca < 2,15 · Ca²⁺ < 1,1 ммоль/л",lead:"Общий Ca ниже 2,15 ммоль/л или ионизированный Ca²⁺ ниже 1,1 ммоль/л. Нужна поправка на альбумин: скорректированный Ca = Ca + 0,02 × (40 − альбумин, г/л). Главное следствие — повышение нервно-мышечной возбудимости.",
nodes:[{"id":"e1","c":0,"r":0,"dir":"neuro","type":"etio","t":"Дефицит ПТГ: тиреоидэктомия, гипомагниемия","term":"hypoparathyroidism","s":["Паращитовидные железы выделяют недостаточно паратгормона.","Железы повреждаются или удаляются при операции, поражаются аутоиммунно (синдром Ди Джорджи); дефицит Mg²⁺ тормозит секрецию и действие ПТГ.","Гипокальциемия и гиперфосфатемия.","Тетания через 1–2 дня после операции.","Коррекция дефицита Mg²⁺; активный витамин D, рекомбинантный ПТГ.","hypoparathyreosis"]},{"id":"e2","c":1,"r":0,"dir":"metab","type":"etio","t":"Дефицит витамина D, ХБП","term":"vitamin D deficiency","s":["Всасывание Ca²⁺ в кишечнике снижается.","Мало солнца, мальабсорбция, болезни печени; при ХБП в почках снижается 1α-гидроксилаза. Кальцитриол стимулирует синтез кальбиндина и TRPV6 в энтероцитах.","Вторичный гиперпаратиреоз, остеомаляция или рахит.","Боли в костях, мышечная слабость.","Холекальциферол; при ХБП кальцитриол или альфакальцидол.","vitamin D deficiency"]},{"id":"e3","c":3,"r":0,"dir":"metab","type":"etio","t":"Связывание Ca²⁺: гиперфосфатемия, панкреатит, цитрат","term":"calcium sequestration","s":["Ионизированный Ca²⁺ уходит из крови.","Образует осадок с фосфатом; мыла со свободными жирными кислотами вокруг поджелудочной железы; хелаты с цитратом (при переливании крови); переходит в кость при синдроме «голодной кости».","Острая гипокальциемия.","Признаки основного заболевания.","Лечение причины; глюконат кальция.","calcium sequestration; saponification"]},{"id":"e4","c":4,"r":0,"dir":"cell","type":"etio","t":"Алкалоз; резистентность к ПТГ","term":"alkalosis; pseudohypoparathyroidism","s":["При алкалозе снижается ионизированный Ca²⁺; при псевдогипопаратиреозе ткани не отвечают на ПТГ.","Альбумин сильнее связывает Ca²⁺; при дефекте белка Gsα нарушается сигнал цАМФ после рецептора ПТГ.","Признаки гипокальциемии.","Парестезии при гипервентиляции; остеодистрофия Олбрайта.","Коррекция алкалоза; активный витамин D.","alkalosis; pseudohypoparathyreosis"]},{"id":"main","c":2,"r":1,"dir":"cell","type":"main","t":"Ca²⁺ < 1,1: нервно-мышечная возбудимость ↑","term":"increased neuromuscular excitability","s":["Нервные волокна и мышцы отвечают даже на слабый стимул и дают спонтанные разряды.","Наружный Ca²⁺ экранирует отрицательные заряды на внешней поверхности мембраны и стабилизирует Na⁺-каналы. При снижении Ca²⁺ каналы открываются близко к потенциалу покоя.","Тетания, парестезии, судороги.","Ионизированный Ca²⁺ < 1,1 ммоль/л.","При острых симптомах 10% глюконат кальция в/в медленно (10–20 мин), затем инфузия.","hypocalcaemia"]},{"id":"thr","c":0,"r":2,"dir":"cell","type":"damage","t":"Порог снижается: спонтанные разряды","term":"spontaneous discharges","s":["В периферических нервах возникают спонтанные импульсы.","Порог приближается к потенциалу покоя.","Тоническое сокращение мышц.","Онемение вокруг рта и в пальцах.","Глюконат кальция.","spontaneous nerve activity"]},{"id":"lar","c":0,"r":3,"dir":"organ","type":"damage","t":"Тетания, ларингоспазм, судороги","term":"tetany, laryngospasm","s":["Спазм скелетных мышц, мышц гортани и бронхов; возбуждение нейронов ЦНС.","Повышение нервно-мышечной возбудимости.","Ларингоспазм может привести к удушью.","Стридор, карпопедальный спазм, судороги.","Глюконат кальция в/в; обеспечение проходимости дыхательных путей.","tetania; laryngospasmus"]},{"id":"par","c":2,"r":2,"dir":"organ","type":"damage","t":"Парестезии, стеснение в груди, тревога","term":"paraesthesia, anxiety","s":["Больной ощущает онемение и сведение мышц, тревожится.","Разряды сенсорных нервов и спазм мышц.","Тревога учащает дыхание.","Онемение пальцев и вокруг рта, стеснение в груди.","Успокоить больного.","paraesthesiae; anxietas"]},{"id":"hvn","c":2,"r":3,"dir":"neuro","type":"damage","t":"Гипервентиляция","term":"hyperventilation","s":["Дыхание учащается и углубляется.","Тревога и возбуждение дыхательного центра.","CO₂ выводится в избытке.","Частое глубокое дыхание.","Замедлить дыхание.","hyperventilatio"]},{"id":"ral","c":1,"r":3,"dir":"metab","type":"damage","t":"Респираторный алкалоз: Ca²⁺ связывается с альбумином","term":"respiratory alkalosis","s":["pH растёт, ионизированный Ca²⁺ снижается.","При алкалозе с альбумина уходят H⁺, и он связывает больше Ca²⁺.","Тетания усиливается: порочный круг.","Приступ тетании при нормальном общем Ca.","Замедлить дыхание, дыхание в пакет (с осторожностью).","alkalosis respiratoria"]},{"id":"pl","c":3,"r":2,"dir":"cell","type":"damage","t":"Фаза плато удлиняется, сокращение ослабевает","term":"prolonged plateau","s":["Фаза плато потенциала действия кардиомиоцита удлиняется.","Плато зависит от входа Ca²⁺; при малом Ca²⁺ оно заканчивается медленно. Электромеханическое сопряжение ослабевает.","QT удлиняется, сократимость миокарда снижается.","ЭКГ: сегмент ST удлинён.","Глюконат кальция.","prolonged QT interval"]},{"id":"hrt","c":3,"r":3,"dir":"hemo","type":"damage","t":"Удлинение QT, сердечная недостаточность, гипотензия","term":"hypocalcaemic cardiomyopathy","s":["Снижается сердечный выброс и тонус сосудов.","Сокращение миокарда и гладких мышц сосудов зависит от Ca²⁺; ответ на катехоламины ослабевает.","Гипотензия, обратимая кардиомиопатия.","Одышка, отёки, гипотензия.","Восполнение Ca²⁺.","cardiomyopathia hypocalcaemica"]},{"id":"pth","c":4,"r":2,"dir":"neuro","type":"protect","t":"CaSR → ПТГ ↑","term":"parathyroid hormone","s":["Кальций-чувствительный рецептор (CaSR) воспринимает снижение Ca²⁺ и усиливает выделение ПТГ.","Активность CaSR падает, торможение секреции ПТГ снимается.","Растут резорбция кости и реабсорбция Ca²⁺ в почках, фосфатурия, активируется 1α-гидроксилаза.","ПТГ повышен (кроме гипопаратиреоза).","Измерение ПТГ различает причины.","calcium-sensing receptor; parathormone"]},{"id":"cal","c":4,"r":3,"dir":"neuro","type":"protect","t":"Кальцитриол ↑, Ca²⁺ выходит из кости","term":"calcitriol","s":["В почках растёт образование 1,25(OH)₂D; из кости высвобождается Ca²⁺.","ПТГ стимулирует 1α-гидроксилазу и активирует остеокласты.","Всасывание Ca²⁺ в кишечнике растёт, Ca²⁺ восстанавливается. При дефиците D или ХБП это звено не работает.","При длительном течении минерализация кости снижается.","Кальцитриол, альфакальцидол.","calcitriolum; 1α-hydroxylase"]},{"id":"k1","c":0,"r":4,"dir":"organ","type":"clinic","t":"Симптомы Хвостека, Труссо, карпопедальный спазм","term":"Chvostek and Trousseau signs","s":["Признаки скрытой тетании.","Нервы легко отвечают на механическое раздражение и ишемию.","Хвостек: сокращение мышц рта при постукивании по лицевому нерву. Труссо: «рука акушера» при сдавлении манжетой 3 минуты.","Карпопедальный спазм, ларингоспазм.","Глюконат кальция.","Chvostek sign; Trousseau sign"]},{"id":"k2","c":2,"r":4,"dir":"neuro","type":"clinic","t":"Гипервентиляционный приступ тетании","term":"hyperventilation tetany","s":["Приступ тетании.","Алкалоз снижает ионизированный Ca²⁺.","Приступ проходит при замедлении дыхания.","Тревога, одышка, сведение пальцев.","Замедлить дыхание.","tetania hyperventilationis"]},{"id":"k3","c":3,"r":4,"dir":"hemo","type":"clinic","t":"Удлинение QT, гипотензия","term":"cardiac signs","s":["Сердечные признаки.","Удлинение фазы плато и снижение сократимости.","Тахикардия «пируэт» редка.","На ЭКГ удлинён QT, АД снижено.","При хронической форме Ca внутрь и витамин D.","prolonged QT; hypotensio"]}],

overview:[["Что происходит","Ионизированный Ca²⁺ снижается, мембраны нервов и мышц становятся нестабильными: возбудимость растёт."],["Главное звено","Порог открытия Na⁺-каналов снижается; развиваются тетания и судороги."],["Компенсация","Через CaSR растёт ПТГ; кальцитриол усиливает всасывание Ca²⁺ в кишечнике, Ca²⁺ выходит из кости."],["Порочный круг","Парестезии вызывают тревогу и гипервентиляцию; респираторный алкалоз ещё больше снижает ионизированный Ca²⁺."],["Точка лечения","Остро: 10% глюконат кальция в/в. Хронически: Ca внутрь и витамин D; коррекция дефицита Mg²⁺."]]},
caHyper:{name:"Гиперкальциемия",full:"Гиперкальциемия",vals:"Ca > 2,6 · Ca²⁺ > 1,3 ммоль/л",lead:"Общий Ca выше 2,6 ммоль/л или ионизированный Ca²⁺ выше 1,3 ммоль/л. Около 90% случаев — первичный гиперпаратиреоз и злокачественные опухоли. Мембраны стабилизируются, возбудимость падает, почки не удерживают воду.",
nodes:[{"id":"e1","c":0,"r":0,"dir":"neuro","type":"etio","t":"Избыток ПТГ: первичный гиперпаратиреоз","term":"primary hyperparathyroidism","s":["Паратгормон выделяется бесконтрольно.","В аденоме (около 85%) снижена чувствительность CaSR; при ХБП длительно стимулированные железы становятся автономными (третичный). Литий тоже повышает ПТГ.","Растут резорбция кости, реабсорбция Ca²⁺ в почках и кальцитриол.","Камни почек, остеопороз, фиброзно-кистозный остеит.","Паратиреоидэктомия; цинакалцет.","hyperparathyreosis primaria"]},{"id":"e2","c":1,"r":0,"dir":"cell","type":"etio","t":"Злокачественные опухоли: ПТГрП, метастазы, миелома","term":"hypercalcaemia of malignancy","s":["Опухоль разрушает кость или повторяет действие ПТГ.","ПТГ-родственный пептид (плоскоклеточный рак) активирует рецепторы ПТГ; метастазы и миелома активируют остеокласты через RANKL; при лимфоме избыточно образуется кальцитриол.","Часто тяжёлая, быстро нарастающая гиперкальциемия.","Боли в костях, патологические переломы.","Бисфосфонаты, деносумаб, лечение опухоли.","PTHrP; osteolytic metastases"]},{"id":"e3","c":3,"r":0,"dir":"metab","type":"etio","t":"Избыток кальцитриола: саркоидоз, интоксикация D","term":"calcitriol excess","s":["Всасывание Ca²⁺ в кишечнике растёт.","1α-гидроксилаза макрофагов гранулём работает независимо от ПТГ; избыточный приём витамина D.","Гиперкальциемия с подавленным ПТГ.","Признаки основного заболевания.","Глюкокортикоиды тормозят 1α-гидроксилазу макрофагов; отмена витамина D.","granulomatous disease; vitamin D intoxication"]},{"id":"e4","c":4,"r":0,"dir":"metab","type":"etio","t":"Иммобилизация, тиазиды, тиреотоксикоз","term":"other causes","s":["Резорбция кости растёт или выведение Ca²⁺ снижается.","Иммобилизация и тиреотоксикоз активируют остеокласты; тиазиды усиливают реабсорбцию Ca²⁺ в дистальном канальце; молочно-щелочной синдром.","Лёгкая или умеренная гиперкальциемия.","Признаки основного состояния.","Устранить причину, отменить тиазид.","immobilisation hypercalcaemia; milk-alkali syndrome"]},{"id":"main","c":2,"r":1,"dir":"cell","type":"main","t":"Ca²⁺ > 1,3: мембраны стабилизируются","term":"membrane stabilisation","s":["Ионизированный Ca²⁺ растёт, нервно-мышечная возбудимость падает.","При избытке наружного Ca²⁺ поверхность мембраны экранируется сильнее; для деполяризации нужен более сильный стимул. Активируются и почечные CaSR.","Слабость, угнетение ЦНС, повреждение почек; при высоком Ca × P кальцификация тканей.","При Ca > 3,5 ммоль/л гиперкальциемический криз.","Изотонический NaCl 200–300 мл/ч: первый и главный шаг.","hypercalcaemia"]},{"id":"exc","c":0,"r":2,"dir":"cell","type":"damage","t":"Возбудимость нейронов и мышц ↓","term":"reduced excitability","s":["Клетки нервов, скелетных и гладких мышц плохо возбуждаются.","Порог Na⁺-каналов повышается.","Тонус мышц и рефлексы снижаются.","Гипорефлексия, слабость.","Снизить Ca²⁺.","reduced neuromuscular excitability"]},{"id":"cns","c":0,"r":3,"dir":"organ","type":"damage","t":"Угнетение ЦНС, атония кишечника, панкреатит","term":"CNS depression, bowel atony","s":["Нарушается работа мозга и ЖКТ.","Возбудимость нейронов падает; тонус гладких мышц кишечника снижается; Ca²⁺ стимулирует выделение гастрина и активацию ферментов поджелудочной железы.","Спутанность, кома; запор, язва, панкреатит.","Утомляемость, депрессия, тошнота.","Снизить Ca²⁺.","CNS depression; constipation; pancreatitis"]},{"id":"ndi","c":2,"r":2,"dir":"organ","type":"damage","t":"Нефрогенный несахарный диабет: полиурия","term":"nephrogenic diabetes insipidus","s":["Почки не могут концентрировать мочу.","CaSR толстого восходящего колена петли Генле тормозит NKCC2 (снижается гипертоничность мозгового слоя); в собирательной трубке уменьшается аквапорин-2.","Полиурия, потеря воды.","Жажда, полиурия, никтурия.","Восполнение жидкости.","diabetes insipidus nephrogenes"]},{"id":"dhy","c":2,"r":3,"dir":"hemo","type":"damage","t":"Дегидратация, СКФ ↓","term":"dehydration","s":["Внеклеточный объём уменьшается, клубочковая фильтрация падает.","Полиурия и рвота; Ca²⁺ сужает сосуды почек.","Почки фильтруют меньше Ca²⁺.","Тахикардия, сухие слизистые, рост креатинина.","Изотонический NaCl.","dehydratio; reduced GFR"]},{"id":"rea","c":1,"r":3,"dir":"organ","type":"damage","t":"Реабсорбция Ca²⁺ ↑, выведение ↓","term":"reduced calcium excretion","s":["Почки выводят меньше Ca²⁺.","При уменьшении объёма растёт реабсорбция Na⁺ в проксимальном канальце, и Ca²⁺ всасывается вместе с ним.","Гиперкальциемия усиливается: порочный круг (гиперкальциемический криз).","Ca > 3,5 ммоль/л; кома, ОПП.","Восполнение объёма разрывает круг; затем петлевой диуретик (только при эуволемии).","hypercalcaemic crisis"]},{"id":"hcu","c":3,"r":2,"dir":"metab","type":"damage","t":"Гиперкальциурия, Ca × P ↑","term":"hypercalciuria","s":["В моче много Ca²⁺.","Растёт фильтруемое количество Ca²⁺.","В моче выпадают соли кальция.","Ca мочи более 7,5 ммоль в сутки.","Обильное питьё.","hypercalciuria"]},{"id":"nph","c":3,"r":3,"dir":"organ","type":"damage","t":"Нефрокальциноз, нефролитиаз","term":"nephrocalcinosis","s":["В паренхиме почек и мочевых путях откладываются соли кальция.","Гиперкальциурия и рост произведения Ca × P.","Функция почек постепенно снижается.","Почечная колика, гематурия.","Лечение причины, гидратация.","nephrocalcinosis; nephrolithiasis"]},{"id":"ptl","c":4,"r":2,"dir":"neuro","type":"protect","t":"CaSR → ПТГ ↓, кальцитонин ↑","term":"PTH suppression","s":["CaSR паращитовидных желёз активируется, выделение ПТГ снижается; кальцитонин немного растёт.","Ca²⁺ через CaSR тормозит секрецию ПТГ.","Выведение Ca²⁺ почками растёт, кальцитриол снижается. При первичном гиперпаратиреозе это звено не работает.","ПТГ низкий (при ПТГ-независимых причинах).","Измерение ПТГ — первый шаг диагностики.","PTH suppression; calcitonin"]},{"id":"hrt","c":4,"r":3,"dir":"hemo","type":"damage","t":"Сердце: укорочение QT, брадикардия","term":"shortened QT","s":["Меняются ритм и проводимость сердца.","Фаза плато заканчивается быстрее; Ca²⁺ повышает тонус гладких мышц сосудов.","Брадикардия, AV-блокада; растёт чувствительность к дигоксину.","На ЭКГ QT укорочен, АД повышено.","Снизить Ca²⁺; дигоксин с осторожностью.","shortened QT interval"]},{"id":"k1","c":0,"r":4,"dir":"organ","type":"clinic","t":"Спутанность, депрессия, запор","term":"«psychic moans, abdominal groans»","s":["Признаки со стороны ЦНС и кишечника.","Возбудимость нейронов и гладких мышц падает.","В тяжёлых случаях кома.","Английская мнемоника: psychic moans, abdominal groans.","Снизить Ca²⁺.","psychic moans; abdominal groans"]},{"id":"k2","c":2,"r":4,"dir":"organ","type":"clinic","t":"Полиурия, жажда, гиперкальциемический криз","term":"hypercalcaemic crisis","s":["Признаки потери воды и криза.","Нефрогенный несахарный диабет и порочный круг.","Кома, ОПП, аритмии.","Ca > 3,5 ммоль/л.","NaCl в/в, золедроновая кислота, кальцитонин; при необходимости диализ.","hypercalcaemic crisis"]},{"id":"k3","c":3,"r":4,"dir":"organ","type":"clinic","t":"Почечная колика, гематурия","term":"«stones»","s":["Признаки камней почек.","Нефролитиаз.","Обструкция мочевых путей.","Мнемоника: stones.","Гидратация, лечение причины.","colica renalis"]},{"id":"k4","c":4,"r":4,"dir":"hemo","type":"clinic","t":"Укорочение QT, AV-блокада","term":"cardiac signs","s":["Сердечные признаки.","Укорочение фазы плато.","Риск аритмий.","Изменения ЭКГ.","Снизить Ca²⁺.","cardiac signs of hypercalcaemia"]}],

overview:[["Что происходит","Ионизированный Ca²⁺ растёт, мембраны стабилизируются: возбудимость нервов и мышц падает. Почки не удерживают воду, образуются камни."],["Главное звено","Стабилизация мембран и активация CaSR в почках."],["Компенсация","ПТГ подавляется, кальцитонин растёт; почки выводят больше Ca²⁺ (при ПТГ-независимых причинах)."],["Порочный круг","Полиурия и рвота вызывают дегидратацию; СКФ падает, реабсорбция Ca²⁺ растёт, гиперкальциемия усиливается."],["Точка лечения","NaCl в/в (восполнение объёма), затем петлевой диуретик; золедроновая кислота, деносумаб, кальцитонин; лечение причины."]]},
pHypo:{name:"Гипофосфатемия",full:"Гипофосфатемия",vals:"P < 0,8 ммоль/л",lead:"Фосфат сыворотки ниже 0,8 ммоль/л, тяжёлая форма — ниже 0,32 ммоль/л. В клетках не хватает АТФ и 2,3-ДФГ, страдают энергоёмкие мышцы, нейроны и клетки крови.",
nodes:[{"id":"e1","c":1,"r":0,"dir":"metab","type":"etio","t":"Переход в клетки: рефидинг, инсулин, алкалоз","term":"transcellular shift","s":["Фосфат входит в клетки.","Инсулин переносит глюкозу и фосфат в клетки; гликолизу нужно много фосфорилированных промежуточных продуктов. Алкалоз активирует фосфофруктокиназу.","Острая, иногда тяжёлая гипофосфатемия (синдром возобновлённого питания, лечение ДКА).","В первые дни питания после длительного голодания.","Наращивать калорийность постепенно, тиамин; контроль P, K, Mg.","refeeding syndrome"]},{"id":"e2","c":3,"r":0,"dir":"organ","type":"etio","t":"Потери почками: гиперпаратиреоз, FGF23, синдром Фанкони","term":"phosphaturia","s":["Фосфат не реабсорбируется в проксимальном канальце.","ПТГ и FGF23 уменьшают число переносчиков NaPi-IIa/IIc (X-сцепленный гипофосфатемический рахит, онкогенная остеомаляция); при синдроме Фанкони повреждены канальцы.","Хроническая гипофосфатемия, остеомаляция.","Боли в костях, рахит.","Буросумаб (антитела к FGF23), удаление опухоли.","phosphaturia; FGF23"]},{"id":"e3","c":4,"r":0,"dir":"metab","type":"etio","t":"Всасывание ↓: антациды, дефицит D, алкоголизм","term":"malabsorption","s":["Фосфат пищи не всасывается.","Антациды с Al и Mg связывают фосфат; не хватает кальцитриола; при алкоголизме плохое питание.","Общий запас фосфата уменьшается.","Постепенно нарастающая слабость.","Отменить антацид, витамин D, фосфат внутрь.","phosphate malabsorption"]},{"id":"main","c":2,"r":1,"dir":"cell","type":"main","t":"P < 0,8: дефицит АТФ и 2,3-ДФГ","term":"ATP depletion","s":["Клетки не могут синтезировать достаточно АТФ; в эритроцитах падает 2,3-ДФГ.","Неорганический фосфат — субстрат окислительного фосфорилирования и гликолиза.","Страдают энергоёмкие клетки: мышцы, нейроны, эритроциты, лейкоциты.","Симптомы обычно при P < 0,32 ммоль/л.","При тяжёлой форме фосфат калия или натрия в/в; при лёгкой внутрь.","hypophosphataemia"]},{"id":"myo","c":0,"r":2,"dir":"organ","type":"damage","t":"Мышцы: миопатия, рабдомиолиз","term":"myopathy","s":["Слабеют проксимальные мышцы; в тяжёлых случаях мышцы разрушаются.","Для сокращения и целостности мембран мышц не хватает АТФ.","Креатинкиназа растёт.","Слабость, миалгии.","Восполнение фосфата.","myopathia; rhabdomyolysis"]},{"id":"dia","c":0,"r":3,"dir":"organ","type":"damage","t":"Слабость диафрагмы: дыхательная недостаточность","term":"respiratory failure","s":["Сокращение диафрагмы ослабевает.","Дефицит АТФ в мышцах.","Дыхательная недостаточность; трудно отлучить от ИВЛ.","Одышка, гиперкапния.","Восполнение фосфата, поддержка дыхания.","insufficientia respiratoria"]},{"id":"dpg","c":2,"r":2,"dir":"metab","type":"damage","t":"2,3-ДФГ ↓: тканевая гипоксия","term":"reduced 2,3-DPG","s":["Сродство гемоглобина к кислороду растёт.","Синтез 2,3-ДФГ в эритроцитах через шунт Рапопорта–Люберинг зависит от фосфата.","Кривая оксигемоглобина смещается влево, ткани плохо получают кислород.","Тканевая гипоксия при нормальной сатурации.","Восполнение фосфата.","left shift of dissociation curve"]},{"id":"hvn","c":2,"r":3,"dir":"neuro","type":"damage","t":"Гипервентиляция, респираторный алкалоз","term":"respiratory alkalosis","s":["Дыхание учащается, CO₂ снижается.","Тканевая гипоксия возбуждает дыхательный центр.","pH растёт, развивается респираторный алкалоз.","Частое дыхание, PaCO₂ снижен.","Устранить причину гипоксии.","alkalosis respiratoria"]},{"id":"gly","c":1,"r":3,"dir":"metab","type":"damage","t":"Гликолиз активируется, фосфат входит в клетки","term":"glycolysis activation","s":["Фосфат переходит из крови в клетки.","Алкалоз активирует фосфофруктокиназу и увеличивает количество фосфорилированных промежуточных продуктов.","Фосфат плазмы снижается ещё больше: порочный круг.","При гипервентиляции P может упасть до 0,3 ммоль/л.","Восполнение фосфата, устранение причины алкалоза.","glycolysis activation in alkalosis"]},{"id":"leu","c":3,"r":2,"dir":"immune","type":"damage","t":"Дисфункция лейкоцитов","term":"impaired phagocytosis","s":["Хемотаксис, фагоцитоз и киллинг бактерий ослабевают.","Движение и респираторный взрыв нейтрофилов зависят от АТФ.","Иммунная защита ослабевает.","Частые инфекции.","Восполнение фосфата.","impaired phagocytosis"]},{"id":"inf","c":3,"r":3,"dir":"immune","type":"damage","t":"Склонность к инфекциям, сепсис","term":"susceptibility to infection","s":["Учащаются бактериальные инфекции.","Нейтрофилы не могут уничтожать микробы.","Растёт риск сепсиса.","Лихорадка, очаги инфекции.","Лечение инфекции, восполнение фосфата.","susceptibility to infection"]},{"id":"cal","c":4,"r":2,"dir":"neuro","type":"protect","t":"Кальцитриол ↑, FGF23 ↓: почки сберегают P","term":"renal phosphate reabsorption","s":["Почки сберегают фосфат, всасывание в кишечнике растёт.","Гипофосфатемия стимулирует 1α-гидроксилазу и снижает образование FGF23; число NaPi-IIa растёт.","Фосфат мочи снижается. Рост кальцитриола может вызвать гиперкальциурию.","Фракционная экскреция фосфата < 5% (при внепочечной причине).","Измерение фракционной экскреции различает причины.","renal phosphate reabsorption"]},{"id":"org","c":4,"r":3,"dir":"organ","type":"damage","t":"Повреждение эритроцитов, миокарда, нейронов","term":"haemolysis, cardiomyopathy, encephalopathy","s":["Гемолиз, снижение сократимости миокарда, метаболическая энцефалопатия.","Мембрана эритроцитов, кардиомиоциты и нейроны зависят от АТФ.","Сердечная недостаточность, анемия, нарушение сознания.","Спутанность, парестезии, судороги; одышка.","Восполнение фосфата.","haemolysis; cardiomyopathy; encephalopathy"]},{"id":"k1","c":0,"r":4,"dir":"organ","type":"clinic","t":"Слабость, миалгии, одышка","term":"muscular signs","s":["Признаки со стороны мышц и дыхания.","Миопатия и слабость диафрагмы.","Дыхательная недостаточность.","Проксимальная слабость.","Восполнение фосфата.","muscle weakness"]},{"id":"k2","c":2,"r":4,"dir":"neuro","type":"clinic","t":"Частое дыхание, признаки гипоксии","term":"hyperventilation","s":["Нарушение дыхания.","Тканевая гипоксия.","Респираторный алкалоз.","Одышка, PaCO₂ снижен.","Восполнение фосфата.","hyperventilatio"]},{"id":"k3","c":3,"r":4,"dir":"immune","type":"clinic","t":"Лихорадка, частые инфекции","term":"infections","s":["Признаки инфекции.","Дисфункция лейкоцитов.","Риск сепсиса.","Температура, очаги воспаления.","Лечение инфекции.","infectious complications"]},{"id":"k4","c":4,"r":4,"dir":"organ","type":"clinic","t":"Гемолиз, сердечная недостаточность, спутанность","term":"multiorgan signs","s":["Органные признаки.","Дефицит АТФ в клетках.","В тяжёлых случаях кома.","Анемия, одышка, отёки, нарушение сознания.","При P < 0,32 ммоль/л фосфат в/в.","multiorgan manifestations"]}],
