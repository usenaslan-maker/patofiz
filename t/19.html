<script>
/* geometry helpers used by the scheme data */
const hm=(a,b)=>(Math.max(a.t,b.t)+Math.min(a.b,b.b))/2;
const vm=(a,b)=>(Math.max(a.l,b.l)+Math.min(a.r,b.r))/2;
const D=(a,b)=>{const x=vm(a,b);return [[x,a.b],[x,b.t]]};
const Rt=(a,b)=>{const y=hm(a,b);return [[a.r,y],[b.l,y]]};
const Lf=(a,b)=>{const y=hm(a,b);return [[a.l,y],[b.r,y]]};
const ST=(s,t,side,fo)=>{const x=side==='l'?s.l:s.r,y=fo==null?s.cy:s.t+s.h*fo;return [[x,y],[t.cx,y],[t.cx,t.t]]};
const BTo=(s,t,tx)=>[[s.cx,s.b],[s.cx,t.t-20],[tx,t.t-20],[tx,t.t]];
const GX=c=>20+c*236+218;
const LR=(s,t,fo)=>{const y=t.t+t.h*(fo==null?.5:fo);return [[s.cx,s.t],[s.cx,y],[t.l,y]]};
const SC=(s,t,c,fo)=>{const y=s.t+s.h*fo,x=GX(c);return [[s.r,y],[x,y],[x,t.cy],[t.l,t.cy]]};
const LUP=(s,t,c,fo)=>{const x=GX(c),y=t.t+t.h*(fo==null?.5:fo);return [[s.l,s.cy],[x,s.cy],[x,y],[t.r,y]]};

/* standard layout: e1–e4 row 0 → main (c2 r1); left branch L1→L2 (c0); loop main→A→B→C→main (c2,c2,c1);
   right branch R1→R2 (c3); compensation P1→P2 (c4, optional inhibition of main); clinic k* from node `from` */
function build(S){
  const ids=new Set(S.nodes.map(n=>n.id)),has=i=>ids.has(i);
  const et=S.nodes.filter(n=>n.type==='etio');
  const off={1:[0],2:[-30,30],3:[-45,0,45],4:[-60,-20,20,60]}[et.length]||[];
  const E=[];
  et.forEach((n,i)=>E.push({f:n.id,to:'main',k:n.ek||'main',p:R=>BTo(R[n.id],R.main,R.main.cx+off[i])}));
  const add=(f,to,k,p)=>{if(has(f)&&has(to))E.push({f,to,k,p})};
  add('main','L1','main',R=>ST(R.main,R.L1,'l',.25));
  add('L1','L2','main',R=>D(R.L1,R.L2));
  add('main','A','loop',R=>D(R.main,R.A));
  add('A','B','loop',R=>D(R.A,R.B));
  add('B','C','loop',R=>Lf(R.B,R.C));
  add('C','main','loop',R=>LR(R.C,R.main));
  add('main','R1','main',R=>ST(R.main,R.R1,'r',.75));
  add('R1','R2','main',R=>D(R.R1,R.R2));
  add('main','P1','main',R=>ST(R.main,R.P1,'r',.3));
  add('P1','P2','main',R=>D(R.P1,R.P2));
  if(S.inh) add('P2','main','inh',R=>LUP(R.P2,R.main,3,.55));
  (S.x||[]).forEach(x=>add(x[0],x[1],x[2],x[3]));
  S.nodes.filter(n=>n.from).forEach(n=>add(n.from,n.id,'main',R=>D(R[n.from],R[n.id])));
  S.edges=E;
  S.loops=has('A')&&has('C')?[['main','A','B','C']]:[];
  S.markers=S.loops.length?[R=>[(R.C.cx+R.A.l)/2,R.A.cy]]:[];
}
</script>

'Фосфолипазалар мембраналарды, протеазалар цитоқаңқаны, эндонуклеазалар ДНҚ-ны ыдыратады; Ca²⁺ митохондрияны да зақымдайды.',
'Нейрондар мен кардиомиоциттердің өлуі.',
'Ca²⁺ каналдарының блокаторлары (нимодипин), нейропротекция.',
'Кальциевая перегрузка клетки']},
{id:'A',c:2,r:2,dir:'metab',type:'damage',t:'Анаэробты гликолиз ↑ → лактат жиналады',term:'анаэробный гликолиз',s:[
'Глюкоза O₂-сіз пируватқа, одан лактатқа айналады.',
'АТФ азайып, АМФ артқанда фосфофруктокиназа белсенеді; NAD⁺ қалпына келуі үшін пируват лактатқа айналады.',
'Бір глюкозадан 2 АТФ ғана шығады (аэробты жолда 30-ға жуық); лактат пен H⁺ жиналады.',
'Қанда лактат > 2 ммоль/л.',
'O₂ жеткізуді қалпына келтіру.',
'Анаэробный гликолиз']},
{id:'B',c:2,r:3,dir:'metab',type:'damage',t:'Лактат-ацидоз',term:'метаболический ацидоз',s:[
'Жасуша ішінде және қанда pH төмендейді.',
'Лактат пен АТФ гидролизінен түзілген H⁺ буферлердің сыйымдылығынан асып кетеді.',
'Ацидоз ферменттерді тежеп, лизосома мембраналарын әлсіретеді: тұйық шеңбер.',
'pH < 7,35, анион аралығы ↑, Куссмауль тынысы.',
'Гипоксияны жою; ауыр ацидозда буферлік ерітінділер.',
'Лактат-ацидоз']},
{id:'C',c:1,r:3,dir:'cell',type:'damage',t:'Ферменттер тежеледі, митохондриялар зақымданады',term:'повреждение митохондрий',s:[
'Митохондриялар ісініп, тыныс тізбегі одан әрі әлсірейді.',
'Ацидоз, Ca²⁺ артықтығы және бос радикалдар митохондрия мембранасының өткізгіштік порын ашады.',
'АТФ түзілуі тағы азаяды: энергия тапшылығы күшейеді.',
'Жасуша зақымдануы қайтымсыз сатыға өтеді.',
'Антиоксиданттар, антигипоксанттар.',
'Митохондриальная дисфункция']},
{id:'R1',c:3,r:2,dir:'cell',type:'damage',t:'Мембраналар бұзылады: ЛАТ, лизосома ферменттері',term:'деструкция мембран',s:[
'Жасуша мембраналары тұтастығын жоғалтады.',
'Фосфолипазалар, липидтердің асқын тотығуы (әсіресе реоксигенацияда), лизосомалардан шыққан гидролазалар.',
'Жасуша некрозға немесе апоптозға ұшырайды; қанға жасуша ферменттері шығады.',
'Қанда трансаминазалар, тропонин, КФК ↑.',
'Реоксигенацияны бақылап жүргізу, антиоксиданттар.',
'Перекисное окисление липидов; некроз']},
{id:'R2',c:3,r:3,dir:'organ',type:'damage',t:'Мүшелер зақымдануы: алдымен ми, жүрек, бүйрек',term:'органная дисфункция',s:[
'O₂-ге сезімтал мүшелер бірінші зардап шегеді.',
'Ми қыртысының нейрондары толық аноксияға шамамен 4–6 минут қана төзеді; миокард, бүйрек түтікшелері, бауыр да O₂-ге тәуелді.',
'Көп мүшелік жеткіліксіздік дамуы мүмкін.',
'Сана бұзылуы, аритмия, олигурия.',
'Ерте оксигенация, мүшелерді қолдау.',
'Полиорганная недостаточность']},
{id:'P1',c:4,r:2,dir:'neuro',type:'protect',t:'Шұғыл бейімделу: гипервентиляция, тахикардия',term:'срочная адаптация',s:[
'Секундтар мен минуттар ішінде тыныс пен қан айналымы күшейеді.',
'Каротид және аорта хеморецепторлары PaO₂ төмендеуіне жауап беріп, тыныс орталығы мен симпатикалық жүйені қоздырады.',
'O₂ көбірек жеткізіледі: тыныс тереңдейді, жүрек лақтырысы артады, қан ми мен жүрекке бағытталады, деподан эритроциттер шығады.',
'Ентігу, тахикардия, АҚ сәл ↑.',
'Бұл реакциялар энергия жұмсайды; ұзаққа созылса, өздері таусылады.',
'Срочная адаптация к гипоксии']},
{id:'P2',c:4,r:3,dir:'cell',type:'protect',t:'Ұзақ бейімделу: HIF-1α → эритропоэтин, ангиогенез',term:'долговременная адаптация',s:[
'Апталар мен айлар ішінде жасушалар мен мүшелер қайта құрылады.',
'O₂ жетіспегенде HIF-1α ыдырамай, ядроға өтіп, эритропоэтин, VEGF, гликолиз ферменттерінің гендерін белсендіреді.',
'Эритроцитоз, капиллярлар мен митохондриялар саны ↑, 2,3-ДФГ ↑: тінге O₂ берілуі жақсарады.',
'Тау тұрғындарында Hb мен гематокрит жоғары.',
'Біртіндеп бейімдеу (гипоксиялық жаттығу).',
'Долговременная адаптация; HIF-1α']},
{id:'k1',c:0,r:4,dir:'organ',type:'clinic',from:'L2',t:'ОЖЖ: эйфория → тежелу, құрысу, кома',term:'неврологические проявления',s:[

'Нейрондар энергия тапшылығына ең сезімтал.',
'Алдымен қозу (эйфория, сын жоғалуы), кейін тежелу.',
'Бас ауыру, координация бұзылуы, құрысу, сана жоғалуы.',
'Ми гипоксиясын тез жою.',
'Неврологические проявления гипоксии']},
{id:'k2',c:2,r:4,dir:'metab',type:'clinic',from:'B',t:'Лактат ↑, pH ↓, Куссмауль тынысы',term:'метаболический ацидоз',s:[
'Қышқыл-негіз жағдайының өзгерісі.',
'Анаэробты гликолиз өнімдері жиналады.',
'Тыныс орталығы H⁺ артуына терең тыныспен жауап береді.',
'pH < 7,35, HCO₃⁻ ↓, лактат > 2 ммоль/л.',
'Гипоксияны жою.',
'Дыхание Куссмауля']},
{id:'k3',c:3,r:4,dir:'organ',type:'clinic',from:'R2',t:'Аритмия, олигурия, бауыр ферменттері ↑',term:'органные проявления',s:[
'Мүшелер жеткіліксіздігінің белгілері.',
'Кардиомиоциттер, бүйрек түтікшелері, гепатоциттер зақымданады.',
'Жүрек, бүйрек, бауыр жеткіліксіздігі.',
'ЭКГ-де ишемия, креатинин ↑, АЛТ/АСТ ↑.',
'Мүшелерді қолдау.',
'Полиорганная недостаточность']},
{id:'k4',c:4,r:4,dir:'hemo',type:'clinic',from:'P2',t:'Ентігу, тахикардия; созылмалыда эритроцитоз',term:'компенсаторные признаки',s:[
'Бейімделу реакцияларының сыртқы көрінісі.',
'Тыныс пен қан айналымының күшеюі, эритропоэздің артуы.',
'Компенсация жеткілікті болса, мүшелер қызметі сақталады.',
'Тахипноэ, тахикардия, Hb мен гематокрит ↑.',
'Себепті жою.',
'Компенсаторные реакции']}
],
overview:[
['Не болады','Тіндерге O₂ жеткізу немесе оны пайдалану бұзылып, митохондрияда АТФ жетіспейді. Жасушалар анаэробты гликолизге ауысып, иондық сорғылар әлсірейді.'],
['Басты буын','Тотығу фосфорлануының әлсіреуі және АТФ тапшылығы.'],
['Компенсация','Шұғыл: гипервентиляция, тахикардия, қанның қайта бөлінуі, деподан эритроциттер шығуы. Ұзақ: HIF-1α арқылы эритропоэз, ангиогенез, 2,3-ДФГ ↑.'],
['Тұйық шеңбер','АТФ тапшылығы → анаэробты гликолиз → лактат-ацидоз → митохондриялар зақымдануы → АТФ одан әрі азаяды.'],
['Өту жылдамдығы','Қауырт (найзағай тәрізді): бірнеше секунд; жіті: бірнеше минут; созылмалы: бірнеше апта, айлар–жылдар. Төмендегі кестені қараңыз.'],
['Емдік нүкте','Себепті жою, O₂ беру (қажет болса, гипербарлық оксигенация), антигипоксанттар, ацидозды түзету.']
]},

hypobar:{
name:'Гипобариялық',full:'Гипобариялық гипоксия',vals:'Биіктік · PaO₂ ↓, PaCO₂ ↓',inh:true,
lead:'Биіктікке көтерілгенде атмосфералық қысым төмендеп, онымен бірге ауадағы O₂ парциалды қысымы да азаяды (O₂ үлесі 21% болып қалады). Белгілер көбіне 2500–3000 м-ден жоғары байқалады. Ерекшелігі: гипоксемия гипервентиляция арқылы гипокапнияға әкеледі.',
nodes:[
{id:'e1',c:0,r:0,dir:'hemo',type:'etio',t:'Тауға көтерілу (> 2500–3000 м)',term:'горная болезнь',s:[
'Биіктікте барометрлік қысым төмендейді.',
'Шамамен әр 5500 м сайын атмосфералық қысым екі есе азаяды; теңіз деңгейінде ауадағы pO₂ ≈ 159 мм с.б.б.',
'Альвеолалық pO₂ азаяды.',
'Тау ауруы: бас ауыру, ұйқысыздық, әлсіздік.',
'Біртіндеп көтерілу, ацетазоламид, төмен түсу.',
'Горная болезнь']},
{id:'e2',c:1,r:0,dir:'hemo',type:'etio',t:'Ұшақ кабинасының герметизациясы бұзылуы',term:'высотная болезнь',s:[
'Үлкен биіктікте кабинадағы қысым кенет төмендейді.',
'Ауадағы pO₂ өте аз, компенсация үлгермейді.',
'Найзағай тәрізді немесе жіті гипоксия; сана тез жоғалады.',
'Сана сақталатын уақыт биіктікке қарай секундтар–минуттар.',
'O₂ маскасы, биіктікті жедел азайту.',
'Высотная болезнь; разгерметизация']},
{id:'e3',c:3,r:0,dir:'hemo',type:'etio',t:'Бейімделусіз тез көтерілу',term:'фактор риска',s:[
'Ағза бейімделуге үлгермейді.',
'Ұзақ бейімделу механизмдері (эритропоэз, 2,3-ДФГ, бүйрек компенсациясы) күндер мен апталарды қажет етеді.',
'Жіті тау ауруы, өкпе мен ми ісінуі қаупі артады.',
'Белгілер көтерілгеннен кейін шамамен 6–12 сағатта басталады.',
'3000 м-ден жоғары тәулігіне 300–500 м-ден артық көтерілмеу.',
'Факторы риска высотной болезни']},
{id:'main',c:2,r:1,dir:'hemo',type:'main',t:'Альвеолалық pO₂ ↓ → PaO₂ ↓, SaO₂ ↓',term:'гипобарическая гипоксемия',s:[
'Артериялық қан O₂-мен толық қанықпайды.',
'Альвеолалық газ теңдеуі: PAO₂ = FiO₂ × (Pатм − 47) − PaCO₂/0,8; Pатм азайса, PAO₂ де азаяды.',
'PaO₂ < 60 мм с.б.б. болғанда диссоциация қисығының тік бөлігі басталып, SaO₂ тез төмендейді.',
'SaO₂ < 90%, диффузды цианоз.',
'O₂ беру, төмен түсу.',
'Гипобарическая гипоксемия']},
{id:'L1',c:0,r:2,dir:'neuro',type:'protect',t:'Хеморецепторлар → гипервентиляция',term:'гипоксическая гипервентиляция',s:[
'Тыныс тереңдеп, жиілейді.',
'Каротид шумағы PaO₂ < 60 мм с.б.б. болғанда күшті қозады.',
'Альвеолалық pO₂ біршама артады, бірақ CO₂ де көп шығады.',
'Ентігу, тахипноэ.',
'Пайдалы реакция; бірақ гипокапния оны шектейді.',
'Гипоксическая гипервентиляция']},
{id:'L2',c:0,r:3,dir:'metab',type:'damage',t:'Гипокапния, тыныстық алкалоз',term:'респираторный алкалоз',s:[
'PaCO₂ төмендеп, pH артады.',
'CO₂ қалыптыдан көп шығарылады.',
'Тыныс орталығы тежеліп, гипервентиляция шектеледі; ми тамырлары тарылады; диссоциация қисығы солға жылжып, тінге O₂ нашар беріледі.',
'Бас айналу, парестезия, бұлшықет тартылуы.',
'Ацетазоламид бүйрек арқылы HCO₃⁻ шығарып, алкалозды азайтады.',
'Гипокапния; респираторный алкалоз']},
{id:'k1',c:0,r:4,dir:'organ',type:'clinic',from:'L2',t:'Бас ауыру, бас айналу, ұйқы бұзылуы',term:'острая горная болезнь',s:[

'Әдетте 1–3 күнде басылады.',
'Бас ауыру, жүрек айну, әлсіздік, ұйқысыздық; ұйқыда Чейн–Стокс тынысы.',

{id:'A',c:2,r:2,dir:'hemo',type:'damage',t:'Өкпе тамырлары тарылады',term:'рефлекс Эйлера–Лильестранда',s:[

'Гипоксия тегіс бұлшықет жасушаларының K⁺ каналдарын жауып, Ca²⁺ кіруін арттырады.',
'Өкпе тамырларының кедергісі артады.',
'Өкпе артериясында қысым ↑.',
'O₂, нифедипин.',
'Гипоксическая лёгочная вазоконстрикция']},
{id:'B',c:2,r:3,dir:'hemo',type:'damage',t:'Өкпе гипертензиясы, капилляр қысымы ↑',term:'лёгочная гипертензия',s:[

'Тарылу әр аймақта әртүрлі; тарылмаған аймақтарға қан көп ағып, капиллярлар зақымданады.',
'Сұйықтық интерстиций мен альвеолаларға шығады.',
'Оң қарынша жүктемесі.',
'Нифедипин, O₂.',
'Лёгочная гипертензия']},
{id:'C',c:1,r:3,dir:'organ',type:'damage',t:'Биіктік өкпе ісінуі → диффузия ↓',term:'высотный отёк лёгких',s:[

{id:'k2',c:1,r:4,dir:'organ',type:'clinic',from:'C',t:'Тыныштықта ентігу, көбікті қақырық',term:'клиника отёка лёгких',s:[

'Альвеолаларда сұйықтық, газ алмасу бұзылуы.',

'Жоғары жүйке қызметі бұзылады.',

'Қан ми мен жүрекке басымдықпен бағытталады.',
'Тері, бүйрек, ішек тамырлары тарылады, ал ми мен коронарлық тамырлар тарылмайды.',
'Өмірлік маңызды мүшелердің перфузиясы уақытша сақталады.',

'Централизация кровообращения']},
{id:'k4',c:4,r:4,dir:'hemo',type:'clinic',from:'P2',t:'Тахикардия, тері бозаруы, суық тер',term:'признаки компенсации',s:[
'Компенсациялық реакциялардың белгілері.',
'Симпатикалық жүйенің белсенуі.',
'АҚ біраз уақыт сақталады.',
'Пульс жиі, әлсіз.',
'Себепті емдеу.',

hemic:{
name:'Қандық (гемдік)',full:'Қандық (гемдік) гипоксия',vals:'PaO₂ қалыпты · O₂ сыйымдылығы ↓',inh:true,
lead:'Қанның оттегі сыйымдылығы азаяды: Hb аз болады (анемия) немесе ол O₂-ні байланыстыра алмайды (карбоксигемоглобин, метгемоглобин). PaO₂ қалыпты, сондықтан хеморецепторлар әлсіз қозады. 1 г Hb 1,34 мл O₂ байланыстырады; қалыпты CaO₂ шамамен 200 мл/л.',
nodes:[
{id:'e1',c:0,r:0,dir:'cell',type:'etio',t:'Анемия: Hb мөлшері ↓',term:'анемическая гипоксия',s:[
'Қанда Hb аз.',
'Қан жоғалту, темір тапшылығы, гемолиз, эритропоэз тежелуі.',
'Әр Hb толық қаныққанымен, жалпы тасымалданатын O₂ азаяды.',
'Hb < 120 г/л (әйелдер), < 130 г/л (ерлер).',
'Себепті емдеу, темір препараттары, эритроцит массасы.',
'Анемическая гипоксия']},
{id:'e2',c:1,r:0,dir:'cell',type:'etio',t:'Көміртек тотығы (CO) улануы',term:'отравление угарным газом',s:[
'CO гемоглобинмен карбоксигемоглобин (HbCO) түзеді.',
'CO-ның Hb-ге жақындығы O₂-ден шамамен 200–250 есе жоғары.',
'O₂ байланыстыратын орындар жабылады; CO цитохромоксидаза мен миоглобинді де тежейді.',
'Бас ауыру, жүрек айну, сана бұзылуы; пульсоксиметр жалған қалыпты көрсетеді.',
'100% O₂, гипербарлық оксигенация.',
'Карбоксигемоглобинемия']},
{id:'e3',c:3,r:0,dir:'cell',type:'etio',t:'Метгемоглобин түзушілер: нитриттер, анилин',term:'метгемоглобинемия',s:[
'Hb темірі Fe²⁺-тен Fe³⁺-ке тотығады.',
'Нитраттар, нитриттер, анилин, сульфаниламидтер, бензокаин.',
'Fe³⁺ O₂ байланыстырмайды; қалған гемдер O₂-ні мықты ұстайды.',
'Қоңыр-сұр цианоз, қан шоколад түсті.',
'Метилен көгі в/і, аскорбин қышқылы.',
'Метгемоглобинемия']},
{id:'e4',c:4,r:0,dir:'cell',type:'etio',t:'Hb-нің O₂-ге жақындығы ↑',term:'повышенное сродство Hb к O₂',s:[
'Hb O₂-ні тінге нашар береді.',
'Кейбір гемоглобинопатиялар; ұзақ сақталған қанда 2,3-ДФГ аз.',
'Диссоциация қисығы солға жылжиды.',
'Компенсаторлық эритроцитоз.',
'Жаңа қан құю, себепті емдеу.',
'Повышение сродства гемоглобина к кислороду']},
{id:'main',c:2,r:1,dir:'cell',type:'main',t:'Қанның O₂ сыйымдылығы ↓ (CaO₂ ↓), PaO₂ қалыпты',term:'снижение кислородной ёмкости',s:[
'Әр литр қан тінге аз O₂ тасымалдайды.',
'CaO₂ = 1,34 × Hb × SaO₂ + 0,003 × PaO₂; Hb немесе белсенді Hb азаяды.',
'Тінге O₂ жеткізу азаяды, бірақ PaO₂ қалыпты болғандықтан тыныс аз күшейеді.',
'PaO₂ қалыпты; CaO₂ ↓; A-V айырмасы азаяды.',
'Hb-ні толтыру немесе белсенді Hb-ні қалпына келтіру.',
'Гемическая гипоксия']},
{id:'L1',c:0,r:2,dir:'cell',type:'damage',t:'HbCO, MetHb: O₂ орындары жабылады',term:'блокада гема',s:[
'Hb-нің бір бөлігі O₂ тасымалдауға қатыспайды.',
'CO гемге мықты байланысады; MetHb-да темір Fe³⁺ күйінде.',
'Белсенді Hb мөлшері азаяды.',
'HbCO немесе MetHb деңгейі ↑.',
'O₂ (CO-да), метилен көгі (MetHb-да).',
'Блокада гемоглобина']},
{id:'L2',c:0,r:3,dir:'cell',type:'damage',t:'Қисық солға: тінге O₂ нашар беріледі',term:'эффект Холдейна',s:[
'Қалған гемдер O₂-ні мықты ұстап, тінге бермейді.',
'HbCO мен MetHb молекуланың басқа гемдерінің O₂-ге жақындығын арттырады (Холдейн әсері).',
'Тіндік гипоксия CaO₂ азаюынан күштірек болады.',
'50% HbCO анемиядағы 50% Hb азаюынан анағұрлым ауыр.',
'Себепті жою.',
'Сдвиг кривой диссоциации влево (эффект Холдейна)']},
{id:'k1',c:0,r:4,dir:'organ',type:'clinic',from:'L2',t:'CO: шие-қызыл тері; MetHb: қоңыр-сұр цианоз',term:'окраска кожи',s:[
'Тері түсінің өзгерісі.',
'HbCO ашық қызыл, MetHb қоңыр түсті.',
'Ауыр түрінде кома, құрысу.',
'CO-да тері қызғылт (көбіне өлгеннен кейін айқын); MetHb > 15%-да цианоз.',
'Антидоттар.',
'Отравление CO; метгемоглобинемия']},
{id:'A',c:2,r:2,dir:'hemo',type:'damage',t:'Гипердинамиялық қан айналымы: жүрек жұмысы ↑',term:'гипердинамический тип',s:[
'Жүрек жиі әрі көп қан айдайды.',
'Тіндік гипоксия, қан тұтқырлығының азаюы (анемияда) жүрек лақтырысын арттырады.',
'Миокардтың O₂ қажеттілігі өседі.',
'Тахикардия, жүрек қағуы.',
'Анемияны түзету.',
'Гипердинамический тип кровообращения']},
{id:'B',c:2,r:3,dir:'organ',type:'damage',t:'Миокард гипоксиясы, дистрофиясы',term:'дистрофия миокарда',s:[
'Жүрек жұмысы артып, ал O₂ жеткізу азайған.',
'Коронарлық қан да O₂-ге кедей.',
'Миокард дистрофиясы, ишемия.',
'Стенокардия, систолалық шу.',
'Hb-ні толтыру.',
'Анемическая дистрофия миокарда']},
{id:'C',c:1,r:3,dir:'hemo',type:'damage',t:'Жүрек жеткіліксіздігі → қанайналымдық гипоксия қосылады',term:'присоединение циркуляторной гипоксии',s:[
'Жүрек лақтырысы төмендейді.',
'Шаршаған миокард жүктемені көтере алмайды.',
'Тінге O₂ жеткізу одан әрі азаяды: тұйық шеңбер.',
'Ісінулер, ентігу.',
'Эритроцит массасын абайлап құю.',
'Смешанная гемическая и циркуляторная гипоксия']},
{id:'k2',c:2,r:4,dir:'organ',type:'clinic',from:'B',t:'Жүрек қағуы, систолалық шу, ентігу',term:'кардиальные признаки анемии',s:[
'Жүрек белгілері.',
'Гипердинамиялық қан айналымы, қан тұтқырлығы ↓.',
'Жүктемеде ентігу.',
'Функциялық систолалық шу.',
'Анемияны түзету.',
'Анемический шум']},
{id:'R1',c:3,r:2,dir:'metab',type:'damage',t:'Тінге жеткізілетін O₂ ↓',term:'снижение доставки O₂',s:[
'Тін алатын O₂ мөлшері азаяды.',
'CaO₂ төмен болғандықтан, тін әр литр қаннан аз O₂ алады.',
'Анаэробты гликолиз артады.',
'Лактат ↑ (ауыр түрінде).',
'Себепті емдеу.',
'Снижение доставки кислорода']},
{id:'R2',c:3,r:3,dir:'organ',type:'damage',t:'Ми мен бұлшықеттер гипоксиясы',term:'гипоксия мозга и мышц',s:[
'Ми мен бұлшықеттер энергия тапшылығына ұшырайды.',
'O₂-ге тәуелді тіндер бірінші зардап шегеді.',
'Әлсіздік, жұмыс қабілеті төмендейді.',
'Бас айналу, шаршау.',
'Hb-ні толтыру.',
'Гипоксия мозга и скелетных мышц']},
{id:'k3',c:3,r:4,dir:'organ',type:'clinic',from:'R2',t:'Бозғылттық, әлсіздік, бас айналу',term:'анемический синдром',s:[
'Анемиялық синдром.',
'Hb аз, тері тамырлары тарылған.',
'Анемияда цианоз болмайды: капиллярда қалпына келген Hb 50 г/л-ге жетпейді.',
'Тері мен шырышты қабаттар бозғылт.',
'Себепті емдеу.',
'Анемический синдром']},
{id:'P1',c:4,r:2,dir:'neuro',type:'protect',t:'Бүйрек эритропоэтин бөледі',term:'эритропоэтин',s:[
'Бүйрек гипоксиясы эритропоэтин түзілуін арттырады.',
'Бүйректің перитубулярлы жасушаларында HIF белсенеді.',
'Сүйек кемігінде эритропоэз күшейеді.',
'Эритропоэтин ↑.',
'Бүйрек ауруында рекомбинантты эритропоэтин.',
'Эритропоэтин']},
{id:'P2',c:4,r:3,dir:'cell',type:'protect',t:'2,3-ДФГ ↑, ретикулоцитоз',term:'2,3-ДФГ, ретикулоцитоз',s:[

'2,3-ДФГ Hb-нің O₂-ге жақындығын азайтып, қисықты оңға жылжытады.',
'Тінге O₂ берілуі жақсарады, Hb біртіндеп өседі.',
'Ретикулоциттер ↑ (қан жоғалтудан кейін 3–5 күнде).',
'Себепті емдеу.',
'Ретикулоцитоз']}
],

tissue:{

nodes:[
{id:'e1',c:0,r:0,dir:'cell',type:'etio',t:'Цианидтер: цитохромоксидаза тежеледі',term:'отравление цианидами',s:[
'CN⁻ цитохромоксидазаның (aa₃) Fe³⁺-мен байланысады.',
'Тыныс тізбегінің соңғы ферменті бұғатталып, электрондар O₂-ге берілмейді.',

{id:'e2',c:1,r:0,dir:'cell',type:'etio',t:'Ажыратушылар: 2,4-динитрофенол, тироксин артықтығы',term:'разобщители',s:[

'Протондар АТФ-синтазаны айналып, мембрана арқылы кері өтеді.',
'Энергия жылуға айналады.',
'Гипертермия, тершеңдік.',
'Себепті жою, суыту.',
'Разобщение окисления и фосфорилирования']},
{id:'e3',c:3,r:0,dir:'metab',type:'etio',t:'B₁, B₂, PP витаминдерінің тапшылығы',term:'дефицит коферментов',s:[

'B₁ (тиаминпирофосфат), B₂ (ФАД), PP (НАД) түзілмейді.',
'Пируват пен Кребс циклі баяулайды.',
'Бери-бери, пеллагра, Вернике энцефалопатиясы.',
'Витаминдерді толтыру.',
'Дефицит витаминов-коферментов']},
{id:'e4',c:4,r:0,dir:'cell',type:'etio',t:'Мембраналар зақымдануы: радиация, бос радикалдар, алкоголь',term:'повреждение мембран митохондрий',s:[

'Липидтердің асқын тотығуы, иондаушы сәуле, эндотоксиндер, алкоголь.',
'Тыныс тізбегі ферменттері мембранадан ажырайды.',
'Негізгі аурудың белгілері.',
'Антиоксиданттар.',
'Повреждение мембран митохондрий']},
{id:'main',c:2,r:1,dir:'cell',type:'main',t:'Митохондрия O₂-ні пайдалана алмайды',term:'нарушение утилизации O₂',s:[

'O₂ тінге жеткенімен, АТФ түзілмейді.',

'Антидоттар, коферменттер, антиоксиданттар.',
'Гистотоксическая гипоксия']},
{id:'L1',c:0,r:2,dir:'metab',type:'damage',t:'O₂ венаға өтеді: веналық pO₂ ↑, A-V айырмасы ↓',term:'артериализация венозной крови',s:[

'Веналық қан ашық қызыл; A-V айырмасы күрт азаяды.',

'Цианоз':['Диффузды','Диффузды','Орталық, «жылы»','Перифериялық, «суық» (акроцианоз)','Анемияда жоқ; CO-да шие-қызыл тері; MetHb-да қоңыр-сұр','Жоқ, тері қызғылт','Бозғылт-көкшіл','Жоқ немесе әлсіз','Жоқ'],
'Басты буын':['Ауадағы pO₂ ↓','Ауадағы O₂ үлесі ↓','Өкпеде газ алмасу ↓','Тіндік қан ағысы ↓','Hb O₂ тасымалдай алмайды','Митохондрия O₂-ні пайдаланбайды','Бірнеше буын','Қажеттілік жеткізуден асады','Тотығатын субстрат ↓'],
'Негізгі ем':['Төмен түсу, O₂, ацетазоламид','Таза ауа, O₂','Себепті ем, O₂, желдету','Гемодинамиканы қалпына келтіру','Hb толтыру; CO-да гипербарлық O₂; MetHb-да метилен көгі','Антидоттар, коферменттер','Әр бөлікті түзету','Жүктемені азайту','Глюкоза, инсулин, тамақтандыру']
};
const SPEED=[
['Қауырт','найзағай тәрізді','бірнеше секунд','Цианид улануы, жоғары биіктікте кабина герметизациясының бұзылуы, CO-ның өте жоғары концентрациясы.','Компенсация іске қосылуға үлгермейді; сана бірнеше секундта жоғалып, өлім тез болады.'],
['Жіті','','бірнеше минут','Асфиксия, жедел қан жоғалту, миокард инфарктісі, CO улануы, өкпе ісінуі.','Шұғыл бейімделу іске қосылады: гипервентиляция, тахикардия, қанның қайта бөлінуі, деподан эритроциттер шығуы.'],
['Созылмалы','','бірнеше апта, айлар–жылдар','Созылмалы жүрек және тыныс жеткіліксіздігі, анемия, биік тауда тұру.','Ұзақ бейімделу дамиды: HIF-1α, эритроцитоз, ангиогенез, 2,3-ДФГ ↑, митохондриялар саны ↑.']
];

<script>
(function(){
const DIRS={
  hemo:{name:'Гемодинамикалық',g:'Гд'},
  neuro:{name:'Нейрогуморалдық',g:'Нг'},
  metab:{name:'Метаболизмдік',g:'Мб'},
  immune:{name:'Иммундық-қабынулық',g:'Иқ'},
  cell:{name:'Жасушалық-молекулалық',g:'Жм'},
  organ:{name:'Мүшелік зақымданулар',g:'Мш'}
};
const TYPES={
  etio:{short:'Этиология',full:'Этиология',v:'--t-etio'},
  main:{short:'Басты буын',full:'Басты буын',v:'--t-main'},
  damage:{short:'Зақымдаушы',full:'Зақымдаушы буын',v:'--t-damage'},
  protect:{short:'Компенсаторлық',full:'Қорғаныш / компенсаторлық буын',v:'--t-protect'},
  clinic:{short:'Клиника',full:'Клиникалық белгі',v:'--t-clinic'}
};
const SEC=['Не болады','Неліктен','Нәтижесі','Клиника','Емдік нүкте','Термин'];
const KEYS=GROUPS.flatMap(g=>g[1]);
const CW=1184, TOP=44, GAP=48;

const canvas=document.getElementById('canvas');
const svg=document.getElementById('edges');
const panel=document.getElementById('panel');
const scroller=document.getElementById('scroller');
const tabsEl=document.getElementById('tabs');
const leadEl=document.getElementById('lead');
const cmpEl=document.getElementById('cmp');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
canvas.style.width=CW+'px';

let S,N,E,byId,els,sel=null,cur=null;

/* legend (once) */
(function(){
  let h='';
  for(const k in DIRS) h+=`<span class="lg"><span class="tag" style="--d:var(--d-${k})">${DIRS[k].g}</span>${DIRS[k].name}</span>`;
  h+='<span class="lg-sep"></span>';
  const tl={etio:'Этиология',main:'Басты буын',damage:'Зақымдаушы буын',protect:'Қорғаныш / компенсаторлық',clinic:'Клиникалық белгі'};
  for(const k in tl) h+=`<span class="lg"><span class="dot" style="--t:var(${TYPES[k].v})"></span>${tl[k]}</span>`;
  h+='<span class="lg-sep"></span>';
  const ln=(c,dash)=>`<svg width="30" height="10" viewBox="0 0 30 10"><line x1="1" y1="5" x2="22" y2="5" style="stroke:var(${c});stroke-width:1.5${dash?';stroke-dasharray:4 3':''}"/><path d="M29 5 L21 1 L21 9 Z" style="fill:var(${c})"/></svg>`;
  h+=`<span class="lg">${ln('--arrow')}Себеп-салдар</span>`;
  h+=`<span class="lg">${ln('--t-loop')}Тұйық шеңбер</span>`;
  h+=`<span class="lg">${ln('--t-cross',1)}Айқасқан байланыс</span>`;
  h+=`<span class="lg"><svg width="30" height="12" viewBox="0 0 30 12"><line x1="1" y1="6" x2="27" y2="6" style="stroke:var(--t-protect);stroke-width:1.5"/><line x1="27" y1="1" x2="27" y2="11" style="stroke:var(--t-protect);stroke-width:2"/></svg>Тежеу</span>`;
  document.getElementById('legend').innerHTML=h;
})();

/* grouped tabs (once) */
tabsEl.innerHTML=GROUPS.map(([lb,ks])=>`<div class="tg"><span class="tg-lb">${lb}</span><div class="tabs">`+
  ks.map(k=>`<button type="button" class="tab" role="tab" id="tab-${k}" data-k="${k}" aria-selected="false"><span class="tn">${SCHEMES[k].name}</span><span class="tv">${SCHEMES[k].vals}</span></button>`).join('')+
  `</div></div>`).join('');
tabsEl.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b&&b.dataset.k!==cur)mount(b.dataset.k)});
tabsEl.addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  const i=KEYS.indexOf(cur),n=KEYS[(i+(e.key==='ArrowRight'?1:KEYS.length-1))%KEYS.length];
  mount(n); document.getElementById('tab-'+n).focus();
});

function renderTable(){
  let h='<thead><tr><th scope="col">Көрсеткіш</th>'+CK.map(k=>`<th scope="col"${k===cur?' class="cur"':''}>${SCHEMES[k].name}</th>`).join('')+'</tr></thead><tbody>';
  for(const row in COMPARE){
    h+=`<tr><th scope="row">${esc(row)}</th>`+COMPARE[row].map((v,i)=>`<td${CK[i]===cur?' class="cur"':''}>${esc(v)}</td>`).join('')+'</tr>';
  }
  cmpEl.innerHTML=h+'</tbody>';
}
document.getElementById('spd').innerHTML='<thead><tr><th scope="col">Түрі</th><th scope="col">Даму уақыты</th><th scope="col">Мысалдар</th><th scope="col">Ерекшелігі</th></tr></thead><tbody>'+
  SPEED.map(r=>`<tr><th scope="row">${esc(r[0])}${r[1]?`<br><span class="sub">(${esc(r[1])})</span>`:''}</th><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`).join('')+'</tbody>';

function pathD(pts,rad){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const p0=pts[i-1],p=pts[i],p1=pts[i+1];
    const li=Math.hypot(p[0]-p0[0],p[1]-p0[1]),lo=Math.hypot(p1[0]-p[0],p1[1]-p[1]);
    if(!li||!lo){d+=` L${p[0]},${p[1]}`;continue}
    const r=Math.min(rad,li/2,lo/2);
    const di=[(p[0]-p0[0])/li,(p[1]-p0[1])/li],dout=[(p1[0]-p[0])/lo,(p1[1]-p[1])/lo];
    d+=` L${p[0]-di[0]*r},${p[1]-di[1]*r} Q${p[0]},${p[1]} ${p[0]+dout[0]*r},${p[1]+dout[1]*r}`;
  }
  const L=pts[pts.length-1];return d+` L${L[0]},${L[1]}`;
}

function draw(){
  if(!N)return;
  const rows=Math.max(...N.map(n=>n.r))+1, rh=new Array(rows).fill(0);
  N.forEach(n=>{rh[n.r]=Math.max(rh[n.r],els[n.id].offsetHeight)});
  const top=[];let y=TOP;
  for(let r=0;r<rows;r++){top[r]=y;y+=(rh[r]||44)+GAP}
  N.forEach(n=>{els[n.id].style.top=top[n.r]+'px'});
  const H=y-GAP+28; canvas.style.height=H+'px';
  const R={};
  N.forEach(n=>{const el=els[n.id];const l=el.offsetLeft,t=top[n.r],w=el.offsetWidth,h=el.offsetHeight;
    R[n.id]={l,t,w,h,r:l+w,b:t+h,cx:l+w/2,cy:t+h/2}});
  svg.setAttribute('width',CW); svg.setAttribute('height',H); svg.setAttribute('viewBox',`0 0 ${CW} ${H}`);
  let out='';
  E.forEach((e,i)=>{
    const raw=e.p(R); let pts=raw.map(p=>p.slice());
    const a=pts[pts.length-2],z=pts[pts.length-1];
    const len=Math.hypot(z[0]-a[0],z[1]-a[1])||1;const dx=(z[0]-a[0])/len,dy=(z[1]-a[1])/len;
    let extra='';
    if(e.k==='inh'){
      const bx=z[0]-dx*3,by=z[1]-dy*3; pts[pts.length-1]=[bx,by];
      extra=`<line class="bar" x1="${bx-dy*6}" y1="${by+dx*6}" x2="${bx+dy*6}" y2="${by-dx*6}" stroke-width="2"/>`;
    }else{
      pts[pts.length-1]=[z[0]-dx*8,z[1]-dy*8];
      const bx=z[0]-dx*9,by=z[1]-dy*9;
      extra=`<path class="hd" d="M${z[0]},${z[1]} L${bx-dy*4.5},${by+dx*4.5} L${bx+dy*4.5},${by-dx*4.5} Z"/>`;
    }
    out+=`<g class="edge e-${e.k}" data-i="${i}"><path class="ln" d="${pathD(pts,8)}"/>${extra}</g>`;
  });
  (S.markers||[]).forEach((m,i)=>{
    const [cx,cy0]=m(R),cy=cy0-10,r=15;
    const a0=-50*Math.PI/180,a1=a0+300*Math.PI/180;
    const sx=cx+r*Math.cos(a0),sy=cy+r*Math.sin(a0),ex=cx+r*Math.cos(a1),ey=cy+r*Math.sin(a1);
    const tx=-Math.sin(a1),ty=Math.cos(a1),hb=[ex-tx*8,ey-ty*8];
    out+=`<g class="loopmark" data-l="${i}"><path class="loop-ic" d="M${sx},${sy} A${r},${r} 0 1 1 ${ex-tx*3},${ey-ty*3}"/>`+
      `<path class="loop-hd" d="M${ex+tx*2},${ey+ty*2} L${hb[0]-ty*4.5},${hb[1]+tx*4.5} L${hb[0]+ty*4.5},${hb[1]-tx*4.5} Z"/>`+
      `<text class="loop-lb" x="${cx}" y="${cy+r+20}" text-anchor="middle">тұйық шеңбер</text></g>`;
  });
  svg.innerHTML=out;
  applyFade();
}

function applyFade(){
  const s=sel?byId[sel]:null;
  N.forEach(n=>{
    const el=els[n.id];
    el.setAttribute('aria-pressed',String(n.id===sel));
    el.classList.toggle('faded',!!s&&n.dir!==s.dir&&n.id!==s.id);
  });
  svg.querySelectorAll('.edge').forEach(g=>{
    const e=E[+g.dataset.i];
    const keep=!s||e.f===sel||e.to===sel||(byId[e.f].dir===s.dir&&byId[e.to].dir===s.dir);
    g.classList.toggle('faded',!keep);
  });
  svg.querySelectorAll('.loopmark').forEach(g=>{
    const ids=(S.loops||[])[+g.dataset.l]||[];
    g.classList.toggle('faded',!!s&&!ids.includes(sel));
  });
}
const narrow=()=>window.matchMedia('(max-width:1099px)').matches;
function chip(id,suffix){
  const n=byId[id];
  return `<button type="button" class="chip" data-go="${id}" style="--d:var(--d-${n.dir})">${esc(n.t)}${suffix?' ('+suffix+')':''}</button>`;
}
const kindNote=k=>k==='inh'?'тежейді':k==='cross'?'айқасқан':'';
function renderPanel(){
  const n=sel?byId[sel]:null;
  if(!n){
    panel.style.setProperty('--pd','var(--t-main)');
    let h=`<div class="p-top"><h2>${esc(S.full||S.name)}</h2><button type="button" class="panel-close" data-close>Жабу</button></div>`;
    S.overview.forEach(([hd,p])=>{h+=`<div class="p-sec"><h3>${esc(hd)}</h3><p>${esc(p)}</p></div>`});
    h+=`<div class="p-sec"><h3>Схеманы оқу</h3><p>Түйінді басыңыз: таңдалған бағыт қалады, қалғандары бозарады. Бос жерді басу немесе Esc таңдауды алып тастайды.</p></div>`;
    panel.innerHTML=h; return;
  }
  panel.style.setProperty('--pd',`var(--d-${n.dir})`);
  const inc=E.filter(e=>e.to===n.id).map(e=>chip(e.f,kindNote(e.k)));
  const out=E.filter(e=>e.f===n.id).map(e=>chip(e.to,kindNote(e.k)));
  let h=`<div class="p-top"><h2>${esc(n.t)}</h2><button type="button" class="panel-close" data-close>Жабу</button></div>
    <div class="p-dir"><span class="tag" style="--d:var(--d-${n.dir})">${DIRS[n.dir].g}</span>${DIRS[n.dir].name}</div>
    <div class="p-type"><span class="dot" style="--t:var(${TYPES[n.type].v})"></span>${TYPES[n.type].full}</div>`;
  n.s.forEach((txt,i)=>{
    h+=i===5?`<div class="p-sec"><h3>${SEC[i]}</h3><p class="term-txt">(${esc(txt)})</p></div>`
            :`<div class="p-sec"><h3>${SEC[i]}</h3><p>${esc(txt)}</p></div>`;
  });
  if(inc.length||out.length){
    h+=`<div class="p-sec"><h3>Байланыстар</h3>`;
    if(inc.length) h+=`<div class="chip-lb">Алдыңғы буын</div><div class="chips">${inc.join('')}</div>`;
    if(out.length) h+=`<div class="chip-lb">Келесі буын</div><div class="chips">${out.join('')}</div>`;
    h+=`</div>`;
  }
  panel.innerHTML=h; panel.scrollTop=0;
}
function ensureVisible(id){
  const el=els[id];
  let nr=el.getBoundingClientRect(),cr=scroller.getBoundingClientRect();
  if(nr.left<cr.left+16||nr.right>cr.right-16) scroller.scrollLeft+=(nr.left+nr.width/2)-(cr.left+cr.width/2);
  if(narrow()){
    nr=el.getBoundingClientRect();
    const sheetTop=window.innerHeight-panel.offsetHeight;
    if(nr.bottom>sheetTop-12||nr.top<12) window.scrollBy(0,nr.top-72);
  }
}
function select(id){
  sel=id; applyFade(); renderPanel();
  panel.classList.toggle('open',!!id);
  document.body.style.paddingBottom=(id&&narrow())?panel.offsetHeight+'px':'';
  if(id) ensureVisible(id);
}

function mount(key){
  cur=key; S=SCHEMES[key]; N=S.nodes; E=S.edges; byId={}; N.forEach(n=>byId[n.id]=n);
  canvas.querySelectorAll('.node').forEach(b=>b.remove());
  els={};
  N.forEach(n=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='node'+(n.type==='main'?' main':'');
    b.style.left=(20+n.c*236)+'px';
    b.style.setProperty('--d',`var(--d-${n.dir})`);
    b.setAttribute('aria-pressed','false');
    b.title=DIRS[n.dir].name+' · '+TYPES[n.type].full;
    b.innerHTML=`<span class="meta"><span class="ty"><span class="dot" style="--t:var(${TYPES[n.type].v})"></span>${TYPES[n.type].short}</span><span class="tag">${DIRS[n.dir].g}</span></span><span class="ttl">${esc(n.t)}</span><span class="term">(${esc(n.term)})</span>`;
    b.addEventListener('click',e=>{e.stopPropagation();select(sel===n.id?null:n.id)});
    canvas.appendChild(b); els[n.id]=b;
  });
  KEYS.forEach(k=>document.getElementById('tab-'+k).setAttribute('aria-selected',String(k===key)));
  leadEl.textContent=S.lead+' Түйінді басыңыз — түсіндірме ашылады. Esc таңдауды алып тастайды.';
  renderTable();
  sel=null; draw(); select(null); scroller.scrollLeft=0;
  try{localStorage.setItem(PAGE.store,key)}catch(_){}
}

panel.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){select(g.dataset.go);els[g.dataset.go].focus({preventScroll:true});return}
  if(e.target.closest('[data-close]')){const prev=sel;select(null);if(prev)els[prev].focus({preventScroll:true})}
});
canvas.addEventListener('click',()=>{if(sel)select(null)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sel)select(null)});
window.addEventListener('resize',()=>{document.body.style.paddingBottom=(sel&&narrow())?panel.offsetHeight+'px':''});

let start=KEYS[0];
const h=(location.hash||'').slice(1);
if(KEYS.includes(h)) start=h;
else{try{const s=localStorage.getItem(PAGE.store);if(KEYS.includes(s))start=s}catch(_){}}
mount(start);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
window.addEventListener('load',draw);
})();
</script>
<script>
/* viewer bridge: two-finger pinch is sent to the reader, zoom keeps the point under the fingers in place, theme follows the reader */
(function(){
  if (window.parent === window) return;
  var z = 1, pinch = null, focal = null, lastW = innerWidth, lastH = innerHeight;
  function send(m){ try { parent.postMessage(m, '*'); } catch (e) {} }
  addEventListener('message', function(e){
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.__viewer === 'zoom' && typeof d.z === 'number') z = d.z;
    if (d.__viewer === 'theme') {
      if (d.theme) document.documentElement.setAttribute('data-theme', d.theme);
      else document.documentElement.removeAttribute('data-theme');
    }
  });
  function dist(t){ var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.sqrt(dx*dx + dy*dy); }
  function mid(t){ return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 }; }
  document.addEventListener('touchstart', function(e){
    if (e.touches.length === 2) { pinch = { d: dist(e.touches) * z, z: z }; focal = mid(e.touches); e.preventDefault(); }
  }, { passive: false });
  document.addEventListener('touchmove', function(e){
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    focal = mid(e.touches);
    var d = dist(e.touches) * z;
    if (pinch.d > 0) send({ __viewer: 'pinch', z: pinch.z * d / pinch.d });
  }, { passive: false });
  function end(e){
    if (pinch && e.touches.length < 2) {
      pinch = null; send({ __viewer: 'pinchend' });
      setTimeout(function(){ if (!pinch) focal = null; }, 300);
    }
  }
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', end);
  ['gesturestart', 'gesturechange'].forEach(function(t){ document.addEventListener(t, function(e){ e.preventDefault(); }); });
  /* trackpad pinch / ctrl + wheel on a computer */
  var wt = 0;
  addEventListener('wheel', function(e){
    if (!e.ctrlKey) return;
    e.preventDefault();
    focal = { x: e.clientX, y: e.clientY };
    send({ __viewer: 'pinch', z: z * Math.exp(-e.deltaY * 0.01) });
    clearTimeout(wt);
    wt = setTimeout(function(){ focal = null; send({ __viewer: 'pinchend' }); }, 400);
  }, { passive: false });
  addEventListener('resize', function(){
    var w = innerWidth, h = innerHeight, r = lastW / w, rh = lastH / h;
    var oldW = lastW, oldH = lastH;
    lastW = w; lastH = h;
    /* width and height change by the same factor only when the zoom changed (not on rotation) */
    if (Math.abs(r - 1) < 0.01 || Math.abs(r - rh) > 0.04 * r) return;
    var f = focal || { x: oldW / 2, y: oldH / 2 };
    var dx = f.x - f.x / r, dy = f.y - f.y / r;
    window.scrollBy(0, dy);
    var el = document.elementFromPoint(f.x / r, f.y / r);
    while (el && el !== document.body && el !== document.documentElement) {
      if (el.scrollWidth > el.clientWidth + 1) {
        var ox = getComputedStyle(el).overflowX;
        if (ox === 'auto' || ox === 'scroll') { el.scrollLeft += dx; break; }
      }
      el = el.parentElement;
    }
    if (focal) focal = { x: f.x / r, y: f.y / r };
  });
