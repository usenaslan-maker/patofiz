    --bg:#1E1F1C; --node:#2A2B27; --fg:#ECECE8; --fg2:#A9A9A3; --line:#3D3E39; --arrow:#8F908A;

    --d-hemo:#4F8BAA; --d-neuro:#876BAF; --d-metab:#C69643; --d-immune:#BC647A; --d-cell:#5C9898; --d-organ:#7A884E;

  }
}
:root[data-theme="dark"]{
  --bg:#1E1F1C; --node:#2A2B27; --fg:#ECECE8; --fg2:#A9A9A3; --line:#3D3E39; --arrow:#8F908A;
  --t-etio:#989898; --t-main:#4F6BB2; --t-damage:#CE6650; --t-protect:#609A79;
  --t-loop:#CE6650; --t-cross:#A5A5A5; --t-clinic:#B88A40;
  --d-hemo:#4F8BAA; --d-neuro:#876BAF; --d-metab:#C69643; --d-immune:#BC647A; --d-cell:#5C9898; --d-organ:#7A884E;

}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
.page{max-width:1600px;margin:0 auto;padding-inline:16px;padding-block:24px 40px}
@media (min-width:700px){.page{padding-inline:24px}}
h1{font-size:20px;font-weight:600;margin:0 0 12px;text-wrap:balance}
.lead{font-size:15px;color:var(--fg2);max-width:76ch;margin:0 0 14px;line-height:1.6}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tab{font:inherit;text-align:left;cursor:pointer;background:var(--node);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tab .tn{font-size:15px;font-weight:500;line-height:1.35}
.tab .tv{font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{border:1.5px solid var(--t-main);background:color-mix(in srgb,var(--t-main) 8%,var(--node))}
.tab[aria-selected="true"] .tn{font-weight:600}
.tab:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.legend{display:flex;align-items:center;gap:16px;overflow-x:auto;white-space:nowrap;padding-block:10px;margin-bottom:16px;border-block:1px solid var(--line);font-size:13px;color:var(--fg2)}
.lg{display:inline-flex;align-items:center;gap:6px;flex:none}
.lg-sep{width:1px;height:18px;background:var(--line);flex:none}
.tag{display:inline-block;font-size:13px;font-weight:600;line-height:18px;padding:0 5px;border-radius:6px;color:var(--fg);border:1px solid var(--d);background:color-mix(in srgb,var(--d) 8%,transparent);flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--t);flex:none}
.lg svg{flex:none}

.layout{display:block}
@media (min-width:1100px){.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.canvas{position:relative;margin:0 auto}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

.node{position:absolute;top:0;width:200px;background:var(--node);color:var(--fg);border:1.5px solid var(--d);border-radius:10px;padding:9px 12px 10px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.node.main{border-width:2px}
.node[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--d);background:color-mix(in srgb,var(--d) 8%,var(--node))}
.node:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.node .meta{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;font-weight:500;color:var(--fg2);line-height:18px}
.node .ty{display:inline-flex;align-items:center;gap:6px;min-width:0}
.node .ttl{font-size:14px;font-weight:500;line-height:1.4}
.node .term,.term-txt{font-size:13px;font-style:italic;color:var(--fg2);line-height:1.4}
.faded{opacity:.3}

.e-main path.ln{stroke:var(--arrow)} .e-main .hd{fill:var(--arrow)}
.e-loop path.ln{stroke:var(--t-loop)} .e-loop .hd{fill:var(--t-loop)}
.e-cross path.ln{stroke:var(--t-cross);stroke-dasharray:5 4} .e-cross .hd{fill:var(--t-cross)}
.e-inh path.ln,.e-inh .bar{stroke:var(--t-protect)}
path.ln{fill:none;stroke-width:1.5}
.elabel{font-family:var(--font);font-size:13px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.loop-ic{fill:none;stroke:var(--t-loop);stroke-width:1.5}
.loop-hd{fill:var(--t-loop)}
.loop-lb{font-family:var(--font);font-size:13px;font-weight:500;fill:var(--t-loop);paint-order:stroke;stroke:var(--bg);stroke-width:5px}

.panel{--pd:var(--t-main);position:relative;background:var(--node);border:1px solid var(--line);border-radius:10px;padding:20px 22px 22px 26px;display:none}
.panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pd);border-radius:10px 0 0 10px}
@media (min-width:1100px){
  .panel{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow-y:auto}
  .panel-close{display:none!important}
}
@media (max-width:1099px){
  .panel.open{display:block;position:fixed;left:0;right:0;bottom:0;max-height:60vh;overflow-y:auto;z-index:20;border-radius:10px 10px 0 0;border-bottom:0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .panel.open::before{border-radius:10px 0 0 0}
}
.p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel h2{font-size:20px;font-weight:600;margin:0;line-height:1.35;text-wrap:balance}
.panel-close{font:inherit;font-size:13px;font-weight:600;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:10px;padding:4px 10px;cursor:pointer;flex:none}
.p-dir{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;font-weight:600}
.p-type{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--fg2)}
.p-sec{margin-top:16px}
.p-sec h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);margin:0 0 4px}
.p-sec p{font-size:15px;font-weight:400;line-height:1.6;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:inherit;font-size:13px;color:var(--fg);background:var(--node);border:1px solid var(--d);border-radius:10px;padding:3px 9px;cursor:pointer;text-align:left}
.chip:focus-visible,.panel-close:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.chip-lb{font-size:13px;color:var(--fg2);margin-top:8px}

.cmp{margin-top:28px}
.cmp h2{font-size:15px;font-weight:600;margin:0 0 10px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--node)}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);line-height:1.5}
thead th{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
tbody th{font-weight:600;width:20%}
td{font-weight:400}
.cur{background:color-mix(in srgb,var(--t-main) 8%,transparent)}
thead th.cur{color:var(--fg)}
tbody tr:last-child>*{border-bottom:0}
</style>
<style>
.nav{display:flex;flex-direction:column;gap:10px;margin:0 0 16px}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.grp-lb{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);width:100%}
.topic{font:inherit;font-size:14px;font-weight:500;cursor:pointer;background:var(--node);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.topic[aria-selected="true"]{border:1.5px solid var(--t-main);background:color-mix(in srgb,var(--t-main) 8%,var(--node));font-weight:600}
.topic:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
h2.sch{font-size:20px;font-weight:600;margin:4px 0 8px;text-wrap:balance}
.branch{position:absolute;top:8px;font-size:15px;font-weight:600;color:var(--fg2)}
</style>

<script>
const LANE=1182;
const hm=(a,b)=>(Math.max(a.t,b.t)+Math.min(a.b,b.b))/2;
const vm=(a,b)=>(Math.max(a.l,b.l)+Math.min(a.r,b.r))/2;
const D=(a,b)=>{const x=vm(a,b);return [[x,a.b],[x,b.t]]};
const U=(a,b)=>{const x=vm(a,b);return [[x,a.t],[x,b.b]]};
const Rt=(a,b)=>{const y=hm(a,b);return [[a.r,y],[b.l,y]]};
const Lf=(a,b)=>{const y=hm(a,b);return [[a.l,y],[b.r,y]]};
const BT=(s,t,fo)=>{const x=s.l+s.w*fo,y=t.t-24;return [[x,s.b],[x,y],[t.cx,y],[t.cx,t.t]]};
const ST=(s,t,side,fo)=>{const x=side==='l'?s.l:s.r,y=fo==null?s.cy:s.t+s.h*fo;return [[x,y],[t.cx,y],[t.cx,t.t]]};
const BS=(s,t,side)=>[[s.cx,s.b],[s.cx,t.cy],[side==='l'?t.l:t.r,t.cy]];
const BTo=(s,t,tx)=>[[s.cx,s.b],[s.cx,t.t-20],[tx,t.t-20],[tx,t.t]];
const BB=(s,t,x0,Y,tx)=>[[x0,s.b],[x0,Y],[tx,Y],[tx,t.b]];
const GX=c=>20+c*236+218;
const UPL=(s,t)=>[[s.cx,s.t],[s.cx,t.cy],[t.l,t.cy]];
const RUP=(s,t)=>{const x=GX(3),y=t.t+t.h*.3;return [[s.r,s.cy],[x,s.cy],[x,y],[t.r,y]]};
const SCHEMES={},COMPARES={};
</script>
<script>Object.assign(SCHEMES,{
renal:{
title:'Почечные отёки',lane:true,
branches:[{c:0,t:'Нефротический путь'},{c:4,t:'Нефритический путь'}],
lead:'При заболеваниях почек жидкость выходит из сосудов в интерстиций. Различают два основных пути: нефротический (потеря белка и снижение онкотического давления) и нефритический (первичная задержка Na⁺ и гиперволемия).',
nodes:[
{id:'e1',c:0,r:0,dir:'organ',type:'etio',t:'Причины нефротического синдрома',term:'нефротический синдром',s:[
'Заболевания, повреждающие клубочковый фильтр: болезнь минимальных изменений, мембранозная нефропатия, фокально-сегментарный гломерулосклероз, диабетическая нефропатия, амилоидоз, системная красная волчанка.',
'Иммунные, метаболические или наследственные причины нарушают строение подоцитов и гломерулярной базальной мембраны.',
'Фильтр начинает пропускать белок, прежде всего альбумин.',
'Отёки развиваются постепенно и распространяются по всему телу.',
'Лечение основного заболевания: при болезни минимальных изменений — глюкокортикоиды, при мембранозной нефропатии — ритуксимаб, при диабете — контроль гликемии.',
'Нефротический синдром; syndroma nephroticum']},
{id:'n1',c:0,r:1,dir:'cell',type:'damage',t:'Повреждение клубочкового фильтра',term:'подоцитопатия',s:[
'Ножки подоцитов распластываются и сглаживаются; нарушаются белки щелевой диафрагмы (нефрин, подоцин).',
'Базальная мембрана теряет отрицательный заряд (гепарансульфат), поэтому отрицательно заряженный альбумин больше не отталкивается.',
'Ослабевает размерный и зарядовый барьер фильтра.',
'Сам по себе симптомов не даёт; изменения видны при электронной микроскопии.',
'Глюкокортикоиды и ингибиторы кальциневрина (циклоспорин, такролимус) стабилизируют подоциты.',

{id:'n2',c:0,r:2,dir:'organ',type:'main',t:'Массивная протеинурия, >3,5 г/сут',term:'массивная протеинурия',s:[
'С мочой теряется более 3,5 г белка в сутки, большая часть — альбумин. В мочу проходит и плазминоген.',
'Количество белка, прошедшего через повреждённый фильтр, превышает реабсорбционную способность проксимальных канальцев.',
'Организм теряет белок; профильтрованный белок повреждает и канальцевый эпителий.',
'Моча пенистая; в моче белок, гиалиновые и жировые цилиндры.',
'Ингибиторы АПФ или блокаторы рецепторов ангиотензина II снижают внутриклубочковое давление и уменьшают протеинурию.',

{id:'n3',c:0,r:3,dir:'metab',type:'main',t:'Гипоальбуминемия',term:'альбумин <30 г/л',s:[

'При тяжёлых, резистентных к диуретикам отёках — инфузия альбумина вместе с фуросемидом (эффект временный).',

{id:'n4',c:0,r:4,dir:'hemo',type:'main',t:'Снижение онкотического давления плазмы',term:'онкотическое давление',s:[
'Онкотическое давление плазмы падает ниже нормальных ~25 мм рт. ст.',

'Восстановление уровня альбумина за счёт уменьшения протеинурии.',

{id:'n9',c:1,r:2,dir:'cell',type:'damage',t:'Плазмин активирует канал ENaC',term:'overfill-механизм',s:[
'Плазминоген, попавший в мочу, превращается в канальце в плазмин и протеолитически активирует эпителиальный натриевый канал (ENaC) собирательной трубки.',
'Теория «переполнения» (overfill): Na⁺ первично задерживается самой почкой, без гиповолемии.',
'Усиливается альдостерон-независимая реабсорбция Na⁺.',
'У многих больных ОЦК нормальный или повышен, ренин низкий — это указывает на данный механизм.',
'Амилорид прямо блокирует ENaC; сочетается с петлевыми диуретиками.',
'Эпителиальный натриевый канал (ENaC), теория «overfill»']},
{id:'n10',c:1,r:3,dir:'metab',type:'protect',t:'Печень усиленно синтезирует липопротеины',term:'компенсаторный синтез',s:[
'Вместе с альбумином печень усиленно синтезирует липопротеины (ЛПОНП, ЛПНП, Лп(а)).',
'Снижение онкотического давления стимулирует синтез белка в печени; активность липопротеинлипазы снижается, ЛПВП теряются с мочой.',
'Онкотическое давление частично компенсируется, но возникает гиперлипидемия.',

'Компенсаторный синтез липопротеинов; гиперлипидемия']},
{id:'k3',c:1,r:4,dir:'metab',type:'clinic',t:'Гиперлипидемия, липидурия',term:'липидурия',s:[
'Сыворотка выглядит молочной, в моче — капли жира и жировые цилиндры.',

'Холестерин выше 6,5 ммоль/л; в осадке мочи при поляризационной микроскопии — «мальтийские кресты».',

'Гиперлипидемия, липидурия; lipiduria']},
{id:'n6',c:1,r:7,dir:'hemo',type:'damage',t:'Гиповолемия',term:'снижение ОЦК (underfill)',s:[

'Гиповолемия; underfill-гипотеза']},
{id:'n7',c:1,r:5,dir:'neuro',type:'protect',t:'Активация РААС, АДГ, симпатической системы',term:'РААС, АДГ',s:[
'Активируются ренин-ангиотензин-альдостероновая система, антидиуретический гормон (вазопрессин) и симпатическая нервная система.',
'Приспособительный ответ почек и сосудов на уменьшение объёма крови.',
'Альдостерон усиливает реабсорбцию Na⁺ в дистальном канальце, АДГ — реабсорбцию воды в собирательной трубке (аквапорин-2). Задержанная жидкость снова уходит в интерстиций — порочный круг.',
'В крови повышены ренин и альдостерон, Na⁺ в моче очень низкий (<20 ммоль/л).',
'Спиронолактон (антагонист альдостерона), ингибиторы АПФ.',
'Ренин-ангиотензин-альдостероновая система, вторичный гиперальдостеронизм']},
{id:'n8',c:2,r:5,dir:'metab',type:'main',t:'Задержка Na⁺ и воды почками',term:'задержка натрия и воды',s:[
'Почки выводят меньше натрия и вслед за ним воды; объём внеклеточной жидкости растёт.',
'При нефротическом синдроме — активация РААС, АДГ и ENaC. При нефритическом — СКФ снижается, а канальцы продолжают реабсорбировать Na⁺ (гломерулотубулярный дисбаланс).',
'При нефрозе задержанная жидкость не удерживается в сосудах и снова уходит в интерстиций; при нефрите развивается гиперволемия.',
'Масса тела растёт, диурез уменьшается.',
'Ограничение соли до 2–3 г/сут; петлевые диуретики (фуросемид, торасемид), при необходимости вместе с тиазидами.',
'Задержка натрия и воды; retentio natrii']},
{id:'S',c:2,r:7,dir:'hemo',type:'main',t:'Выход жидкости из сосудов в интерстиций',term:'нарушение равновесия Старлинга',s:[
'Фильтрация через стенку капилляра преобладает над реабсорбцией, и жидкость накапливается в межклеточном пространстве.',
'Могут меняться все три силы Старлинга: снижается онкотическое давление (нефроз), растёт гидростатическое давление (нефрит), повышается проницаемость капилляров (нефрит).',
'Лимфоотток сначала увеличивается и уносит избыток жидкости, но затем становится недостаточным.',
'Отёки видны, когда объём внеклеточной жидкости увеличивается на 2,5–3 л.',
'В зависимости от причины: уменьшить протеинурию, гиперволемию или воспаление.',
'Закон Старлинга; транссудация']},
{id:'c1',c:2,r:9,dir:'organ',type:'main',t:'Почечные отёки',term:'почечные отёки',s:[
'Накопление жидкости в интерстиции при заболеваниях почек.',
'Два основных пути: нефротический (снижение онкотического давления и задержка Na⁺) и нефритический (первичная задержка Na⁺, гиперволемия, повышение проницаемости).',
'Отёки начинаются там, где рыхлая клетчатка (веки, лицо), затем распространяются по всему телу.',
'По утрам отекают лицо и веки; в отличие от сердечных отёков распространяются сверху вниз, кожа бледная, тёплая.',
'Ограничение соли, диуретики, лечение основного заболевания.',
'Почечные отёки; oedema renale']},
{id:'k1',c:0,r:9,dir:'organ',type:'clinic',t:'Признаки нефротических отёков',term:'нефротические отёки',s:[
'Отёки мягкие, бледные, при надавливании остаётся ямка, быстро смещаются при перемене положения тела.',
'Онкотическое давление очень низкое, жидкость свободно перемещается в тканях.',
'Возможны анасарка, асцит, гидроторакс, гидроперикард.',
'Протеинурия >3,5 г/сут, альбумин <30 г/л, гиперлипидемия; АД чаще нормальное.',
'Ограничение соли, петлевые диуретики; при очень низком альбумине — профилактика тромбозов (антикоагулянты).',
'Нефротические отёки; anasarca']},
{id:'k2',c:3,r:9,dir:'organ',type:'clinic',t:'Признаки нефритических отёков',term:'нефритические отёки',s:[
'Отёки плотнее, в основном на лице и веках, выражены по утрам; чаще умеренные.',
'Гиперволемия и повышение проницаемости капилляров; онкотическое давление относительно сохранено.',
'Гиперволемия увеличивает нагрузку на сердце.',
'Артериальная гипертензия, гематурия, олигурия, протеинурия <3,5 г/сут. Осложнения: острая левожелудочковая недостаточность, почечная эклампсия.',
'Ограничение соли и жидкости, петлевые диуретики, гипотензивные средства.',
'Нефритический синдром; oedema nephriticum']},
{id:'e2',c:4,r:0,dir:'immune',type:'etio',t:'Острый гломерулонефрит',term:'острый гломерулонефрит',s:[
'Чаще начинается через 1–3 недели после инфекции β-гемолитическим стрептококком группы А (ангина, пиодермия).',
'Образуются антитела к антигенам стрептококка; иммунные комплексы откладываются в клубочках.',
'В клубочках развивается иммунное воспаление — нефритический синдром.',
'Триада: отёки, артериальная гипертензия, гематурия (моча цвета «мясных помоев»).',
'Санация очага инфекции (пенициллины), постельный режим, ограничение соли и жидкости.',
'Острый постстрептококковый гломерулонефрит; glomerulonephritis acuta']},
{id:'m1',c:4,r:1,dir:'immune',type:'main',t:'Отложение иммунных комплексов в клубочках',term:'иммунные комплексы, C3',s:[
'Комплексы антиген–антитело откладываются под базальной мембраной (субэпителиальные «горбы») и в мезангии.',
'Комплемент активируется по классическому и альтернативному пути, C3 потребляется.',
'C5a привлекает нейтрофилы и макрофаги; мембраноатакующий комплекс (C5b–9) повреждает клетки. Системное воспаление повышает проницаемость капилляров.',
'В крови снижен C3, повышен титр АСЛ-О.',
'При постстрептококковой форме — симптоматическое лечение; при быстропрогрессирующих формах — глюкокортикоиды, циклофосфамид, плазмаферез.',
'Иммунные комплексы, активация комплемента']},
{id:'m2',c:4,r:2,dir:'immune',type:'damage',t:'Воспаление и пролиферация в клубочке',term:'пролиферативный гломерулит',s:[
'Размножаются эндотелиальные и мезангиальные клетки, нейтрофилы проникают в капилляры клубочка.',
'Действие цитокинов (ИЛ-1, ФНО-α), факторов роста и продуктов комплемента.',
'Просвет капилляров клубочка сужается, площадь фильтрации уменьшается.',
'Гематурия, эритроцитарные цилиндры, умеренная протеинурия.',
'При тяжёлых формах — противовоспалительная иммуносупрессия.',
'Эндокапиллярный пролиферативный гломерулонефрит']},
{id:'m3',c:4,r:3,dir:'organ',type:'main',t:'Снижение скорости клубочковой фильтрации',term:'снижение СКФ',s:[
'Скорость клубочковой фильтрации (СКФ) снижается, фильтруется меньше Na⁺.',
'Капилляры сужены, площадь фильтрации уменьшена, а канальцы реабсорбируют Na⁺ и воду как прежде — нарушается гломерулотубулярный баланс.',
'Na⁺ и вода задерживаются первично (независимо от РААС).',
'Олигурия, повышение креатинина и мочевины.',
'Петлевые диуретики, ограничение жидкости; при тяжёлой олигурии — диализ.',
'Скорость клубочковой фильтрации, гломерулотубулярный дисбаланс']},
{id:'m5',c:3,r:6,dir:'hemo',type:'damage',t:'Гиперволемия',term:'увеличение ОЦК (overfill)',s:[
'Объём циркулирующей крови увеличивается.',
'Задержанные почкой Na⁺ и вода остаются в сосудистом русле, так как онкотическое давление относительно нормально.',
'Растут гидростатическое давление в капиллярах и преднагрузка сердца; ренин подавлен.',
'Артериальная гипертензия, набухание шейных вен, застой в лёгких.',
'Петлевые диуретики, ограничение соли и жидкости.',
'Гиперволемия; hypervolaemia']},
{id:'m8',c:4,r:6,dir:'neuro',type:'protect',t:'Выделение натрийуретического пептида',term:'ПНП (ANP)',s:[
'Из растянутых предсердий выделяется натрийуретический пептид.',
'Гиперволемия растягивает стенки предсердий.',
'Усиливает выведение Na⁺ и воды, тормозит ренин и альдостерон; но повреждённая почка отвечает слабо, поэтому компенсация недостаточна.',
'В крови повышены натрийуретические пептиды.',
'Это собственная защитная система организма; основное лечение направлено на прямое уменьшение задержки Na⁺.',
'Предсердный натрийуретический пептид; ANP']},
{id:'m6',c:3,r:7,dir:'hemo',type:'damage',t:'Рост гидростатического давления в капиллярах',term:'гидростатическое давление',s:[
'Давление повышается в артериальном и венозном отделах капилляра.',
'Увеличение объёма жидкости в сосудистом русле.',
'Усиливается фильтрация жидкости в интерстиций.',
'Вместе с отёками — риск острой левожелудочковой недостаточности (одышка, отёк лёгких).',
'Диуретики, вазодилататоры.',
'Гидростатическое давление; pressio hydrostatica']},
{id:'m7',c:3,r:8,dir:'immune',type:'damage',t:'Повышение проницаемости капилляров',term:'повышение проницаемости',s:[
'Стенки капилляров всего тела сильнее пропускают воду и белок.',
'Системное иммунное воспаление; стрептококковая гиалуронидаза разрушает основное вещество и базальную мембрану; действие гистамина, брадикинина.',
'Жидкость и немного белка выходят в интерстиций.',
'Отёки развиваются даже при небольшой протеинурии.',
'Лечение основного заболевания, санация очага инфекции.',
'Повышение сосудистой проницаемости, гиалуронидаза']}
],

overview:[
['Что происходит','При заболеваниях почек жидкость выходит из сосудов в межклеточное пространство и развиваются отёки. Есть два основных пути.'],
['Нефротический путь','С мочой теряется белок, снижаются альбумин и онкотическое давление. Жидкость уходит в интерстиций, гиповолемия активирует РААС и АДГ. Задержанные Na⁺ и вода снова выходят из сосудов — образуется порочный круг. Плазмин через ENaC задерживает Na⁺ и напрямую.'],
['Нефритический путь','Иммунные комплексы вызывают воспаление в клубочке, СКФ снижается. Na⁺ и вода задерживаются первично, гиперволемия повышает гидростатическое давление; системное воспаление усиливает проницаемость капилляров.'],
['Клиника','Нефротические отёки мягкие, бледные, вплоть до анасарки. Нефритические плотнее, на лице, сочетаются с гипертензией и гематурией.']
]},

cardiac:{
title:'Сердечные отёки',lane:true,
lead:'При сердечной недостаточности отёки развиваются двумя путями. Венозный застой повышает гидростатическое давление в капиллярах, а при снижении минутного объёма почки через РААС задерживают Na⁺ и воду.',
nodes:[
{id:'e1',c:2,r:0,dir:'organ',type:'etio',t:'Сердечная недостаточность',term:'сердечная недостаточность',s:[
'Сердце не способно перекачивать кровь в необходимом объёме. Отёки чаще развиваются при правожелудочковой или тотальной недостаточности.',
'Причины: ишемическая болезнь сердца, инфаркт миокарда, артериальная гипертензия, пороки клапанов, кардиомиопатии, лёгочное сердце.',
'С одной стороны, кровь застаивается в венах, с другой — в артериальную систему поступает мало крови.',
'Одышка, слабость, тахикардия, отёки.',
'Лечение основного заболевания; базисная терапия СН: иАПФ/БРА или сакубитрил-валсартан, бета-блокаторы, спиронолактон, ингибиторы SGLT2.',
'Сердечная недостаточность; insufficientia cordis']},
{id:'k2',c:0,r:1,dir:'organ',type:'clinic',t:'Набухание шейных вен, увеличение печени',term:'набухание шейных вен',s:[
'Шейные вены набухшие даже в полусидячем положении; печень увеличена, выступает из-под рёберной дуги, болезненна.',
'Центральное венозное давление высокое; растягивается капсула печени.',
'При длительном застое развивается «мускатная» печень, затем кардиальный фиброз.',
'При надавливании на печень шейные вены набухают сильнее (гепатоюгулярный рефлюкс).',
'Уменьшение застоя: диуретики, лечение сердечной недостаточности.',
'Набухание шейных вен, застойная гепатомегалия; hepar moschatum']},
{id:'a2',c:1,r:1,dir:'hemo',type:'main',t:'Слабость правого желудочка, венозный застой',term:'венозный застой',s:[
'Правый желудочек не полностью перекачивает поступающую кровь в лёгочную артерию; кровь застаивается в полых венах и большом круге.',
'Сократимость правого желудочка снижается, конечно-диастолическое давление растёт, приток крови в правое предсердие затрудняется.',
'Повышается ЦВД; переполняются кровью вены печени, кишечника, ног.',
'Набухание шейных вен, увеличение печени.',
'Диуретики уменьшают преднагрузку; нитраты расширяют вены.',
'Венозный застой, повышение ЦВД; stasis venosa']},
{id:'a1',c:3,r:1,dir:'hemo',type:'main',t:'Снижение минутного объёма сердца',term:'снижение сердечного выброса',s:[
'Сердце выбрасывает в аорту меньше крови за минуту.',
'Снижается сократимость миокарда или нарушается его наполнение.',
'Артериальная система «недонаполнена»: почки, мозг, мышцы плохо кровоснабжаются.',
'Слабость, быстрая утомляемость, тахикардия, бледно-цианотичная кожа.',
'Бета-блокаторы (длительно), ингибиторы SGLT2; в тяжёлых случаях — инотропы.',
'Сниженный сердечный выброс; low cardiac output']},
{id:'liv',c:0,r:2,dir:'organ',type:'damage',t:'Застой в печени, снижение синтеза белка',term:'застойная печень',s:[
'Застой и гипоксия повреждают гепатоциты, белоксинтетическая функция печени снижается.',
'В центре долек, вокруг центральной вены, преобладают гипоксия и атрофия.',
'Синтез альбумина уменьшается; из-за застоя в стенке кишки ухудшается и всасывание белка.',
'Снижение альбумина в крови; при длительной СН — сердечная кахексия.',
'Основное — устранить застой; полноценное питание.',
'Застойная печень, кардиальный фиброз']},
{id:'a3',c:1,r:2,dir:'hemo',type:'main',t:'Рост гидростатического давления в капиллярах',term:'гемодинамический фактор',s:[
'Венозное давление передаётся на венозный конец капилляра, гидростатическое давление в нём растёт.',
'По закону Старлинга фильтрующая сила растёт, а реабсорбирующая уменьшается.',
'Жидкость в избытке выходит из капилляров в интерстиций — главный (гемодинамический) фактор сердечных отёков.',
'Отёки сначала появляются в нижележащих частях тела (стопы, голени, поясница).',
'Диуретики, ограничение соли, возвышенное положение ног.',
'Гидростатическое давление; pressio hydrostatica']},
{id:'h1',c:2,r:2,dir:'cell',type:'damage',t:'Гипоксия тканей: стенка капилляра становится проницаемой',term:'тканевая гипоксия',s:[
'Ткани получают мало кислорода; повреждаются эндотелий и базальная мембрана капилляров.',
'Снижение минутного объёма и замедление кровотока (циркуляторная гипоксия) нарушают обмен, накапливаются продукты анаэробного обмена.',
'Повышается проницаемость капилляров (сосудистый фактор); в ткани накапливаются мелкие молекулы и растёт тканевое осмотическое давление (тканевой фактор).',
'Акроцианоз, холодная кожа; при длительных отёках — трофические изменения кожи.',
'Оксигенация, улучшение работы сердца.',
'Циркуляторная гипоксия, повышение проницаемости']},
{id:'b1',c:3,r:2,dir:'organ',type:'damage',t:'Снижение почечного кровотока',term:'гипоперфузия почек',s:[
'К артериолам почек поступает мало крови, клубочковая фильтрация снижается.',
'Снижение минутного объёма и симпатическая вазоконстрикция.',
'Юкстагломерулярные клетки усиленно выделяют ренин; фильтруется меньше Na⁺.',
'Олигурия, никтурия; повышение креатинина (кардиоренальный синдром).',
'Улучшение почечной перфузии; диуретики под контролем функции почек.',
'Гипоперфузия почек, кардиоренальный синдром']},
{id:'onc',c:0,r:3,dir:'metab',type:'damage',t:'Снижение онкотического давления',term:'онкотический фактор',s:[
'Альбумин плазмы снижается, онкотическое давление крови падает.',
'Альбумин — главный белок, удерживающий жидкость внутри капилляра.',
'Облегчается переход жидкости в интерстиций; к сердечным отёкам присоединяется онкотический фактор.',
'При длительной СН отёки усиливаются, присоединяется асцит.',
'Коррекция питания; при тяжёлой гипоальбуминемии действие диуретиков ослабевает.',
'Онкотическое давление; pressio oncotica']},
{id:'l1',c:1,r:3,dir:'hemo',type:'damage',t:'Затруднение оттока лимфы в вены',term:'лимфогенный фактор',s:[
'Грудной лимфатический проток впадает в левую подключичную вену; при высоком венозном давлении лимфоотток замедляется.',
'Давление в месте впадения протока высокое, лимфа «упирается».',
'Избыток жидкости и белка не уносится из интерстиция; лимфатическая компенсация ослабевает (лимфогенный фактор).',
'Отёки держатся долго и начинают уплотняться.',
'Снижение ЦВД; возвышенное положение ног.',
'Динамическая лимфатическая недостаточность']},
{id:'b2',c:3,r:3,dir:'neuro',type:'protect',t:'Активация РААС, АДГ, симпатической системы',term:'вторичный гиперальдостеронизм',s:[
'Активируются ренин-ангиотензин-альдостероновая система, антидиуретический гормон и симпатическая нервная система.',
'Организм пытается восстановить сниженное артериальное наполнение, увеличивая объём крови (нейроэндокринный фактор).',
'Альдостерон усиливает реабсорбцию Na⁺, АДГ — воды; ангиотензин II суживает сосуды. В долгосрочной перспективе эта адаптация вредна.',
'В крови повышены ренин и альдостерон; гипонатриемия (из-за избытка АДГ).',
'иАПФ, БРА, сакубитрил-валсартан, спиронолактон, эплеренон, бета-блокаторы.',
'Ренин-ангиотензин-альдостероновая система, вторичный гиперальдостеронизм']},
{id:'b3',c:3,r:4,dir:'metab',type:'main',t:'Задержка Na⁺ и воды',term:'задержка натрия и воды',s:[
'Почки выводят меньше Na⁺ и воды; объём внеклеточной жидкости растёт.',
'Действие альдостерона, АДГ, ангиотензина II и снижение клубочковой фильтрации.',
'Объём циркулирующей крови увеличивается.',
'Масса тела растёт день ото дня, диурез уменьшается.',
'Ограничение соли, петлевые диуретики (фуросемид, торасемид), при необходимости тиазиды.',
'Задержка натрия и воды; retentio natrii']},
{id:'p1',c:4,r:4,dir:'neuro',type:'protect',t:'Выделение натрийуретических пептидов',term:'ПНП, МНП',s:[
'Из растянутых предсердий выделяется ПНП, из желудочков — МНП (BNP).',
'Гиперволемия и растяжение камер сердца.',
'Усиливают выведение Na⁺ и воды, тормозят ренин и альдостерон, расширяют сосуды. При СН этого эффекта недостаточно.',
'Повышенный NT-proBNP в крови — диагностический маркер сердечной недостаточности.',
'Сакубитрил тормозит неприлизин и замедляет распад натрийуретических пептидов.',
'Натрийуретические пептиды (ANP, BNP)']},
{id:'b4',c:3,r:5,dir:'hemo',type:'damage',t:'Гиперволемия, перегрузка сердца',term:'гиперволемия',s:[
'Увеличиваются ОЦК и преднагрузка сердца.',
'Задержанные почками Na⁺ и вода остаются в сосудистом русле.',
'Слабый миокард перерастягивается, сократимость ухудшается — минутный объём снова снижается, образуется порочный круг. Растёт и венозное давление.',
'Нарастание отёков, одышки, декомпенсация сердечной недостаточности.',
'Петлевые диуретики — основной способ разорвать порочный круг.',
'Гиперволемия; hypervolaemia']},
{id:'S',c:2,r:6,dir:'hemo',type:'main',t:'Выход жидкости в интерстиций',term:'транссудация',s:[
'Жидкости выходит из капилляров больше, чем уносит лимфа, и она накапливается в интерстиции.',
'Растёт гидростатическое давление, снижается онкотическое, повышается проницаемость капилляров, замедляется лимфоотток.',
'Накапливается бедный белком транссудат.',
'Отёки видны при увеличении внеклеточной жидкости на 4–5 л.',
'Воздействие на причины: уменьшить застой и гиперволемию.',
'Транссудат; transsudatum']},
{id:'k1',c:0,r:7,dir:'organ',type:'clinic',t:'Отёки на ногах, к вечеру, цианотичные, холодные',term:'периферические отёки',s:[
'Отёки начинаются со стоп и голеней; у лежачих больных — в области поясницы и крестца.',
'Гидростатическое давление под действием силы тяжести выше в нижележащих отделах.',
'В тяжёлых случаях асцит, гидроторакс (чаще справа), гидроперикард, анасарка.',
'Кожа цианотичная (акроцианоз), холодная; при длительных отёках уплотняется, возможны трофические язвы. В отличие от почечных отёков распространяются снизу вверх.',
'Диуретики, ограничение соли, ежедневное взвешивание.',
'Периферические отёки, анасарка']},
{id:'c1',c:2,r:7,dir:'organ',type:'main',t:'Сердечные отёки',term:'сердечные отёки',s:[
'Накопление жидкости в интерстиции при сердечной недостаточности.',
'Главный — гемодинамический фактор; к нему присоединяются нейроэндокринный, онкотический, лимфогенный, сосудистый и тканевой факторы.',
'Отёки распространяются снизу вверх: стопы → бёдра → поясница → асцит, гидроторакс, анасарка.',
'Усиливаются к вечеру, уменьшаются утром; при надавливании остаётся ямка.',
'Ограничение соли, диуретики, базисная терапия сердечной недостаточности.',
'Сердечные отёки; oedema cardiale']},
{id:'k3',c:4,r:7,dir:'organ',type:'clinic',t:'При слабости левого желудочка — отёк лёгких',term:'кардиогенный отёк лёгких',s:[
'При слабости левого желудочка кровь застаивается в малом круге.',
'Когда давление в лёгочных капиллярах превышает 25–28 мм рт. ст., жидкость выходит сначала в интерстиций лёгких, затем в альвеолы.',
'Нарушается газообмен, развивается гипоксемия.',
'Одышка, ортопноэ, ночные приступы удушья (сердечная астма), пенистая розовая мокрота, влажные хрипы.',
'Усадить, кислород, фуросемид внутривенно, нитраты; при необходимости неинвазивная вентиляция.',
'Кардиогенный отёк лёгких; oedema pulmonum']}
],

overview:[
['Что происходит','При сердечной недостаточности жидкость накапливается в интерстиции. Отёки начинаются снизу, усиливаются к вечеру, кожа цианотичная и холодная.'],
['Гемодинамический путь','При слабости правого желудочка кровь застаивается в венах. Гидростатическое давление в капиллярах растёт, затрудняется отток лимфы в вены, в печени снижается синтез белка.'],
['Нейрогуморальный путь','Минутный объём падает, почки плохо кровоснабжаются. РААС и АДГ задерживают Na⁺ и воду. Гиперволемия перегружает слабое сердце и ещё сильнее снижает минутный объём — порочный круг.'],
['Факторы отёка','Гемодинамический (главный), нейроэндокринный, онкотический, лимфогенный, сосудистый и тканевой (гипоксия).']
]},

hepatic:{
title:'Печёночные отёки',
lead:'При циррозе печени отёки проявляются прежде всего асцитом. Вместе действуют портальная гипертензия, снижение альбумина, избыточное образование печёночной лимфы и задержка Na⁺ через РААС.',
nodes:[
{id:'e1',c:2,r:0,dir:'organ',type:'etio',t:'Цирроз печени',term:'цирроз печени',s:[
'Ткань печени замещается фиброзом и узлами регенерации; нарушаются строение и кровообращение печени.',
'Причины: хронические вирусные гепатиты (B, C, D), алкоголь, метаболически ассоциированная жировая болезнь, аутоиммунные и холестатические заболевания, болезнь Вильсона, гемохроматоз.',
'Одновременно развиваются печёночно-клеточная недостаточность и портальная гипертензия.',
'Слабость, желтуха, «сосудистые звёздочки», пальмарная эритема, асцит.',
'Устранение причины (противовирусная терапия, отказ от алкоголя); в тяжёлых случаях — трансплантация печени.',
'Цирроз печени; cirrhosis hepatis']},
{id:'hf',c:0,r:1,dir:'organ',type:'damage',t:'Снижение функции гепатоцитов',term:'печёночно-клеточная недостаточность',s:[
'Уменьшается число функционирующих клеток печени.',
'Некроз гепатоцитов и замещение их фиброзом.',
'Нарушаются синтез белка, инактивация гормонов (альдостерона, АДГ, эстрогенов), обезвреживание токсинов.',
'Желтуха, нарушение свёртывания (удлинение протромбинового времени), энцефалопатия.',
'Лечение основного заболевания; трансплантация печени.',
'Печёночно-клеточная недостаточность']},
{id:'fib',c:2,r:1,dir:'organ',type:'main',t:'Фиброз: рост внутрипечёночного сопротивления',term:'внутрипечёночное сопротивление',s:[
'Синусоиды сужаются и капилляризуются; узлы регенерации сдавливают вены.',
'Звёздчатые (Ито) клетки активируются и образуют коллаген; эндотелий выделяет мало NO, сосуды сужены.',
'Затрудняется прохождение крови из воротной вены через печень.',
'Печень плотная, бугристая; по эластографии жёсткость повышена.',
'Остановить прогрессирование фиброза: устранить причину.',
'Фиброз печени, повышение внутрипечёночного сопротивления']},
{id:'alb',c:0,r:2,dir:'metab',type:'main',t:'Снижение синтеза альбумина',term:'гипоальбуминемия',s:[
'Синтез альбумина в печени снижается, его уровень в крови падает.',
'Альбумин образуется только в печени; при уменьшении числа гепатоцитов синтез снижается.',
'Не хватает главного белка, поддерживающего онкотическое давление плазмы.',
'Альбумин сыворотки <35 г/л; при тяжёлом циррозе <25 г/л.',
'Инфузия альбумина после объёмного парацентеза и при гепаторенальном синдроме.',
'Гипоальбуминемия; hypoalbuminaemia']},
{id:'ph',c:2,r:2,dir:'hemo',type:'main',t:'Портальная гипертензия',term:'портальная гипертензия',s:[
'Повышается давление в системе воротной вены (градиент печёночного венозного давления >10 мм рт. ст.).',
'Растёт внутрипечёночное сопротивление, затем увеличивается и спланхнический кровоток.',
'Застой в венах кишечника, сальника, селезёнки; растёт давление в синусоидах; открываются анастомозы.',
'Спленомегалия, асцит, варикозные вены.',
'Неселективные бета-блокаторы (пропранолол, карведилол); TIPS (трансъюгулярный портосистемный шунт).',
'Портальная гипертензия; hypertensio portalis']},
{id:'pca',c:4,r:2,dir:'hemo',type:'protect',t:'Открытие портокавальных анастомозов',term:'портокавальные анастомозы',s:[
'Расширяются обходные пути между воротной и полыми венами.',
'Кровь обходит печень, снижая высокое давление.',
'Портальное давление частично снижается, но кровь попадает в системный кровоток неочищенной от токсинов.',
'Варикоз вен пищевода и желудка, «голова медузы», геморроидальные вены.',
'Профилактика кровотечения из варикоза: бета-блокаторы, эндоскопическое лигирование.',
'Портокавальные анастомозы']},
{id:'onc',c:0,r:3,dir:'hemo',type:'main',t:'Снижение онкотического давления',term:'онкотический фактор',s:[
'Онкотическое давление плазмы снижается.',
'Дефицит альбумина.',
'Сила, удерживающая жидкость в капилляре, ослабевает; жидкость переходит в интерстиций и брюшную полость (онкотический фактор).',
'Вместе с асцитом появляются отёки ног.',
'По показаниям инфузия альбумина, питание, богатое белком.',
'Онкотическое давление; pressio oncotica']},
{id:'sp',c:1,r:3,dir:'hemo',type:'damage',t:'Рост гидростатического давления в капиллярах кишечника',term:'гемодинамический фактор',s:[
'Повышается давление в капиллярах кишечника и сальника.',
'Высокое давление в воротной вене передаётся ретроградно.',
'Жидкость выходит в брюшную полость (гемодинамический фактор).',
'Асцит, отёк стенки кишки, диспепсия.',
'Снижение портального давления (бета-блокаторы, TIPS).',
'Гидростатическое давление; pressio hydrostatica']},
{id:'ly',c:2,r:3,dir:'hemo',type:'protect',t:'Усиленное лимфообразование в печени',term:'лимфообразование',s:[
'Из синусоидов в пространство Диссе фильтруется много жидкости, печёночной лимфы становится больше.',
'Гидростатическое давление в синусоидах высокое; стенка синусоидов хорошо пропускает белок.',
'Грудной проток расширяется, лимфоток возрастает в несколько раз — это компенсация, направленная на удаление избытка жидкости.',
'Грудной лимфатический проток расширен, давление в нём повышено.',
'Компенсация; снижение портального давления уменьшает её нагрузку.',
'Повышенное лимфообразование в печени']},
{id:'vd',c:3,r:3,dir:'hemo',type:'damage',t:'Расширение спланхнических сосудов',term:'спланхническая вазодилатация',s:[
'Расширяются артериолы органов брюшной полости.',
'При портальной гипертензии образуется много NO, простациклина, глюкагона; вещества, обходящие печень, не обезвреживаются.',
'Кровь депонируется в спланхнической области; общее периферическое сопротивление снижается.',
'Низкое АД, гипердинамический тип кровообращения (тахикардия, тёплые конечности).',
'Терлипрессин, октреотид суживают спланхнические сосуды.',
'Спланхническая вазодилатация (теория периферической вазодилатации)']},
{id:'k3',c:4,r:3,dir:'organ',type:'clinic',t:'Варикоз: пищевод, «голова медузы»',term:'варикоз вен пищевода',s:[
'Расширяются вены пищевода, желудка, прямой кишки и передней брюшной стенки.',
'Возрастает кровоток через анастомозы.',
'Варикозные вены могут разорваться и кровоточить.',
'Рвота кровью, мелена; расширенные вены вокруг пупка.',
'Бета-блокаторы, эндоскопическое лигирование, терлипрессин.',
'Варикозное расширение вен пищевода; caput medusae']},
{id:'lyB',c:2,r:4,dir:'hemo',type:'damage',t:'Превышение возможностей лимфатического протока',term:'лимфогенный фактор',s:[
'Объём образующейся лимфы превышает дренажную способность лимфатической системы.',
'Компенсаторные возможности лимфотока ограничены.',
'Богатая белком лимфа «пропотевает» с поверхности печени в брюшную полость (лимфогенный фактор).',
'В асцитической жидкости может быть относительно много белка.',
'Уменьшение портальной гипертензии, парацентез.',
'Механическая лимфатическая недостаточность, лимфорея']},
{id:'eav',c:3,r:4,dir:'hemo',type:'damage',t:'Снижение эффективного артериального объёма',term:'эффективный артериальный объём',s:[
'Наполнение артериальной системы снижается, хотя общий объём крови растёт.',
'Сосудистое русло расширено, а жидкость скапливается в брюшной полости вне кровотока.',
'Барорецепторы и почки воспринимают это как кровопотерю.',
'Гипотензия, снижение почечной перфузии.',
'Инфузия альбумина временно увеличивает эффективный объём.',
'Снижение эффективного артериального объёма крови']},
{id:'raas',c:4,r:4,dir:'neuro',type:'protect',t:'Активация РААС, симпатической системы, АДГ',term:'вторичный гиперальдостеронизм',s:[
'Активируются ренин-ангиотензин-альдостероновая система, симпатическая нервная система и АДГ.',
'Ответ на снижение эффективного артериального объёма; кроме того, альдостерон и АДГ хуже инактивируются в печени (нейроэндокринный фактор).',
'Уровень альдостерона резко растёт — вторичный гиперальдостеронизм.',
'Na⁺ в моче очень низкий; гипонатриемия (из-за избытка АДГ).',
'Спиронолактон — препарат первой линии при асците, назначается вместе с фуросемидом.',
'Вторичный гиперальдостеронизм; нарушение инактивации альдостерона в печени']},
{id:'S',c:3,r:6,dir:'hemo',type:'main',t:'Скопление жидкости в брюшной полости',term:'асцит',s:[
'Жидкость накапливается в брюшной полости и интерстиции.',
'Сочетание гидростатического, онкотического, лимфогенного и нейроэндокринного факторов.',
'Жидкость из брюшной полости не возвращается в сосудистое русло, поэтому эффективный объём остаётся сниженным — порочный круг.',
'Увеличение живота, выпячивание пупка, притупление при перкуссии.',
'Диуретики; парацентез (при удалении >5 л — 6–8 г альбумина на каждый литр).',
'Асцит; ascites']},
{id:'na',c:4,r:6,dir:'metab',type:'main',t:'Задержка Na⁺ и воды',term:'задержка натрия и воды',s:[
'Почки выводят меньше Na⁺ и воды.',
'Действие альдостерона, ангиотензина II, симпатической нервной системы и АДГ.',
'Задержанная жидкость переходит в брюшную полость и увеличивает асцит.',
'Диурез снижается, масса тела растёт, гипонатриемия.',
'Ограничение соли примерно до 5 г/сут; спиронолактон и фуросемид.',
'Задержка натрия и воды; retentio natrii']},
{id:'k1',c:1,r:7,dir:'organ',type:'clinic',t:'Признаки асцита',term:'клиника асцита',s:[
'Живот увеличен, в положении лёжа бока распластаны («лягушачий живот»), пупок выпячен.',
'Скопление жидкости в брюшной полости.',
'Диафрагма поднимается, затрудняется дыхание; позже отекают ноги.',
'При перкуссии притупление в отлогих местах, флюктуация; на УЗИ — свободная жидкость. Жидкость — транссудат (сывороточно-асцитический градиент альбумина ≥11 г/л).',
'Диагностический парацентез; ограничение соли, диуретики.',
'Асцит; ascites']},
{id:'c1',c:3,r:7,dir:'organ',type:'main',t:'Печёночные отёки',term:'печёночные отёки',s:[
'Накопление жидкости в брюшной полости и интерстиции при заболеваниях печени.',
'Портальная гипертензия, гипоальбуминемия, лимфатическая недостаточность и вторичный гиперальдостеронизм.',
'Сначала асцит, затем отёки ног, гидроторакс (чаще справа).',
'Асцит появляется раньше отёков ног — особенность печёночных отёков.',
'Ограничение соли, спиронолактон, фуросемид, парацентез, TIPS, трансплантация.',
'Печёночные отёки; oedema hepaticum']},
{id:'k2',c:4,r:7,dir:'organ',type:'clinic',t:'Осложнения: гепаторенальный синдром, перитонит',term:'гепаторенальный синдром',s:[
'Сосуды почек резко сужаются и развивается почечная недостаточность; асцитическая жидкость инфицируется.',
'Снижение эффективного артериального объёма и выраженная вазоконстрикция; транслокация бактерий из кишечника.',
'Гепаторенальный синдром, спонтанный бактериальный перитонит, печёночный гидроторакс.',
'Олигурия, рост креатинина; боль в животе, лихорадка; нейтрофилы в асцитической жидкости ≥250/мкл.',
'Терлипрессин и альбумин; при перитоните цефалоспорины; трансплантация.',
'Гепаторенальный синдром, спонтанный бактериальный перитонит']}
],

overview:[
['Что происходит','При заболеваниях печени, особенно при циррозе, жидкость сначала скапливается в брюшной полости (асцит), затем отекают ноги.'],
['Портальная гипертензия','Фиброз повышает внутрипечёночное сопротивление. Растёт гидростатическое давление в капиллярах кишечника, печёночная лимфа образуется в избытке и превышает возможности протока.'],
['Печёночно-клеточная недостаточность','Альбумина образуется мало, онкотическое давление падает; альдостерон и АДГ хуже инактивируются в печени.'],
['Порочный круг','Спланхнические сосуды расширяются, эффективный артериальный объём снижается. РААС задерживает Na⁺ и воду, но жидкость уходит в брюшную полость, и объём не восстанавливается.'],
['Факторы отёка','Гемодинамический (портальная гипертензия), онкотический, лимфогенный и нейроэндокринный (вторичный гиперальдостеронизм).']
]},

hunger:{
title:'Голодные отёки',
lead:'При длительном голодании и белковой недостаточности главная причина отёков — снижение онкотического давления. К нему присоединяются снижение тургора тканей, активация РААС и слабость сердца.',
nodes:[
{id:'e1',c:2,r:0,dir:'metab',type:'etio',t:'Длительное голодание, белковая недостаточность',term:'белково-энергетическая недостаточность',s:[
'Белок и энергия поступают в организм в недостаточном количестве или не усваиваются.',
'Причины: голод, однообразное безбелковое питание (квашиоркор), мальабсорбция, раковая кахексия, хронические болезни, нервная анорексия.',
'Организм сначала расходует жировые запасы, затем белки мышц.',
'Похудание, слабость; отёки могут маскировать похудание.',
'Постепенное восстановление белка и энергии.',
'Алиментарная дистрофия, белково-энергетическая недостаточность']},
{id:'aa',c:1,r:1,dir:'metab',type:'main',t:'Дефицит аминокислот',term:'дефицит аминокислот',s:[
'Незаменимых аминокислот, нужных для синтеза белка, поступает мало.',
'В пище мало белка, или он не всасывается в кишечнике.',
'Синтез белка в печени и других органах тормозится.',
'Атрофия мышц, медленное заживление ран, ослабление иммунитета.',
'Полноценный белок (яйца, молоко, мясо) вводится постепенно.',
'Дефицит незаменимых аминокислот']},
{id:'vit',c:3,r:1,dir:'metab',type:'damage',t:'Дефицит витамина B₁, слабость миокарда',term:'дефицит тиамина',s:[
'Дефицит тиамина (B₁) и атрофия сердечной мышцы.',
'Однообразное углеводное питание; при недостатке белка распадаются и белки миокарда.',
'Сократимость сердца снижается («влажная» бери-бери).',
'Тахикардия, расширение границ сердца, одышка.',
'Тиамин вводится до начала кормления (профилактика рефидинг-синдрома).',
'Дефицит тиамина, бери-бери, атрофия миокарда']},
{id:'fat',c:4,r:1,dir:'metab',type:'damage',t:'Уменьшение жировой и мышечной ткани',term:'катаболизм тканей',s:[
'Подкожный жир и мышечные белки распадаются для получения энергии.',
'При голодании усиливаются липолиз и протеолиз.',
'Объём тканей уменьшается, а продукты распада накапливаются в интерстиции.',
'Похудание, истончение кожной складки, атрофия мышц.',
'Постепенное восполнение энергии и белка.',
'Катаболизм жировой и мышечной ткани']},
{id:'alb',c:1,r:2,dir:'metab',type:'main',t:'Снижение синтеза альбумина в печени',term:'снижение синтеза альбумина',s:[
'Печень синтезирует меньше альбумина.',
'Не хватает аминокислот; белоксинтетическая функция печени ослабевает.',
'Альбумин в крови снижается; липопротеинов тоже образуется мало, поэтому в печени накапливается жир (жировой гепатоз).',
'Увеличение печени (особенно при квашиоркоре).',
'Белковое питание; жировой гепатоз проходит при восстановлении питания.',
'Снижение белковосинтетической функции печени']},
{id:'hf',c:3,r:2,dir:'hemo',type:'damage',t:'Ослабление сердца, снижение минутного объёма',term:'сердечная слабость',s:[
'Сердце не может перекачивать достаточно крови.',
'Атрофия миокарда и дефицит B₁.',
'Почечный кровоток снижается, дополнительно активируется РААС; растёт венозное давление.',
'Гипотензия, тахикардия, усиление отёков.',
'Начинать кормление очень медленно: быстрое кормление может вызвать сердечную недостаточность.',
'Сердечная недостаточность при истощении']},
{id:'tis',c:4,r:2,dir:'cell',type:'damage',t:'Снижение тургора, рост тканевого осмотического давления',term:'тканевой фактор',s:[
'Механическая плотность (тургор) тканей уменьшается; в интерстиции становится больше осмотически активных веществ.',
'Исчезает подкожный жир; белки тканей распадаются с образованием мелких молекул.',
'Межклеточное пространство легко заполняется жидкостью (тканевой фактор).',
'Отёки начинаются с лица, век, ног; кожа тонкая, рыхлая.',
'При восстановлении питания тканевой фактор постепенно исчезает.',
'Снижение тургора тканей, тканевая гиперосмия']},
{id:'gut',c:0,r:3,dir:'organ',type:'damage',t:'Отёк стенки кишки, нарушение всасывания',term:'отёк кишечной стенки',s:[
'Слизистая кишечника отекает и атрофируется.',
'Снижение онкотического давления; для обновления клеток слизистой не хватает белка.',
'Всасывание аминокислот уменьшается ещё больше — дефицит белка нарастает, образуется порочный круг.',
'Диарея, мальабсорбция.',
'Начинать с малых порций и постепенно увеличивать; при необходимости энтеральные смеси.',
'Отёк и атрофия слизистой кишечника, мальабсорбция']},
{id:'hpa',c:1,r:3,dir:'metab',type:'main',t:'Гипоальбуминемия',term:'гипопротеинемия',s:[
'В сыворотке снижаются общий белок и альбумин.',
'Синтез уменьшается, а белок расходуется на энергию.',
'Онкотическое давление падает; отекает и стенка кишки.',
'Альбумин <30 г/л; отёки обычно выражены при альбумине ниже 20–25 г/л.',
'Питание с достаточным количеством белка; переливание альбумина требуется редко.',
'Гипопротеинемия, гипоальбуминемия']},
{id:'onc',c:1,r:4,dir:'hemo',type:'main',t:'Снижение онкотического давления',term:'онкотический фактор',s:[
'Онкотическое давление плазмы снижается.',
'Дефицит альбумина.',
'Жидкость легко переходит из капилляров в интерстиций — главный (онкотический) фактор голодных отёков.',
'Отёки мягкие, бледные, при надавливании остаётся ямка.',
'Устранение белкового дефицита.',
'Онкотическое давление; pressio oncotica']},
{id:'na',c:2,r:4,dir:'metab',type:'main',t:'Задержка Na⁺ и воды',term:'задержка натрия и воды',s:[
'Почки выводят меньше Na⁺ и воды.',
'В ответ на гиповолемию и слабость сердца действуют РААС и АДГ.',
'Задержанная жидкость не удерживается в сосудах и уходит в интерстиций — отёки нарастают.',
'Диурез снижается, масса тела растёт за счёт отёков.',
'Ограничение соли; диуретики не являются основным лечением.',
'Задержка натрия и воды']},
{id:'raas',c:3,r:4,dir:'neuro',type:'protect',t:'Активация РААС и АДГ',term:'вторичный гиперальдостеронизм',s:[
'Активируются ренин-ангиотензин-альдостероновая система и антидиуретический гормон.',

overview:[
['Что происходит','В очаге воспаления или в месте действия яда в интерстиции накапливается богатый белком экссудат. Отёк местный, развивается быстро.'],
['Воспалительный путь','Из повреждённой ткани выделяются медиаторы. Они расширяют артериолы и сокращают эндотелий; проницаемость капилляров растёт, выходит экссудат. Продукты распада повышают тканевое осмотическое давление.'],
['Токсический путь','Яд прямо повреждает эндотелий и базальную мембрану. Удушающие яды вызывают токсический отёк лёгких.'],
['Порочный круг','Отёчная ткань сдавливает сосуды, вызывая гипоксию и ацидоз; эндотелий повреждается ещё больше, экссудация усиливается.'],
['Факторы отёка','Сосудистый (главный), гемодинамический (гиперемия), тканевой (рост осмотического и онкотического давления) и лимфогенный.']
]},

neuro:{
title:'Нейрогенные отёки',
lead:'При поражении нервной системы нарушаются сосудистый тонус и трофика тканей, прекращается работа мышечной помпы. При травме мозга симпатический «шторм» вызывает нейрогенный отёк лёгких.',
nodes:[
{id:'e1',c:1,r:0,dir:'neuro',type:'etio',t:'Поражение периферических нервов, паралич',term:'параличи, повреждение нервов',s:[
'Из-за поражения периферических нервов, спинного или головного мозга развивается паралич конечностей.',
'Травма нерва, полинейропатия, травма спинного мозга, сирингомиелия, гемиплегия после инсульта.',
'Нарушается двигательная, чувствительная и вегетативная (вазомоторная, трофическая) иннервация.',
'Отёк парализованной конечности, трофические изменения кожи.',
'Лечение основного заболевания, реабилитация.',
'Параличи, нейропатии; paralysis']},
{id:'e2',c:4,r:0,dir:'neuro',type:'etio',t:'Поражение мозга: травма, инсульт',term:'повреждение мозга',s:[
'Черепно-мозговая травма, субарахноидальное кровоизлияние, инсульт, эпилептический приступ.',
'Внутричерепное давление резко растёт, раздражаются вазомоторные центры гипоталамуса и ствола мозга.',
'Возникает мощный разряд симпатической нервной системы.',
'Нарушение сознания, очаговые неврологические симптомы.',
'Снижение внутричерепного давления, нейрохирургическая помощь.',
'Черепно-мозговая травма, субарахноидальное кровоизлияние']},
{id:'imm',c:0,r:1,dir:'hemo',type:'damage',t:'Неподвижность: мышечная помпа не работает',term:'иммобилизация',s:[
'В парализованной конечности мышцы не сокращаются.',
'В норме сокращение мышц проталкивает венозную кровь и лимфу к сердцу (мышечно-венозная помпа).',
'Венозный и лимфатический отток замедляется.',
'Отёк усиливается, когда конечность свисает вниз.',
'Пассивные и активные движения, ЛФК, электромиостимуляция.',
'Иммобилизация, мышечно-венозная помпа']},
{id:'den',c:1,r:1,dir:'neuro',type:'main',t:'Утрата вазомоторной иннервации',term:'денервация сосудов',s:[
'Исчезает влияние симпатических сосудосуживающих нервов.',
'Перерыв нервных волокон или поражение вегетативных центров (нервный фактор).',
'Тонус артериол и вен снижается; нарушается трофика тканей.',
'В ранний период кожа тёплая, розовая; позже холодная, цианотичная.',
'Восстановление нерва (хирургический шов), реабилитация.',
'Денервация, нарушение вазомоторной иннервации']},
{id:'sns',c:3,r:1,dir:'immune',type:'damage',t:'Выделение субстанции P и CGRP из чувствительных окончаний',term:'нейрогенное воспаление',s:[
'Из окончаний чувствительных нервных волокон выделяются нейропептиды.',
'Раздражение или повреждение нерва, аксон-рефлекс.',
'Субстанция P и CGRP расширяют сосуды, повышают проницаемость, активируют тучные клетки (нейрогенное воспаление).',
'Боль, жгучая боль, отёк (например, при комплексном регионарном болевом синдроме).',
'Лечение нейропатической боли; при КРБС — бисфосфонаты, глюкокортикоиды.',
'Нейрогенное воспаление; субстанция P, CGRP']},
{id:'symp',c:4,r:1,dir:'neuro',type:'main',t:'Симпатический «шторм»',term:'симпатический шторм',s:[
'В кровь выбрасывается большое количество катехоламинов (адреналина, норадреналина).',
'Раздражаются вазомоторные центры ствола мозга (нервный фактор).',
'Системные сосуды резко суживаются, кровь перемещается в малый круг.',
'Гипертензия, тахикардия, гипертермия, потливость.',
'Лечение причины; рассматриваются α-адреноблокаторы.',
'Симпатический (катехоламиновый) шторм']},
{id:'ven',c:0,r:2,dir:'hemo',type:'damage',t:'Замедление венозного и лимфатического оттока',term:'венозный и лимфатический застой',s:[
'Венозная кровь и лимфа застаиваются в конечности.',
'Отсутствие мышечной помпы и снижение венозного тонуса.',
'Давление в венозном отделе капилляра растёт, интерстициальная жидкость не уносится (гемодинамический и лимфогенный факторы).',
'Отёк усиливается к вечеру; риск тромбоза глубоких вен.',
'Возвышенное положение, компрессионный трикотаж, лимфодренажный массаж.',
'Венозный и лимфатический застой']},
{id:'hyd',c:1,r:2,dir:'hemo',type:'damage',t:'Паралитическая гиперемия, рост давления в капиллярах',term:'нейропаралитическая гиперемия',s:[
'Артериолы расширяются, к капиллярам поступает много крови.',
'Утрата сосудосуживающих влияний (нейропаралитическая артериальная гиперемия).',
'Гидростатическое давление в капиллярах растёт, фильтрация усиливается (гемодинамический фактор).',
'В ранний период кожа покрасневшая, тёплая.',
'Возвышенное положение конечности, компрессия.',
'Нейропаралитическая артериальная гиперемия']},
{id:'tro',c:2,r:2,dir:'cell',type:'damage',t:'Нейротрофическое нарушение',term:'нейродистрофия',s:[
'Нарушаются обмен веществ в тканях и обновление клеток.',
'Утрачивается трофическое влияние нервов (нейротрофины, аксоплазматический транспорт).',
'Стенка капилляров и межклеточное вещество подвергаются дистрофии, проницаемость растёт; присоединяется тканевой фактор.',
'Кожа истончается, шелушится, изменяются ногти, появляются трофические язвы.',
'Уход за кожей, профилактика язв, реабилитация.',
'Нейродистрофический процесс']},
{id:'vc',c:4,r:2,dir:'hemo',type:'damage',t:'Системная вазоконстрикция, перемещение крови в лёгкие',term:'системная вазоконстрикция',s:[
'Сосуды большого круга суживаются, кровь смещается в малый круг; суживаются и лёгочные вены.',
'Активация α-адренорецепторов.',
'Растёт постнагрузка левого желудочка, повышается давление в лёгочных капиллярах.',
'Внезапный подъём артериального давления.',
'Контроль гемодинамики, вазодилататоры.',
'Системная вазоконстрикция']},
{id:'pc',c:4,r:3,dir:'hemo',type:'damage',t:'Рост давления в лёгочных капиллярах, разрыв эндотелия',term:'отёк лёгких: гидростатический механизм',s:[
'Давление в лёгочных капиллярах внезапно растёт, эндотелий механически повреждается.',
'Резкий рост гидростатического давления (теория «взрыва») и прямое действие катехоламинов на эндотелий.',
'Жидкость и белок выходят в интерстиций лёгких и альвеолы.',
'Гипоксемия, хрипы.',
'Кислород, вентиляция с PEEP.',
'Гидростатический и мембраногенный отёк лёгких']},
{id:'perm',c:2,r:4,dir:'hemo',type:'main',t:'Повышение проницаемости капилляров',term:'сосудистый фактор',s:[
'Стенка капилляра сильнее пропускает воду и белок.',
'Действие трофических нарушений, нейропептидов и гипоксии.',
'Жидкость выходит в интерстиций (сосудистый фактор).',
'Отёк начинает уплотняться.',
'Улучшение микроциркуляции, противовоспалительная терапия.',
'Повышение проницаемости капилляров']},
{id:'hyp',c:3,r:4,dir:'cell',type:'damage',t:'Гипоксия ещё сильнее нарушает трофику',term:'тканевая гипоксия',s:[
'В отёчной ткани не хватает кислорода.',
'Сдавление сосудов и нарушение микроциркуляции.',
'Стенка капилляров повреждается ещё больше, проницаемость растёт — порочный круг.',
'Кожа цианотичная, холодная; язвы плохо заживают.',
'Уменьшение отёка (возвышенное положение, компрессия) разрывает круг.',
'Тканевая гипоксия']},
{id:'npe',c:4,r:4,dir:'organ',type:'clinic',t:'Нейрогенный отёк лёгких',term:'нейрогенный отёк лёгких',s:[
'Отёк лёгких, развивающийся через минуты–часы после поражения мозга.',
'Симпатический «шторм» и повреждение лёгочных капилляров.',
'Дыхательная недостаточность; обычно разрешается за 48–72 ч.',
'Одышка, тахипноэ, розовая пенистая мокрота, гипоксемия; на рентгенограмме двусторонние инфильтраты.',
'Снижение внутричерепного давления, кислород, протективная вентиляция лёгких.',
'Нейрогенный отёк лёгких; oedema pulmonum neurogenicum']},
{id:'plym',c:4,r:5,dir:'hemo',type:'protect',t:'Усиление лимфооттока из лёгких',term:'лимфатический дренаж лёгких',s:[
'Лимфатические сосуды лёгких усиленно отводят интерстициальную жидкость.',
'Рост интерстициального давления стимулирует лимфоток.',
'Заполнение альвеол жидкостью несколько сдерживается, но при внезапной нагрузке этого недостаточно.',
'Сначала интерстициальный, затем альвеолярный отёк.',
'Компенсация; лечебное действие — снижение давления в лёгочных капиллярах.',
'Лимфатический дренаж лёгких']},
{id:'S',c:2,r:6,dir:'hemo',type:'main',t:'Накопление жидкости в интерстиции',term:'отёк',s:[
'Жидкость накапливается в межклеточном пространстве.',
'Растёт гидростатическое давление, лимфа не уносится, повышается проницаемость, нарушается трофика тканей.',
'Отёчная ткань сдавливает сосуды.',
'Отёк парализованной конечности.',
'Возвышенное положение, компрессия, движение.',
'Отёк; oedema']},
{id:'comp',c:3,r:6,dir:'hemo',type:'damage',t:'Отёчная ткань сдавливает сосуды',term:'компрессия микрососудов',s:[
'Тканевое давление повышается, мелкие сосуды сдавливаются.',
'Накопление жидкости в интерстиции.',
'Микроциркуляция нарушается, развивается гипоксия.',
'Чувство тяжести, ограничение движений.',
'Возвышенное положение конечности, компрессионный трикотаж.',
'Компрессия микрососудов']},
{id:'k1',c:0,r:7,dir:'organ',type:'clinic',t:'Отёк конечностей на стороне паралича, трофические язвы',term:'нейротрофические изменения',s:[
'Отёк на парализованной стороне, чаще на кисти и стопе.',
'Утрата мышечной помпы и сосудистого тонуса.',
'Суставы тугоподвижны, появляется боль (синдром «плечо–кисть» после инсульта).',
'Кожа холодная, цианотичная или блестящая, тонкая; трофические язвы.',
'Возвышенное положение, движение, компрессия, уход за кожей.',
'Нейротрофические изменения']},
{id:'c1',c:2,r:7,dir:'organ',type:'main',t:'Нейрогенные отёки',term:'нейрогенные отёки',s:[
'Накопление жидкости в интерстиции при поражении нервной системы.',
'Главный — нервный фактор; присоединяются гемодинамический, лимфогенный, сосудистый и тканевой факторы.',
'Периферическая форма — отёк парализованной конечности; центральная — нейрогенный отёк лёгких.',
'Отёк односторонний (при гемиплегии), сочетается с трофическими изменениями.',
'Реабилитация, возвышенное положение, компрессия, массаж; профилактика тромбозов.',
'Нейрогенные отёки; oedema neuroticum']},
{id:'k2',c:4,r:7,dir:'organ',type:'clinic',t:'Риск тромбоза глубоких вен',term:'тромбоз глубоких вен',s:[
'В глубоких венах неподвижной конечности образуется тромб.',
'Триада Вирхова: замедление кровотока, повреждение эндотелия, гиперкоагуляция.',
'Тромб может оторваться и вызвать тромбоэмболию лёгочной артерии.',
'Внезапное усиление одностороннего отёка, боль; повышен D-димер, на УЗИ тромб.',
'Профилактика: ранняя активизация, низкомолекулярный гепарин, пневмокомпрессия.',
'Тромбоз глубоких вен; thrombosis venarum profundarum']}
],

overview:[

['Периферический путь','После денервации артериолы расширяются, давление в капиллярах растёт. Из-за неподвижности застаиваются венозная кровь и лимфа. Нарушение трофики и выделение субстанции P повышают проницаемость.'],
['Центральный путь','При поражении мозга симпатический «шторм» суживает системные сосуды и перемещает кровь в лёгкие — развивается нейрогенный отёк лёгких.'],
['Порочный круг','Отёчная ткань сдавливает сосуды и вызывает гипоксию; трофика нарушается ещё сильнее, проницаемость растёт.'],
['Факторы отёка','Нейроэндокринный (главный), гемодинамический, лимфогенный, сосудистый и тканевой (трофическое нарушение).']
]},

allergic:{
title:'Аллергические отёки',
lead:'Аллергический отёк развивается при гиперчувствительности I типа (IgE-зависимой): гистамин и лейкотриены из тучных клеток резко повышают проницаемость капилляров. Брадикининовый отёк развивается сходно, но не зависит от IgE.',
nodes:[
{id:'e1',c:1,r:0,dir:'immune',type:'etio',t:'Аллерген: пища, лекарство, яд насекомых, пыльца',term:'аллерген',s:[
'В организм поступает чужеродное, чаще безвредное вещество (аллерген).',
'Пища (орехи, морепродукты, яйца), лекарства (пенициллины, НПВС), яд пчёл и ос, латекс, пыльца; наследственная предрасположенность (атопия).',
'При первом поступлении — сенсибилизация, при повторном — аллергическая реакция.',
'Аллергия в анамнезе, атопические заболевания.',
'Выявить аллерген и избегать его; аллерген-специфическая иммунотерапия.',
'Аллерген; allergenum']},
{id:'e2',c:4,r:0,dir:'cell',type:'etio',t:'Ингибиторы АПФ, дефицит C1-ингибитора',term:'брадикининовый ангиоотёк',s:[
'IgE-независимый ангиоотёк из-за накопления брадикинина.',
'Ингибиторы АПФ блокируют распад брадикинина; при наследственном ангиоотёке не хватает ингибитора C1-эстеразы.',
'Калликреин-кининовая система активируется бесконтрольно.',
'Нет крапивницы и зуда; антигистаминные средства не действуют.',
'Отменить ингибитор АПФ; концентрат C1-ингибитора, икатибант.',
'Брадикининовый ангиоотёк, наследственный ангиоотёк']},
{id:'sen',c:1,r:1,dir:'immune',type:'main',t:'Сенсибилизация: IgE фиксируются на тучных клетках',term:'сенсибилизация',s:[
'Образуются IgE к аллергену и фиксируются на рецепторах FcεRI тучных клеток и базофилов.',
'Антигенпрезентирующие клетки активируют Th2-лимфоциты; ИЛ-4 и ИЛ-13 переключают B-лимфоциты на синтез IgE.',
'Организм становится чувствительным к аллергену, но симптомов пока нет.',
'Повышены общий и специфический IgE; кожные пробы положительные.',
'Омализумаб (моноклональное антитело к IgE).',
'Сенсибилизация, IgE, FcεRI']},
{id:'bk',c:4,r:1,dir:'cell',type:'damage',t:'Накопление брадикинина',term:'брадикинин',s:[
'В тканях накапливается много брадикинина.',
'Его образование растёт (активация калликреина) или распад снижается (блокада АПФ).',
'Через B₂-рецепторы сосуды расширяются, проницаемость растёт.',
'Тяжёлый незудящий отёк (губы, язык, гортань, стенка кишки); боли в животе.',
'Икатибант (блокатор B₂-рецепторов), экаллантид, C1-ингибитор.',
'Брадикинин; B₂-рецепторы']},
{id:'deg',c:1,r:2,dir:'immune',type:'main',t:'При повторном поступлении — дегрануляция тучных клеток',term:'дегрануляция тучных клеток',s:[
'Аллерген связывает две молекулы IgE на поверхности тучной клетки.',
'Рецепторы FcεRI перекрёстно сшиваются, в клетку входит Ca²⁺.',
'Готовые медиаторы гранул высвобождаются за секунды, синтезируются новые.',
'Реакция начинается в течение минут; в крови повышена триптаза.',
'Стабилизаторы мембран тучных клеток (кромогликат, кетотифен) — для профилактики.',
'Дегрануляция тучных клеток']},
{id:'hdx',c:0,r:3,dir:'neuro',type:'protect',t:'Адреналин и гистаминаза ослабляют действие медиаторов',term:'антимедиаторные механизмы',s:[
'Организм старается ограничить действие медиаторов.',
'Надпочечники выделяют адреналин; гистаминаза (диаминоксидаза) и ферменты эозинофилов разрушают гистамин.',
'Сосуды суживаются, проницаемость снижается, выделение медиаторов из тучных клеток тормозится.',
'Лёгкие реакции проходят самостоятельно.',
'При анафилаксии адреналин в/м 0,01 мг/кг (взрослым до 0,5 мг) — терапия первой линии.',
'Адреналин, гистаминаза (диаминоксидаза)']},
{id:'hist',c:1,r:3,dir:'immune',type:'main',t:'Гистамин, лейкотриены, простагландин D₂',term:'медиаторы аллергии',s:[
'Выделяются гистамин, триптаза, лейкотриены (C₄, D₄, E₄), простагландин D₂, фактор активации тромбоцитов.',
'Тучные клетки и базофилы дегранулируют, из фосфолипидов мембран образуются новые медиаторы.',
'Через H₁-рецепторы эндотелий сокращается, сосуды расширяются; бронхи суживаются, появляется зуд.',
'Зуд, покраснение, крапивница.',
'H₁-блокаторы (цетиризин, лоратадин), антагонисты лейкотриеновых рецепторов.',
'Гистамин, лейкотриены, PGD₂, PAF']},
{id:'vd',c:0,r:4,dir:'hemo',type:'damage',t:'Расширение артериол, рост гидростатического давления',term:'вазодилатация',s:[
'Артериолы расширяются, к капиллярам поступает много крови.',
'Действие гистамина, простагландинов, брадикинина.',
'Гидростатическое давление в капиллярах растёт (гемодинамический фактор).',
'Покраснение кожи; при системной реакции АД падает.',
'Адреналин (α₁-эффект суживает сосуды).',
'Вазодилатация']},
{id:'eos',c:1,r:4,dir:'immune',type:'damage',t:'Поздняя фаза: накопление эозинофилов',term:'поздняя фаза',s:[
'Через 4–8 ч в очаг поступают эозинофилы, нейтрофилы, Th2-клетки.',
'Хемокины, ИЛ-5, лейкотриены.',
'Отёк затягивается, ткань повреждается.',
'Повторное усиление реакции (двухфазная анафилаксия).',
'Глюкокортикоиды тормозят позднюю фазу.',
'Поздняя фаза аллергической реакции']},
{id:'endo',c:2,r:4,dir:'cell',type:'main',t:'Сокращение эндотелия, открытие щелей',term:'межэндотелиальные щели',s:[
'Клетки эндотелия венул сокращаются, между ними появляются щели.',
'Действие через H₁-рецепторы гистамина и B₂-рецепторы брадикинина.',
'Проницаемость капилляров резко растёт, плазма и белок выходят в интерстиций (сосудистый фактор).',
'Отёк развивается за минуты.',
'Адреналин, антигистаминные средства; при брадикининовой форме — икатибант.',
'Повышение проницаемости, межэндотелиальные щели']},
{id:'hyp',c:3,r:4,dir:'cell',type:'damage',t:'Гипоксия тканей повреждает эндотелий',term:'тканевая гипоксия',s:[
'Из-за гипотензии и нарушения микроциркуляции ткани плохо снабжаются кислородом.',
'Потеря плазмы и расширение сосудов.',
'Эндотелий повреждается ещё больше, медиаторов становится больше, проницаемость растёт — порочный круг.',
'Ацидоз, повышенный лактат, нарушение сознания.',
'Адреналин, инфузия жидкости, кислород.',
'Тканевая гипоксия при анафилаксии']},
{id:'S',c:2,r:6,dir:'hemo',type:'main',t:'Выход жидкости в интерстиций',term:'аллергический отёк',s:[
'Содержащая белок жидкость накапливается в интерстиции.',
'Проницаемость резко растёт, гидростатическое давление повышается.',
'При системной реакции значительная часть плазмы может покинуть сосуды за минуты.',
'Отёк быстро развивается и быстро проходит (часы–сутки).',
'Прекращение контакта с аллергеном, адреналин, антигистаминные средства.',
'Аллергический отёк']},
{id:'hv',c:3,r:6,dir:'hemo',type:'damage',t:'Гиповолемия, гипотензия (анафилаксия)',term:'анафилактический шок',s:[
'ОЦК и артериальное давление резко снижаются.',
'Плазма выходит в интерстиций, сосуды расширяются генерализованно.',
'Нарушается перфузия органов — анафилактический шок.',
'Систолическое АД <90 мм рт. ст., тахикардия, нарушение сознания.',
'Адреналин в/м, кристаллоиды (20 мл/кг), приподнять ноги, кислород.',
'Анафилактический шок']},
{id:'sym',c:4,r:6,dir:'neuro',type:'protect',t:'Активация симпатоадреналовой системы',term:'симпатоадреналовая реакция',s:[
'Выделяются катехоламины, развиваются тахикардия и вазоконстрикция.',
'Барорецепторы воспринимают падение артериального давления.',
'Минутный объём и сосудистый тонус частично восстанавливаются.',
'Тахикардия, бледная кожа, холодный пот.',
'Введённый извне адреналин усиливает этот ответ; больным, принимающим бета-блокаторы, — глюкагон.',
'Симпатоадреналовая реакция']},
{id:'k1',c:1,r:7,dir:'organ',type:'clinic',t:'Отёк Квинке, крапивница',term:'ангиоотёк Квинке, крапивница',s:[
'Отёк глубоких слоёв кожи и слизистых (Квинке) или поверхностного слоя (крапивница).',
'Медиаторы действуют на кожу и слизистые.',
'При отёке гортани дыхательные пути перекрываются, возможна асфиксия.',
'Отекают губы, веки, язык, половые органы; осиплость, стридор — неотложное состояние.',
'Обеспечить проходимость дыхательных путей, адреналин, антигистаминные средства, глюкокортикоиды.',
'Ангиоотёк Квинке, крапивница; urticaria']},
{id:'c1',c:2,r:7,dir:'organ',type:'main',t:'Аллергические отёки',term:'аллергический отёк',s:[
'Накопление жидкости в интерстиции при реакции гиперчувствительности I типа.',
'Главный — сосудистый фактор (проницаемость); присоединяется гемодинамический фактор.',
'Бывает местным (отёк Квинке, крапивница) или системным (анафилаксия).',
'Начинается быстро, зудит (гистаминовая форма), ямка при надавливании не остаётся.',
'Адреналин (при анафилаксии), H₁-блокаторы, глюкокортикоиды; избегать аллергена.',
'Аллергический отёк; oedema allergicum']},
{id:'k2',c:3,r:7,dir:'organ',type:'clinic',t:'Анафилаксия: гипотензия, бронхоспазм',term:'анафилаксия',s:[
'Тяжёлая системная аллергическая реакция с вовлечением нескольких систем.',
'Системное действие медиаторов.',
'Шок, дыхательная недостаточность, угроза смерти.',
'Через минуты после контакта с аллергеном — крапивница, отёки, бронхоспазм, гипотензия, рвота.',
'Адреналин в/м (при необходимости повторять каждые 5–15 мин), жидкость, кислород, бронходилататоры.',
'Анафилаксия; anaphylaxis']}
],

<script>Object.assign(SCHEMES,{
'dehyd-iso':{
title:'Изоосмолярная гипогидратация',name:'Изоосмолярная',vals:'Na⁺ 135–145 · осмолярность в норме',
lead:'Вода и Na⁺ теряются вместе, в той же пропорции, что в плазме. Уменьшается объём внеклеточной жидкости, осмолярность остаётся нормальной, поэтому клетки не меняются.',
nodes:[
{id:'e1',c:1,r:0,dir:'hemo',type:'etio',t:'Наружные потери: кровопотеря, ожог, рвота, диарея',term:'потеря изотонической жидкости',s:[
'Вода и натрий теряются вместе в той же пропорции, что в плазме.',
'Острая кровопотеря, потеря плазмы при обширных ожогах, ранний период рвоты и диареи, полиурия.',
'Объём внеклеточной жидкости уменьшается, а её осмолярность не меняется.',
'В зависимости от потерянного объёма: слабость, жажда, тахикардия.',
'Устранить причину: остановить кровотечение, лечить рвоту и диарею.',
'Изоосмолярная (изотоническая) дегидратация; dehydratio isotonica']},
{id:'e2',c:3,r:0,dir:'organ',type:'etio',t:'Секвестрация в «третье пространство»: кишечная непроходимость, перитонит',term:'секвестрация жидкости',s:[
