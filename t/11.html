'При кишечной непроходимости — в просвете кишки, при перитоните — в брюшной полости, при панкреатите и в повреждённых тканях.',
'Изотоническая жидкость выходит из циркуляции и функционально считается потерянной.',
'Масса тела может не снижаться, но признаки гиповолемии выражены.',
'Лечение основного заболевания (часто хирургическое), восполнение потерянного объёма.',
'Секвестрация жидкости в «третье пространство»']},
{id:'ecf',c:2,r:1,dir:'metab',type:'main',t:'Уменьшение внеклеточной жидкости при нормальной осмолярности',term:'дефицит внеклеточной жидкости',s:[
'Внеклеточный сектор (плазма и интерстициальная жидкость) уменьшается.',
'Вода и Na⁺ теряются в равных долях, поэтому осмолярность остаётся в пределах 280–295 мОсм/кг.',
'Осмотический градиент между секторами не возникает, вода не выходит из клеток и не входит в них.',
'Na⁺ 135–145 ммоль/л; тургор кожи снижен, слизистые сухие.',
'Изотонические кристаллоиды: 0,9% NaCl, раствор Рингера.',
'Изоосмолярная гипогидратация; hypohydratio isoosmolaris']},
{id:'hc',c:0,r:2,dir:'hemo',type:'damage',t:'Гемоконцентрация, рост вязкости крови',term:'сгущение крови',s:[
'Объём плазмы уменьшается, форменные элементы и белки крови относительно увеличиваются.',
'Теряются вода и соли плазмы, а клетки и белки остаются в сосудах. При кровопотере в первые часы Ht не меняется, так как всё теряется вместе.',
'Вязкость крови растёт, микроциркуляция замедляется, усиливается склонность к тромбообразованию.',
'Повышены Ht, гемоглобин, общий белок; Na⁺ в норме.',
'Восполнение объёма; профилактика тромбоза.',
'Гемоконцентрация, сгущение крови']},
{id:'hv',c:2,r:2,dir:'hemo',type:'main',t:'Гиповолемия',term:'снижение ОЦК',s:[
'Объём циркулирующей крови (ОЦК) уменьшается.',
'Плазма — часть внеклеточной жидкости; при её уменьшении сосудистое русло недостаточно заполнено.',
'Венозный возврат к сердцу уменьшается; барорецепторы и почки воспринимают снижение объёма.',
'Слабость, спавшиеся шейные вены, низкое центральное венозное давление.',
'Восполнение объёма изотоническими кристаллоидами; при кровопотере — компоненты крови.',
'Гиповолемия; hypovolaemia']},
{id:'icf',c:4,r:2,dir:'cell',type:'main',t:'Внутриклеточный объём не меняется',term:'внутриклеточный объём сохранён',s:[
'Объём и гидратация клеток остаются нормальными.',
'Осмолярность внеклеточной жидкости не изменилась, поэтому вода не выходит из клеток и не входит в них.',
'Клетки мозга не повреждаются, поэтому неврологические симптомы (кроме шока) не выражены.',
'Сознание нарушается только при тяжёлой гиповолемии, когда снижается перфузия мозга.',
'Специального воздействия на клетки не требуется; только восполнение внеклеточного объёма.',
'Внутриклеточный сектор не изменён']},
{id:'co',c:2,r:3,dir:'hemo',type:'main',t:'Снижение сердечного выброса, падение АД',term:'снижение сердечного выброса',s:[
'Уменьшаются венозный возврат и ударный объём сердца.',
'По закону Франка–Старлинга при меньшем наполнении меньше и выброс.',
'Артериальное давление падает, барорецепторы включают симпатическую систему и РААС.',
'Гипотензия, ортостатический коллапс, нитевидный пульс.',
'Восполнение объёма; вазопрессоры только после восполнения объёма.',
'Снижение сердечного выброса, артериальная гипотензия']},
{id:'sym',c:3,r:3,dir:'neuro',type:'protect',t:'Активация симпатоадреналовой системы',term:'симпатоадреналовая активация',s:[
'Через барорецепторный рефлекс выделяется много катехоламинов.',
'Уменьшается растяжение барорецепторов каротидного синуса и дуги аорты.',
'Тахикардия; сужение сосудов кожи, почек и органов брюшной полости. Кровь направляется к сердцу и мозгу (централизация кровообращения). Через β₁ растёт и секреция ренина.',
'Тахикардия, бледность кожи, холодный пот, акроцианоз.',
'Устранить причину; длительная вазоконстрикция вредна для тканей.',
'Централизация кровообращения']},
{id:'raas',c:4,r:3,dir:'neuro',type:'protect',t:'Активация РААС и АДГ',term:'ренин–ангиотензин–альдостерон, вазопрессин',s:[
'Выделяется много ренина, ангиотензина II, альдостерона и антидиуретического гормона.',
'Снижается перфузия почек, симпатическая система повышает ренин; уменьшение объёма выбрасывает АДГ независимо от осмолярности.',
'Альдостерон реабсорбирует Na⁺, АДГ — воду; ангиотензин II суживает сосуды и вызывает жажду.',
'Жажда умеренная; в крови повышены ренин и альдостерон.',
'Устранить причину; при восполнении объёма система подавляется сама.',
'Вторичный гиперальдостеронизм']},
{id:'perf',c:2,r:4,dir:'hemo',type:'damage',t:'Снижение перфузии периферических тканей',term:'гипоперфузия тканей',s:[
'К коже, мышцам, кишечнику, почкам поступает мало крови.',
'Сердечный выброс снижается, сосуды суживаются (централизация); сгущённая кровь медленно течёт в микрососудах.',
'Тканям не хватает кислорода и питательных веществ.',
'Кожа бледная, холодная; время наполнения капилляров больше 2 секунд.',
'Быстрое восполнение объёма — основной путь восстановления микроциркуляции.',
'Гипоперфузия, нарушение микроциркуляции']},
{id:'ret',c:4,r:4,dir:'neuro',type:'protect',t:'Почки задерживают Na⁺ и воду',term:'антидиуретический ответ почек',s:[
'Почки выделяют мало, но концентрированной мочи.',
'Действие альдостерона и АДГ; клубочковая фильтрация снижается.',
'Циркулирующий объём частично сохраняется. При длительной ишемии развивается преренальная почечная недостаточность.',
'Олигурия, высокая плотность мочи, Na⁺ в моче менее 20 ммоль/л.',
'Контроль диуреза (не менее 0,5 мл/кг в час); восполнение объёма.',
'Олигурия, преренальная азотемия']},
{id:'perm',c:1,r:5,dir:'cell',type:'damage',t:'Атония сосудов, рост проницаемости капилляров',term:'повышение проницаемости капилляров',s:[
'Микрососуды расширяются, их стенка становится проницаемой; плазма выходит в интерстиций.',
'Ацидоз и гипоксия повреждают эндотелий; метаболиты расслабляют прекапиллярные сфинктеры, а посткапиллярные венулы остаются суженными.',
'Кровь задерживается в микрососудах, циркулирующий объём уменьшается ещё больше. Порочный круг может привести к необратимой стадии шока.',
'Гипотензия плохо отвечает на восполнение объёма.',
'Разорвать порочный круг рано: быстрое восполнение объёма, устранение ацидоза и гипоксии.',
'Атония сосудов, плазморрагия']},
{id:'hyp',c:2,r:5,dir:'metab',type:'damage',t:'Гипоксия тканей, метаболический ацидоз',term:'лактат-ацидоз',s:[
'Клетки переходят на анаэробный гликолиз, накапливается молочная кислота.',
'Доставка кислорода к тканям снижается.',
'Ацидоз ослабляет сократимость миокарда, снижает чувствительность прекапиллярных сфинктеров к катехоламинам.',
'Лактат повышен, pH снижен, BE отрицательный; дыхание Куссмауля.',
'Восстановление перфузии; бикарбонат только при тяжёлом ацидозе.',
'Гипоксия тканей, метаболический ацидоз']},
{id:'shock',c:2,r:6,dir:'hemo',type:'damage',t:'В тяжёлых случаях — гиповолемический шок',term:'гиповолемический шок',s:[
'Компенсаторных механизмов не хватает, развивается недостаточность кровообращения.',
'При потере более 25–30% ОЦК порочный круг сильнее компенсации.',
'Полиорганная недостаточность: поражаются почки, печень, кишечник, мозг.',
'Шоковый индекс (ЧСС / систолическое АД) выше 1, анурия, нарушение сознания.',
'Экстренная инфузия, кислород, устранение причины; при кровопотере — компоненты крови.',
'Гиповолемический шок']},
{id:'k1',c:0,r:7,dir:'metab',type:'clinic',t:'Na⁺ и осмолярность в норме, Ht и белок повышены',term:'лабораторная картина',s:[
'Лабораторная картина, характерная для изоосмолярной гипогидратации.',
'Вода и соль плазмы теряются одинаково, клетки и белок остаются в сосудах.',
'Отличает изоосмолярную форму от гипо- и гиперосмолярной.',
'Na⁺ 135–145 ммоль/л, осмолярность 280–295 мОсм/кг, Ht и общий белок повышены; отношение мочевина/креатинин растёт.',
'При инфузии контролировать Na⁺, Ht и креатинин.',
'Лабораторная картина изотонической дегидратации']},
{id:'k2',c:2,r:7,dir:'hemo',type:'clinic',t:'Тахикардия, гипотензия, ортостатический коллапс',term:'гемодинамические нарушения',s:[
'Признаки нарушения гемодинамики.',
'Гиповолемия и снижение сердечного выброса.',
'Тяжесть зависит от потерянного объёма.',
'При переходе из положения лёжа в положение стоя ЧСС растёт более чем на 30 в минуту или падает АД; шейные вены спавшиеся.',
'Восполнение объёма, контроль гемодинамики.',
'Ортостатическая гипотензия']},
{id:'k3',c:4,r:7,dir:'organ',type:'clinic',t:'Олигурия; жажда умеренная, слизистые сухие',term:'олигурия, умеренная жажда',s:[
'Мочи выделяется мало, человек испытывает некоторую жажду.',
'Почки задерживают воду. Осмолярность нормальная, поэтому жажда возникает только по объёмной причине (ангиотензин II, барорецепторы).',
'Слизистые и кожа сухие, тургор снижен.',
'Диурез менее 0,5 мл/кг в час, кожная складка расправляется медленно, язык сухой.',
'Ежечасный контроль диуреза.',
'Олигурия, умеренная жажда']}
],

overview:[
['Что происходит','Вода и Na⁺ теряются в той же пропорции, что в плазме. Внеклеточный объём уменьшается, но осмолярность нормальна, поэтому клетки не повреждаются.'],
['Главное звено','Гиповолемия. Она снижает сердечный выброс и нарушает перфузию тканей.'],
['Компенсация','Симпатоадреналовая система централизует кровообращение; РААС и АДГ задерживают Na⁺ и воду и частично восполняют объём.'],
['Порочный круг','Гипоксия и ацидоз вызывают атонию сосудов и повышают проницаемость капилляров. Плазма выходит из сосудов, гиповолемия углубляется.'],
['Терапевтическая мишень','Изотонические кристаллоиды (0,9% NaCl, Рингер) и устранение причины.']
]},

'dehyd-hypo':{
title:'Гипоосмолярная гипогидратация',name:'Гипоосмолярная',vals:'Na⁺ < 135 · осмолярность снижена',
lead:'Na⁺ теряется больше, чем вода. Вода переходит в клетки: снаружи развивается гиповолемия, внутри — набухание клеток.',
nodes:[
{id:'e1',c:1,r:0,dir:'metab',type:'etio',t:'Потеря солёной жидкости с восполнением пресной водой',term:'потеря солей с восполнением водой',s:[
'Теряется жидкость, содержащая соль, а восполняется только водой.',
'Повторная рвота, диарея (холера), обильное потоотделение, кишечные свищи; человек пьёт пресную воду или вводится только 5% глюкоза.',
'Вода восполняется, Na⁺ — нет: внеклеточная жидкость становится гипоосмолярной.',
'Слабость, головокружение, судороги мышц.',
'Восполнять потери солевыми растворами (регидрон, 0,9% NaCl).',
'Гипоосмолярная дегидратация; дефицит солей']},
{id:'e2',c:3,r:0,dir:'neuro',type:'etio',t:'Почечная потеря Na⁺: надпочечниковая недостаточность, диуретики',term:'почечная потеря натрия',s:[
'Почки выводят Na⁺ в избытке.',
'Дефицит альдостерона (болезнь Аддисона), тиазидные диуретики, сольтеряющая нефропатия, церебральный сольтеряющий синдром.',
'С натрийурезом теряется и вода, но потеря Na⁺ преобладает.',
'При болезни Аддисона — потемнение кожи, гипотензия, гиперкалиемия.',
'Лечение причины: при болезни Аддисона — глюко- и минералокортикоиды (флудрокортизон); отмена диуретика.',
'Солевое истощение почечного генеза']},
{id:'na',c:2,r:1,dir:'metab',type:'main',t:'Потеря Na⁺ больше, чем воды: гипонатриемия',term:'гипоосмолярность',s:[
'Натрий и осмолярность внеклеточной жидкости снижаются.',
'Потеря соли преобладает над потерей воды.',
'Между секторами возникает осмотический градиент: внутри клеток осмолярность остаётся выше.',
'Na⁺ ниже 135 ммоль/л, осмолярность ниже 280 мОсм/кг; Ht повышен.',
'0,9% NaCl; при тяжёлой неврологической симптоматике 3% NaCl. Na⁺ не должен расти быстрее 8–10 ммоль/л в сутки, иначе развивается осмотический демиелинизирующий синдром.',
'Гипоосмолярная (гипотоническая) дегидратация; hyponatriaemia']},
{id:'shift',c:2,r:2,dir:'cell',type:'main',t:'Вода переходит из внеклеточного пространства в клетки',term:'перемещение воды в клетки',s:[
'Вода переходит из среды с низкой осмолярностью (внеклеточной) в среду с высокой (внутриклеточную).',
'Закон осмоса: вода движется в сторону более высокого осмотического давления.',
'Внеклеточный сектор уменьшается двумя путями: наружные потери и переход в клетки. Клетки набухают.',
'Одновременно наблюдаются признаки гиповолемии и набухания клеток.',
'Возвращение Na⁺ во внеклеточный сектор выводит воду из клеток обратно.',
'Внеклеточная дегидратация с внутриклеточной гипергидратацией']},
{id:'adh',c:4,r:2,dir:'neuro',type:'protect',t:'Осмотический АДГ подавлен, жажды нет',term:'подавление осморецепторов',s:[
'Осморецепторы гипоталамуса тормозят секрецию АДГ и жажду.',
'Осмолярность плазмы низкая.',
'Сначала избыток воды выводится (водный диурез), осмолярность выравнивается, но объём уменьшается ещё больше. Человек пьёт мало.',
'Жажды нет, отвращение к воде; моча вначале обильная, разведённая.',
'Не давать пить пресную воду; давать солевые растворы.',
'Отсутствие жажды, отвращение к воде']},
{id:'adhv',c:0,r:3,dir:'neuro',type:'damage',t:'Гиповолемия выбрасывает АДГ независимо от осмолярности',term:'неосмотическая секреция АДГ',s:[
'При значительном уменьшении объёма АДГ выделяется в большом количестве, даже если осмолярность низкая.',
'Барорецепторный сигнал преобладает над осмотическим: для организма важнее сохранить объём.',
'Почки задерживают пресную воду, гипонатриемия углубляется — порочный круг.',
'Олигурия, нарастание гипонатриемии.',
'Восполнение объёма изотоническим раствором устраняет стимул АДГ; при выведении избытка воды следить, чтобы Na⁺ не рос слишком быстро.',
'Неосмотическая (волюм-зависимая) секреция вазопрессина']},
{id:'ecfd',c:1,r:3,dir:'hemo',type:'main',t:'Резкое уменьшение внеклеточного объёма',term:'выраженная гиповолемия',s:[
'Внеклеточный сектор, в том числе плазма, уменьшается сильнее, чем при других формах.',
'К наружным потерям добавляется переход воды в клетки.',
'Гиповолемия ранняя и тяжёлая; гемодинамика нарушается быстро.',
'При одинаковой потере объёма гемодинамические нарушения наиболее тяжелы при гипоосмолярной форме.',
'Быстрое восполнение объёма 0,9% NaCl.',
'Выраженная гиповолемия']},
{id:'cell',c:3,r:3,dir:'cell',type:'damage',t:'Набухание клеток (внутриклеточная гипергидратация)',term:'внутриклеточная гипергидратация',s:[
'В клетках накапливается вода, их объём увеличивается.',
'Гипоосмолярность внеклеточной среды.',
'Нарушается работа ферментов и мембран; наиболее чувствительны клетки мозга.',
'Судороги мышц, слабость.',
'Постепенное восстановление внеклеточного Na⁺.',
'Внутриклеточный отёк; hyperhydratio intracellularis']},
{id:'circ',c:1,r:4,dir:'hemo',type:'damage',t:'Падение АД, сгущение крови, коллапс',term:'коллапс, гемоконцентрация',s:[
'Артериальное давление падает, вязкость крови растёт.',
'ОЦК значительно снижается; плазмы становится меньше, Ht растёт.',
'Нарушается перфузия тканей, развиваются гипоксия и ацидоз; в тяжёлых случаях гиповолемический шок.',
'Ортостатический коллапс, нитевидный пульс, спавшиеся вены.',
'Инфузия, контроль гемодинамики.',
'Коллапс, гемоконцентрация']},
{id:'brain',c:3,r:4,dir:'organ',type:'damage',t:'Отёк мозга, рост внутричерепного давления',term:'отёк головного мозга',s:[
'Нейроны и глия набухают, объём мозга внутри черепа растёт.',
'Вода переходит в клетки мозга; череп не расширяется, поэтому давление растёт.',
'Функции мозга нарушаются; в тяжёлых случаях ствол мозга вклинивается в большое затылочное отверстие.',
'Головная боль, апатия, тошнота, оглушение, судороги, кома.',
'При тяжёлой симптоматике 3% NaCl, но не поднимать Na⁺ слишком быстро (осмотическая демиелинизация).',
'Отёк мозга; oedema cerebri']},
{id:'k1',c:0,r:5,dir:'hemo',type:'clinic',t:'Гипотензия, тахикардия, сниженный тургор, мягкие глазные яблоки',term:'клиника гипоосмолярной дегидратации',s:[
'Выраженные признаки уменьшения внеклеточного сектора.',
'Уменьшаются интерстициальная жидкость и плазма.',
'Признаки ранние и выраженные; часто присоединяются судороги мышц.',
'Кожная складка не расправляется, глазные яблоки мягкие; из-за набухания клеток слизистые могут быть влажными.',
'Контроль гемодинамики и Na⁺.',
'Клиника гипоосмолярной дегидратации']},
{id:'kid',c:1,r:5,dir:'organ',type:'damage',t:'Снижение почечной перфузии, азотемия',term:'преренальная азотемия',s:[
'Клубочковая фильтрация снижается.',
'Уменьшение почечного кровотока.',
'Мочевина и креатинин накапливаются в крови; развивается преренальная почечная недостаточность.',
'Олигурия, повышение мочевины и креатинина.',
'Восполнение объёма, контроль диуреза.',
'Преренальная азотемия']},
{id:'k2',c:2,r:5,dir:'organ',type:'clinic',t:'Головная боль, апатия, судороги мышц, оглушение, кома',term:'гипонатриемическая энцефалопатия',s:[
'Неврологические признаки отёка мозга.',
'Нейроны набухают, их функция нарушается.',
'Тяжесть зависит от уровня гипонатриемии и скорости её развития.',
'Обычно выражены при Na⁺ ниже 125 ммоль/л; при быстром развитии — и при более высоком уровне.',
'При тяжёлой симптоматике болюс 3% NaCl; не поднимать Na⁺ быстрее 8–10 ммоль/л в сутки.',
'Гипонатриемическая энцефалопатия']},
{id:'vom',c:3,r:5,dir:'organ',type:'damage',t:'Тошнота, рвота — Na⁺ теряется ещё больше',term:'рвота центрального генеза',s:[
'Появляется рвота центрального происхождения.',
'Рост внутричерепного давления раздражает рвотный центр.',
'С рвотой снова теряются соль и вода; если человек пьёт пресную воду, гипонатриемия углубляется — порочный круг.',
'Рвота, не приносящая облегчения, вместе с головной болью.',
'Противорвотные средства, солевые растворы — разрыв порочного круга.',
'Церебральная рвота']},
{id:'k3',c:4,r:5,dir:'neuro',type:'clinic',t:'Жажды нет, отвращение к воде',term:'отсутствие жажды',s:[
'Несмотря на тяжёлое обезвоживание, человек не испытывает жажды.',
'Осмотическая жажда подавлена.',
'Человек сам не пьёт; состояние может быть оценено поздно.',
'Отвращение к воде, тошнота.',
'Регидратация солевым раствором.',
'Отсутствие жажды']}
],

overview:[
['Что происходит','Na⁺ теряется больше, чем вода. Внеклеточная жидкость становится гипоосмолярной, вода переходит в клетки: снаружи объём уменьшается, внутри клетки набухают.'],
['Главное звено','Гипонатриемия и снижение осмолярности. Она одновременно вызывает гиповолемию и набухание клеток.'],
['Порочные круги','Объёмный путь: гиповолемия выбрасывает АДГ, пресная вода задерживается, гипонатриемия углубляется. Мозговой путь: отёк мозга вызывает рвоту, Na⁺ снова теряется.'],
['Особенности','Жажды нет, гемодинамика нарушается рано и тяжело, неврологические признаки выражены.'],
['Терапевтическая мишень','0,9% NaCl; при тяжёлой симптоматике 3% NaCl. Na⁺ не поднимается быстрее 8–10 ммоль/л в сутки.']
]},

'dehyd-hyper':{
title:'Гиперосмолярная гипогидратация',name:'Гиперосмолярная',vals:'Na⁺ > 145 · осмолярность повышена',
lead:'Вода теряется больше, чем соль. Вода выходит из клеток, клетки, особенно клетки мозга, обезвоживаются.',
nodes:[
{id:'e1',c:0,r:0,dir:'metab',type:'etio',t:'Нет питья: оглушение, младенец, пожилой, отсутствие воды',term:'водное голодание',s:[
'Вода поступает в организм в недостаточном количестве.',
'Отсутствие воды (пустыня, катастрофа), нарушение глотания, нарушение сознания; младенцы и пожилые не могут сообщить о жажде или не чувствуют её.',
'«Неощутимые» потери воды через кожу и дыхание (800–1000 мл в сутки) продолжаются.',
'Сильная жажда, снижение массы тела.',
'Дать воду; контролировать питьевой режим пожилых и младенцев.',
'Водное голодание']},
{id:'e2',c:2,r:0,dir:'metab',type:'etio',t:'Потеря гипотонической жидкости: пот, гипервентиляция, лихорадка, диарея у младенцев',term:'потеря гипотонической жидкости',s:[
'Вода теряется больше, чем соль.',
'Пот и влага выдыхаемого воздуха гипотоничны: работа в жару, лихорадка, гипервентиляция, жидкий стул у младенцев.',
'Осмолярность внеклеточной жидкости растёт.',
'Потливость, частое дыхание, повышение температуры.',
'Регидратация, снижение температуры.',
'Потеря гипотонической жидкости']},
{id:'e3',c:4,r:0,dir:'neuro',type:'etio',t:'Почечная потеря воды: несахарный диабет, осмотический диурез',term:'почечная потеря воды',s:[
'Почки выводят воду в избытке.',
'Центральный несахарный диабет (дефицит АДГ), нефрогенный несахарный диабет (почки не чувствуют АДГ), осмотический диурез (глюкозурия при сахарном диабете, маннитол).',
'Выделяется много разведённой мочи, дефицит воды быстро нарастает.',
'Полиурия (более 3 л в сутки), полидипсия.',
'При центральной форме десмопрессин; при сахарном диабете коррекция гликемии.',
'Несахарный диабет, осмотический диурез']},
{id:'osm',c:2,r:1,dir:'metab',type:'main',t:'Потеря воды больше, чем соли: гипернатриемия',term:'гиперосмолярность',s:[
'Натрий и осмолярность внеклеточной жидкости растут.',
'Потеря воды преобладает над потерей соли.',
'Осмолярность внеклеточной среды высокая, вода выходит из клеток.',
'Na⁺ выше 145 ммоль/л, осмолярность выше 295 мОсм/кг; Ht умеренно повышен.',
'Восполнять дефицит воды питьём, 5% глюкозой или 0,45% NaCl. Na⁺ не снижать быстрее 10 ммоль/л в сутки.',
'Гиперосмолярная (гипертоническая) дегидратация; hypernatriaemia']},
{id:'shift',c:2,r:2,dir:'cell',type:'main',t:'Вода выходит из клеток во внеклеточное пространство',term:'перемещение воды из клеток',s:[
'Вода переходит из клеток в гиперосмолярную внеклеточную среду.',
'Осмотический градиент между секторами.',
'Внеклеточный объём частично восполняется, а клетки обезвоживаются. Дефицит воды распределяется на все секторы.',
'Гиповолемия поздняя, а клеточные признаки (жажда, неврологические) ранние.',
'Давать воду постепенно — клетки восстанавливаются медленно.',
'Внутриклеточная дегидратация']},
{id:'thirst',c:4,r:2,dir:'neuro',type:'protect',t:'Осморецепторы: сильная жажда, рост АДГ',term:'осмотическая жажда',s:[
'Осморецепторы гипоталамуса возбуждают центр жажды и усиливают секрецию АДГ.',
'Осморецепторы включаются уже при росте осмолярности на 1–2%.',
'Питьё и задержка воды почками снижают осмолярность — главная компенсация.',
'Очень сильная жажда (если сознание сохранено).',
'Обеспечить возможность пить.',
'Осмотическая жажда, секреция вазопрессина']},
{id:'ecf',c:0,r:3,dir:'hemo',type:'protect',t:'Внеклеточный объём частично сохраняется',term:'относительно сохранённый ОЦК',s:[
'Объём плазмы уменьшается меньше, чем при других формах.',
'Вода, вышедшая из клеток, заполняет внеклеточный сектор.',
'Гемодинамика долго сохраняется; гиповолемия и гипотензия — только на тяжёлой стадии.',
'Тахикардия умеренная, АД долго нормальное.',
'Первоочередное восполнение объёма нужно только при тяжёлой гиповолемии.',
'Относительная сохранность внеклеточного объёма']},
{id:'cdh',c:3,r:3,dir:'cell',type:'main',t:'Внутриклеточная гипогидратация',term:'клеточная дегидратация',s:[
'Клетки теряют воду и сморщиваются.',
'Гиперосмолярность внеклеточной среды.',
'В клетках растёт концентрация ионов и метаболитов, нарушаются ферменты и синтез белка; наиболее чувствительны клетки мозга.',
'Язык и слизистые очень сухие, слюны нет, кожа сухая.',
'Постепенное восполнение воды.',
'Клеточная дегидратация; dehydratio intracellularis']},
{id:'ret',c:4,r:3,dir:'neuro',type:'protect',t:'Задержка воды: олигурия, концентрированная моча',term:'антидиурез',s:[
'Почки выделяют мало концентрированной мочи.',
'АДГ усиливает реабсорбцию воды в собирательных трубках через аквапорин-2.',
'Дефицит воды нарастает медленнее. При несахарном диабете и осмотическом диурезе эта компенсация не работает.',
'Олигурия, плотность мочи выше 1025 (при несахарном диабете ниже 1005).',
'Контроль диуреза и плотности мочи помогает различить причины.',
'Олигурия, концентрированная моча']},
{id:'wloss',c:1,r:4,dir:'metab',type:'damage',t:'Усиление потерь воды через дыхание и кожу',term:'неощутимые потери',s:[
'«Неощутимые» потери воды растут.',
'При лихорадке дыхание учащается; при повышении температуры на 1°C эти потери растут примерно на 10–12%.',
'Дефицит воды углубляется, гипернатриемия усиливается — порочный круг.',
'Частое дыхание, снижение массы тела.',
'При расчёте объёма регидратации учитывать потери при лихорадке.',
'Неощутимые потери воды; perspiratio insensibilis']},
{id:'fever',c:2,r:4,dir:'metab',type:'damage',t:'Снижение потоотделения, лихорадка обезвоживания',term:'лихорадка обезвоживания',s:[
'Температура тела повышается.',
'Потоотделение снижается, теплоотдача нарушается; обезвоживание клеток гипоталамуса нарушает терморегуляцию.',
'Гипертермия усиливает потери воды через дыхание.',
'Лихорадка (особенно у младенцев), кожа горячая и сухая.',
'Регидратация — температура часто снижается после восполнения воды; физическое охлаждение.',
'Лихорадка обезвоживания (эксикозный токсикоз)']},
{id:'brain',c:3,r:4,dir:'organ',type:'damage',t:'Сморщивание клеток мозга, нарушение функции нейронов',term:'дегидратация мозга',s:[
'Объём мозга уменьшается, функция нейронов нарушается.',
'Клетки мозга обезвоживаются.',
'При уменьшении мозга вены, связывающие его с твёрдой оболочкой, растягиваются и могут разорваться: субарахноидальное и внутримозговое кровоизлияние.',
'Возбуждение, беспокойство, галлюцинации, гиперрефлексия, судороги.',
'Медленное снижение Na⁺; неврологический контроль.',
'Гиперосмолярная энцефалопатия']},
{id:'idio',c:4,r:4,dir:'cell',type:'protect',t:'Накопление идиогенных осмолей в клетках мозга',term:'идиогенные осмоли',s:[
'За 1–3 суток клетки мозга накапливают в себе осмотически активные вещества.',
'Таурин, миоинозитол, глутамин, глутамат, бетаин и ионы (K⁺, Na⁺).',
'Внутриклеточная осмолярность растёт, вода возвращается в клетки; объём мозга восстанавливается.',
'При хронической гипернатриемии неврологические признаки легче.',
'Эту адаптацию учитывают при лечении: осмоли удаляются медленно.',
'Идиогенные осмоли, органические осмолиты']},
{id:'cons',c:3,r:5,dir:'organ',type:'damage',t:'Нарушение сознания — человек не может пить',term:'нарушение сознания',s:[
'Развиваются оглушение, сопор, кома.',
'Обезвоживание клеток мозга, ослабление функции центра жажды.',
'Человек не может сообщить о жажде и не может пить; дефицит воды углубляется — порочный круг.',
'Сопор, кома, особенно у пожилых.',
'Вводить воду внутривенно (5% глюкоза, 0,45% NaCl).',
'Гиперосмолярная кома']},
{id:'cedema',c:4,r:5,dir:'organ',type:'damage',t:'Отёк мозга при слишком быстрой регидратации',term:'отёк мозга при быстрой коррекции',s:[
'Осложнение лечения — отёк мозга.',
'Если внеклеточная осмолярность быстро падает, пока идиогенные осмоли остаются в клетках, вода быстро входит в клетки.',
'Мозг отекает, появляются судороги; возможен летальный исход.',
'Внезапные судороги и нарушение сознания у больного, который шёл на поправку.',
'При хронической гипернатриемии Na⁺ не снижать быстрее 0,5 ммоль/л в час и 10 ммоль/л в сутки.',
'Отёк мозга при быстрой коррекции гипернатриемии']},
{id:'k1',c:0,r:6,dir:'organ',type:'clinic',t:'Сухие слизистые, тургор относительно сохранён',term:'клиника гиперосмолярной дегидратации',s:[
'Признаки уменьшения внеклеточного сектора слабые.',
'Вода, вышедшая из клеток, частично восполняет интерстициальную жидкость.',
'Тургор кожи относительно сохранён, кожа может быть «тестообразной».',
'Язык и слизистые очень сухие, тахикардия, АД долго нормальное.',
'Регидратация; контроль гемодинамики.',
'Клиника гиперосмолярной дегидратации']},
{id:'k2',c:3,r:6,dir:'organ',type:'clinic',t:'Возбуждение, галлюцинации, судороги, кома',term:'гиперосмолярная энцефалопатия',s:[
'Признаки гиперосмолярной энцефалопатии.',
'Обезвоживание клеток мозга.',
'Тяжесть зависит от уровня Na⁺ и скорости его роста.',
'При Na⁺ выше 160 ммоль/л тяжёлые признаки часты; гипертермия, при сохранённом сознании сильная жажда.',
'Медленная коррекция Na⁺; неврологический контроль.',
'Гиперосмолярная энцефалопатия']}
],

{id:'osm',c:2,r:1,dir:'metab',type:'main',t:'Избыток воды: гипонатриемия, снижение осмолярности',term:'гипоосмолярность',s:[
'Na⁺ и осмолярность внеклеточной жидкости снижаются за счёт разведения.',
'Воды в избытке, а общее количество Na⁺ в организме нормальное.',
'Внутри клеток осмолярность остаётся выше — вода переходит в клетки.',
'Na⁺ ниже 135 ммоль/л, осмолярность ниже 280 мОсм/кг; Ht и белок снижены.',
'Ограничение питья; при тяжёлой симптоматике 3% NaCl. Na⁺ не поднимать быстрее 8–10 ммоль/л в сутки.',
'Гипоосмолярная гипергидратация, водное отравление; intoxicatio aquosa']},
{id:'vol',c:0,r:2,dir:'hemo',type:'main',t:'Внеклеточный объём немного увеличивается',term:'умеренная гиперволемия',s:[
'Примерно треть избыточной воды остаётся во внеклеточном секторе.',
'Большая часть воды переходит в клетки.',
'Гиперволемия лёгкая, отёки не выражены; волюморецепторы активируются.',
'Масса тела растёт, но периферических отёков обычно нет.',
'Ограничение питья.',
'Умеренная гиперволемия']},
{id:'shift',c:2,r:2,dir:'cell',type:'main',t:'Вода переходит в клетки',term:'перемещение воды в клетки',s:[
'Вода переходит из гипоосмолярной внеклеточной среды внутрь клеток.',
'Осмотический градиент между секторами.',
'Клетки набухают: преобладает внутриклеточная гипергидратация.',
'Неврологические признаки, гемолиз.',
'Постепенное повышение внеклеточной осмолярности.',
'Внутриклеточная гипергидратация']},
{id:'adh',c:4,r:2,dir:'neuro',type:'protect',t:'Подавление осмотического АДГ, водный диурез',term:'подавление АДГ',s:[
'Осморецепторы тормозят секрецию АДГ и жажду.',
'Осмолярность плазмы низкая.',
'Почки выводят много разведённой мочи и избавляются от избытка воды. При СНСАДГ и почечной недостаточности эта компенсация не работает.',
'При полидипсии моча обильная и разведённая (осмолярность ниже 100 мОсм/кг).',
'Осмолярность мочи различает причины: низкая — избыточное питьё, высокая — СНСАДГ.',
'Подавление секреции вазопрессина, водный диурез']},
{id:'anp',c:0,r:3,dir:'neuro',type:'protect',t:'Рост натрийуретических пептидов, торможение альдостерона',term:'натрийуретический ответ',s:[
'Выделяется ANP, активность РААС снижается.',
'Растяжение предсердий, увеличение объёма.',
'Почки усиленно выводят Na⁺ и приближают объём к норме.',
'При СНСАДГ объём удерживается на нормальном уровне (эуволемия).',
'Это корректируют ограничением воды, а не назначением соли.',
'Натрийуретические пептиды']},
{id:'natr',c:1,r:3,dir:'organ',type:'damage',t:'Натрийурез: Na⁺ теряется с мочой',term:'натрийурез',s:[
'С мочой выводится много Na⁺.',
'Ответ на увеличение объёма.',
'Объём стабилизируется, но Na⁺ теряется, гипонатриемия углубляется — порочный круг.',
'Na⁺ в моче выше 30 ммоль/л.',
'Ограничение воды. При СНСАДГ 0,9% NaCl неэффективен: Na⁺ выводится с мочой, вода задерживается.',
'Натрийурез']},
{id:'hem',c:2,r:3,dir:'cell',type:'damage',t:'Набухание эритроцитов, гемолиз',term:'осмотический гемолиз',s:[
'Эритроциты впитывают воду, набухают и разрушаются.',
'Осмолярность плазмы падает ниже предела осмотической резистентности эритроцитов.',
'Гемоглобин выходит в плазму, развивается анемия; возможно повреждение почечных канальцев.',
'Гемоглобинемия, гемоглобинурия, анемия.',
'Восстановление осмолярности; защита почек.',
'Осмотический гемолиз']},
{id:'cell',c:3,r:3,dir:'cell',type:'damage',t:'Набухание клеток (внутриклеточная гипергидратация)',term:'внутриклеточная гипергидратация',s:[
'В клетках накапливается вода, их объём увеличивается.',
'Гипоосмолярность внеклеточной среды.',
'Нарушается работа ферментов и мембран; наиболее чувствительны клетки мозга.',
'Судороги мышц, слабость.',
'Постепенное восстановление внеклеточной осмолярности.',
'Внутриклеточный отёк; hyperhydratio intracellularis']},
{id:'k3',c:4,r:3,dir:'neuro',type:'clinic',t:'Жажды нет, отвращение к воде',term:'отсутствие жажды',s:[
'Человек не испытывает жажды.',
'Осмотическая жажда подавлена.',
'Человек склонен сам ограничивать питьё.',
'Жажды нет, тошнота, отвращение к воде.',
'Объяснить важность ограничения питья.',
'Отсутствие жажды']},
{id:'k2',c:1,r:4,dir:'organ',type:'clinic',t:'Отёки не выражены; в моче высокие Na⁺ и осмолярность',term:'клиника СНСАДГ',s:[
'Клинико-лабораторная картина, характерная для СНСАДГ.',
'Вода уходит в клетки, натрийурез стабилизирует объём.',
'Гипонатриемия выражена, а признаки гиперволемии слабые.',
'Осмолярность мочи выше 100 мОсм/кг, Na⁺ в моче выше 30 ммоль/л; в крови мочевина и мочевая кислота снижены.',
'Ограничение питья (0,8–1 л в сутки).',
'Клиника СНСАДГ']},
{id:'brain',c:3,r:4,dir:'organ',type:'damage',t:'Отёк мозга, рост внутричерепного давления',term:'отёк головного мозга',s:[
'Нейроны и глия набухают, объём мозга растёт.',
'Вода переходит в клетки мозга; череп не расширяется.',
'Внутричерепное давление растёт, возможно вклинение ствола мозга в большое затылочное отверстие; может присоединиться нейрогенный отёк лёгких.',
'Головная боль, тошнота, оглушение, судороги, кома.',
'При тяжёлой симптоматике болюс 3% NaCl 100–150 мл; в первые часы достаточно поднять Na⁺ на 4–6 ммоль/л.',
'Отёк мозга; oedema cerebri']},
{id:'osmo',c:4,r:4,dir:'cell',type:'protect',t:'Клетки мозга выводят ионы и осмолиты',term:'регуляторное уменьшение объёма',s:[
'Клетки мозга выводят наружу K⁺, Cl⁻ и органические осмолиты (таурин, миоинозитол, глутамат).',
'Адаптация к набуханию клеток; завершается за 24–48 ч.',
'Внутриклеточная осмолярность снижается, отёк мозга уменьшается.',
'При хронической гипонатриемии симптомы легче.',
'В адаптированном мозге нельзя быстро поднимать Na⁺: осмолиты накапливаются заново медленно.',
'Регуляторное уменьшение объёма клеток']},
{id:'k1',c:2,r:5,dir:'organ',type:'clinic',t:'Головная боль, апатия, судороги, кома',term:'гипонатриемическая энцефалопатия',s:[
'Неврологические признаки водного отравления.',
'Набухание клеток мозга.',
'Тяжесть зависит от уровня гипонатриемии и скорости её развития.',
'Обычно выражены при Na⁺ ниже 125 ммоль/л; при быстром развитии — и при более высоком уровне.',
'При тяжёлой симптоматике болюс 3% NaCl; Na⁺ не поднимать быстрее 8–10 ммоль/л в сутки.',
'Гипонатриемическая энцефалопатия']},
{id:'nau',c:3,r:5,dir:'neuro',type:'damage',t:'Тошнота, рвота — АДГ выделяется ещё больше',term:'тошнота как стимул АДГ',s:[
'Появляются тошнота и рвота.',
'Внутричерепное давление раздражает рвотный центр.',
'Тошнота — сильный неосмотический стимул секреции АДГ. Вода задерживается, гипонатриемия углубляется — порочный круг.',
'Рвота, не приносящая облегчения, головная боль.',
'Противорвотные средства, ограничение воды.',
'Тошнота — неосмотический стимул вазопрессина']},
{id:'ods',c:4,r:5,dir:'organ',type:'damage',t:'Осмотическая демиелинизация при слишком быстрой коррекции',term:'центральный понтинный миелинолиз',s:[
'Осложнение лечения: разрушается миелин в стволе мозга и других областях.',
'Клетки мозга, потерявшие осмолиты, при быстром росте Na⁺ обезвоживаются, олигодендроциты повреждаются.',
'Необратимый неврологический дефицит.',
'Через 2–6 суток: дизартрия, дисфагия, тетрапарез, синдром «запертого человека».',
'При хронической гипонатриемии Na⁺ не поднимать быстрее 8–10 ммоль/л в сутки; при превышении снизить снова 5% глюкозой или десмопрессином.',
'Осмотический демиелинизирующий синдром']}
],

overview:[
['Что происходит','Вода накапливается в избытке и разводит внеклеточную жидкость. Вода переходит в клетки, клетки, особенно клетки мозга, набухают — водное отравление.'],
['Главное звено','Гипонатриемия и снижение осмолярности; внутриклеточная гипергидратация.'],
['Порочные круги','Натрийуретический путь: при росте объёма Na⁺ выводится с мочой, гипонатриемия углубляется. Мозговой путь: отёк мозга вызывает тошноту, выделяется АДГ, вода задерживается ещё больше.'],
['Компенсация','Водный диурез (при СНСАДГ отсутствует) и выведение осмолитов клетками мозга.'],
['Терапевтическая мишень','Ограничение воды; при тяжёлой симптоматике 3% NaCl. Na⁺ не поднимают быстрее 8–10 ммоль/л в сутки, иначе развивается осмотическая демиелинизация.']
]},

'hyper-hyper':{
title:'Гиперосмолярная гипергидратация',name:'Гиперосмолярная',vals:'Na⁺ > 145 · солевое отравление',
lead:'Na⁺ накапливается больше, чем вода. Вода выходит из клеток: снаружи гиперволемия и отёки, внутри обезвоживание клеток.',
nodes:[
{id:'e1',c:0,r:0,dir:'metab',type:'etio',t:'Питьё морской воды',term:'питьё морской воды',s:[
'При отсутствии пресной воды человек пьёт морскую.',
'Na⁺ в морской воде около 470 ммоль/л; почки не могут концентрировать Na⁺ в моче до такого уровня.',
'На выведение выпитой соли тратится больше воды, чем было выпито, — гипернатриемия нарастает.',
'Сильная жажда, тошнота, диарея.',
'Дать пресную воду; морскую воду пить нельзя.',
'Солевое отравление морской водой']},
{id:'e2',c:2,r:0,dir:'hemo',type:'etio',t:'Инфузия гипертонических растворов: NaCl, NaHCO₃',term:'инфузия гипертонических растворов',s:[
'В вену вводятся растворы с высоким содержанием натрия.',
'3% или 10% NaCl, гидрокарбонат натрия в реанимации, смесь с избытком соли у младенцев.',
'Внеклеточный сектор становится гиперосмолярным за счёт натрия.',
'Жажда, повышение АД, одышка.',
'Рассчитывать дозу натрийсодержащих растворов, контролировать Na⁺.',
'Ятрогенная гипернатриемия']},
{id:'e3',c:4,r:0,dir:'neuro',type:'etio',t:'Избыточная задержка Na⁺: первичный гиперальдостеронизм, синдром Кушинга',term:'избыток минералокортикоидов',s:[
'Почки реабсорбируют Na⁺ в избытке.',
'Первичный гиперальдостеронизм (синдром Конна), синдром Кушинга, избыточный приём минералокортикоидов.',
'Na⁺ задерживается; так как вода задерживается вместе с ним, гипернатриемия обычно лёгкая.',
'Артериальная гипертензия, гипокалиемия, мышечная слабость.',
'Спиронолактон, хирургическое лечение причины.',
'Гиперальдостеронизм']},
{id:'osm',c:2,r:1,dir:'metab',type:'main',t:'Избыток Na⁺: гипернатриемия, рост осмолярности',term:'гиперосмолярность',s:[
'Во внеклеточной жидкости растут Na⁺ и осмолярность.',
'Na⁺ поступает или задерживается больше, чем вода.',
'Вода выходит из клеток во внеклеточный сектор.',
'Na⁺ выше 145 ммоль/л, осмолярность выше 295 мОсм/кг; Ht и белок снижены.',
'Прекратить поступление Na⁺; петлевой диуретик вместе с 5% глюкозой; при почечной недостаточности диализ. Na⁺ не снижать быстрее 10 ммоль/л в сутки.',
'Гиперосмолярная гипергидратация, солевое отравление']},
{id:'thirst',c:0,r:2,dir:'neuro',type:'protect',t:'Осморецепторы: сильная жажда, рост АДГ',term:'осмотическая жажда',s:[
'Осморецепторы гипоталамуса усиливают жажду и секрецию АДГ.',
'Рост осмолярности плазмы.',
'Если пить пресную воду, осмолярность снижается, но питьё и задержка воды ещё больше увеличивают объём.',
'Очень сильная жажда.',
'Пресная вода или 5% глюкоза, в зависимости от объёма вместе с диуретиком.',
'Осмотическая жажда']},
{id:'shift',c:2,r:2,dir:'cell',type:'main',t:'Вода выходит из клеток',term:'перемещение воды из клеток',s:[
'Вода переходит из клеток в гиперосмолярную внеклеточную среду.',
'Осмотический градиент между секторами.',
'Клетки обезвоживаются, а внеклеточный объём растёт ещё больше.',
'Неврологические признаки и признаки гиперволемии наблюдаются вместе.',
'Медленное снижение осмолярности.',
'Внутриклеточная дегидратация при внеклеточной гипергидратации']},
{id:'sea',c:0,r:3,dir:'metab',type:'damage',t:'При отсутствии пресной воды — снова пить морскую',term:'порочный круг жажды',s:[
'Испытывающий жажду человек снова пьёт имеющуюся морскую воду.',
'Жажда не утоляется, так как соль поступает снова.',
'Поступление Na⁺ продолжается, гипернатриемия нарастает — порочный круг.',
'Жажда нарастает, сознание нарушается.',
'Порочный круг можно разорвать только пресной водой.',
'Порочный круг при питье морской воды']},
{id:'cdh',c:4,r:3,dir:'cell',type:'main',t:'Внутриклеточная гипогидратация',term:'клеточная дегидратация',s:[
'Клетки теряют воду и сморщиваются.',
'Гиперосмолярность внеклеточной среды.',
'Нарушаются ферменты и синтез белка; наиболее чувствительны клетки мозга.',
'Несмотря на интерстициальные отёки, слизистые сухие, жажда сильная.',
'Постепенное восполнение воды.',
'Клеточная дегидратация']},
{id:'adh',c:1,r:4,dir:'neuro',type:'protect',t:'Почки задерживают воду',term:'антидиурез',s:[
'Под действием АДГ почки усиленно реабсорбируют воду.',
'Осмолярность плазмы высокая.',
'Осмолярность несколько выравнивается, но внеклеточный объём растёт ещё больше.',
'Олигурия, концентрированная моча.',
'Петлевые диуретики (выводят воду и Na⁺ вместе) и 5% глюкоза.',
'Антидиурез']},
{id:'hv',c:2,r:4,dir:'hemo',type:'main',t:'Резкое увеличение внеклеточного объёма: гиперволемия',term:'гиперволемия',s:[
'Объём циркулирующей крови и интерстициальной жидкости растёт.',
'К поступившей жидкости добавляются вода из клеток и задержанная вода.',
'Растёт венозное давление, сердце перегружается; жидкость выходит в интерстиций.',
'Шейные вены набухшие, масса тела растёт, Ht и белок снижены.',
'Петлевые диуретики, ограничение соли и воды.',
'Гиперволемия']},
{id:'anp',c:3,r:4,dir:'neuro',type:'protect',t:'Натрийуретические пептиды, натрийурез',term:'натрийурез',s:[

<script>
(function(){
const GROUPS=[
 {n:'Отёки',items:[

  {k:'inflam',n:'Воспалительные и токсические'},{k:'neuro',n:'Нейрогенные'},{k:'allergic',n:'Аллергические'}]},
 {n:'Нарушения водно-электролитного обмена',items:[
  {k:'dehyd',n:'Гипогидратация',subs:['dehyd-iso','dehyd-hypo','dehyd-hyper'],cmp:'dehyd'},

const DIRS={

  metab:{name:'Метаболическое',g:'Мб'},

const SEC=['Что происходит','Почему','Результат','Клиника','Терапевтическая мишень','Термин'];
const TOP=44, GAP=48;
let CW=1184;

const nav=document.getElementById('nav');
const canvas=document.getElementById('canvas');

let S,N,E,byId,els={},sel=null,topic=null,cur=null;

(function(){

  h+='<span class="lg-sep"></span>';
  const ln=(c,dash)=>`<svg width="30" height="10" viewBox="0 0 30 10"><line x1="1" y1="5" x2="22" y2="5" style="stroke:var(${c});stroke-width:1.5${dash?';stroke-dasharray:4 3':''}"/><path d="M29 5 L21 1 L21 9 Z" style="fill:var(${c})"/></svg>`;
  h+=`<span class="lg">${ln('--arrow')}Причина–следствие</span>`;

  document.getElementById('legend').innerHTML=h;
})();

nav.innerHTML=GROUPS.map(g=>`<div class="grp"><span class="grp-lb">${esc(g.n)}</span>`+
  g.items.map(t=>`<button type="button" class="topic" data-t="${t.k}" aria-selected="false">${esc(t.n)}</button>`).join('')+`</div>`).join('');
nav.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)go(b.dataset.t)});

function go(t){
  const T=TOPICS[t];
  mount(T.subs?T.subs[0]:t);
}
function topicOf(key){for(const k in TOPICS){const T=TOPICS[k];if(k===key||(T.subs&&T.subs.includes(key)))return k}return null}

function renderTable(T){
  if(!T.cmp){cmpSec.hidden=true;return}
  cmpSec.hidden=false;
  const subs=T.subs, rows=COMPARES[T.cmp];
  let h='<thead><tr><th scope="col">Показатель</th>'+subs.map(k=>`<th scope="col"${k===cur?' class="cur"':''}>${esc(SCHEMES[k].name)}</th>`).join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{h+=`<tr><th scope="row">${esc(r[0])}</th>`+subs.map((k,i)=>`<td${k===cur?' class="cur"':''}>${esc(r[i+1])}</td>`).join('')+'</tr>'});
  cmpEl.innerHTML=h+'</tbody>';
  document.getElementById('cmp-h').textContent='Сравнение трёх форм: '+T.n.toLowerCase();

function pathD(pts,rad){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const p0=pts[i-1],p=pts[i],p1=pts[i+1];
    const li=Math.hypot(p[0]-p0[0],p[1]-p0[1]),lo=Math.hypot(p1[0]-p[0],p1[1]-p[1]);
    if(!li||!lo){d+=` L${p[0]},${p[1]}`;continue}
    const r=Math.min(rad,li/2,lo/2);
    const di=[(p[0]-p0[0])/li,(p[1]-p0[1])/li],dout=[(p1[0]-p[0])/lo,(p1[1]-p[1])/lo];
    d+=` L${p[0]-di[0]*r},${p[1]-di[1]*r} Q${p[0]},${p[1]} ${p[0]+dout[0]*r},${p[1]+dout[1]*r}`;
  }
  const L=pts[pts.length-1];return d+` L${L[0]},${L[1]}`;
}
function draw(){
  if(!N)return;
  const rows=Math.max(...N.map(n=>n.r))+1, rh=new Array(rows).fill(0);
  N.forEach(n=>{rh[n.r]=Math.max(rh[n.r],els[n.id].offsetHeight)});
  const top=[];let y=TOP;
  for(let r=0;r<rows;r++){top[r]=y;y+=(rh[r]||0)+(rh[r]?GAP:12)}
  N.forEach(n=>{els[n.id].style.top=top[n.r]+'px'});
  const H=y-GAP+28; canvas.style.height=H+'px';
  const R={};
  N.forEach(n=>{const el=els[n.id];const l=el.offsetLeft,t=top[n.r],w=el.offsetWidth,h=el.offsetHeight;
    R[n.id]={l,t,w,h,r:l+w,b:t+h,cx:l+w/2,cy:t+h/2}});
  svg.setAttribute('width',CW); svg.setAttribute('height',H); svg.setAttribute('viewBox',`0 0 ${CW} ${H}`);
  let out='';
  E.forEach((e,i)=>{
    const raw=e.p(R); let pts=raw.map(p=>p.slice());
    const a=pts[pts.length-2],z=pts[pts.length-1];
    const len=Math.hypot(z[0]-a[0],z[1]-a[1]);const dx=(z[0]-a[0])/len,dy=(z[1]-a[1])/len;
    let extra='';
    if(e.k==='inh'){
      const bx=z[0]-dx*3,by=z[1]-dy*3; pts[pts.length-1]=[bx,by];
      extra=`<line class="bar" x1="${bx-dy*6}" y1="${by+dx*6}" x2="${bx+dy*6}" y2="${by-dx*6}" stroke-width="2"/>`;
    }else{
      pts[pts.length-1]=[z[0]-dx*8,z[1]-dy*8];
      const bx=z[0]-dx*9,by=z[1]-dy*9;
      extra=`<path class="hd" d="M${z[0]},${z[1]} L${bx-dy*4.5},${by+dx*4.5} L${bx+dy*4.5},${by-dx*4.5} Z"/>`;
    }
    let lab='',best=0,bi=0;
    for(let j=0;j<raw.length-1;j++){const l=Math.hypot(raw[j+1][0]-raw[j][0],raw[j+1][1]-raw[j][1]);if(l>best){best=l;bi=j}}
    if(e.lb&&best>=e.lb.length*7+24){
      const p=raw[bi],q=raw[bi+1];
      lab=Math.abs(p[1]-q[1])<1
        ?`<text class="elabel" x="${(p[0]+q[0])/2}" y="${p[1]-8}" text-anchor="middle">${esc(e.lb)}</text>`
        :`<text class="elabel" x="${p[0]+8}" y="${(p[1]+q[1])/2+4}" text-anchor="start">${esc(e.lb)}</text>`;
    }
    out+=`<g class="edge e-${e.k}" data-i="${i}"><path class="ln" d="${pathD(pts,8)}"/>${extra}${lab}</g>`;
  });
  (S.markers||[]).forEach((m,i)=>{
    const [cx,cy0]=m(R),cy=cy0-10,r=15;
    const a0=-50*Math.PI/180,a1=a0+300*Math.PI/180;
    const sx=cx+r*Math.cos(a0),sy=cy+r*Math.sin(a0),ex=cx+r*Math.cos(a1),ey=cy+r*Math.sin(a1);
    const tx=-Math.sin(a1),ty=Math.cos(a1),hb=[ex-tx*8,ey-ty*8];
    out+=`<g class="loopmark" data-l="${i}"><path class="loop-ic" d="M${sx},${sy} A${r},${r} 0 1 1 ${ex-tx*3},${ey-ty*3}"/>`+
      `<path class="loop-hd" d="M${ex+tx*2},${ey+ty*2} L${hb[0]-ty*4.5},${hb[1]+tx*4.5} L${hb[0]+ty*4.5},${hb[1]-tx*4.5} Z"/>`+
      `<text class="loop-lb" x="${cx}" y="${cy+r+20}" text-anchor="middle">порочный круг</text></g>`;
  });
  svg.innerHTML=out;
  applyFade();
}
function applyFade(){
  const s=sel?byId[sel]:null;
  N.forEach(n=>{
    const el=els[n.id];
    el.setAttribute('aria-pressed',String(n.id===sel));
    el.classList.toggle('faded',!!s&&n.dir!==s.dir&&n.id!==s.id);
  });
  svg.querySelectorAll('.edge').forEach(g=>{
    const e=E[+g.dataset.i];
    const keep=!s||e.f===sel||e.to===sel||(byId[e.f].dir===s.dir&&byId[e.to].dir===s.dir);
    g.classList.toggle('faded',!keep);
  });
  svg.querySelectorAll('.loopmark').forEach(g=>{
    const ids=(S.loops||[])[+g.dataset.l]||[];
    g.classList.toggle('faded',!!s&&!ids.includes(sel));
  });
}
const narrow=()=>window.matchMedia('(max-width:1099px)').matches;
function chip(id,suffix){
  const n=byId[id];
  return `<button type="button" class="chip" data-go="${id}" style="--d:var(--d-${n.dir})">${esc(n.t)}${suffix?' ('+suffix+')':''}</button>`;
}
const kindNote=k=>k==='inh'?'тормозит':k==='cross'?'перекрёстная':'';
function renderPanel(){

    panel.innerHTML=h; return;
  }
  panel.style.setProperty('--pd',`var(--d-${n.dir})`);
  const inc=E.filter(e=>e.to===n.id).map(e=>chip(e.f,kindNote(e.k)));
  const out=E.filter(e=>e.f===n.id).map(e=>chip(e.to,kindNote(e.k)));
  let h=`<div class="p-top"><h2>${esc(n.t)}</h2><button type="button" class="panel-close" data-close>Закрыть</button></div>
    <div class="p-dir"><span class="tag" style="--d:var(--d-${n.dir})">${DIRS[n.dir].g}</span>${DIRS[n.dir].name}</div>
    <div class="p-type"><span class="dot" style="--t:var(${TYPES[n.type].v})"></span>${TYPES[n.type].full}</div>`;
  n.s.forEach((txt,i)=>{
    h+=i===5?`<div class="p-sec"><h3>${SEC[i]}</h3><p class="term-txt">(${esc(txt)})</p></div>`
            :`<div class="p-sec"><h3>${SEC[i]}</h3><p>${esc(txt)}</p></div>`;
  });
  if(inc.length||out.length){
    h+=`<div class="p-sec"><h3>Связи</h3>`;
    if(inc.length) h+=`<div class="chip-lb">Предыдущее звено</div><div class="chips">${inc.join('')}</div>`;
    if(out.length) h+=`<div class="chip-lb">Следующее звено</div><div class="chips">${out.join('')}</div>`;
    h+=`</div>`;
  }
  panel.innerHTML=h; panel.scrollTop=0;
}
function ensureVisible(id){
  const el=els[id];
  let nr=el.getBoundingClientRect(),cr=scroller.getBoundingClientRect();
  if(nr.left<cr.left+16||nr.right>cr.right-16) scroller.scrollLeft+=(nr.left+nr.width/2)-(cr.left+cr.width/2);
  if(narrow()){
    nr=el.getBoundingClientRect();
    const sheetTop=window.innerHeight-panel.offsetHeight;
    if(nr.bottom>sheetTop-12||nr.top<12) window.scrollBy(0,nr.top-72);
  }
}
function select(id){
  sel=id; applyFade(); renderPanel();
  panel.classList.toggle('open',!!id);
  document.body.style.paddingBottom=(id&&narrow())?panel.offsetHeight+'px':'';
  if(id) ensureVisible(id);
}

function mount(key){
  cur=key; topic=topicOf(key); const T=TOPICS[topic];
  S=SCHEMES[key]; N=S.nodes; E=S.edges; byId={}; N.forEach(n=>byId[n.id]=n);
  CW=S.lane?1204:1184; canvas.style.width=CW+'px';
  canvas.querySelectorAll('.node,.branch').forEach(b=>b.remove());
  (S.branches||[]).forEach(b=>canvas.insertAdjacentHTML('beforeend',`<div class="branch" style="left:${20+b.c*236}px">${esc(b.t)}</div>`));
  els={};
  N.forEach(n=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='node'+(n.type==='main'?' main':'');
    b.style.left=(20+n.c*236)+'px';
    b.style.setProperty('--d',`var(--d-${n.dir})`);
    b.setAttribute('aria-pressed','false');
    b.title=DIRS[n.dir].name+' · '+TYPES[n.type].full;
    b.innerHTML=`<span class="meta"><span class="ty"><span class="dot" style="--t:var(${TYPES[n.type].v})"></span>${TYPES[n.type].short}</span><span class="tag">${DIRS[n.dir].g}</span></span><span class="ttl">${esc(n.t)}</span><span class="term">(${esc(n.term)})</span>`;
    b.addEventListener('click',e=>{e.stopPropagation();select(sel===n.id?null:n.id)});
    canvas.appendChild(b); els[n.id]=b;
  });
  nav.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===topic)));
  if(T.subs){
    tabsEl.hidden=false;
    tabsEl.innerHTML=T.subs.map(k=>`<button type="button" class="tab" role="tab" id="tab-${k}" data-k="${k}" aria-selected="${k===key}"><span class="tn">${esc(SCHEMES[k].name)}</span><span class="tv">${esc(SCHEMES[k].vals)}</span></button>`).join('');
  }else{tabsEl.hidden=true;tabsEl.innerHTML=''}
  schEl.textContent=S.title;
  leadEl.textContent=S.lead+' Нажмите на узел, чтобы открыть пояснение. Esc снимает выделение.';
  renderTable(T);
  sel=null; draw(); select(null); scroller.scrollLeft=0;
  try{localStorage.setItem('ru-path-key',key)}catch(_){}
}

panel.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){select(g.dataset.go);els[g.dataset.go].focus({preventScroll:true});return}
  if(e.target.closest('[data-close]')){const prev=sel;select(null);if(prev)els[prev].focus({preventScroll:true})}
});
canvas.addEventListener('click',()=>{if(sel)select(null)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sel)select(null)});
window.addEventListener('resize',()=>{document.body.style.paddingBottom=(sel&&narrow())?panel.offsetHeight+'px':''});

let start='renal';
const h=(location.hash||'').slice(1);
if(SCHEMES[h]) start=h; else if(TOPICS[h]) start=TOPICS[h].subs?TOPICS[h].subs[0]:h;
else{try{const s=localStorage.getItem('ru-path-key');if(SCHEMES[s])start=s}catch(_){}}
mount(start);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
window.addEventListener('load',draw);
})();
</script>
<script>
/* viewer bridge: two-finger pinch is sent to the reader, zoom keeps the point under the fingers in place, theme follows the reader */
(function(){
  if (window.parent === window) return;
  var z = 1, pinch = null, focal = null, lastW = innerWidth, lastH = innerHeight;
  function send(m){ try { parent.postMessage(m, '*'); } catch (e) {} }
  addEventListener('message', function(e){
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.__viewer === 'zoom' && typeof d.z === 'number') z = d.z;
    if (d.__viewer === 'theme') {
      if (d.theme) document.documentElement.setAttribute('data-theme', d.theme);
      else document.documentElement.removeAttribute('data-theme');
    }
  });
  function dist(t){ var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.sqrt(dx*dx + dy*dy); }
  function mid(t){ return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 }; }
  document.addEventListener('touchstart', function(e){
    if (e.touches.length === 2) { pinch = { d: dist(e.touches) * z, z: z }; focal = mid(e.touches); e.preventDefault(); }
  }, { passive: false });
  document.addEventListener('touchmove', function(e){
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    focal = mid(e.touches);
    var d = dist(e.touches) * z;
    if (pinch.d > 0) send({ __viewer: 'pinch', z: pinch.z * d / pinch.d });
  }, { passive: false });
  function end(e){
    if (pinch && e.touches.length < 2) {
      pinch = null; send({ __viewer: 'pinchend' });
      setTimeout(function(){ if (!pinch) focal = null; }, 300);
    }
  }
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', end);
  ['gesturestart', 'gesturechange'].forEach(function(t){ document.addEventListener(t, function(e){ e.preventDefault(); }); });
  /* trackpad pinch / ctrl + wheel on a computer */
  var wt = 0;
  addEventListener('wheel', function(e){
    if (!e.ctrlKey) return;
    e.preventDefault();
    focal = { x: e.clientX, y: e.clientY };
    send({ __viewer: 'pinch', z: z * Math.exp(-e.deltaY * 0.01) });
    clearTimeout(wt);
    wt = setTimeout(function(){ focal = null; send({ __viewer: 'pinchend' }); }, 400);
  }, { passive: false });
  addEventListener('resize', function(){
    var w = innerWidth, h = innerHeight, r = lastW / w, rh = lastH / h;
    var oldW = lastW, oldH = lastH;
    lastW = w; lastH = h;
    /* width and height change by the same factor only when the zoom changed (not on rotation) */
    if (Math.abs(r - 1) < 0.01 || Math.abs(r - rh) > 0.04 * r) return;
    var f = focal || { x: oldW / 2, y: oldH / 2 };
    var dx = f.x - f.x / r, dy = f.y - f.y / r;
    window.scrollBy(0, dy);
    var el = document.elementFromPoint(f.x / r, f.y / r);
    while (el && el !== document.body && el !== document.documentElement) {
      if (el.scrollWidth > el.clientWidth + 1) {
        var ox = getComputedStyle(el).overflowX;
        if (ox === 'auto' || ox === 'scroll') { el.scrollLeft += dx; break; }
      }
      el = el.parentElement;
    }
    if (focal) focal = { x: f.x / r, y: f.y / r };
  });
  send({ __viewer: 'ready' });
})();
</script>
