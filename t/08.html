<style>
/* Layout: title → tabs (7 edema types) → lead → one-line legend → pathogenesis map on a 5-column grid + explanation panel (docked ≥1100px, bottom sheet below) */
:root{
  --bg:#FAFAF7; --node:#FFFFFF; --fg:#2B2B2B; --fg2:#6B6B6B; --line:#D9D9D4; --arrow:#6B6B6B;
  --t-etio:#8C8C8C; --t-main:#3B5BA9; --t-damage:#C8553D; --t-protect:#4E8F6A;
  --t-loop:#C8553D; --t-cross:#9A9A9A; --t-clinic:#B07D2B;
  --d-hemo:#3B7EA1; --d-neuro:#7A5BA6; --d-metab:#C08A2E; --d-immune:#B5536B; --d-cell:#4A8C8C; --d-organ:#6B7B3A;
  --font:"Noto Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1F1C; --node:#2A2B27; --fg:#ECECE8; --fg2:#A9A9A3; --line:#3D3E39; --arrow:#8F908A;
    --t-etio:#989898; --t-main:#4F6BB2; --t-damage:#CE6650; --t-protect:#609A79;
    --t-loop:#CE6650; --t-cross:#A5A5A5; --t-clinic:#B88A40;
    --d-hemo:#4F8BAA; --d-neuro:#876BAF; --d-metab:#C69643; --d-immune:#BC647A; --d-cell:#5C9898; --d-organ:#7A884E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1F1C; --node:#2A2B27; --fg:#ECECE8; --fg2:#A9A9A3; --line:#3D3E39; --arrow:#8F908A;
  --t-etio:#989898; --t-main:#4F6BB2; --t-damage:#CE6650; --t-protect:#609A79;
  --t-loop:#CE6650; --t-cross:#A5A5A5; --t-clinic:#B88A40;
  --d-hemo:#4F8BAA; --d-neuro:#876BAF; --d-metab:#C69643; --d-immune:#BC647A; --d-cell:#5C9898; --d-organ:#7A884E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
.page{max-width:1600px;margin:0 auto;padding-inline:16px;padding-block:24px 40px}
@media (min-width:700px){.page{padding-inline:24px}}
h1{font-size:20px;font-weight:600;margin:0 0 14px;text-wrap:balance}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{font:inherit;font-size:15px;font-weight:500;color:var(--fg2);background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;white-space:nowrap;flex:none;border-radius:10px 10px 0 0}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--t-main)}
.tab:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.tab .n{font-size:13px;color:var(--fg2);margin-right:6px;font-variant-numeric:tabular-nums}
h2.sch{font-size:15px;font-weight:600;margin:0 0 4px}
.lead{font-size:15px;color:var(--fg2);max-width:80ch;margin:0 0 14px;line-height:1.6}

.legend{display:flex;align-items:center;gap:16px;overflow-x:auto;white-space:nowrap;padding-block:10px;margin-bottom:16px;border-block:1px solid var(--line);font-size:13px;color:var(--fg2)}
.lg{display:inline-flex;align-items:center;gap:6px;flex:none}
.lg-sep{width:1px;height:18px;background:var(--line);flex:none}
.tag{display:inline-block;font-size:13px;font-weight:600;line-height:18px;padding:0 5px;border-radius:6px;color:var(--fg);border:1px solid var(--d);background:color-mix(in srgb,var(--d) 8%,transparent);flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--t);flex:none}
.lg svg{flex:none}

.layout{display:block}
@media (min-width:1100px){.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.canvas{position:relative;margin:0 auto}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.branch{position:absolute;top:12px;font-size:15px;font-weight:600;color:var(--fg2)}

.node{position:absolute;top:0;width:200px;background:var(--node);color:var(--fg);border:1.5px solid var(--d);border-radius:10px;padding:9px 12px 10px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.node.main{border-width:2px}
.node[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--d);background:color-mix(in srgb,var(--d) 8%,var(--node))}
.node:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.node .meta{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;font-weight:500;color:var(--fg2);line-height:18px}
.node .ty{display:inline-flex;align-items:center;gap:6px;min-width:0}
.node .ttl{font-size:14px;font-weight:500;line-height:1.4}
.node .term,.term-txt{font-size:13px;font-style:italic;color:var(--fg2);line-height:1.4}
.faded{opacity:.3}

.e-main path.ln{stroke:var(--arrow)} .e-main .hd{fill:var(--arrow)}
.e-loop path.ln{stroke:var(--t-loop)} .e-loop .hd{fill:var(--t-loop)}
.e-cross path.ln{stroke:var(--t-cross);stroke-dasharray:5 4} .e-cross .hd{fill:var(--t-cross)}
.e-inh path.ln,.e-inh .bar{stroke:var(--t-protect)}
path.ln{fill:none;stroke-width:1.5}
.elabel{font-family:var(--font);font-size:13px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.loop-ic{fill:none;stroke:var(--t-loop);stroke-width:1.5}
.loop-hd{fill:var(--t-loop)}
.loop-lb{font-family:var(--font);font-size:13px;font-weight:500;fill:var(--t-loop);paint-order:stroke;stroke:var(--bg);stroke-width:5px}

.panel{--pd:var(--t-main);position:relative;background:var(--node);border:1px solid var(--line);border-radius:10px;padding:20px 22px 22px 26px;display:none}
.panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pd);border-radius:10px 0 0 10px}
@media (min-width:1100px){
  .panel{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow-y:auto}
  .panel-close{display:none!important}
}
@media (max-width:1099px){
  .panel.open{display:block;position:fixed;left:0;right:0;bottom:0;max-height:60vh;overflow-y:auto;z-index:20;border-radius:10px 10px 0 0;border-bottom:0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .panel.open::before{border-radius:10px 0 0 0}
}
.p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel h3.pt{font-size:20px;font-weight:600;margin:0;line-height:1.35;text-wrap:balance}
.panel-close{font:inherit;font-size:13px;font-weight:600;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:10px;padding:4px 10px;cursor:pointer;flex:none}
.p-dir{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;font-weight:600}
.p-type{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--fg2)}
.p-sec{margin-top:16px}
.p-sec h4{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);margin:0 0 4px}
.p-sec p{font-size:15px;font-weight:400;line-height:1.6;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:inherit;font-size:13px;color:var(--fg);background:var(--node);border:1px solid var(--d);border-radius:10px;padding:3px 9px;cursor:pointer;text-align:left}
.chip:focus-visible,.panel-close:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.chip-lb{font-size:13px;color:var(--fg2);margin-top:8px}
</style>

<div class="page">
  <h1>Патогенез отёков</h1>
  <div class="tabs" id="tabs" role="tablist" aria-label="Виды отёков"></div>
  <h2 class="sch" id="sch"></h2>
  <p class="lead" id="lead"></p>
  <div class="legend" id="legend" aria-label="Условные обозначения"></div>
  <div class="layout">
    <div class="scroller" id="scroller">
      <div class="canvas" id="canvas">
        <svg class="edges" id="edges" aria-hidden="true"></svg>
      </div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>

<script>
const LANE=1182;
const hm=(a,b)=>(Math.max(a.t,b.t)+Math.min(a.b,b.b))/2;
const vm=(a,b)=>(Math.max(a.l,b.l)+Math.min(a.r,b.r))/2;
const D=(a,b)=>{const x=vm(a,b);return [[x,a.b],[x,b.t]]};
const U=(a,b)=>{const x=vm(a,b);return [[x,a.t],[x,b.b]]};
const Rt=(a,b)=>{const y=hm(a,b);return [[a.r,y],[b.l,y]]};
const Lf=(a,b)=>{const y=hm(a,b);return [[a.l,y],[b.r,y]]};
const BT=(s,t,fo)=>{const x=s.l+s.w*fo,y=t.t-24;return [[x,s.b],[x,y],[t.cx,y],[t.cx,t.t]]};
const ST=(s,t,side,fo)=>{const x=side==='l'?s.l:s.r,y=fo==null?s.cy:s.t+s.h*fo;return [[x,y],[t.cx,y],[t.cx,t.t]]};
const BS=(s,t,side)=>[[s.cx,s.b],[s.cx,t.cy],[side==='l'?t.l:t.r,t.cy]];
const BTo=(s,t,tx)=>[[s.cx,s.b],[s.cx,t.t-20],[tx,t.t-20],[tx,t.t]];
const BB=(s,t,x0,Y,tx)=>[[x0,s.b],[x0,Y],[tx,Y],[tx,t.b]];
const SCHEMES=[];
</script>

id:'renal',tab:'Почечные',

lane:true,
branches:[[0,'Нефротический путь'],[4,'Нефритический путь']],
nodes:[

'Иммунные, метаболические или наследственные факторы нарушают структуру подоцитов и гломерулярной базальной мембраны.',
'Фильтр начинает пропускать белок, прежде всего альбумин.',

'Лечение основного заболевания: при болезни минимальных изменений — глюкокортикоиды, при мембранозной нефропатии — ритуксимаб, при диабете — контроль гликемии.',
'Нефротический синдром; syndroma nephroticum']},
{id:'n1',c:0,r:1,dir:'cell',type:'damage',t:'Повреждение клубочкового фильтра',term:'podocytopathia',s:[

'Ослабевает размерный и зарядовый барьер фильтра.',
'Сами по себе изменения симптомов не дают; они видны при электронной микроскопии.',

{id:'n2',c:0,r:2,dir:'organ',type:'main',t:'Массивная протеинурия >3,5 г/сут',term:'proteinuria massiva',s:[

'Организм теряет белок; профильтрованный белок дополнительно повреждает канальцевый эпителий.',

'Массивная протеинурия; proteinuria']},
{id:'n3',c:0,r:3,dir:'metab',type:'main',t:'Гипоальбуминемия',term:'hypoalbuminaemia',s:[

{id:'n9',c:1,r:2,dir:'cell',type:'damage',t:'Плазмин активирует каналы ENaC',term:'overfill',s:[

{id:'k3',c:1,r:4,dir:'metab',type:'clinic',t:'Гиперлипидемия, липидурия',term:'lipiduria',s:[

{id:'n6',c:1,r:7,dir:'hemo',type:'damage',t:'Гиповолемия',term:'underfill',s:[

{id:'S',c:2,r:7,dir:'hemo',type:'main',t:'Выход жидкости из сосудов в интерстиций',term:'transsudatio',s:[
'Фильтрация через стенку капилляра преобладает над реабсорбцией, жидкость накапливается в межклеточном пространстве.',
'Могут меняться все три силы Старлинга: онкотическое давление снижается (нефроз), гидростатическое растёт (нефрит), проницаемость капилляров увеличивается (нефрит).',
'Лимфоотток сначала возрастает и уносит избыток жидкости, но затем становится недостаточным.',
'Отёки становятся видимыми при увеличении внеклеточной жидкости на 2,5–3 л.',
'В зависимости от причины: уменьшить протеинурию, гиперволемию или воспаление.',
'Закон Старлинга; транссудация']},
{id:'c1',c:2,r:9,dir:'organ',type:'main',t:'Почечные отёки',term:'oedema renale',s:[
'Накопление жидкости в интерстиции при заболеваниях почек.',
'Два основных пути: нефротический (снижение онкотического давления и задержка Na⁺) и нефритический (первичная задержка Na⁺, гиперволемия, повышение проницаемости).',
'Отёки начинаются с мест с рыхлой клетчаткой (веки, лицо), затем распространяются по всему телу.',
'Утром отекают лицо и веки; в отличие от сердечных отёков распространяются сверху вниз, кожа бледная, тёплая.',
'Ограничение соли, диуретики, лечение основного заболевания.',
'Почечные отёки; oedema renale']},
{id:'k1',c:0,r:9,dir:'organ',type:'clinic',t:'Признаки нефротических отёков',term:'anasarca',s:[
'Отёки мягкие, бледные, при надавливании остаётся ямка, быстро смещаются при перемене положения тела.',
'Онкотическое давление очень низкое, жидкость свободно перемещается в тканях.',
'Возможны анасарка, асцит, гидроторакс, гидроперикард.',
'Протеинурия >3,5 г/сут, альбумин <30 г/л, гиперлипидемия; артериальное давление чаще нормальное.',
'Ограничение соли, петлевые диуретики; при очень низком альбумине — профилактика тромбозов (антикоагулянты).',
'Нефротические отёки; anasarca']},
{id:'k2',c:3,r:9,dir:'organ',type:'clinic',t:'Признаки нефритических отёков',term:'oedema nephriticum',s:[
'Отёки плотнее, преимущественно на лице и веках, выражены утром; чаще умеренные.',
'Гиперволемия и повышение проницаемости капилляров; онкотическое давление относительно сохранено.',
'Гиперволемия увеличивает нагрузку на сердце.',
'Артериальная гипертензия, гематурия, олигурия, протеинурия <3,5 г/сут. Осложнения: острая левожелудочковая недостаточность, почечная эклампсия.',
'Ограничение соли и жидкости, петлевые диуретики, гипотензивные препараты.',
'Нефритический синдром; oedema nephriticum']},
{id:'e2',c:4,r:0,dir:'immune',type:'etio',t:'Острый гломерулонефрит',term:'glomerulonephritis acuta',s:[
'Чаще начинается через 1–3 недели после инфекции β-гемолитическим стрептококком группы А (ангина, пиодермия).',
'Образуются антитела к стрептококковым антигенам; иммунные комплексы антиген–антитело откладываются в клубочках.',
'В клубочках развивается иммунное воспаление — нефритический синдром.',
'Триада: отёки, артериальная гипертензия, гематурия (моча цвета «мясных помоев»).',
'Санация очага инфекции (пенициллины), постельный режим, ограничение соли и жидкости.',
'Острый постстрептококковый гломерулонефрит; glomerulonephritis acuta']},
{id:'m1',c:4,r:1,dir:'immune',type:'main',t:'Отложение иммунных комплексов в клубочках',term:'complexus immuni, C3',s:[
'Комплексы антиген–антитело откладываются под базальной мембраной (субэпителиальные «горбы») и в мезангии.',
'Комплемент активируется по классическому и альтернативному пути, C3 потребляется.',
'C5a привлекает нейтрофилы и макрофаги; мембраноатакующий комплекс (C5b–9) повреждает клетки. Системное воспаление повышает проницаемость капилляров.',
'В крови снижен C3, повышен титр АСЛ-О.',
'При постстрептококковой форме — симптоматическое лечение; при быстропрогрессирующих формах — глюкокортикоиды, циклофосфамид, плазмаферез.',
'Иммунные комплексы, активация комплемента']},
{id:'m2',c:4,r:2,dir:'immune',type:'damage',t:'Воспаление и пролиферация в клубочках',term:'glomerulitis proliferativa',s:[
'Пролиферируют клетки эндотелия и мезангия, нейтрофилы проникают в капилляры клубочка.',
'Действие цитокинов (ИЛ-1, ФНО-α), факторов роста и продуктов комплемента.',
'Просвет капилляров клубочка сужается, фильтрующая поверхность уменьшается.',
'Гематурия, эритроцитарные цилиндры, умеренная протеинурия.',
'При тяжёлых формах — противовоспалительная иммуносупрессия.',
'Эндокапиллярный пролиферативный гломерулонефрит']},
{id:'m3',c:4,r:3,dir:'organ',type:'main',t:'Снижение скорости клубочковой фильтрации',term:'filtratio glomerularis ↓',s:[
'Скорость клубочковой фильтрации (СКФ) снижается, фильтруется меньше Na⁺.',
'Капилляры сужаются, фильтрующая поверхность уменьшается, а канальцы продолжают реабсорбировать Na⁺ и воду — нарушается клубочково-канальцевый баланс.',
'Первичная (РААС-независимая) задержка Na⁺ и воды.',
'Олигурия, повышение креатинина и мочевины.',
'Петлевые диуретики, ограничение жидкости; при тяжёлой олигурии — диализ.',
'Скорость клубочковой фильтрации, гломерулотубулярный дисбаланс']},
{id:'m5',c:3,r:6,dir:'hemo',type:'damage',t:'Гиперволемия',term:'overfill',s:[
'Объём циркулирующей крови увеличивается.',
'Задержанные почками Na⁺ и вода остаются в сосудистом русле, так как онкотическое давление относительно нормальное.',
'Растут гидростатическое давление в капиллярах и преднагрузка сердца; ренин подавлен.',
'Артериальная гипертензия, набухание шейных вен, застой в лёгких.',
'Петлевые диуретики, ограничение соли и жидкости.',
'Гиперволемия; hypervolaemia']},
{id:'m8',c:4,r:6,dir:'neuro',type:'protect',t:'Выделение натрийуретического пептида',term:'ANP',s:[
'Растянутые предсердия выделяют натрийуретический пептид.',
'Гиперволемия растягивает стенки предсердий.',
'Усиливает выведение Na⁺ и воды, подавляет ренин и альдостерон; но повреждённая почка отвечает на него слабо, поэтому компенсация недостаточна.',
'В крови повышены натрийуретические пептиды.',
'Это собственная защитная система организма; основное лечение направлено на непосредственное уменьшение задержки Na⁺.',
'Предсердный натрийуретический пептид; ANP']},
{id:'m6',c:3,r:7,dir:'hemo',type:'damage',t:'Повышение гидростатического давления в капиллярах',term:'pressio hydrostatica',s:[
'Давление в артериальном и венозном отделах капилляра повышается.',
'Увеличение объёма жидкости в сосудистом русле.',
'Усиливается фильтрация жидкости в интерстиций.',
'Наряду с отёками — риск острой левожелудочковой недостаточности (одышка, отёк лёгких).',
'Диуретики, вазодилататоры.',
'Гидростатическое давление; pressio hydrostatica']},
{id:'m7',c:3,r:8,dir:'immune',type:'damage',t:'Повышение проницаемости капилляров',term:'permeabilitas vasorum',s:[
'Стенки капилляров всего организма сильнее пропускают воду и белок.',
'Системное иммунное воспаление; стрептококковая гиалуронидаза разрушает основное вещество и базальную мембрану; действие гистамина, брадикинина.',
'Жидкость и небольшое количество белка выходят в интерстиций.',
'Отёки развиваются даже при небольшой протеинурии.',
'Лечение основного заболевания, санация очага инфекции.',
'Повышение сосудистой проницаемости, гиалуронидаза']}
],

['Нефротический путь','С мочой теряется белок, снижаются альбумин и онкотическое давление. Жидкость уходит в интерстиций, гиповолемия активирует РААС и АДГ. Задержанные Na⁺ и вода снова покидают сосуды — формируется порочный круг. Плазмин через ENaC задерживает Na⁺ и напрямую.'],

['Клиника','Нефротические отёки мягкие, бледные, вплоть до анасарки. Нефритические плотнее, на лице, сочетаются с гипертензией и гематурией.']
]

{id:'b2',c:3,r:3,dir:'neuro',type:'protect',t:'Активация РААС, АДГ, симпатической системы',term:'hyperaldosteronismus secundarius',s:[

{id:'b3',c:3,r:4,dir:'metab',type:'main',t:'Задержка Na⁺ и воды',term:'retentio natrii',s:[

{id:'k3',c:4,r:7,dir:'organ',type:'clinic',t:'При слабости левого желудочка — отёк лёгких',term:'oedema pulmonum',s:[

<script>
(function(){
const DIRS={
  hemo:{name:'Гемодинамическое',g:'Гд'},
  neuro:{name:'Нейрогуморальное',g:'Нг'},
  metab:{name:'Метаболическое',g:'Мб'},
  immune:{name:'Иммунно-воспалительное',g:'Ив'},
  cell:{name:'Клеточно-молекулярное',g:'Км'},
  organ:{name:'Органные поражения',g:'Ор'}
};
const TYPES={
  etio:{short:'Этиология',full:'Этиология',v:'--t-etio'},
  main:{short:'Главное звено',full:'Главное звено',v:'--t-main'},
  damage:{short:'Повреждающее',full:'Повреждающее звено',v:'--t-damage'},
  protect:{short:'Компенсаторное',full:'Защитное / компенсаторное звено',v:'--t-protect'},
  clinic:{short:'Клиника',full:'Клинический признак',v:'--t-clinic'}
};
const SEC=['Что происходит','Почему','Результат','Клиника','Точка терапии','Термин'];
const TOP=44, GAP=48;

const tabsEl=document.getElementById('tabs');
const canvas=document.getElementById('canvas');
const svg=document.getElementById('edges');
const panel=document.getElementById('panel');
const scroller=document.getElementById('scroller');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

(function(){
  let h='';
  for(const k in DIRS) h+=`<span class="lg"><span class="tag" style="--d:var(--d-${k})">${DIRS[k].g}</span>${DIRS[k].name}</span>`;
  h+='<span class="lg-sep"></span>';
  const tl={etio:'Этиология',main:'Главное звено',damage:'Повреждающее звено',protect:'Защитное / компенсаторное',clinic:'Клинический признак'};
  for(const k in tl) h+=`<span class="lg"><span class="dot" style="--t:var(${TYPES[k].v})"></span>${tl[k]}</span>`;
  h+='<span class="lg-sep"></span>';
  const ln=(c,dash)=>`<svg width="30" height="10" viewBox="0 0 30 10"><line x1="1" y1="5" x2="22" y2="5" style="stroke:var(${c});stroke-width:1.5${dash?';stroke-dasharray:4 3':''}"/><path d="M29 5 L21 1 L21 9 Z" style="fill:var(${c})"/></svg>`;
  h+=`<span class="lg">${ln('--arrow')}Причина — следствие</span>`;
  h+=`<span class="lg">${ln('--t-loop')}Порочный круг</span>`;
  h+=`<span class="lg">${ln('--t-cross',1)}Перекрёстная связь</span>`;
  h+=`<span class="lg"><svg width="30" height="12" viewBox="0 0 30 12"><line x1="1" y1="6" x2="27" y2="6" style="stroke:var(--t-protect);stroke-width:1.5"/><line x1="27" y1="1" x2="27" y2="11" style="stroke:var(--t-protect);stroke-width:2"/></svg>Торможение</span>`;
  document.getElementById('legend').innerHTML=h;
})();

tabsEl.innerHTML=SCHEMES.map((s,i)=>`<button type="button" class="tab" role="tab" id="tab-${s.id}" data-id="${s.id}" aria-selected="false"><span class="n">${i+1}</span>${esc(s.tab)}</button>`).join('');
tabsEl.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)show(b.dataset.id,true)});
tabsEl.addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  const i=SCHEMES.findIndex(s=>s.id===cur.id), j=(i+(e.key==='ArrowRight'?1:-1)+SCHEMES.length)%SCHEMES.length;
  show(SCHEMES[j].id,true); document.getElementById('tab-'+SCHEMES[j].id).focus();
});

let cur=null, N=[], E=[], byId={}, els={}, sel=null;

function show(id,user){
  const S=SCHEMES.find(s=>s.id===id)||SCHEMES[0];
  cur=S; N=S.nodes; E=S.edges; byId={}; N.forEach(n=>byId[n.id]=n); sel=null;
  tabsEl.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.id===S.id)));
  document.getElementById('sch').textContent=S.title;
  document.getElementById('lead').textContent=S.lead+' Нажмите на узел — откроется пояснение. Esc снимает выделение.';
  canvas.querySelectorAll('.node,.branch').forEach(x=>x.remove());
  svg.innerHTML='';
  const CW=S.lane?1204:1184; canvas.style.width=CW+'px';
  (S.branches||[]).forEach(([c,t])=>canvas.insertAdjacentHTML('beforeend',`<div class="branch" style="left:${20+c*236}px">${esc(t)}</div>`));
  els={};
  N.forEach(n=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='node'+(n.type==='main'?' main':'');
    b.style.left=(20+n.c*236)+'px';
    b.style.setProperty('--d',`var(--d-${n.dir})`);
    b.setAttribute('aria-pressed','false');
    b.title=DIRS[n.dir].name+' · '+TYPES[n.type].full;
    b.innerHTML=`<span class="meta"><span class="ty"><span class="dot" style="--t:var(${TYPES[n.type].v})"></span>${TYPES[n.type].short}</span><span class="tag">${DIRS[n.dir].g}</span></span><span class="ttl">${esc(n.t)}</span><span class="term">(${esc(n.term)})</span>`;
    b.addEventListener('click',e=>{e.stopPropagation();select(sel===n.id?null:n.id)});
    canvas.appendChild(b); els[n.id]=b;
  });
  draw(); select(null); scroller.scrollLeft=0;
  if(user){try{history.replaceState(null,'','#'+S.id)}catch(_){}}

function pathD(pts,rad){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const p0=pts[i-1],p=pts[i],p1=pts[i+1];
    const li=Math.hypot(p[0]-p0[0],p[1]-p0[1]),lo=Math.hypot(p1[0]-p[0],p1[1]-p[1]);
    if(!li||!lo){d+=` L${p[0]},${p[1]}`;continue}
    const r=Math.min(rad,li/2,lo/2);
    const di=[(p[0]-p0[0])/li,(p[1]-p0[1])/li],dout=[(p1[0]-p[0])/lo,(p1[1]-p[1])/lo];
    d+=` L${p[0]-di[0]*r},${p[1]-di[1]*r} Q${p[0]},${p[1]} ${p[0]+dout[0]*r},${p[1]+dout[1]*r}`;
  }
  const L=pts[pts.length-1];return d+` L${L[0]},${L[1]}`;
}
function draw(){
  if(!cur) return;
  const S=cur, CW=S.lane?1204:1184;
  const rows=Math.max(...N.map(n=>n.r))+1, rh=new Array(rows).fill(0);
  N.forEach(n=>{rh[n.r]=Math.max(rh[n.r],els[n.id].offsetHeight)});
  const top=[];let y=TOP;
  for(let r=0;r<rows;r++){top[r]=y;y+=(rh[r]||44)+GAP}
  N.forEach(n=>{els[n.id].style.top=top[n.r]+'px'});
  const H=y-GAP+28; canvas.style.height=H+'px';
  const R={};
  N.forEach(n=>{const el=els[n.id];const l=el.offsetLeft,t=top[n.r],w=el.offsetWidth,h=el.offsetHeight;
    R[n.id]={l,t,w,h,r:l+w,b:t+h,cx:l+w/2,cy:t+h/2}});
  svg.setAttribute('width',CW); svg.setAttribute('height',H); svg.setAttribute('viewBox',`0 0 ${CW} ${H}`);
  let out='';
  E.forEach((e,i)=>{
    const raw=e.p(R); let pts=raw.map(p=>p.slice());
    const a=pts[pts.length-2],z=pts[pts.length-1];
    const len=Math.hypot(z[0]-a[0],z[1]-a[1]);const dx=(z[0]-a[0])/len,dy=(z[1]-a[1])/len;
    let extra='';
    if(e.k==='inh'){
      const bx=z[0]-dx*3,by=z[1]-dy*3; pts[pts.length-1]=[bx,by];
      extra=`<line class="bar" x1="${bx-dy*6}" y1="${by+dx*6}" x2="${bx+dy*6}" y2="${by-dx*6}" stroke-width="2"/>`;
    }else{
      pts[pts.length-1]=[z[0]-dx*8,z[1]-dy*8];
      const bx=z[0]-dx*9,by=z[1]-dy*9;
      extra=`<path class="hd" d="M${z[0]},${z[1]} L${bx-dy*4.5},${by+dx*4.5} L${bx+dy*4.5},${by-dx*4.5} Z"/>`;
    }
    let lab='';
    let best=0,bi=0;
    for(let j=0;j<raw.length-1;j++){const l=Math.hypot(raw[j+1][0]-raw[j][0],raw[j+1][1]-raw[j][1]);if(l>best){best=l;bi=j}}
    if(e.lb&&best>=e.lb.length*8+24){
      const p=raw[bi],q=raw[bi+1];
      lab=Math.abs(p[1]-q[1])<1
        ?`<text class="elabel" x="${(p[0]+q[0])/2}" y="${p[1]-8}" text-anchor="middle">${esc(e.lb)}</text>`
        :`<text class="elabel" x="${p[0]+8}" y="${(p[1]+q[1])/2+4}" text-anchor="start">${esc(e.lb)}</text>`;
    }
    out+=`<g class="edge e-${e.k}" data-i="${i}"><path class="ln" d="${pathD(pts,8)}"/>${extra}${lab}</g>`;
  });
  (S.markers||[]).forEach((m,i)=>{
    const [cx,cy0]=m(R),cy=cy0-10,r=15;
    const a0=-50*Math.PI/180,a1=a0+300*Math.PI/180;
    const sx=cx+r*Math.cos(a0),sy=cy+r*Math.sin(a0),ex=cx+r*Math.cos(a1),ey=cy+r*Math.sin(a1);
    const tx=-Math.sin(a1),ty=Math.cos(a1),hb=[ex-tx*8,ey-ty*8];
    out+=`<g class="loopmark" data-l="${i}"><path class="loop-ic" d="M${sx},${sy} A${r},${r} 0 1 1 ${ex-tx*3},${ey-ty*3}"/>`+
      `<path class="loop-hd" d="M${ex+tx*2},${ey+ty*2} L${hb[0]-ty*4.5},${hb[1]+tx*4.5} L${hb[0]+ty*4.5},${hb[1]-tx*4.5} Z"/>`+
      `<text class="loop-lb" x="${cx}" y="${cy+r+20}" text-anchor="middle">порочный круг</text></g>`;
  });
  svg.innerHTML=out;
  applyFade();
}

function applyFade(){
  const s=sel?byId[sel]:null;
  N.forEach(n=>{
    const el=els[n.id];
    el.setAttribute('aria-pressed',String(n.id===sel));
    el.classList.toggle('faded',!!s&&n.dir!==s.dir&&n.id!==s.id);
  });
  svg.querySelectorAll('.edge').forEach(g=>{
    const e=E[+g.dataset.i];
    const keep=!s||e.f===sel||e.to===sel||(byId[e.f].dir===s.dir&&byId[e.to].dir===s.dir);
    g.classList.toggle('faded',!keep);
  });
  svg.querySelectorAll('.loopmark').forEach(g=>{
    const ids=(cur.loops||[])[+g.dataset.l]||[];
    g.classList.toggle('faded',!!s&&!ids.includes(sel));
  });
}
const narrow=()=>window.matchMedia('(max-width:1099px)').matches;
function chip(id,suffix){
  const n=byId[id];
  return `<button type="button" class="chip" data-go="${id}" style="--d:var(--d-${n.dir})">${esc(n.t)}${suffix?' ('+suffix+')':''}</button>`;
}
const kindNote=k=>k==='inh'?'тормозит':k==='cross'?'перекрёстная':'';
function renderPanel(){
  const n=sel?byId[sel]:null;
  if(!n){
    panel.style.setProperty('--pd','var(--t-main)');
    let h=`<div class="p-top"><h3 class="pt">Общий обзор</h3><button type="button" class="panel-close" data-close>Закрыть</button></div>`;
    cur.overview.forEach(([hd,p])=>{h+=`<div class="p-sec"><h4>${esc(hd)}</h4><p>${esc(p)}</p></div>`});
    h+=`<div class="p-sec"><h4>Как читать схему</h4><p>Нажмите на узел: выбранное направление остаётся, остальные бледнеют. Клик по пустому месту или Esc снимает выделение. Вкладки сверху переключают виды отёков.</p></div>`;
    panel.innerHTML=h; return;
  }
  panel.style.setProperty('--pd',`var(--d-${n.dir})`);
  const inc=E.filter(e=>e.to===n.id).map(e=>chip(e.f,kindNote(e.k)));
  const out=E.filter(e=>e.f===n.id).map(e=>chip(e.to,kindNote(e.k)));
  let h=`<div class="p-top"><h3 class="pt">${esc(n.t)}</h3><button type="button" class="panel-close" data-close>Закрыть</button></div>
    <div class="p-dir"><span class="tag" style="--d:var(--d-${n.dir})">${DIRS[n.dir].g}</span>${DIRS[n.dir].name}</div>
    <div class="p-type"><span class="dot" style="--t:var(${TYPES[n.type].v})"></span>${TYPES[n.type].full}</div>`;
  n.s.forEach((txt,i)=>{
    h+=i===5?`<div class="p-sec"><h4>${SEC[i]}</h4><p class="term-txt">(${esc(txt)})</p></div>`
            :`<div class="p-sec"><h4>${SEC[i]}</h4><p>${esc(txt)}</p></div>`;
  });
  if(inc.length||out.length){
    h+=`<div class="p-sec"><h4>Связи</h4>`;
    if(inc.length) h+=`<div class="chip-lb">Предыдущее звено</div><div class="chips">${inc.join('')}</div>`;
    if(out.length) h+=`<div class="chip-lb">Следующее звено</div><div class="chips">${out.join('')}</div>`;
    h+=`</div>`;
  }
  panel.innerHTML=h; panel.scrollTop=0;
}
function ensureVisible(id){
  const el=els[id];
  let nr=el.getBoundingClientRect(),cr=scroller.getBoundingClientRect();
  if(nr.left<cr.left+16||nr.right>cr.right-16) scroller.scrollLeft+=(nr.left+nr.width/2)-(cr.left+cr.width/2);
  if(narrow()){
    nr=el.getBoundingClientRect();
    const sheetTop=window.innerHeight-panel.offsetHeight;
    if(nr.bottom>sheetTop-12||nr.top<12) window.scrollBy(0,nr.top-72);
  }
}
function select(id){
  sel=id; applyFade(); renderPanel();
  panel.classList.toggle('open',!!id);
  document.body.style.paddingBottom=(id&&narrow())?panel.offsetHeight+'px':'';
  if(id) ensureVisible(id);
}
panel.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){select(g.dataset.go);els[g.dataset.go].focus({preventScroll:true});return}
  if(e.target.closest('[data-close]')){const prev=sel;select(null);if(prev)els[prev].focus({preventScroll:true})}
});
canvas.addEventListener('click',()=>{if(sel)select(null)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sel)select(null)});
window.addEventListener('resize',()=>{document.body.style.paddingBottom=(sel&&narrow())?panel.offsetHeight+'px':''});

const start=(location.hash||'').slice(1);
show(SCHEMES.some(s=>s.id===start)?start:SCHEMES[0].id,false);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
window.addEventListener('load',draw);
})();
</script>
<script>
/* viewer bridge: two-finger pinch is sent to the reader, zoom keeps the point under the fingers in place, theme follows the reader */
(function(){
  if (window.parent === window) return;
  var z = 1, pinch = null, focal = null, lastW = innerWidth, lastH = innerHeight;
  function send(m){ try { parent.postMessage(m, '*'); } catch (e) {} }
  addEventListener('message', function(e){
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.__viewer === 'zoom' && typeof d.z === 'number') z = d.z;
    if (d.__viewer === 'theme') {
      if (d.theme) document.documentElement.setAttribute('data-theme', d.theme);
      else document.documentElement.removeAttribute('data-theme');
    }
  });
  function dist(t){ var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.sqrt(dx*dx + dy*dy); }
  function mid(t){ return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 }; }
  document.addEventListener('touchstart', function(e){
    if (e.touches.length === 2) { pinch = { d: dist(e.touches) * z, z: z }; focal = mid(e.touches); e.preventDefault(); }
  }, { passive: false });
  document.addEventListener('touchmove', function(e){
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    focal = mid(e.touches);
    var d = dist(e.touches) * z;
    if (pinch.d > 0) send({ __viewer: 'pinch', z: pinch.z * d / pinch.d });
  }, { passive: false });
  function end(e){
    if (pinch && e.touches.length < 2) {
      pinch = null; send({ __viewer: 'pinchend' });
      setTimeout(function(){ if (!pinch) focal = null; }, 300);
    }
  }
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', end);
  ['gesturestart', 'gesturechange'].forEach(function(t){ document.addEventListener(t, function(e){ e.preventDefault(); }); });
  /* trackpad pinch / ctrl + wheel on a computer */
  var wt = 0;
  addEventListener('wheel', function(e){
    if (!e.ctrlKey) return;
    e.preventDefault();
    focal = { x: e.clientX, y: e.clientY };
    send({ __viewer: 'pinch', z: z * Math.exp(-e.deltaY * 0.01) });
    clearTimeout(wt);
    wt = setTimeout(function(){ focal = null; send({ __viewer: 'pinchend' }); }, 400);
  }, { passive: false });
  addEventListener('resize', function(){
    var w = innerWidth, h = innerHeight, r = lastW / w, rh = lastH / h;
    var oldW = lastW, oldH = lastH;
    lastW = w; lastH = h;
    /* width and height change by the same factor only when the zoom changed (not on rotation) */
    if (Math.abs(r - 1) < 0.01 || Math.abs(r - rh) > 0.04 * r) return;
    var f = focal || { x: oldW / 2, y: oldH / 2 };
    var dx = f.x - f.x / r, dy = f.y - f.y / r;
    window.scrollBy(0, dy);
    var el = document.elementFromPoint(f.x / r, f.y / r);
    while (el && el !== document.body && el !== document.documentElement) {
      if (el.scrollWidth > el.clientWidth + 1) {
        var ox = getComputedStyle(el).overflowX;
        if (ox === 'auto' || ox === 'scroll') { el.scrollLeft += dx; break; }
      }
      el = el.parentElement;
    }
    if (focal) focal = { x: f.x / r, y: f.y / r };
  });
  send({ __viewer: 'ready' });
})();
</script>
