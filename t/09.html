<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Гипогидратация патогенезі</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: title → type tabs → one-line legend → pathogenesis map on a 5-column grid + explanation panel (docked ≥1100px, bottom sheet below) → comparison table */
:root{
  --bg:#FAFAF7; --node:#FFFFFF; --fg:#2B2B2B; --fg2:#6B6B6B; --line:#D9D9D4; --arrow:#6B6B6B;
  --t-etio:#8C8C8C; --t-main:#3B5BA9; --t-damage:#C8553D; --t-protect:#4E8F6A;
  --t-loop:#C8553D; --t-cross:#9A9A9A; --t-clinic:#B07D2B;
  --d-hemo:#3B7EA1; --d-neuro:#7A5BA6; --d-metab:#C08A2E; --d-immune:#B5536B; --d-cell:#4A8C8C; --d-organ:#6B7B3A;
  --font:"Noto Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1F1C; --node:#2A2B27; --fg:#ECECE8; --fg2:#A9A9A3; --line:#3D3E39; --arrow:#8F908A;
    --t-etio:#989898; --t-main:#4F6BB2; --t-damage:#CE6650; --t-protect:#609A79;
    --t-loop:#CE6650; --t-cross:#A5A5A5; --t-clinic:#B88A40;
    --d-hemo:#4F8BAA; --d-neuro:#876BAF; --d-metab:#C69643; --d-immune:#BC647A; --d-cell:#5C9898; --d-organ:#7A884E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1F1C; --node:#2A2B27; --fg:#ECECE8; --fg2:#A9A9A3; --line:#3D3E39; --arrow:#8F908A;
  --t-etio:#989898; --t-main:#4F6BB2; --t-damage:#CE6650; --t-protect:#609A79;
  --t-loop:#CE6650; --t-cross:#A5A5A5; --t-clinic:#B88A40;
  --d-hemo:#4F8BAA; --d-neuro:#876BAF; --d-metab:#C69643; --d-immune:#BC647A; --d-cell:#5C9898; --d-organ:#7A884E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
.page{max-width:1600px;margin:0 auto;padding-inline:16px;padding-block:24px 40px}
@media (min-width:700px){.page{padding-inline:24px}}
h1{font-size:20px;font-weight:600;margin:0 0 12px;text-wrap:balance}
.lead{font-size:15px;color:var(--fg2);max-width:76ch;margin:0 0 14px;line-height:1.6}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tab{font:inherit;text-align:left;cursor:pointer;background:var(--node);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tab .tn{font-size:15px;font-weight:500;line-height:1.35}
.tab .tv{font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{border:1.5px solid var(--t-main);background:color-mix(in srgb,var(--t-main) 8%,var(--node))}
.tab[aria-selected="true"] .tn{font-weight:600}
.tab:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.legend{display:flex;align-items:center;gap:16px;overflow-x:auto;white-space:nowrap;padding-block:10px;margin-bottom:16px;border-block:1px solid var(--line);font-size:13px;color:var(--fg2)}
.lg{display:inline-flex;align-items:center;gap:6px;flex:none}
.lg-sep{width:1px;height:18px;background:var(--line);flex:none}
.tag{display:inline-block;font-size:13px;font-weight:600;line-height:18px;padding:0 5px;border-radius:6px;color:var(--fg);border:1px solid var(--d);background:color-mix(in srgb,var(--d) 8%,transparent);flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--t);flex:none}
.lg svg{flex:none}

.layout{display:block}
@media (min-width:1100px){.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.canvas{position:relative;margin:0 auto}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

.node{position:absolute;top:0;width:200px;background:var(--node);color:var(--fg);border:1.5px solid var(--d);border-radius:10px;padding:9px 12px 10px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.node.main{border-width:2px}
.node[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--d);background:color-mix(in srgb,var(--d) 8%,var(--node))}
.node:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.node .meta{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;font-weight:500;color:var(--fg2);line-height:18px}
.node .ty{display:inline-flex;align-items:center;gap:6px;min-width:0}
.node .ttl{font-size:14px;font-weight:500;line-height:1.4}
.node .term,.term-txt{font-size:13px;font-style:italic;color:var(--fg2);line-height:1.4}
.faded{opacity:.3}

.e-main path.ln{stroke:var(--arrow)} .e-main .hd{fill:var(--arrow)}
.e-loop path.ln{stroke:var(--t-loop)} .e-loop .hd{fill:var(--t-loop)}
.e-cross path.ln{stroke:var(--t-cross);stroke-dasharray:5 4} .e-cross .hd{fill:var(--t-cross)}
.e-inh path.ln,.e-inh .bar{stroke:var(--t-protect)}
path.ln{fill:none;stroke-width:1.5}
.elabel{font-family:var(--font);font-size:13px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.loop-ic{fill:none;stroke:var(--t-loop);stroke-width:1.5}
.loop-hd{fill:var(--t-loop)}
.loop-lb{font-family:var(--font);font-size:13px;font-weight:500;fill:var(--t-loop);paint-order:stroke;stroke:var(--bg);stroke-width:5px}

.panel{--pd:var(--t-main);position:relative;background:var(--node);border:1px solid var(--line);border-radius:10px;padding:20px 22px 22px 26px;display:none}
.panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pd);border-radius:10px 0 0 10px}
@media (min-width:1100px){
  .panel{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow-y:auto}
  .panel-close{display:none!important}
}
@media (max-width:1099px){
  .panel.open{display:block;position:fixed;left:0;right:0;bottom:0;max-height:60vh;overflow-y:auto;z-index:20;border-radius:10px 10px 0 0;border-bottom:0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .panel.open::before{border-radius:10px 0 0 0}
}
.p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel h2{font-size:20px;font-weight:600;margin:0;line-height:1.35;text-wrap:balance}
.panel-close{font:inherit;font-size:13px;font-weight:600;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:10px;padding:4px 10px;cursor:pointer;flex:none}
.p-dir{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;font-weight:600}
.p-type{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--fg2)}
.p-sec{margin-top:16px}
.p-sec h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);margin:0 0 4px}
.p-sec p{font-size:15px;font-weight:400;line-height:1.6;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:inherit;font-size:13px;color:var(--fg);background:var(--node);border:1px solid var(--d);border-radius:10px;padding:3px 9px;cursor:pointer;text-align:left}
.chip:focus-visible,.panel-close:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.chip-lb{font-size:13px;color:var(--fg2);margin-top:8px}

.cmp{margin-top:28px}
.cmp h2{font-size:15px;font-weight:600;margin:0 0 10px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--node)}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);line-height:1.5}
thead th{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
tbody th{font-weight:600;width:20%}
td{font-weight:400}
.cur{background:color-mix(in srgb,var(--t-main) 8%,transparent)}
thead th.cur{color:var(--fg)}
tbody tr:last-child>*{border-bottom:0}
</style>

  <div class="tabs" id="tabs" role="tablist" aria-label="Гипогидратация түрлері"></div>
  <p class="lead" id="lead"></p>
  <div class="legend" id="legend" aria-label="Шартты белгілер"></div>

  <section class="cmp" aria-labelledby="cmp-h">
    <h2 id="cmp-h">Үш түрді салыстыру</h2>
    <div class="tbl-wrap"><table id="cmp"></table></div>
  </section>
</div>

<script>
/* geometry helpers used by the scheme data */
const hm=(a,b)=>(Math.max(a.t,b.t)+Math.min(a.b,b.b))/2;
const vm=(a,b)=>(Math.max(a.l,b.l)+Math.min(a.r,b.r))/2;
const D=(a,b)=>{const x=vm(a,b);return [[x,a.b],[x,b.t]]};
const Rt=(a,b)=>{const y=hm(a,b);return [[a.r,y],[b.l,y]]};
const Lf=(a,b)=>{const y=hm(a,b);return [[a.l,y],[b.r,y]]};
const BT=(s,t,fo)=>{const x=s.l+s.w*fo,y=t.t-24;return [[x,s.b],[x,y],[t.cx,y],[t.cx,t.t]]};
const ST=(s,t,side,fo)=>{const x=side==='l'?s.l:s.r,y=fo==null?s.cy:s.t+s.h*fo;return [[x,y],[t.cx,y],[t.cx,t.t]]};
const BS=(s,t,side)=>[[s.cx,s.b],[s.cx,t.cy],[side==='l'?t.l:t.r,t.cy]];
const BTo=(s,t,tx)=>[[s.cx,s.b],[s.cx,t.t-20],[tx,t.t-20],[tx,t.t]];
const GX=c=>20+c*236+218; /* vertical corridor between column c and c+1 */
const UPL=(s,t)=>[[s.cx,s.t],[s.cx,t.cy],[t.l,t.cy]];               /* up from s, then right into t's left side */
const RUP=(s,t)=>{const x=GX(3),y=t.t+t.h*.3;return [[s.r,s.cy],[x,s.cy],[x,y],[t.r,y]]}; /* right corridor back up to t */
</script>

{id:'ecf',c:2,r:1,dir:'metab',type:'main',t:'Жасушадан тыс сұйықтық азаяды, осмостылық қалыпты',term:'дефицит внеклеточной жидкости',s:[

'Альдостерон Na⁺-ды, АДГ суды кері сіңіреді; ангиотензин II тамырды тарылтып, шөлдеуді тудырады.',
'Шөлдеу орташа; қанда ренин мен альдостерон жоғары.',
'Себепті жою; көлем толтырылғанда жүйе өзі басылады.',
'Вторичный гиперальдостеронизм']},
{id:'perf',c:2,r:4,dir:'hemo',type:'damage',t:'Шеткі тіндер перфузиясы азаяды',term:'гипоперфузия тканей',s:[
'Тері, бұлшықет, ішек, бүйрек сияқты мүшелерге қан аз келеді.',
'Жүрек лақтырысы азайып, тамырлар тарылады (орталықтану); қоюланған қан микротамырларда баяу ағады.',
'Тіндерге оттегі мен қоректік заттар жетпейді.',
'Тері бозғылт, суық; капиллярлық толу уақыты 2 секундтан ұзақ.',
'Көлемді жылдам толтыру — микроциркуляцияны қалпына келтірудің негізгі жолы.',
'Гипоперфузия, нарушение микроциркуляции']},
{id:'ret',c:4,r:4,dir:'neuro',type:'protect',t:'Бүйрек Na⁺ мен суды ұстайды',term:'антидиуретический ответ почек',s:[
'Бүйрек аз, бірақ концентрацияланған зәр бөледі.',
'Альдостерон мен АДГ әсері; шумақтық сүзілу азаяды.',
'Айналымдағы көлем ішінара сақталады. Ишемия ұзаққа созылса, преренальдық бүйрек жеткіліксіздігі дамиды.',
'Олигурия, зәрдің тығыздығы жоғары, зәрде Na⁺ 20 ммоль/л-ден аз.',
'Диурезді бақылау (сағатына 0,5 мл/кг-нан кем болмауы керек); көлемді толтыру.',
'Олигурия, преренальная азотемия']},
{id:'perm',c:1,r:5,dir:'cell',type:'damage',t:'Тамыр атониясы, қылтамыр өткізгіштігі артады',term:'повышение проницаемости капилляров',s:[
'Микротамырлар кеңейіп, қабырғасы өткізгіш болады; плазма тінаралыққа шығады.',
'Ацидоз бен гипоксия эндотелийді зақымдайды; метаболиттер прекапиллярлық сфинктерлерді босаңсытады, ал посткапиллярлық веналар тарылған күйде қалады.',
'Қан микротамырларда іркіліп, айналымдағы көлем одан әрі азаяды. Тұйық шеңбер шоктың қайтымсыз сатысына әкелуі мүмкін.',
'Гипотензия көлем толтыруға нашар жауап береді.',
'Тұйық шеңберді ерте үзу: көлемді жедел толтыру, ацидоз бен гипоксияны жою.',
'Атония сосудов, плазморрагия']},
{id:'hyp',c:2,r:5,dir:'metab',type:'damage',t:'Тін гипоксиясы, метаболизмдік ацидоз',term:'лактат-ацидоз',s:[
'Жасушалар анаэробтық гликолизге көшіп, сүт қышқылы жиналады.',
'Тіндерге оттегі жеткізілуі азаяды.',
'Ацидоз миокард жиырылуын әлсіретеді, прекапиллярлық сфинктерлердің катехоламиндерге сезімталдығын азайтады.',
'Лактат жоғары, pH төмен, BE теріс; Куссмауль тынысы.',
'Перфузияны қалпына келтіру; бикарбонат тек ауыр ацидозда.',
'Гипоксия тканей, метаболический ацидоз']},
{id:'shock',c:2,r:6,dir:'hemo',type:'damage',t:'Ауыр жағдайда гиповолемиялық шок',term:'гиповолемический шок',s:[
'Компенсаторлық механизмдер жетпей, қанайналым жеткіліксіздігі дамиды.',
'Айналымдағы қан көлемінің 25–30%-дан астамы жоғалғанда тұйық шеңбер компенсациядан күшті болады.',
'Көп мүшелік жеткіліксіздік: бүйрек, бауыр, ішек, ми зақымданады.',
'Шок индексі (ЖСЖ / систолалық АҚ) 1-ден жоғары, анурия, ес бұзылуы.',
'Жедел инфузия, оттегі, себепті жою; қан кетуде қан компоненттері.',
'Гиповолемический шок']},
{id:'k1',c:0,r:7,dir:'metab',type:'clinic',t:'Na⁺ мен осмостылық қалыпты, Ht мен нәруыз жоғары',term:'лабораторная картина',s:[
'Изосмостық гипогидратацияға тән зертханалық көрініс.',
'Плазманың суы мен тұзы бірдей жоғалып, жасушалар мен нәруыз тамырда қалады.',
'Изосмостық түрін гипо- және гиперосмостық түрлерден ажыратады.',
'Na⁺ 135–145 ммоль/л, осмостылық 280–295 мОсм/кг, Ht мен жалпы нәруыз жоғары; мочевина/креатинин арақатынасы артады.',
'Инфузия кезінде Na⁺, Ht және креатининді бақылау.',
'Лабораторная картина изотонической дегидратации']},
{id:'k2',c:2,r:7,dir:'hemo',type:'clinic',t:'Тахикардия, гипотензия, ортостатикалық коллапс',term:'гемодинамические нарушения',s:[
'Гемодинамика бұзылуының белгілері.',
'Гиповолемия және жүрек лақтырысының азаюы.',
'Ауырлығы жоғалған көлемге байланысты.',
'Жатқаннан тұрғанда ЖСЖ минутына 30-дан астам артады немесе АҚ төмендейді; мойын веналары солған.',
'Көлемді толтыру, гемодинамиканы бақылау.',
'Ортостатическая гипотензия']},
{id:'k3',c:4,r:7,dir:'organ',type:'clinic',t:'Олигурия; шөлдеу орташа, шырышты қабық құрғақ',term:'олигурия, умеренная жажда',s:[
'Зәр аз бөлінеді, адам біршама шөлдейді.',
'Бүйрек суды ұстайды. Осмостылық қалыпты болғандықтан, шөлдеу тек көлемдік себеппен (ангиотензин II, барорецепторлар) пайда болады.',
'Шырышты қабық пен тері құрғап, тургор төмендейді.',
'Диурез сағатына 0,5 мл/кг-нан аз, тері қатпары баяу жазылады, тіл құрғақ.',
'Диурезді сағат сайын бақылау.',
'Олигурия, умеренная жажда']}

hypo:{
name:'Гипосмостық',vals:'Na⁺ < 135 · осмостылық төмен',
lead:'Na⁺ судан көп жоғалады. Су жасушаларға ауысып, сыртта гиповолемия, ішінде жасуша ісінуі дамиды.',
nodes:[
{id:'e1',c:1,r:0,dir:'metab',type:'etio',t:'Тұзды сұйықтықты жоғалтып, орнын тұщы сумен толтыру',term:'потеря солей с восполнением водой',s:[
'Құрамында тұз бар сұйықтық жоғалады, ал оның орны тек сумен толтырылады.',
'Қайталанған құсу, іш өту (тырысқақ), қатты терлеу, ішек жыланкөзі; адам тұщы су ішеді немесе тек 5% глюкоза құйылады.',
'Су орнына келеді, Na⁺ қалпына келмейді — жасушадан тыс сұйықтық гипоосмостық болады.',
'Әлсіздік, бас айналу, бұлшықет құрысуы.',
'Жоғалған сұйықтықты тұзды ерітінділермен (регидрон, 0,9% NaCl) толтыру.',
'Гипоосмолярная дегидратация; дефицит солей']},
{id:'e2',c:3,r:0,dir:'neuro',type:'etio',t:'Бүйрек арқылы Na⁺ жоғалту: бүйрекүсті безі жеткіліксіздігі, диуретиктер',term:'почечная потеря натрия',s:[
'Бүйрек Na⁺-ды шамадан тыс шығарады.',
'Альдостерон тапшылығы (Аддисон ауруы), тиазидтік диуретиктер, тұз жоғалтатын нефропатия, церебралдық тұз жоғалту синдромы.',
'Натрийурез суды да бірге шығарады, бірақ Na⁺ жоғалуы басым.',
'Аддисон ауруында терінің қараюы, гипотензия, гиперкалиемия.',
'Себепті емдеу: Аддисон ауруында глюко- және минералокортикоидтар (флудрокортизон); диуретикті тоқтату.',
'Солевое истощение почечного генеза']},
{id:'na',c:2,r:1,dir:'metab',type:'main',t:'Na⁺ судан көп жоғалады: гипонатриемия',term:'гипоосмолярность',s:[
'Жасушадан тыс сұйықтықтың натрийі мен осмостылығы төмендейді.',
'Тұз жоғалуы су жоғалуынан басым.',
'Секторлар арасында осмостық айырма пайда болады: жасуша ішінде осмостылық жоғары болып қалады.',
'Na⁺ 135 ммоль/л-ден төмен, осмостылық 280 мОсм/кг-нан төмен; Ht жоғары.',
'0,9% NaCl; ауыр неврологиялық белгілерде 3% NaCl. Na⁺ тәулігіне 8–10 ммоль/л-ден артық көтерілмеуі керек, әйтпесе осмостық демиелинизация синдромы дамиды.',
'Гипоосмолярная (гипотоническая) дегидратация; hyponatriaemia']},
{id:'shift',c:2,r:2,dir:'cell',type:'main',t:'Су жасушадан тыс кеңістіктен жасушаға ауысады',term:'перемещение воды в клетки',s:[
'Су осмостылығы төмен ортадан (жасушадан тыс) жоғары ортаға (жасуша ішіне) өтеді.',
'Осмос заңы: су осмостық қысымы жоғары жаққа жылжиды.',
'Жасушадан тыс сектор екі жолмен азаяды: сыртқа жоғалту және жасушаға ауысу. Жасушалар ісінеді.',
'Бір мезгілде гиповолемия мен жасуша ісінуінің белгілері байқалады.',
'Жасушадан тыс секторға Na⁺ қайтарса, су жасушадан кері шығады.',
'Внеклеточная дегидратация с внутриклеточной гипергидратацией']},
{id:'adh',c:4,r:2,dir:'neuro',type:'protect',t:'Осмостық АДГ тежеледі, шөлдеу жоқ',term:'подавление осморецепторов',s:[

'Плазма осмостылығы төмен.',
'Бастапқыда артық су шығарылып (су диурезі), осмостылық түзеледі, бірақ көлем одан әрі азаяды. Адам суды аз ішеді.',
'Шөлдеу жоқ, суға жиіркеніш; зәр бастапқыда мол әрі сұйылтылған.',
'Тұщы су ішкізбеу; тұзды ерітінділер беру.',
'Отсутствие жажды, отвращение к воде']},
{id:'adhv',c:0,r:3,dir:'neuro',type:'damage',t:'Гиповолемия АДГ-ны осмостылыққа қарамай шығарады',term:'неосмотическая секреция АДГ',s:[
'Көлем айтарлықтай азайғанда АДГ осмостылық төмен болса да көп бөлінеді.',
'Барорецепторлық сигнал осмостық сигналдан басым: организм үшін көлемді сақтау маңыздырақ.',
'Бүйрек тұщы суды ұстайды, гипонатриемия одан әрі тереңдейді — тұйық шеңбер.',
'Олигурия, гипонатриемияның өсуі.',
'Изотониялық ерітіндімен көлемді толтыру АДГ стимулын жояды; артық су шыққанда Na⁺ тым тез көтерілмеуін бақылау.',
'Неосмотическая (волюм-зависимая) секреция вазопрессина']},
{id:'ecfd',c:1,r:3,dir:'hemo',type:'main',t:'Жасушадан тыс көлем күрт азаяды',term:'выраженная гиповолемия',s:[
'Жасушадан тыс сектор, оның ішінде плазма, басқа түрлерге қарағанда көбірек азаяды.',
'Сыртқа жоғалтуға судың жасушаға ауысуы қосылады.',
'Гиповолемия ерте әрі ауыр; гемодинамика тез бұзылады.',
'Бірдей көлем жоғалғанда гемодинамикалық бұзылыстар гипоосмостық түрде ең ауыр.',

'Коллапс, гемоконцентрация']},
{id:'brain',c:3,r:4,dir:'organ',type:'damage',t:'Ми ісінеді, бассүйек ішілік қысым артады',term:'отёк головного мозга',s:[
'Нейрондар мен глия ісініп, бассүйек ішінде ми көлемі артады.',
'Ми жасушаларына су ауысады; бассүйек кеңеймейтіндіктен қысым артады.',
'Ми қызметі бұзылады; ауыр жағдайда ми бағанасы шүйде тесігіне сыналап қысылады.',
'Бас ауыруы, апатия, жүрек айну, есеңгіреу, құрысу, кома.',
'Ауыр симптомда 3% NaCl, бірақ Na⁺-ды тым тез көтермеу (осмостық демиелинизация).',
'Отёк мозга; oedema cerebri']},
{id:'k1',c:0,r:5,dir:'hemo',type:'clinic',t:'Гипотензия, тахикардия, тургор төмен, көз алмасы жұмсақ',term:'клиника гипоосмолярной дегидратации',s:[
'Жасушадан тыс сектор азаюының айқын белгілері.',
'Тінаралық сұйықтық пен плазма азаяды.',
'Белгілер ерте әрі айқын; бұлшықет құрысуы жиі қосылады.',
'Тері қатпары жазылмайды, көз алмасы жұмсақ; жасушалар ісінгендіктен шырышты қабық ылғалды болуы мүмкін.',
'Гемодинамиканы және Na⁺-ды бақылау.',
'Клиника гипоосмолярной дегидратации']},
{id:'kid',c:1,r:5,dir:'organ',type:'damage',t:'Бүйрек перфузиясы азаяды, азотемия',term:'преренальная азотемия',s:[
'Шумақтық сүзілу азаяды.',
'Бүйрек қанайналымының төмендеуі.',
'Мочевина мен креатинин қанда жиналады; преренальдық бүйрек жеткіліксіздігі дамиды.',
'Олигурия, қанда мочевина мен креатинин жоғары.',
'Көлемді толтыру, диурезді бақылау.',
'Преренальная азотемия']},
{id:'k2',c:2,r:5,dir:'organ',type:'clinic',t:'Бас ауыруы, апатия, бұлшықет құрысуы, есеңгіреу, кома',term:'гипонатриемическая энцефалопатия',s:[
'Ми ісінуінің неврологиялық белгілері.',
'Нейрондар ісініп, қызметі бұзылады.',
'Ауырлығы гипонатриемияның деңгейі мен даму жылдамдығына байланысты.',
'Әдетте Na⁺ 125 ммоль/л-ден төмендегенде айқын; тез дамыса жоғарырақ деңгейде де байқалады.',
'Ауыр симптомда 3% NaCl болюс; Na⁺-ды тәулігіне 8–10 ммоль/л-ден артық көтермеу.',
'Гипонатриемическая энцефалопатия']},
{id:'vom',c:3,r:5,dir:'organ',type:'damage',t:'Жүрек айну, құсу — Na⁺ одан әрі жоғалады',term:'рвота центрального генеза',s:[
'Орталық тектес құсу пайда болады.',
'Бассүйек ішілік қысымның артуы құсу орталығын тітіркендіреді.',
'Құсу арқылы тұз бен су қайта жоғалады; адам тұщы су ішсе, гипонатриемия тереңдейді — тұйық шеңбер.',
'Жеңілдік әкелмейтін құсу, бас ауыруымен бірге.',
'Құсуға қарсы ем, тұзды ерітінділер — тұйық шеңберді үзу.',
'Церебральная рвота']},
{id:'k3',c:4,r:5,dir:'neuro',type:'clinic',t:'Шөлдеу жоқ, суға жиіркеніш',term:'отсутствие жажды',s:[
'Ауыр сусыздануға қарамастан адам шөлдемейді.',
'Осмостық шөлдеу тежелген.',
'Адам суды өзі ішпейді; жағдайы кеш бағалануы мүмкін.',
'Суға жиіркеніш, жүрек айну.',
'Сусындатуды тұзды ерітіндімен жүргізу.',
'Отсутствие жажды']}
],

overview:[

['Басты буын','Гипонатриемия мен осмостылықтың төмендеуі. Ол бір мезгілде гиповолемия мен жасуша ісінуін тудырады.'],
['Тұйық шеңберлер','Көлем жолы: гиповолемия АДГ-ны шығарып, тұщы су ұсталады, гипонатриемия тереңдейді. Ми жолы: ми ісінуі құсу тудырып, Na⁺ қайта жоғалады.'],
['Ерекшелігі','Шөлдеу жоқ, гемодинамика ерте әрі ауыр бұзылады, неврологиялық белгілер айқын.'],
['Емдік нүкте','0,9% NaCl; ауыр симптомда 3% NaCl. Na⁺ тәулігіне 8–10 ммоль/л-ден тез көтерілмейді.']

hyper:{
name:'Гиперосмостық',vals:'Na⁺ > 145 · осмостылық жоғары',
lead:'Су тұзға қарағанда көп жоғалады. Су жасушалардан шығып, жасушалар, әсіресе ми жасушалары, сусызданады.',
nodes:[
{id:'e1',c:0,r:0,dir:'metab',type:'etio',t:'Су ішпеу: есеңгіреу, нәресте, қарт адам, су жоқ жағдай',term:'водное голодание',s:[
'Организмге су жеткіліксіз түседі.',
'Су жоқ жағдай (шөл, апат), жұтынудың бұзылуы, ес бұзылуы; нәрестелер мен қарттар шөлдегенін білдіре алмайды немесе сезбейді.',
'Тері мен тыныс арқылы тәулігіне 800–1000 мл «байқалмайтын» су шығыны жалғаса береді.',
'Қатты шөлдеу, салмақтың азаюы.',
'Су беру; қарттар мен нәрестелердің сусындатуын бақылау.',
'Водное голодание']},
{id:'e2',c:2,r:0,dir:'metab',type:'etio',t:'Гипотониялық сұйықтық жоғалту: терлеу, гипервентиляция, қызба, нәрестедегі іш өту',term:'потеря гипотонической жидкости',s:[
'Тұзға қарағанда су көбірек жоғалады.',
'Тер мен тыныс ауасының ылғалы гипотониялық: ыстықта жұмыс, қызба, гипервентиляция, нәрестелердегі сұйық іш өту.',
'Жасушадан тыс сұйықтықтың осмостылығы артады.',
'Тершеңдік, жиі тыныс, дене қызуының көтерілуі.',
'Сусындату, қызуды түсіру.',
'Потеря гипотонической жидкости']},
{id:'e3',c:4,r:0,dir:'neuro',type:'etio',t:'Бүйрек арқылы су жоғалту: қантсыз диабет, осмостық диурез',term:'почечная потеря воды',s:[
'Бүйрек суды шамадан тыс шығарады.',
'Орталық қантсыз диабет (АДГ тапшылығы), нефрогендік қантсыз диабет (бүйрек АДГ-ны сезбейді), осмостық диурез (қант диабетіндегі глюкозурия, маннитол).',
'Сұйылтылған зәр көп бөлінеді, су тапшылығы тез артады.',
'Полиурия (тәулігіне 3 л-ден көп), полидипсия.',
'Орталық түрінде десмопрессин; қант диабетінде гликемияны түзету.',
'Несахарный диабет, осмотический диурез']},
{id:'osm',c:2,r:1,dir:'metab',type:'main',t:'Су тұздан көп жоғалады: гипернатриемия',term:'гиперосмолярность',s:[
'Жасушадан тыс сұйықтықтың натрийі мен осмостылығы артады.',
'Су жоғалуы тұз жоғалуынан басым.',
'Жасушадан тыс ортаның осмостылығы жоғары болып, су жасушадан шығады.',
'Na⁺ 145 ммоль/л-ден жоғары, осмостылық 295 мОсм/кг-нан жоғары; Ht орташа жоғары.',
'Су тапшылығын ішкізу арқылы, 5% глюкоза немесе 0,45% NaCl-мен толтыру. Na⁺ тәулігіне 10 ммоль/л-ден тез төмендетілмейді.',
'Гиперосмолярная (гипертоническая) дегидратация; hypernatriaemia']},
{id:'shift',c:2,r:2,dir:'cell',type:'main',t:'Су жасушадан жасушадан тыс кеңістікке шығады',term:'перемещение воды из клеток',s:[
'Су жасуша ішінен осмостылығы жоғары жасушадан тыс ортаға өтеді.',
'Секторлар арасындағы осмостық айырма.',
'Жасушадан тыс көлем ішінара толады, ал жасушалар сусызданады. Су тапшылығы барлық секторға таралады.',
'Гиповолемия кеш, ал жасушалық белгілер (шөлдеу, неврологиялық) ерте пайда болады.',
'Суды біртіндеп беру — жасушалар баяу қалпына келеді.',
'Внутриклеточная дегидратация']},
{id:'thirst',c:4,r:2,dir:'neuro',type:'protect',t:'Осморецепторлар: қатты шөлдеу, АДГ артады',term:'осмотическая жажда',s:[
'Гипоталамус осморецепторлары шөлдеу орталығын қоздырып, АДГ бөлінуін арттырады.',
'Осмостылық 1–2%-ға артқанның өзінде осморецепторлар іске қосылады.',
'Су ішу мен бүйректе су ұсталуы осмостылықты төмендетеді — басты компенсация.',
'Өте қатты шөлдеу (ес сақталса).',
'Су ішуге мүмкіндік беру.',
'Осмотическая жажда, секреция вазопрессина']},
{id:'ecf',c:0,r:3,dir:'hemo',type:'protect',t:'Жасушадан тыс көлем ішінара сақталады',term:'относительно сохранённый ОЦК',s:[
'Плазма көлемі басқа түрлерге қарағанда аз азаяды.',
'Жасушадан шыққан су жасушадан тыс секторды толтырады.',
'Гемодинамика ұзақ сақталады; гиповолемия мен гипотензия тек ауыр сатыда.',
'Тахикардия орташа, АҚ ұзақ қалыпты.',
'Көлемді алдымен толтыру тек ауыр гиповолемияда қажет.',
'Относительная сохранность внеклеточного объёма']},
{id:'cdh',c:3,r:3,dir:'cell',type:'main',t:'Жасуша ішілік гипогидратация',term:'клеточная дегидратация',s:[
'Жасушалар суын жоғалтып, кішірейеді.',
'Жасушадан тыс ортаның гиперосмостылығы.',
'Жасуша ішінде иондар мен метаболиттер концентрациясы артып, ферменттер мен нәруыз синтезі бұзылады; ең сезімтал — ми жасушалары.',
'Тіл мен шырышты қабық өте құрғақ, сілекей жоқ, тері құрғақ.',
'Суды біртіндеп толтыру.',
'Клеточная дегидратация; dehydratio intracellularis']},
{id:'ret',c:4,r:3,dir:'neuro',type:'protect',t:'Су ұсталады: олигурия, зәр концентрацияланған',term:'антидиурез',s:[
'Бүйрек аз әрі концентрацияланған зәр бөледі.',
'АДГ жинағыш түтікшелерде аквапорин-2 арқылы су сіңірілуін арттырады.',
'Су тапшылығы баяулайды. Қантсыз диабет пен осмостық диурезде бұл компенсация жұмыс істемейді.',
'Олигурия, зәр тығыздығы 1025-тен жоғары (қантсыз диабетте 1005-тен төмен).',
'Диурез бен зәр тығыздығын бақылау себепті ажыратуға көмектеседі.',
'Олигурия, концентрированная моча']},
{id:'wloss',c:1,r:4,dir:'metab',type:'damage',t:'Тыныс пен тері арқылы су шығыны күшейеді',term:'неощутимые потери',s:[
'«Байқалмайтын» су шығыны артады.',
'Қызбада тыныс жиілейді; дене қызуы 1°C көтерілгенде бұл шығын шамамен 10–12%-ға артады.',
'Су тапшылығы тереңдеп, гипернатриемия күшейеді — тұйық шеңбер.',
'Жиі тыныс, салмақтың азаюы.',
'Сусындату көлемін есептегенде қызбадағы шығынды қосу.',
'Неощутимые потери воды; perspiratio insensibilis']},
{id:'fever',c:2,r:4,dir:'metab',type:'damage',t:'Тер азаяды, сусызданулық қызба',term:'лихорадка обезвоживания',s:[
'Дене қызуы көтеріледі.',
'Тер бөлінуі азайып, жылу беру бұзылады; гипоталамус жасушаларының сусыздануы жылу реттеуді бұзады.',
'Гипертермия тыныс арқылы су шығынын арттырады.',
'Қызба (әсіресе нәрестелерде), тері ыстық әрі құрғақ.',
'Сусындату — қызу көбіне су толтырылғанда түседі; физикалық салқындату.',
'Лихорадка обезвоживания (эксикозный токсикоз)']},
{id:'brain',c:3,r:4,dir:'organ',type:'damage',t:'Ми жасушалары кішірейеді, нейрон қызметі бұзылады',term:'дегидратация мозга',s:[
'Ми көлемі азайып, нейрондар қызметі бұзылады.',
'Ми жасушалары сусызданады.',
'Ми кішірейгенде оны қатты қабықпен байланыстыратын веналар созылып жыртылуы мүмкін: субарахноидтық және ми ішіне қан құйылу.',
'Қозу, мазасыздық, галлюцинация, гиперрефлексия, құрысу.',
'Na⁺-ды баяу төмендету; неврологиялық бақылау.',
'Гиперосмолярная энцефалопатия']},
{id:'idio',c:4,r:4,dir:'cell',type:'protect',t:'Ми жасушаларында идиогендік осмолдер жиналады',term:'идиогенные осмоли',s:[
'1–3 тәулік ішінде ми жасушалары өз ішінде осмостық белсенді заттар жинайды.',
'Таурин, миоинозитол, глутамин, глутамат, бетаин және иондар (K⁺, Na⁺).',
'Жасуша ішілік осмостылық артып, су жасушаға қайтады; ми көлемі қалпына келеді.',
'Созылмалы гипернатриемияда неврологиялық белгілер жеңілірек.',
'Бұл бейімделу ем кезінде ескеріледі: осмолдер баяу жойылады.',
'Идиогенные осмоли, органические осмолиты']},
{id:'cons',c:3,r:5,dir:'organ',type:'damage',t:'Сана бұзылады — адам су іше алмайды',term:'нарушение сознания',s:[
'Есеңгіреу, сопор, кома дамиды.',
'Ми жасушаларының сусыздануы, шөлдеу орталығы қызметінің әлсіреуі.',
'Адам шөлдегенін білдіре алмайды және су іше алмайды; су тапшылығы тереңдейді — тұйық шеңбер.',
'Сопор, кома, әсіресе қарттарда.',
'Суды көктамыр арқылы енгізу (5% глюкоза, 0,45% NaCl).',
'Гиперосмолярная кома']},
{id:'cedema',c:4,r:5,dir:'organ',type:'damage',t:'Тым жылдам регидратацияда ми ісінеді',term:'отёк мозга при быстрой коррекции',s:[
'Ем кезіндегі асқыну — ми ісінуі.',
'Идиогендік осмолдер жасушада қалғанда жасушадан тыс осмостылық тез төмендесе, су жасушаға жедел өтеді.',
'Ми ісініп, құрысу пайда болады; өлімге әкелуі мүмкін.',
'Ем кезінде жақсарып келе жатқан науқаста кенеттен құрысу, ес бұзылуы.',
'Созылмалы гипернатриемияда Na⁺ сағатына 0,5 ммоль/л-ден, тәулігіне 10 ммоль/л-ден тез төмендетілмейді.',
'Отёк мозга при быстрой коррекции гипернатриемии']},
{id:'k1',c:0,r:6,dir:'organ',type:'clinic',t:'Шырышты қабық құрғақ, тургор біршама сақталған',term:'клиника гиперосмолярной дегидратации',s:[
'Жасушадан тыс сектор азаюының белгілері әлсіз.',
'Жасушадан шыққан су тінаралық сұйықтықты ішінара толтырады.',
'Тері тургоры салыстырмалы түрде сақталады, тері «қамыр тәрізді» болуы мүмкін.',
'Тіл мен шырышты қабық өте құрғақ, тахикардия, АҚ ұзақ қалыпты.',
'Сусындату; гемодинамиканы бақылау.',
'Клиника гиперосмолярной дегидратации']},
{id:'k2',c:3,r:6,dir:'organ',type:'clinic',t:'Қозу, галлюцинация, құрысу, кома',term:'гиперосмолярная энцефалопатия',s:[
'Гиперосмостық энцефалопатияның белгілері.',
'Ми жасушаларының сусыздануы.',
'Ауырлығы Na⁺ деңгейі мен оның өсу жылдамдығына байланысты.',
'Na⁺ 160 ммоль/л-ден асқанда ауыр белгілер жиі; гипертермия, ес сақталса қатты шөлдеу.',
'Na⁺-ды баяу түзету; неврологиялық бақылау.',
'Гиперосмолярная энцефалопатия']}
],
edges:[
{f:'e1',to:'osm',k:'main',p:R=>BTo(R.e1,R.osm,R.osm.cx-40)},
{f:'e2',to:'osm',k:'main',p:R=>D(R.e2,R.osm)},
{f:'e3',to:'osm',k:'main',p:R=>BTo(R.e3,R.osm,R.osm.cx+40)},
{f:'osm',to:'shift',k:'loop',p:R=>D(R.osm,R.shift)},
{f:'osm',to:'thirst',k:'main',p:R=>ST(R.osm,R.thirst,'r',.75)},
{f:'shift',to:'ecf',k:'main',p:R=>BT(R.shift,R.ecf,.2)},
{f:'shift',to:'cdh',k:'loop',p:R=>BT(R.shift,R.cdh,.8)},
{f:'thirst',to:'ret',k:'main',p:R=>D(R.thirst,R.ret)},
{f:'cdh',to:'fever',k:'loop',p:R=>BT(R.cdh,R.fever,.2)},
{f:'fever',to:'wloss',k:'loop',p:R=>Lf(R.fever,R.wloss)},
{f:'wloss',to:'osm',k:'loop',p:R=>UPL(R.wloss,R.osm)},
{f:'cdh',to:'brain',k:'loop',p:R=>D(R.cdh,R.brain)},
{f:'brain',to:'idio',k:'main',p:R=>Rt(R.brain,R.idio)},
{f:'idio',to:'cedema',k:'cross',p:R=>D(R.idio,R.cedema)},
{f:'brain',to:'cons',k:'loop',p:R=>D(R.brain,R.cons)},
{f:'cons',to:'osm',k:'loop',p:R=>RUP(R.cons,R.osm)},
{f:'ecf',to:'k1',k:'main',p:R=>D(R.ecf,R.k1)},
{f:'cons',to:'k2',k:'main',p:R=>D(R.cons,R.k2)}
],
markers:[R=>[(R.wloss.cx+R.shift.l)/2,R.shift.cy],R=>[R.cdh.cx,R.shift.cy]],
loops:[['osm','shift','cdh','fever','wloss'],['osm','shift','cdh','brain','cons']],
overview:[
['Не болады','Су тұзға қарағанда көп жоғалады. Жасушадан тыс сұйықтық гиперосмостық болып, су жасушалардан шығады: жасушалар сусызданады.'],
['Басты буын','Гипернатриемия мен жасуша ішілік гипогидратация; ең сезімтал — ми жасушалары.'],
['Компенсация','Қатты шөлдеу және АДГ арқылы су ұстау; мида идиогендік осмолдер жиналады. Гемодинамика ұзақ сақталады.'],
['Тұйық шеңберлер','Сусызданулық қызба тыныс арқылы су шығынын арттырады. Сана бұзылған адам су іше алмайды.'],
['Емдік нүкте','Су, 5% глюкоза, 0,45% NaCl. Na⁺ баяу төмендетіледі, әйтпесе ми ісінеді.']
]}
};

const COMPARE=[
['Не жоғалады','Су мен Na⁺ тең үлесте','Na⁺ судан көп','Су Na⁺-дан көп'],
['Na⁺ плазмада','135–145 ммоль/л','135 ммоль/л-ден төмен','145 ммоль/л-ден жоғары'],
['Осмостылық','280–295 мОсм/кг','280 мОсм/кг-нан төмен','295 мОсм/кг-нан жоғары'],
['Су қозғалысы','Секторлар арасында жоқ','Жасушаға кіреді','Жасушадан шығады'],
['Жасушадан тыс көлем','Азаяды','Күрт азаяды (ең ауыр)','Азаяды, ішінара сақталады'],
['Жасуша ішілік көлем','Өзгермейді','Артады, жасуша ісінеді','Азаяды, жасуша сусызданады'],
['Шөлдеу','Орташа','Жоқ, суға жиіркеніш','Өте қатты'],
['Басты қауіп','Гиповолемиялық шок','Коллапс, ми ісінуі','Гиперосмостық кома, ми ішіне қан құйылу'],
['Ем','0,9% NaCl, Рингер','0,9% NaCl; ауыр симптомда 3% NaCl; Na⁺ тәулігіне 8–10 ммоль/л-ден тез көтерілмейді','Су, 5% глюкоза, 0,45% NaCl; Na⁺ тәулігіне 10 ммоль/л-ден тез төмендемейді']
];
</script>
<script>
(function(){
const DIRS={
  hemo:{name:'Гемодинамикалық',g:'Гд'},
  neuro:{name:'Нейрогуморалдық',g:'Нг'},
  metab:{name:'Метаболизмдік',g:'Мб'},
  immune:{name:'Иммундық-қабынулық',g:'Иқ'},
  cell:{name:'Жасушалық-молекулалық',g:'Жм'},
  organ:{name:'Мүшелік зақымданулар',g:'Мш'}
};
const TYPES={
  etio:{short:'Этиология',full:'Этиология',v:'--t-etio'},
  main:{short:'Басты буын',full:'Басты буын',v:'--t-main'},
  damage:{short:'Зақымдаушы',full:'Зақымдаушы буын',v:'--t-damage'},
  protect:{short:'Компенсаторлық',full:'Қорғаныш / компенсаторлық буын',v:'--t-protect'},
  clinic:{short:'Клиника',full:'Клиникалық белгі',v:'--t-clinic'}
};
const SEC=['Не болады','Неліктен','Нәтижесі','Клиника','Емдік нүкте','Термин'];
const KEYS=['iso','hypo','hyper'];
const CW=1184, TOP=44, GAP=48;

const canvas=document.getElementById('canvas');
const svg=document.getElementById('edges');
const panel=document.getElementById('panel');
const scroller=document.getElementById('scroller');
const tabsEl=document.getElementById('tabs');
const leadEl=document.getElementById('lead');
const cmpEl=document.getElementById('cmp');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
canvas.style.width=CW+'px';

let S,N,E,byId,els,sel=null,cur=null;

/* legend (once) */
(function(){
  let h='';
  for(const k in DIRS) h+=`<span class="lg"><span class="tag" style="--d:var(--d-${k})">${DIRS[k].g}</span>${DIRS[k].name}</span>`;
  h+='<span class="lg-sep"></span>';
  const tl={etio:'Этиология',main:'Басты буын',damage:'Зақымдаушы буын',protect:'Қорғаныш / компенсаторлық',clinic:'Клиникалық белгі'};
  for(const k in tl) h+=`<span class="lg"><span class="dot" style="--t:var(${TYPES[k].v})"></span>${tl[k]}</span>`;
  h+='<span class="lg-sep"></span>';
  const ln=(c,dash)=>`<svg width="30" height="10" viewBox="0 0 30 10"><line x1="1" y1="5" x2="22" y2="5" style="stroke:var(${c});stroke-width:1.5${dash?';stroke-dasharray:4 3':''}"/><path d="M29 5 L21 1 L21 9 Z" style="fill:var(${c})"/></svg>`;
  h+=`<span class="lg">${ln('--arrow')}Себеп-салдар</span>`;
  h+=`<span class="lg">${ln('--t-loop')}Тұйық шеңбер</span>`;
  h+=`<span class="lg">${ln('--t-cross',1)}Айқасқан байланыс</span>`;
  h+=`<span class="lg"><svg width="30" height="12" viewBox="0 0 30 12"><line x1="1" y1="6" x2="27" y2="6" style="stroke:var(--t-protect);stroke-width:1.5"/><line x1="27" y1="1" x2="27" y2="11" style="stroke:var(--t-protect);stroke-width:2"/></svg>Тежеу</span>`;
  document.getElementById('legend').innerHTML=h;
})();

/* tabs (once) */
tabsEl.innerHTML=KEYS.map(k=>`<button type="button" class="tab" role="tab" id="tab-${k}" data-k="${k}" aria-selected="false"><span class="tn">${SCHEMES[k].name}</span><span class="tv">${SCHEMES[k].vals}</span></button>`).join('');
tabsEl.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b&&b.dataset.k!==cur)mount(b.dataset.k)});
tabsEl.addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  const i=KEYS.indexOf(cur),n=KEYS[(i+(e.key==='ArrowRight'?1:2))%3];
  mount(n); document.getElementById('tab-'+n).focus();
});

function renderTable(){
  let h='<thead><tr><th scope="col">Көрсеткіш</th>'+KEYS.map((k,i)=>`<th scope="col"${k===cur?' class="cur"':''}>${SCHEMES[k].name}</th>`).join('')+'</tr></thead><tbody>';
  COMPARE.forEach(r=>{
    h+=`<tr><th scope="row">${esc(r[0])}</th>`+KEYS.map((k,i)=>`<td${k===cur?' class="cur"':''}>${esc(r[i+1])}</td>`).join('')+'</tr>';
  });
  cmpEl.innerHTML=h+'</tbody>';
}

function pathD(pts,rad){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const p0=pts[i-1],p=pts[i],p1=pts[i+1];
    const li=Math.hypot(p[0]-p0[0],p[1]-p0[1]),lo=Math.hypot(p1[0]-p[0],p1[1]-p[1]);
    if(!li||!lo){d+=` L${p[0]},${p[1]}`;continue}
    const r=Math.min(rad,li/2,lo/2);
    const di=[(p[0]-p0[0])/li,(p[1]-p0[1])/li],dout=[(p1[0]-p[0])/lo,(p1[1]-p[1])/lo];
    d+=` L${p[0]-di[0]*r},${p[1]-di[1]*r} Q${p[0]},${p[1]} ${p[0]+dout[0]*r},${p[1]+dout[1]*r}`;
  }
  const L=pts[pts.length-1];return d+` L${L[0]},${L[1]}`;
}

function draw(){
  if(!N)return;
  const rows=Math.max(...N.map(n=>n.r))+1, rh=new Array(rows).fill(0);
  N.forEach(n=>{rh[n.r]=Math.max(rh[n.r],els[n.id].offsetHeight)});
  const top=[];let y=TOP;
  for(let r=0;r<rows;r++){top[r]=y;y+=(rh[r]||44)+GAP}
  N.forEach(n=>{els[n.id].style.top=top[n.r]+'px'});
  const H=y-GAP+28; canvas.style.height=H+'px';
  const R={};
  N.forEach(n=>{const el=els[n.id];const l=el.offsetLeft,t=top[n.r],w=el.offsetWidth,h=el.offsetHeight;
    R[n.id]={l,t,w,h,r:l+w,b:t+h,cx:l+w/2,cy:t+h/2}});
  svg.setAttribute('width',CW); svg.setAttribute('height',H); svg.setAttribute('viewBox',`0 0 ${CW} ${H}`);
  let out='';
  E.forEach((e,i)=>{
    const raw=e.p(R); let pts=raw.map(p=>p.slice());
    const a=pts[pts.length-2],z=pts[pts.length-1];
    const len=Math.hypot(z[0]-a[0],z[1]-a[1]);const dx=(z[0]-a[0])/len,dy=(z[1]-a[1])/len;
    let extra='';
    if(e.k==='inh'){
      const bx=z[0]-dx*3,by=z[1]-dy*3; pts[pts.length-1]=[bx,by];
      extra=`<line class="bar" x1="${bx-dy*6}" y1="${by+dx*6}" x2="${bx+dy*6}" y2="${by-dx*6}" stroke-width="2"/>`;
    }else{
      pts[pts.length-1]=[z[0]-dx*8,z[1]-dy*8];
      const bx=z[0]-dx*9,by=z[1]-dy*9;
      extra=`<path class="hd" d="M${z[0]},${z[1]} L${bx-dy*4.5},${by+dx*4.5} L${bx+dy*4.5},${by-dx*4.5} Z"/>`;
    }
    let lab='',best=0,bi=0;
    for(let j=0;j<raw.length-1;j++){const l=Math.hypot(raw[j+1][0]-raw[j][0],raw[j+1][1]-raw[j][1]);if(l>best){best=l;bi=j}}
    if(e.lb&&best>=e.lb.length*8+24){
      const p=raw[bi],q=raw[bi+1];
      lab=Math.abs(p[1]-q[1])<1
        ?`<text class="elabel" x="${(p[0]+q[0])/2}" y="${p[1]-8}" text-anchor="middle">${esc(e.lb)}</text>`
        :`<text class="elabel" x="${p[0]+8}" y="${(p[1]+q[1])/2+4}" text-anchor="start">${esc(e.lb)}</text>`;
    }
    out+=`<g class="edge e-${e.k}" data-i="${i}"><path class="ln" d="${pathD(pts,8)}"/>${extra}${lab}</g>`;
  });
  (S.markers||[]).forEach((m,i)=>{
    const [cx,cy0]=m(R),cy=cy0-10,r=15;
    const a0=-50*Math.PI/180,a1=a0+300*Math.PI/180;
    const sx=cx+r*Math.cos(a0),sy=cy+r*Math.sin(a0),ex=cx+r*Math.cos(a1),ey=cy+r*Math.sin(a1);
    const tx=-Math.sin(a1),ty=Math.cos(a1),hb=[ex-tx*8,ey-ty*8];
    out+=`<g class="loopmark" data-l="${i}"><path class="loop-ic" d="M${sx},${sy} A${r},${r} 0 1 1 ${ex-tx*3},${ey-ty*3}"/>`+
      `<path class="loop-hd" d="M${ex+tx*2},${ey+ty*2} L${hb[0]-ty*4.5},${hb[1]+tx*4.5} L${hb[0]+ty*4.5},${hb[1]-tx*4.5} Z"/>`+
      `<text class="loop-lb" x="${cx}" y="${cy+r+20}" text-anchor="middle">тұйық шеңбер</text></g>`;
  });
  svg.innerHTML=out;
  applyFade();
}

function applyFade(){
  const s=sel?byId[sel]:null;
  N.forEach(n=>{
    const el=els[n.id];
    el.setAttribute('aria-pressed',String(n.id===sel));
    el.classList.toggle('faded',!!s&&n.dir!==s.dir&&n.id!==s.id);
  });
  svg.querySelectorAll('.edge').forEach(g=>{
    const e=E[+g.dataset.i];
    const keep=!s||e.f===sel||e.to===sel||(byId[e.f].dir===s.dir&&byId[e.to].dir===s.dir);
    g.classList.toggle('faded',!keep);
  });
  svg.querySelectorAll('.loopmark').forEach(g=>{
    const ids=(S.loops||[])[+g.dataset.l]||[];
    g.classList.toggle('faded',!!s&&!ids.includes(sel));
  });
}
const narrow=()=>window.matchMedia('(max-width:1099px)').matches;
function chip(id,suffix){
  const n=byId[id];
  return `<button type="button" class="chip" data-go="${id}" style="--d:var(--d-${n.dir})">${esc(n.t)}${suffix?' ('+suffix+')':''}</button>`;
}
const kindNote=k=>k==='inh'?'тежейді':k==='cross'?'айқасқан':'';
function renderPanel(){
  const n=sel?byId[sel]:null;
  if(!n){
    panel.style.setProperty('--pd','var(--t-main)');
    let h=`<div class="p-top"><h2>${esc(S.name)} гипогидратация</h2><button type="button" class="panel-close" data-close>Жабу</button></div>`;
    S.overview.forEach(([hd,p])=>{h+=`<div class="p-sec"><h3>${esc(hd)}</h3><p>${esc(p)}</p></div>`});
    h+=`<div class="p-sec"><h3>Схеманы оқу</h3><p>Түйінді басыңыз: таңдалған бағыт қалады, қалғандары бозарады. Бос жерді басу немесе Esc таңдауды алып тастайды.</p></div>`;
    panel.innerHTML=h; return;
  }
  panel.style.setProperty('--pd',`var(--d-${n.dir})`);
  const inc=E.filter(e=>e.to===n.id).map(e=>chip(e.f,kindNote(e.k)));
  const out=E.filter(e=>e.f===n.id).map(e=>chip(e.to,kindNote(e.k)));
  let h=`<div class="p-top"><h2>${esc(n.t)}</h2><button type="button" class="panel-close" data-close>Жабу</button></div>
    <div class="p-dir"><span class="tag" style="--d:var(--d-${n.dir})">${DIRS[n.dir].g}</span>${DIRS[n.dir].name}</div>
    <div class="p-type"><span class="dot" style="--t:var(${TYPES[n.type].v})"></span>${TYPES[n.type].full}</div>`;
  n.s.forEach((txt,i)=>{
    h+=i===5?`<div class="p-sec"><h3>${SEC[i]}</h3><p class="term-txt">(${esc(txt)})</p></div>`
            :`<div class="p-sec"><h3>${SEC[i]}</h3><p>${esc(txt)}</p></div>`;
  });
  if(inc.length||out.length){
    h+=`<div class="p-sec"><h3>Байланыстар</h3>`;
    if(inc.length) h+=`<div class="chip-lb">Алдыңғы буын</div><div class="chips">${inc.join('')}</div>`;
    if(out.length) h+=`<div class="chip-lb">Келесі буын</div><div class="chips">${out.join('')}</div>`;
    h+=`</div>`;
  }
  panel.innerHTML=h; panel.scrollTop=0;
}
function ensureVisible(id){
  const el=els[id];
  let nr=el.getBoundingClientRect(),cr=scroller.getBoundingClientRect();
  if(nr.left<cr.left+16||nr.right>cr.right-16) scroller.scrollLeft+=(nr.left+nr.width/2)-(cr.left+cr.width/2);
  if(narrow()){
    nr=el.getBoundingClientRect();
    const sheetTop=window.innerHeight-panel.offsetHeight;
    if(nr.bottom>sheetTop-12||nr.top<12) window.scrollBy(0,nr.top-72);
  }
}
function select(id){
  sel=id; applyFade(); renderPanel();
  panel.classList.toggle('open',!!id);
  document.body.style.paddingBottom=(id&&narrow())?panel.offsetHeight+'px':'';
  if(id) ensureVisible(id);
}

function mount(key){
  cur=key; S=SCHEMES[key]; N=S.nodes; E=S.edges; byId={}; N.forEach(n=>byId[n.id]=n);
  canvas.querySelectorAll('.node').forEach(b=>b.remove());
  els={};
  N.forEach(n=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='node'+(n.type==='main'?' main':'');
    b.style.left=(20+n.c*236)+'px';
    b.style.setProperty('--d',`var(--d-${n.dir})`);
    b.setAttribute('aria-pressed','false');
    b.title=DIRS[n.dir].name+' · '+TYPES[n.type].full;
    b.innerHTML=`<span class="meta"><span class="ty"><span class="dot" style="--t:var(${TYPES[n.type].v})"></span>${TYPES[n.type].short}</span><span class="tag">${DIRS[n.dir].g}</span></span><span class="ttl">${esc(n.t)}</span><span class="term">(${esc(n.term)})</span>`;
    b.addEventListener('click',e=>{e.stopPropagation();select(sel===n.id?null:n.id)});
    canvas.appendChild(b); els[n.id]=b;
  });
  KEYS.forEach(k=>document.getElementById('tab-'+k).setAttribute('aria-selected',String(k===key)));
  leadEl.textContent=S.lead+' Түйінді басыңыз — түсіндірме ашылады. Esc таңдауды алып тастайды.';
  renderTable();
  sel=null; draw(); select(null); scroller.scrollLeft=0;
  try{localStorage.setItem('hypohydr-tab',key)}catch(_){}
}

panel.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){select(g.dataset.go);els[g.dataset.go].focus({preventScroll:true});return}
  if(e.target.closest('[data-close]')){const prev=sel;select(null);if(prev)els[prev].focus({preventScroll:true})}
});
canvas.addEventListener('click',()=>{if(sel)select(null)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sel)select(null)});
window.addEventListener('resize',()=>{document.body.style.paddingBottom=(sel&&narrow())?panel.offsetHeight+'px':''});

let start='iso';
const h=(location.hash||'').slice(1);
if(KEYS.includes(h)) start=h;
else{try{const s=localStorage.getItem('hypohydr-tab');if(KEYS.includes(s))start=s}catch(_){}}
mount(start);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
window.addEventListener('load',draw);
})();
</script>
<script>
/* viewer bridge: two-finger pinch is sent to the reader, zoom keeps the point under the fingers in place, theme follows the reader */
(function(){
  if (window.parent === window) return;
  var z = 1, pinch = null, focal = null, lastW = innerWidth, lastH = innerHeight;
  function send(m){ try { parent.postMessage(m, '*'); } catch (e) {} }
  addEventListener('message', function(e){
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.__viewer === 'zoom' && typeof d.z === 'number') z = d.z;
    if (d.__viewer === 'theme') {
      if (d.theme) document.documentElement.setAttribute('data-theme', d.theme);
      else document.documentElement.removeAttribute('data-theme');
    }
  });
  function dist(t){ var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.sqrt(dx*dx + dy*dy); }
  function mid(t){ return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 }; }
  document.addEventListener('touchstart', function(e){
    if (e.touches.length === 2) { pinch = { d: dist(e.touches) * z, z: z }; focal = mid(e.touches); e.preventDefault(); }
  }, { passive: false });
  document.addEventListener('touchmove', function(e){
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    focal = mid(e.touches);
    var d = dist(e.touches) * z;
    if (pinch.d > 0) send({ __viewer: 'pinch', z: pinch.z * d / pinch.d });
  }, { passive: false });
  function end(e){
    if (pinch && e.touches.length < 2) {
      pinch = null; send({ __viewer: 'pinchend' });
      setTimeout(function(){ if (!pinch) focal = null; }, 300);
    }
  }
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', end);
  ['gesturestart', 'gesturechange'].forEach(function(t){ document.addEventListener(t, function(e){ e.preventDefault(); }); });
  /* trackpad pinch / ctrl + wheel on a computer */
  var wt = 0;
  addEventListener('wheel', function(e){
    if (!e.ctrlKey) return;
    e.preventDefault();
    focal = { x: e.clientX, y: e.clientY };
    send({ __viewer: 'pinch', z: z * Math.exp(-e.deltaY * 0.01) });
    clearTimeout(wt);
    wt = setTimeout(function(){ focal = null; send({ __viewer: 'pinchend' }); }, 400);
  }, { passive: false });
  addEventListener('resize', function(){
    var w = innerWidth, h = innerHeight, r = lastW / w, rh = lastH / h;
    var oldW = lastW, oldH = lastH;
    lastW = w; lastH = h;
    /* width and height change by the same factor only when the zoom changed (not on rotation) */
    if (Math.abs(r - 1) < 0.01 || Math.abs(r - rh) > 0.04 * r) return;
    var f = focal || { x: oldW / 2, y: oldH / 2 };
    var dx = f.x - f.x / r, dy = f.y - f.y / r;
    window.scrollBy(0, dy);
    var el = document.elementFromPoint(f.x / r, f.y / r);
    while (el && el !== document.body && el !== document.documentElement) {
      if (el.scrollWidth > el.clientWidth + 1) {
        var ox = getComputedStyle(el).overflowX;
        if (ox === 'auto' || ox === 'scroll') { el.scrollLeft += dx; break; }
      }
      el = el.parentElement;
    }
    if (focal) focal = { x: f.x / r, y: f.y / r };
  });
  send({ __viewer: 'ready' });
})();
</script>
