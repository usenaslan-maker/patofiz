<style>
/* Layout: title → type tabs → one-line legend → pathogenesis map on a 5-column grid + explanation panel (docked ≥1100px, bottom sheet below) → comparison table */
:root{
  --bg:#FAFAF7; --node:#FFFFFF; --fg:#2B2B2B; --fg2:#6B6B6B; --line:#D9D9D4; --arrow:#6B6B6B;
  --t-etio:#8C8C8C; --t-main:#3B5BA9; --t-damage:#C8553D; --t-protect:#4E8F6A;
  --t-loop:#C8553D; --t-cross:#9A9A9A; --t-clinic:#B07D2B;
  --d-hemo:#3B7EA1; --d-neuro:#7A5BA6; --d-metab:#C08A2E; --d-immune:#B5536B; --d-cell:#4A8C8C; --d-organ:#6B7B3A;
  --font:"Noto Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1F1C; --node:#2A2B27; --fg:#ECECE8; --fg2:#A9A9A3; --line:#3D3E39; --arrow:#8F908A;
    --t-etio:#989898; --t-main:#4F6BB2; --t-damage:#CE6650; --t-protect:#609A79;
    --t-loop:#CE6650; --t-cross:#A5A5A5; --t-clinic:#B88A40;
    --d-hemo:#4F8BAA; --d-neuro:#876BAF; --d-metab:#C69643; --d-immune:#BC647A; --d-cell:#5C9898; --d-organ:#7A884E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1F1C; --node:#2A2B27; --fg:#ECECE8; --fg2:#A9A9A3; --line:#3D3E39; --arrow:#8F908A;
  --t-etio:#989898; --t-main:#4F6BB2; --t-damage:#CE6650; --t-protect:#609A79;
  --t-loop:#CE6650; --t-cross:#A5A5A5; --t-clinic:#B88A40;
  --d-hemo:#4F8BAA; --d-neuro:#876BAF; --d-metab:#C69643; --d-immune:#BC647A; --d-cell:#5C9898; --d-organ:#7A884E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
.page{max-width:1600px;margin:0 auto;padding-inline:16px;padding-block:24px 40px}
@media (min-width:700px){.page{padding-inline:24px}}
h1{font-size:20px;font-weight:600;margin:0 0 12px;text-wrap:balance}
.lead{font-size:15px;color:var(--fg2);max-width:76ch;margin:0 0 14px;line-height:1.6}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tab{font:inherit;text-align:left;cursor:pointer;background:var(--node);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tab .tn{font-size:15px;font-weight:500;line-height:1.35}
.tab .tv{font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{border:1.5px solid var(--t-main);background:color-mix(in srgb,var(--t-main) 8%,var(--node))}
.tab[aria-selected="true"] .tn{font-weight:600}
.tab:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.legend{display:flex;align-items:center;gap:16px;overflow-x:auto;white-space:nowrap;padding-block:10px;margin-bottom:16px;border-block:1px solid var(--line);font-size:13px;color:var(--fg2)}
.lg{display:inline-flex;align-items:center;gap:6px;flex:none}
.lg-sep{width:1px;height:18px;background:var(--line);flex:none}
.tag{display:inline-block;font-size:13px;font-weight:600;line-height:18px;padding:0 5px;border-radius:6px;color:var(--fg);border:1px solid var(--d);background:color-mix(in srgb,var(--d) 8%,transparent);flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--t);flex:none}
.lg svg{flex:none}

.layout{display:block}
@media (min-width:1100px){.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.canvas{position:relative;margin:0 auto}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

.node{position:absolute;top:0;width:200px;background:var(--node);color:var(--fg);border:1.5px solid var(--d);border-radius:10px;padding:9px 12px 10px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.node.main{border-width:2px}
.node[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--d);background:color-mix(in srgb,var(--d) 8%,var(--node))}
.node:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.node .meta{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;font-weight:500;color:var(--fg2);line-height:18px}
.node .ty{display:inline-flex;align-items:center;gap:6px;min-width:0}
.node .ttl{font-size:14px;font-weight:500;line-height:1.4}
.node .term,.term-txt{font-size:13px;font-style:italic;color:var(--fg2);line-height:1.4}
.faded{opacity:.3}

.e-main path.ln{stroke:var(--arrow)} .e-main .hd{fill:var(--arrow)}
.e-loop path.ln{stroke:var(--t-loop)} .e-loop .hd{fill:var(--t-loop)}
.e-cross path.ln{stroke:var(--t-cross);stroke-dasharray:5 4} .e-cross .hd{fill:var(--t-cross)}
.e-inh path.ln,.e-inh .bar{stroke:var(--t-protect)}
path.ln{fill:none;stroke-width:1.5}
.elabel{font-family:var(--font);font-size:13px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.loop-ic{fill:none;stroke:var(--t-loop);stroke-width:1.5}
.loop-hd{fill:var(--t-loop)}
.loop-lb{font-family:var(--font);font-size:13px;font-weight:500;fill:var(--t-loop);paint-order:stroke;stroke:var(--bg);stroke-width:5px}

.panel{--pd:var(--t-main);position:relative;background:var(--node);border:1px solid var(--line);border-radius:10px;padding:20px 22px 22px 26px;display:none}
.panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pd);border-radius:10px 0 0 10px}
@media (min-width:1100px){
  .panel{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow-y:auto}
  .panel-close{display:none!important}
}
@media (max-width:1099px){
  .panel.open{display:block;position:fixed;left:0;right:0;bottom:0;max-height:60vh;overflow-y:auto;z-index:20;border-radius:10px 10px 0 0;border-bottom:0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .panel.open::before{border-radius:10px 0 0 0}
}
.p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel h2{font-size:20px;font-weight:600;margin:0;line-height:1.35;text-wrap:balance}
.panel-close{font:inherit;font-size:13px;font-weight:600;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:10px;padding:4px 10px;cursor:pointer;flex:none}
.p-dir{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;font-weight:600}
.p-type{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--fg2)}
.p-sec{margin-top:16px}
.p-sec h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);margin:0 0 4px}
.p-sec p{font-size:15px;font-weight:400;line-height:1.6;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:inherit;font-size:13px;color:var(--fg);background:var(--node);border:1px solid var(--d);border-radius:10px;padding:3px 9px;cursor:pointer;text-align:left}
.chip:focus-visible,.panel-close:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.chip-lb{font-size:13px;color:var(--fg2);margin-top:8px}

.cmp{margin-top:28px}
.cmp h2{font-size:15px;font-weight:600;margin:0 0 10px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--node)}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);line-height:1.5}
thead th{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
tbody th{font-weight:600;width:20%}
td{font-weight:400}
.cur{background:color-mix(in srgb,var(--t-main) 8%,transparent)}
thead th.cur{color:var(--fg)}
tbody tr:last-child>*{border-bottom:0}
</style>

<script>
/* geometry helpers used by the scheme data */
const hm=(a,b)=>(Math.max(a.t,b.t)+Math.min(a.b,b.b))/2;
const vm=(a,b)=>(Math.max(a.l,b.l)+Math.min(a.r,b.r))/2;
const D=(a,b)=>{const x=vm(a,b);return [[x,a.b],[x,b.t]]};
const Rt=(a,b)=>{const y=hm(a,b);return [[a.r,y],[b.l,y]]};
const Lf=(a,b)=>{const y=hm(a,b);return [[a.l,y],[b.r,y]]};
const BT=(s,t,fo)=>{const x=s.l+s.w*fo,y=t.t-24;return [[x,s.b],[x,y],[t.cx,y],[t.cx,t.t]]};
const ST=(s,t,side,fo)=>{const x=side==='l'?s.l:s.r,y=fo==null?s.cy:s.t+s.h*fo;return [[x,y],[t.cx,y],[t.cx,t.t]]};
const BS=(s,t,side)=>[[s.cx,s.b],[s.cx,t.cy],[side==='l'?t.l:t.r,t.cy]];
const BTo=(s,t,tx)=>[[s.cx,s.b],[s.cx,t.t-20],[tx,t.t-20],[tx,t.t]];
const GX=c=>20+c*236+218; /* vertical corridor between column c and c+1 */
const UPL=(s,t)=>[[s.cx,s.t],[s.cx,t.cy],[t.l,t.cy]];               /* up from s, then right into t's left side */
const RUP=(s,t)=>{const x=GX(3),y=t.t+t.h*.3;return [[s.r,s.cy],[x,s.cy],[x,y],[t.r,y]]}; /* right corridor back up to t */
</script>

{id:'diur',c:3,r:4,dir:'neuro',type:'protect',t:'Натрийурез бен диурез артады',term:'натрийурез',s:[
'Бүйрек артық Na⁺ пен суды шығарады.',
'Натрийуретикалық пептидтердің әсері, РААЖ мен АДГ тежелуі.',
'Бүйрек сау болса, гиперволемия өзі түзеледі. Бүйрек немесе жүрек жеткіліксіздігінде бұл компенсация жетпейді.',
'Полиурия (бүйрек сау болса).',
'Ілмектік диуретиктер бұл жолды күшейтеді.',
'Натрийурез, диурез']},
{id:'raas',c:1,r:5,dir:'neuro',type:'damage',t:'Жүрек лақтырысы азайып, РААЖ мен АДГ белсенеді',term:'вторичный гиперальдостеронизм',s:[
'Ренин, альдостерон және АДГ қайта көп бөлінеді.',
'Бүйрек перфузиясы мен «тиімді» артериялық көлем азаяды.',
'Na⁺ пен су одан әрі ұсталып, гиперволемия күшейеді — тұйық шеңбер.',
'Олигурия, зәрде Na⁺ аз.',
'ААФ тежегіштері, спиронолактон, диуретиктер — тұйық шеңберді үзу.',
'Вторичный гиперальдостеронизм']},
{id:'edema',c:2,r:5,dir:'organ',type:'main',t:'Сұйықтық тінаралыққа шығады: ісіну',term:'отёки, водянка',s:[
'Артық изотониялық сұйықтық тінаралықта жиналады.',
'Гидростатикалық қысымның артуы және онкотикалық қысымның азаюы.',
'Шеткі ісіну, асцит, гидроторакс; ауыр жағдайда өкпе ісінуі.',
'Ісіну жұмсақ, басқанда шұңқыр қалады; салмақ артады.',
'Тұз бен суды шектеу, диуретиктер.',
'Отёки; oedema, hydrops']},
{id:'lung',c:1,r:6,dir:'organ',type:'damage',t:'Өкпе ісінуі',term:'отёк лёгких',s:[
'Сұйықтық өкпе интерстицийі мен альвеолаларға шығады.',
'Кіші қанайналым шеңберінде гидростатикалық қысым артады.',
'Газ алмасу бұзылып, гипоксемия дамиды.',
'Ентігу, ортопноэ, ылғалды сырылдар, көбікті қақырық.',
'Отырғызу, оттегі, фуросемид, нитраттар; қажет болса диализ.',
'Отёк лёгких; oedema pulmonum']},
{id:'k1',c:2,r:6,dir:'organ',type:'clinic',t:'Шеткі ісіну, салмақ артады, мойын веналары ісінген',term:'клиника изотонической гипергидратации',s:[
'Изосмостық гипергидратацияның сыртқы белгілері.',
'Артық сұйықтық тамыр мен тінаралықта жиналады.',
'Ісіну себебіне қарай аяқтан немесе беттен басталады.',
'Салмақ тәулігіне 1 кг-нан артық өседі, мойын веналары ісінген, АҚ жоғары; шөлдеу жоқ.',
'Салмақ пен диурезді күнделікті бақылау.',
'Клиника изотонической гипергидратации']},
{id:'k2',c:4,r:6,dir:'metab',type:'clinic',t:'Na⁺ қалыпты, Ht мен нәруыз төмен',term:'лабораторная картина',s:[
'Изосмостық гипергидратацияға тән зертханалық көрініс.',
'Сұйықтық изотониялық, қан сұйылған.',
'Изосмостық түрін басқа түрлерден ажыратады.',
'Na⁺ 135–145 ммоль/л, осмостылық 280–295 мОсм/кг; Ht, гемоглобин, альбумин төмен.',
'Диурез кезінде электролиттерді, әсіресе K⁺-ды бақылау.',
'Лабораторная картина изотонической гипергидратации']}
],

overview:[
['Не болады','Na⁺ пен су плазмадағыдай арақатынаста артық жиналады. Жасушадан тыс көлем артады, осмостылық қалыпты, жасушалар өзгермейді.'],
['Басты буын','Гиперволемия және қылтамырдағы гидростатикалық қысымның артуы — ісінудің негізі.'],
['Компенсация','Натрийуретикалық пептидтер бөлініп, РААЖ мен АДГ тежеледі; бүйрек артық Na⁺ пен суды шығарады.'],
['Тұйық шеңбер','Көлеммен шамадан тыс жүктелген жүрек әлсірейді; бүйрек перфузиясы азайып, РААЖ Na⁺ пен суды одан әрі ұстайды.'],
['Емдік нүкте','Тұз бен суды шектеу, ілмектік диуретиктер, негізгі ауруды емдеу.']
]},

hypo:{
name:'Гипосмостық',vals:'Na⁺ < 135 · су уыттануы',
lead:'Су Na⁺-дан көп жиналады. Су жасушаларға ауысып, жасушалар, әсіресе ми жасушалары, ісінеді.',
nodes:[
{id:'e1',c:1,r:0,dir:'metab',type:'etio',t:'Су артық түседі: психогендік полидипсия, 5% глюкозаны көп құю',term:'избыточное поступление воды',s:[
'Организмге бүйрек шығара алатыннан көп су түседі (тәулігіне 10–15 л-ден астам).',
'Психогендік полидипсия, 5% глюкозаны көп құю, операция кезінде шаю ерітінділерінің сіңуі, марафоншылардың шамадан тыс су ішуі, «сыра потоманиясы».',
'Тұщы су жасушадан тыс сұйықтықты сұйылтады.',
'Жүрек айну, бас ауыруы, әлсіздік.',
'Су ішуді шектеу; тұзсыз ерітінділерді бақылаумен құю.',
'Водное отравление, психогенная полидипсия']},
{id:'e2',c:3,r:0,dir:'neuro',type:'etio',t:'Су шығарылмайды: АДГ-ның сәйкессіз бөліну синдромы, бүйрек жеткіліксіздігі',term:'СНСАДГ',s:[
'Бүйрек суды шығара алмайды, ал адам қалыпты мөлшерде су ішеді.',
'АДГ-ның сәйкессіз бөліну синдромы (өкпе обыры, ОЖЖ аурулары, карбамазепин, антидепрессанттар, операциядан кейінгі ауырсыну), олигуриялық бүйрек жеткіліксіздігі, гипотиреоз, глюкокортикоид тапшылығы.',
'Су ұсталып, Na⁺ сұйылады.',
'Зәр концентрацияланған, ал қан сарысуы гипоосмостық.',
'Су ішуді шектеу, ваптандар (толваптан), себепті емдеу.',
'Синдром неадекватной секреции АДГ (синдром Пархона)']},
{id:'osm',c:2,r:1,dir:'metab',type:'main',t:'Су артық: гипонатриемия, осмостылық төмендейді',term:'гипоосмолярность',s:[
'Жасушадан тыс сұйықтықтың Na⁺-ы мен осмостылығы сұйылу есебінен төмендейді.',
'Су артық, ал организмдегі Na⁺-дың жалпы мөлшері қалыпты.',
'Жасуша ішінде осмостылық жоғары болып қалады — су жасушаға өтеді.',
'Na⁺ 135 ммоль/л-ден төмен, осмостылық 280 мОсм/кг-нан төмен; Ht мен нәруыз төмен.',
'Су ішуді шектеу; ауыр симптомда 3% NaCl. Na⁺ тәулігіне 8–10 ммоль/л-ден тез көтерілмейді.',
'Гипоосмолярная гипергидратация, водное отравление; intoxicatio aquosa']},
{id:'vol',c:0,r:2,dir:'hemo',type:'main',t:'Жасушадан тыс көлем аздап артады',term:'умеренная гиперволемия',s:[
'Артық судың шамамен үштен бірі жасушадан тыс секторда қалады.',
'Судың көп бөлігі жасушаларға ауысады.',
'Гиперволемия жеңіл, ісіну айқын емес; волюморецепторлар белсенеді.',
'Салмақ артады, бірақ шеткі ісіну әдетте болмайды.',
'Су ішуді шектеу.',
'Умеренная гиперволемия']},
{id:'shift',c:2,r:2,dir:'cell',type:'main',t:'Су жасушаларға ауысады',term:'перемещение воды в клетки',s:[
'Су гипоосмостық жасушадан тыс ортадан жасуша ішіне өтеді.',
'Секторлар арасындағы осмостық айырма.',
'Жасушалар ісінеді: жасуша ішілік гипергидратация басым болады.',
'Неврологиялық белгілер, гемолиз.',
'Жасушадан тыс осмостылықты біртіндеп арттыру.',
'Внутриклеточная гипергидратация']},
{id:'adh',c:4,r:2,dir:'neuro',type:'protect',t:'Осмостық АДГ тежеледі, су диурезі',term:'подавление АДГ',s:[
'Осморецепторлар АДГ бөлінуін және шөлдеуді тежейді.',
'Плазма осмостылығы төмен.',
'Бүйрек сұйылтылған зәрді көп шығарып, артық суды жояды. АДГ-СБС мен бүйрек жеткіліксіздігінде бұл компенсация жұмыс істемейді.',
'Полидипсияда зәр мол әрі сұйылтылған (осмостылығы 100 мОсм/кг-нан төмен).',
'Зәр осмостылығы себепті ажыратады: төмен болса — артық су ішу, жоғары болса — АДГ-СБС.',
'Подавление секреции вазопрессина, водный диурез']},
{id:'anp',c:0,r:3,dir:'neuro',type:'protect',t:'Натрийуретикалық пептидтер артады, альдостерон тежеледі',term:'натрийуретический ответ',s:[
'ANP бөлінеді, РААЖ белсенділігі азаяды.',
'Жүрекшелердің созылуы, көлемнің артуы.',
'Бүйрек Na⁺-ды көп шығарып, көлемді қалыпқа жақындатады.',
'АДГ-СБС-да көлем қалыпты деңгейде ұсталады (эуволемия).',
'Мұны тұз беріп емес, су шектеп түзету.',
'Натрийуретические пептиды']},
{id:'natr',c:1,r:3,dir:'organ',type:'damage',t:'Натрийурез: Na⁺ зәрмен жоғалады',term:'натрийурез',s:[
'Зәрмен Na⁺ көп шығады.',
'Көлемнің артуына жауап.',
'Көлем тұрақтанады, бірақ Na⁺ жоғалып, гипонатриемия тереңдейді — тұйық шеңбер.',
'Зәрде Na⁺ 30 ммоль/л-ден жоғары.',
'Су шектеу. АДГ-СБС-да 0,9% NaCl тиімсіз: Na⁺ зәрмен шығып, су ұсталады.',
'Натрийурез']},
{id:'hem',c:2,r:3,dir:'cell',type:'damage',t:'Эритроциттер ісініп, гемолиз',term:'осмотический гемолиз',s:[
'Эритроциттер су сіңіріп, ісініп, жарылады.',
'Плазма осмостылығы эритроциттердің осмостық төзімділік шегінен төмендейді.',
'Гемоглобин плазмаға шығып, анемия дамиды; бүйрек түтікшелері зақымдануы мүмкін.',
'Гемоглобинемия, гемоглобинурия, анемия.',
'Осмостылықты қалпына келтіру; бүйректі қорғау.',
'Осмотический гемолиз']},
{id:'cell',c:3,r:3,dir:'cell',type:'damage',t:'Жасушалар ісінеді (жасуша ішілік гипергидратация)',term:'внутриклеточная гипергидратация',s:[
'Жасуша ішіне су жиналып, жасушалардың көлемі ұлғаяды.',
'Жасушадан тыс ортаның гипоосмостылығы.',
'Ферменттер мен мембраналар қызметі бұзылады; ең сезімтал — ми жасушалары.',
'Бұлшықет құрысуы, әлсіздік.',
'Жасушадан тыс осмостылықты біртіндеп қалпына келтіру.',
'Внутриклеточный отёк; hyperhydratio intracellularis']},
{id:'k3',c:4,r:3,dir:'neuro',type:'clinic',t:'Шөлдеу жоқ, суға жиіркеніш',term:'отсутствие жажды',s:[
'Адам шөлдемейді.',
'Осмостық шөлдеу тежелген.',
'Адам суды өзі шектеуге бейім.',
'Шөлдеу жоқ, жүрек айну, суға жиіркеніш.',
'Су ішуді шектеудің маңызын түсіндіру.',
'Отсутствие жажды']},
{id:'k2',c:1,r:4,dir:'organ',type:'clinic',t:'Ісіну айқын емес; зәрде Na⁺ мен осмостылық жоғары',term:'клиника СНСАДГ',s:[
'АДГ-СБС-ға тән клиникалық-зертханалық көрініс.',
'Су жасушаларға кетеді, натрийурез көлемді тұрақтандырады.',
'Гипонатриемия айқын, ал гиперволемия белгілері әлсіз.',
'Зәр осмостылығы 100 мОсм/кг-нан жоғары, зәрде Na⁺ 30 ммоль/л-ден жоғары; қанда мочевина мен зәр қышқылы төмен.',
'Су ішуді шектеу (тәулігіне 0,8–1 л).',
'Клиника СНСАДГ']},
{id:'brain',c:3,r:4,dir:'organ',type:'damage',t:'Ми ісінеді, бассүйек ішілік қысым артады',term:'отёк головного мозга',s:[
'Нейрондар мен глия ісініп, ми көлемі артады.',
'Ми жасушаларына су ауысады; бассүйек кеңеймейді.',
'Бассүйек ішілік қысым артып, ми бағанасы шүйде тесігіне сыналап қысылуы мүмкін; нейрогендік өкпе ісінуі қосылуы мүмкін.',

'Ауыр симптомда 3% NaCl 100–150 мл болюс; алғашқы сағаттарда Na⁺-ды 4–6 ммоль/л көтеру жеткілікті.',
'Отёк мозга; oedema cerebri']},
{id:'osmo',c:4,r:4,dir:'cell',type:'protect',t:'Ми жасушалары иондар мен осмолиттерді шығарады',term:'регуляторное уменьшение объёма',s:[
'Ми жасушалары K⁺, Cl⁻ және органикалық осмолиттерді (таурин, миоинозитол, глутамат) сыртқа шығарады.',
'Жасуша ісінуіне бейімделу; 24–48 сағатта аяқталады.',
'Жасуша ішілік осмостылық азайып, ми ісінуі кемиді.',
'Созылмалы гипонатриемияда белгілер жеңілірек.',
'Бейімделген мида Na⁺-ды тез көтеруге болмайды: осмолиттер баяу қайта жиналады.',
'Регуляторное уменьшение объёма клеток']},
{id:'k1',c:2,r:5,dir:'organ',type:'clinic',t:'Бас ауыруы, апатия, құрысу, кома',term:'гипонатриемическая энцефалопатия',s:[
'Су уыттануының неврологиялық белгілері.',
'Ми жасушаларының ісінуі.',
'Ауырлығы гипонатриемияның деңгейі мен даму жылдамдығына байланысты.',
'Әдетте Na⁺ 125 ммоль/л-ден төмендегенде айқын; тез дамыса жоғарырақ деңгейде де байқалады.',
'Ауыр симптомда 3% NaCl болюс; Na⁺ тәулігіне 8–10 ммоль/л-ден тез көтерілмейді.',
'Гипонатриемическая энцефалопатия']},
{id:'nau',c:3,r:5,dir:'neuro',type:'damage',t:'Жүрек айну, құсу — АДГ одан әрі бөлінеді',term:'тошнота как стимул АДГ',s:[
'Жүрек айну мен құсу пайда болады.',
'Бассүйек ішілік қысым құсу орталығын тітіркендіреді.',
'Жүрек айну — АДГ бөлінуінің күшті осмостық емес стимулы. Су ұсталып, гипонатриемия тереңдейді — тұйық шеңбер.',
'Жеңілдік әкелмейтін құсу, бас ауыруы.',
'Құсуға қарсы ем, су шектеу.',
'Тошнота — неосмотический стимул вазопрессина']},
{id:'ods',c:4,r:5,dir:'organ',type:'damage',t:'Тым жылдам түзетуде осмостық демиелинизация',term:'центральный понтинный миелинолиз',s:[
'Ем кезіндегі асқыну: ми бағанасы мен басқа аймақтарда миелин бұзылады.',
'Осмолиттерін жоғалтқан ми жасушалары Na⁺ тез көтерілгенде сусызданып, олигодендроциттер зақымданады.',
'Қайтымсыз неврологиялық тапшылық.',

'Осмотический демиелинизирующий синдром']}

hyper:{
name:'Гиперосмостық',vals:'Na⁺ > 145 · тұзбен уыттану',
lead:'Na⁺ судан көп жиналады. Су жасушалардан шығып, сыртта гиперволемия мен ісіну, ішінде жасуша сусыздануы дамиды.',
nodes:[
{id:'e1',c:0,r:0,dir:'metab',type:'etio',t:'Теңіз суын ішу',term:'питьё морской воды',s:[
'Тұщы су жоқта адам теңіз суын ішеді.',
'Теңіз суындағы Na⁺ шамамен 470 ммоль/л; бүйрек зәрдегі Na⁺-ды мұндай деңгейге дейін концентрлей алмайды.',
'Ішілген тұзды шығару үшін ішілгеннен көп су жұмсалады — гипернатриемия күшейеді.',
'Қатты шөлдеу, жүрек айну, іш өту.',
'Тұщы су беру; теңіз суын ішуге болмайды.',
'Солевое отравление морской водой']},
{id:'e2',c:2,r:0,dir:'hemo',type:'etio',t:'Гипертониялық ерітінділерді құю: NaCl, NaHCO₃',term:'инфузия гипертонических растворов',s:[
'Тамырға натрийі көп ерітінділер енгізіледі.',
'3% немесе 10% NaCl, реанимациядағы натрий гидрокарбонаты, нәрестелерге тұзы көп қоспа.',
'Жасушадан тыс сектор натрий есебінен гиперосмостық болады.',
'Шөлдеу, АҚ артуы, ентігу.',
'Натрийлі ерітінділердің дозасын есептеу, Na⁺-ды бақылау.',
'Ятрогенная гипернатриемия']},
{id:'e3',c:4,r:0,dir:'neuro',type:'etio',t:'Na⁺ артық ұсталады: бастапқы гиперальдостеронизм, Кушинг синдромы',term:'избыток минералокортикоидов',s:[
'Бүйрек Na⁺-ды шамадан тыс сіңіреді.',
'Бастапқы гиперальдостеронизм (Конн синдромы), Кушинг синдромы, минералокортикоидтарды артық қабылдау.',
'Na⁺ ұсталады; су да бірге ұсталатындықтан гипернатриемия әдетте жеңіл.',
'Артериялық гипертензия, гипокалиемия, бұлшықет әлсіздігі.',
'Спиронолактон, себепті хирургиялық емдеу.',
'Гиперальдостеронизм']},
{id:'osm',c:2,r:1,dir:'metab',type:'main',t:'Na⁺ артық: гипернатриемия, осмостылық артады',term:'гиперосмолярность',s:[
'Жасушадан тыс сұйықтықта Na⁺ мен осмостылық артады.',
'Na⁺ судан көп түседі немесе ұсталады.',
'Су жасушалардан шығып, жасушадан тыс секторға өтеді.',
'Na⁺ 145 ммоль/л-ден жоғары, осмостылық 295 мОсм/кг-нан жоғары; Ht пен нәруыз төмен.',
'Na⁺ түсуін тоқтату; ілмектік диуретик пен 5% глюкоза бірге; бүйрек жеткіліксіздігінде диализ. Na⁺ тәулігіне 10 ммоль/л-ден тез төмендетілмейді.',
'Гиперосмолярная гипергидратация, солевое отравление']},
{id:'thirst',c:0,r:2,dir:'neuro',type:'protect',t:'Осморецепторлар: қатты шөлдеу, АДГ артады',term:'осмотическая жажда',s:[
'Гипоталамус осморецепторлары шөлдеуді және АДГ бөлінуін арттырады.',
'Плазма осмостылығының артуы.',
'Тұщы су ішілсе, осмостылық төмендейді, бірақ су ішу мен ұстау көлемді одан әрі арттырады.',
'Өте қатты шөлдеу.',
'Тұщы су немесе 5% глюкоза, көлемге қарай диуретикпен бірге.',
'Осмотическая жажда']},
{id:'shift',c:2,r:2,dir:'cell',type:'main',t:'Су жасушадан шығады',term:'перемещение воды из клеток',s:[
'Су жасуша ішінен гиперосмостық жасушадан тыс ортаға өтеді.',
'Секторлар арасындағы осмостық айырма.',
'Жасушалар сусызданады, ал жасушадан тыс көлем одан әрі артады.',
'Неврологиялық белгілер мен гиперволемия белгілері бірге байқалады.',
'Осмостылықты баяу төмендету.',
'Внутриклеточная дегидратация при внеклеточной гипергидратации']},
{id:'sea',c:0,r:3,dir:'metab',type:'damage',t:'Тұщы су жоқта теңіз суын қайта ішу',term:'порочный круг жажды',s:[
'Шөлдеген адам қолда бар теңіз суын тағы ішеді.',
'Шөлдеу басылмайды, себебі тұз қайта түседі.',
'Na⁺ түсуі жалғасып, гипернатриемия күшейеді — тұйық шеңбер.',
'Шөлдеу артады, ес бұзылады.',
'Тұйық шеңберді тек тұщы сумен үзуге болады.',
'Порочный круг при питье морской воды']},
{id:'cdh',c:4,r:3,dir:'cell',type:'main',t:'Жасуша ішілік гипогидратация',term:'клеточная дегидратация',s:[
'Жасушалар суын жоғалтып, кішірейеді.',
'Жасушадан тыс ортаның гиперосмостылығы.',
'Ферменттер мен нәруыз синтезі бұзылады; ми жасушалары ең сезімтал.',
'Тінаралық ісінуге қарамастан шырышты қабық құрғақ, шөлдеу қатты.',
'Суды біртіндеп толтыру.',
'Клеточная дегидратация']},
{id:'adh',c:1,r:4,dir:'neuro',type:'protect',t:'Бүйрек суды ұстайды',term:'антидиурез',s:[
'АДГ әсерімен бүйрек суды көп сіңіреді.',
'Плазма осмостылығы жоғары.',
'Осмостылық біршама түзеледі, бірақ жасушадан тыс көлем одан әрі артады.',
'Олигурия, зәр концентрацияланған.',
'Ілмектік диуретиктер (су мен Na⁺-ды бірге шығарады) және 5% глюкоза.',
'Антидиурез']},
{id:'hv',c:2,r:4,dir:'hemo',type:'main',t:'Жасушадан тыс көлем күрт артады: гиперволемия',term:'гиперволемия',s:[
'Айналымдағы қан мен тінаралық сұйықтық көлемі артады.',
'Түскен сұйықтыққа жасушадан шыққан су мен ұсталған су қосылады.',
'Веналық қысым артып, жүрекке жүктеме түседі; тінаралыққа сұйықтық шығады.',
'Мойын веналары ісінген, салмақ артады, Ht пен нәруыз төмен.',
'Ілмектік диуретиктер, тұз бен суды шектеу.',
'Гиперволемия']},
{id:'anp',c:3,r:4,dir:'neuro',type:'protect',t:'Натрийуретикалық пептидтер, натрийурез',term:'натрийурез',s:[
'ANP мен BNP бөлініп, бүйрек Na⁺-ды шығарады; РААЖ тежеледі.',
'Жүрекшелердің созылуы.',
'Артық Na⁺ біртіндеп шығады. Бүйрек Na⁺-ды теңіз суындағыдай концентрлей алмайтындықтан, бұл компенсация шектеулі.',
'Зәрде Na⁺ жоғары.',
'Ілмектік диуретиктер натрийурезді күшейтеді.',
'Натрийуретические пептиды, натрийурез']},
{id:'brain',c:4,r:4,dir:'organ',type:'damage',t:'Ми жасушалары сусызданып, кішірейеді',term:'дегидратация мозга',s:[
'Ми көлемі азайып, нейрондар қызметі бұзылады.',
'Ми жасушаларынан су шығады.',
'1–3 тәулікте мида идиогендік осмолдер жиналады; тез түзету ми ісінуіне әкеледі.',
'Қозу, гиперрефлексия, бұлшықет ригидтігі, құрысу.',
'Na⁺-ды баяу төмендету; неврологиялық бақылау.',
'Гиперосмолярная энцефалопатия']},
{id:'edema',c:1,r:5,dir:'organ',type:'damage',t:'Тінаралық ісіну',term:'отёки',s:[
'Сұйықтық тінаралыққа жиналады.',
'Қылтамырдағы гидростатикалық қысымның артуы, гемодилюциядан онкотикалық қысымның азаюы.',
'Шеткі ісіну, асцит.',
'Ісіну, салмақтың артуы.',
'Тұз бен суды шектеу, диуретиктер.',
'Отёки']},
{id:'htn',c:2,r:5,dir:'hemo',type:'main',t:'АҚ артады, жүрекке жүктеме түседі',term:'перегрузка объёмом',s:[
'Артериялық қысым көтеріліп, жүрек көлеммен жүктеледі.',
'Гиперволемия.',
'Сол жақ қарынша әлсіресе, кіші қанайналым шеңберінде іркіліс пайда болады.',
'Артериялық гипертензия, тахикардия, ентігу.',
'Диуретиктер, вазодилататорлар.',
'Объёмная перегрузка сердца']},
{id:'bleed',c:4,r:5,dir:'organ',type:'damage',t:'Ми тамырлары созылып жыртылады, қан құйылу',term:'внутричерепные кровоизлияния',s:[
'Ми кішірейгенде ми мен қатты қабық арасындағы көпір веналар созылады.',
'Ми көлемінің жедел азаюы, әсіресе нәрестелерде.',
'Субдуралдық, субарахноидтық және ми ішіне қан құйылу; көктамыр тромбозы.',
'Ес бұзылуы, ошақты неврологиялық белгілер.',
'Нейровизуализация, Na⁺-ды баяу түзету.',
'Субдуральные и внутримозговые кровоизлияния']},
{id:'k2',c:1,r:6,dir:'hemo',type:'clinic',t:'Ісіну, АҚ жоғары, ентігу және қатты шөлдеу',term:'клиника гипертонической гипергидратации',s:[
'Гиперволемия мен жасуша сусыздануы бірге көрінеді.',
'Сұйықтық жасушадан тыс секторда жиналып, жасушалар сусызданған.',
'Ісінген адамның қатты шөлдеуі — осы түрге тән белгі.',
'Ісіну, мойын веналары ісінген, АҚ жоғары, ылғалды сырылдар; шырышты қабық құрғақ.',
'Диурез бен салмақты бақылау.',
'Клиника гипертонической гипергидратации']},
{id:'lung',c:2,r:6,dir:'organ',type:'damage',t:'Өкпе ісінуі',term:'отёк лёгких',s:[
'Сұйықтық өкпе интерстицийі мен альвеолаларға шығады.',
'Кіші қанайналым шеңберінде гидростатикалық қысым артады.',
'Газ алмасу бұзылып, гипоксемия дамиды.',
'Ентігу, ортопноэ, ылғалды сырылдар, көбікті қақырық.',
'Отырғызу, оттегі, фуросемид; қажет болса диализ.',
'Отёк лёгких; oedema pulmonum']},
{id:'k1',c:4,r:6,dir:'organ',type:'clinic',t:'Қозу, құрысу, кома, ошақты белгілер',term:'гиперосмолярная энцефалопатия',s:[
'Гиперосмостық энцефалопатияның белгілері.',
'Ми жасушаларының сусыздануы және қан құйылу.',
'Ауырлығы Na⁺ деңгейі мен оның өсу жылдамдығына байланысты.',
'Мазасыздық, қозу, гиперрефлексия, құрысу, сопор, кома.',
'Na⁺-ды баяу төмендету.',
'Гиперосмолярная энцефалопатия']}

{f:'sea',to:'osm',k:'loop',p:R=>{const x=R.sea.r+206,y=R.osm.t+R.osm.h*.75;return [[R.sea.r,R.sea.cy],[x,R.sea.cy],[x,y],[R.osm.l,y]]}},
{f:'thirst',to:'adh',k:'main',p:R=>{const x=GX(0),y=R.thirst.t+R.thirst.h*.8;return [[R.thirst.r,y],[x,y],[x,R.adh.cy],[R.adh.l,R.adh.cy]]}},
{f:'osm',to:'shift',k:'main',p:R=>D(R.osm,R.shift)},
{f:'shift',to:'hv',k:'main',p:R=>D(R.shift,R.hv)},
{f:'shift',to:'cdh',k:'main',p:R=>BT(R.shift,R.cdh,.8)},
{f:'adh',to:'hv',k:'main',p:R=>Rt(R.adh,R.hv)},
{f:'hv',to:'anp',k:'main',p:R=>Rt(R.hv,R.anp)},
{f:'anp',to:'osm',k:'inh',p:R=>RUP(R.anp,R.osm)},
{f:'hv',to:'htn',k:'main',p:R=>D(R.hv,R.htn)},
{f:'hv',to:'edema',k:'main',p:R=>BT(R.hv,R.edema,.2)},
{f:'htn',to:'lung',k:'main',p:R=>D(R.htn,R.lung)},
{f:'edema',to:'k2',k:'main',p:R=>D(R.edema,R.k2)},
{f:'cdh',to:'brain',k:'main',p:R=>D(R.cdh,R.brain)},
{f:'brain',to:'bleed',k:'main',p:R=>D(R.brain,R.bleed)},
{f:'bleed',to:'k1',k:'main',p:R=>D(R.bleed,R.k1)}
],
markers:[R=>[(R.thirst.r+R.sea.r+206)/2,R.shift.cy]],
loops:[['osm','thirst','sea']],
overview:[
['Не болады','Na⁺ судан көп түседі немесе ұсталады. Су жасушалардан шығып, жасушадан тыс көлем артады: сыртта гиперволемия мен ісіну, ішінде жасушалар сусызданады.'],
['Басты буын','Гипернатриемия мен осмостылықтың артуы.'],
['Тұйық шеңбер','Теңіз суын ішкенде шөлдеу басылмайды; адам тұзды суды қайта ішіп, Na⁺ одан әрі көбейеді.'],
['Ерекшелігі','Ісіну мен қатты шөлдеу бірге болады. Жүрекке түсетін жүктеме де, ми жасушаларының сусыздануы да қауіпті.'],
['Емдік нүкте','Na⁺ түсуін тоқтату, ілмектік диуретик пен 5% глюкоза, бүйрек жеткіліксіздігінде диализ.']
]}
};

const COMPARE=[
['Не жиналады','Су мен Na⁺ тең үлесте','Су Na⁺-дан көп','Na⁺ судан көп'],
['Na⁺ плазмада','135–145 ммоль/л','135 ммоль/л-ден төмен','145 ммоль/л-ден жоғары'],
['Осмостылық','280–295 мОсм/кг','280 мОсм/кг-нан төмен','295 мОсм/кг-нан жоғары'],
['Су қозғалысы','Секторлар арасында жоқ','Жасушаға кіреді','Жасушадан шығады'],
['Жасушадан тыс көлем','Артады','Аздап артады','Күрт артады'],
['Жасуша ішілік көлем','Өзгермейді','Артады, жасуша ісінеді','Азаяды, жасуша сусызданады'],
['Шөлдеу','Жоқ','Жоқ, суға жиіркеніш','Өте қатты'],
['Басты қауіп','Өкпе ісінуі, жүрек жеткіліксіздігі','Ми ісінуі (су уыттануы)','Ми ішіне қан құйылу, өкпе ісінуі'],
['Ем','Тұз бен суды шектеу, ілмектік диуретиктер','Су шектеу; ауыр симптомда 3% NaCl; Na⁺ тәулігіне 8–10 ммоль/л-ден тез көтерілмейді','Na⁺ түсуін тоқтату, диуретик пен 5% глюкоза, диализ; Na⁺ баяу төмендетіледі']
];

<script>
(function(){
const DIRS={
  hemo:{name:'Гемодинамикалық',g:'Гд'},
  neuro:{name:'Нейрогуморалдық',g:'Нг'},
  metab:{name:'Метаболизмдік',g:'Мб'},
  immune:{name:'Иммундық-қабынулық',g:'Иқ'},
  cell:{name:'Жасушалық-молекулалық',g:'Жм'},
  organ:{name:'Мүшелік зақымданулар',g:'Мш'}
};
const TYPES={
  etio:{short:'Этиология',full:'Этиология',v:'--t-etio'},
  main:{short:'Басты буын',full:'Басты буын',v:'--t-main'},
  damage:{short:'Зақымдаушы',full:'Зақымдаушы буын',v:'--t-damage'},
  protect:{short:'Компенсаторлық',full:'Қорғаныш / компенсаторлық буын',v:'--t-protect'},
  clinic:{short:'Клиника',full:'Клиникалық белгі',v:'--t-clinic'}
};
const SEC=['Не болады','Неліктен','Нәтижесі','Клиника','Емдік нүкте','Термин'];
const KEYS=['iso','hypo','hyper'];
const CW=1184, TOP=44, GAP=48;

const canvas=document.getElementById('canvas');
const svg=document.getElementById('edges');
const panel=document.getElementById('panel');
const scroller=document.getElementById('scroller');
const tabsEl=document.getElementById('tabs');
const leadEl=document.getElementById('lead');
const cmpEl=document.getElementById('cmp');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
canvas.style.width=CW+'px';

let S,N,E,byId,els,sel=null,cur=null;

/* legend (once) */
(function(){
  let h='';
  for(const k in DIRS) h+=`<span class="lg"><span class="tag" style="--d:var(--d-${k})">${DIRS[k].g}</span>${DIRS[k].name}</span>`;
  h+='<span class="lg-sep"></span>';
  const tl={etio:'Этиология',main:'Басты буын',damage:'Зақымдаушы буын',protect:'Қорғаныш / компенсаторлық',clinic:'Клиникалық белгі'};
  for(const k in tl) h+=`<span class="lg"><span class="dot" style="--t:var(${TYPES[k].v})"></span>${tl[k]}</span>`;
  h+='<span class="lg-sep"></span>';
  const ln=(c,dash)=>`<svg width="30" height="10" viewBox="0 0 30 10"><line x1="1" y1="5" x2="22" y2="5" style="stroke:var(${c});stroke-width:1.5${dash?';stroke-dasharray:4 3':''}"/><path d="M29 5 L21 1 L21 9 Z" style="fill:var(${c})"/></svg>`;
  h+=`<span class="lg">${ln('--arrow')}Себеп-салдар</span>`;
  h+=`<span class="lg">${ln('--t-loop')}Тұйық шеңбер</span>`;
  h+=`<span class="lg">${ln('--t-cross',1)}Айқасқан байланыс</span>`;
  h+=`<span class="lg"><svg width="30" height="12" viewBox="0 0 30 12"><line x1="1" y1="6" x2="27" y2="6" style="stroke:var(--t-protect);stroke-width:1.5"/><line x1="27" y1="1" x2="27" y2="11" style="stroke:var(--t-protect);stroke-width:2"/></svg>Тежеу</span>`;
  document.getElementById('legend').innerHTML=h;
})();

/* tabs (once) */
tabsEl.innerHTML=KEYS.map(k=>`<button type="button" class="tab" role="tab" id="tab-${k}" data-k="${k}" aria-selected="false"><span class="tn">${SCHEMES[k].name}</span><span class="tv">${SCHEMES[k].vals}</span></button>`).join('');
tabsEl.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b&&b.dataset.k!==cur)mount(b.dataset.k)});
tabsEl.addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  const i=KEYS.indexOf(cur),n=KEYS[(i+(e.key==='ArrowRight'?1:2))%3];
  mount(n); document.getElementById('tab-'+n).focus();
});

function renderTable(){
  let h='<thead><tr><th scope="col">Көрсеткіш</th>'+KEYS.map((k,i)=>`<th scope="col"${k===cur?' class="cur"':''}>${SCHEMES[k].name}</th>`).join('')+'</tr></thead><tbody>';
  COMPARE.forEach(r=>{
    h+=`<tr><th scope="row">${esc(r[0])}</th>`+KEYS.map((k,i)=>`<td${k===cur?' class="cur"':''}>${esc(r[i+1])}</td>`).join('')+'</tr>';
  });
  cmpEl.innerHTML=h+'</tbody>';
}

function pathD(pts,rad){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const p0=pts[i-1],p=pts[i],p1=pts[i+1];
    const li=Math.hypot(p[0]-p0[0],p[1]-p0[1]),lo=Math.hypot(p1[0]-p[0],p1[1]-p[1]);
    if(!li||!lo){d+=` L${p[0]},${p[1]}`;continue}
    const r=Math.min(rad,li/2,lo/2);
    const di=[(p[0]-p0[0])/li,(p[1]-p0[1])/li],dout=[(p1[0]-p[0])/lo,(p1[1]-p[1])/lo];
    d+=` L${p[0]-di[0]*r},${p[1]-di[1]*r} Q${p[0]},${p[1]} ${p[0]+dout[0]*r},${p[1]+dout[1]*r}`;
  }
  const L=pts[pts.length-1];return d+` L${L[0]},${L[1]}`;
}

function draw(){
  if(!N)return;
  const rows=Math.max(...N.map(n=>n.r))+1, rh=new Array(rows).fill(0);
  N.forEach(n=>{rh[n.r]=Math.max(rh[n.r],els[n.id].offsetHeight)});
  const top=[];let y=TOP;
  for(let r=0;r<rows;r++){top[r]=y;y+=(rh[r]||44)+GAP}
  N.forEach(n=>{els[n.id].style.top=top[n.r]+'px'});
  const H=y-GAP+28; canvas.style.height=H+'px';
  const R={};
  N.forEach(n=>{const el=els[n.id];const l=el.offsetLeft,t=top[n.r],w=el.offsetWidth,h=el.offsetHeight;
    R[n.id]={l,t,w,h,r:l+w,b:t+h,cx:l+w/2,cy:t+h/2}});
  svg.setAttribute('width',CW); svg.setAttribute('height',H); svg.setAttribute('viewBox',`0 0 ${CW} ${H}`);
  let out='';
  E.forEach((e,i)=>{
    const raw=e.p(R); let pts=raw.map(p=>p.slice());
    const a=pts[pts.length-2],z=pts[pts.length-1];
    const len=Math.hypot(z[0]-a[0],z[1]-a[1]);const dx=(z[0]-a[0])/len,dy=(z[1]-a[1])/len;
    let extra='';
    if(e.k==='inh'){
      const bx=z[0]-dx*3,by=z[1]-dy*3; pts[pts.length-1]=[bx,by];
      extra=`<line class="bar" x1="${bx-dy*6}" y1="${by+dx*6}" x2="${bx+dy*6}" y2="${by-dx*6}" stroke-width="2"/>`;
    }else{
      pts[pts.length-1]=[z[0]-dx*8,z[1]-dy*8];
      const bx=z[0]-dx*9,by=z[1]-dy*9;
      extra=`<path class="hd" d="M${z[0]},${z[1]} L${bx-dy*4.5},${by+dx*4.5} L${bx+dy*4.5},${by-dx*4.5} Z"/>`;
    }
    let lab='',best=0,bi=0;
    for(let j=0;j<raw.length-1;j++){const l=Math.hypot(raw[j+1][0]-raw[j][0],raw[j+1][1]-raw[j][1]);if(l>best){best=l;bi=j}}
    if(e.lb&&best>=e.lb.length*8+24){
      const p=raw[bi],q=raw[bi+1];
      lab=Math.abs(p[1]-q[1])<1
        ?`<text class="elabel" x="${(p[0]+q[0])/2}" y="${p[1]-8}" text-anchor="middle">${esc(e.lb)}</text>`
        :`<text class="elabel" x="${p[0]+8}" y="${(p[1]+q[1])/2+4}" text-anchor="start">${esc(e.lb)}</text>`;
    }
    out+=`<g class="edge e-${e.k}" data-i="${i}"><path class="ln" d="${pathD(pts,8)}"/>${extra}${lab}</g>`;
  });
  (S.markers||[]).forEach((m,i)=>{
    const [cx,cy0]=m(R),cy=cy0-10,r=15;
    const a0=-50*Math.PI/180,a1=a0+300*Math.PI/180;
    const sx=cx+r*Math.cos(a0),sy=cy+r*Math.sin(a0),ex=cx+r*Math.cos(a1),ey=cy+r*Math.sin(a1);
    const tx=-Math.sin(a1),ty=Math.cos(a1),hb=[ex-tx*8,ey-ty*8];
    out+=`<g class="loopmark" data-l="${i}"><path class="loop-ic" d="M${sx},${sy} A${r},${r} 0 1 1 ${ex-tx*3},${ey-ty*3}"/>`+
      `<path class="loop-hd" d="M${ex+tx*2},${ey+ty*2} L${hb[0]-ty*4.5},${hb[1]+tx*4.5} L${hb[0]+ty*4.5},${hb[1]-tx*4.5} Z"/>`+
      `<text class="loop-lb" x="${cx}" y="${cy+r+20}" text-anchor="middle">тұйық шеңбер</text></g>`;
  });
  svg.innerHTML=out;
  applyFade();
}

function applyFade(){
  const s=sel?byId[sel]:null;
  N.forEach(n=>{
    const el=els[n.id];
    el.setAttribute('aria-pressed',String(n.id===sel));
    el.classList.toggle('faded',!!s&&n.dir!==s.dir&&n.id!==s.id);
  });
  svg.querySelectorAll('.edge').forEach(g=>{
    const e=E[+g.dataset.i];
    const keep=!s||e.f===sel||e.to===sel||(byId[e.f].dir===s.dir&&byId[e.to].dir===s.dir);
    g.classList.toggle('faded',!keep);
  });
  svg.querySelectorAll('.loopmark').forEach(g=>{
    const ids=(S.loops||[])[+g.dataset.l]||[];
    g.classList.toggle('faded',!!s&&!ids.includes(sel));
  });
}
const narrow=()=>window.matchMedia('(max-width:1099px)').matches;
function chip(id,suffix){
  const n=byId[id];
  return `<button type="button" class="chip" data-go="${id}" style="--d:var(--d-${n.dir})">${esc(n.t)}${suffix?' ('+suffix+')':''}</button>`;
}
const kindNote=k=>k==='inh'?'тежейді':k==='cross'?'айқасқан':'';
function renderPanel(){
  const n=sel?byId[sel]:null;
  if(!n){
    panel.style.setProperty('--pd','var(--t-main)');
    let h=`<div class="p-top"><h2>${esc(S.name)} гипергидратация</h2><button type="button" class="panel-close" data-close>Жабу</button></div>`;
    S.overview.forEach(([hd,p])=>{h+=`<div class="p-sec"><h3>${esc(hd)}</h3><p>${esc(p)}</p></div>`});
    h+=`<div class="p-sec"><h3>Схеманы оқу</h3><p>Түйінді басыңыз: таңдалған бағыт қалады, қалғандары бозарады. Бос жерді басу немесе Esc таңдауды алып тастайды.</p></div>`;
    panel.innerHTML=h; return;
  }
  panel.style.setProperty('--pd',`var(--d-${n.dir})`);
  const inc=E.filter(e=>e.to===n.id).map(e=>chip(e.f,kindNote(e.k)));
  const out=E.filter(e=>e.f===n.id).map(e=>chip(e.to,kindNote(e.k)));
  let h=`<div class="p-top"><h2>${esc(n.t)}</h2><button type="button" class="panel-close" data-close>Жабу</button></div>
    <div class="p-dir"><span class="tag" style="--d:var(--d-${n.dir})">${DIRS[n.dir].g}</span>${DIRS[n.dir].name}</div>
    <div class="p-type"><span class="dot" style="--t:var(${TYPES[n.type].v})"></span>${TYPES[n.type].full}</div>`;
  n.s.forEach((txt,i)=>{
    h+=i===5?`<div class="p-sec"><h3>${SEC[i]}</h3><p class="term-txt">(${esc(txt)})</p></div>`
            :`<div class="p-sec"><h3>${SEC[i]}</h3><p>${esc(txt)}</p></div>`;
  });
  if(inc.length||out.length){
    h+=`<div class="p-sec"><h3>Байланыстар</h3>`;
    if(inc.length) h+=`<div class="chip-lb">Алдыңғы буын</div><div class="chips">${inc.join('')}</div>`;
    if(out.length) h+=`<div class="chip-lb">Келесі буын</div><div class="chips">${out.join('')}</div>`;
    h+=`</div>`;
  }
  panel.innerHTML=h; panel.scrollTop=0;
}
function ensureVisible(id){
  const el=els[id];
  let nr=el.getBoundingClientRect(),cr=scroller.getBoundingClientRect();
  if(nr.left<cr.left+16||nr.right>cr.right-16) scroller.scrollLeft+=(nr.left+nr.width/2)-(cr.left+cr.width/2);
  if(narrow()){
    nr=el.getBoundingClientRect();
    const sheetTop=window.innerHeight-panel.offsetHeight;
    if(nr.bottom>sheetTop-12||nr.top<12) window.scrollBy(0,nr.top-72);
  }
}
function select(id){
  sel=id; applyFade(); renderPanel();
  panel.classList.toggle('open',!!id);
  document.body.style.paddingBottom=(id&&narrow())?panel.offsetHeight+'px':'';
  if(id) ensureVisible(id);
}

function mount(key){
  cur=key; S=SCHEMES[key]; N=S.nodes; E=S.edges; byId={}; N.forEach(n=>byId[n.id]=n);
  canvas.querySelectorAll('.node').forEach(b=>b.remove());
  els={};
  N.forEach(n=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='node'+(n.type==='main'?' main':'');
    b.style.left=(20+n.c*236)+'px';
    b.style.setProperty('--d',`var(--d-${n.dir})`);
    b.setAttribute('aria-pressed','false');
    b.title=DIRS[n.dir].name+' · '+TYPES[n.type].full;
    b.innerHTML=`<span class="meta"><span class="ty"><span class="dot" style="--t:var(${TYPES[n.type].v})"></span>${TYPES[n.type].short}</span><span class="tag">${DIRS[n.dir].g}</span></span><span class="ttl">${esc(n.t)}</span><span class="term">(${esc(n.term)})</span>`;
    b.addEventListener('click',e=>{e.stopPropagation();select(sel===n.id?null:n.id)});
    canvas.appendChild(b); els[n.id]=b;
  });
  KEYS.forEach(k=>document.getElementById('tab-'+k).setAttribute('aria-selected',String(k===key)));
  leadEl.textContent=S.lead+' Түйінді басыңыз — түсіндірме ашылады. Esc таңдауды алып тастайды.';
  renderTable();
  sel=null; draw(); select(null); scroller.scrollLeft=0;
  try{localStorage.setItem('hyperhydr-tab',key)}catch(_){}
}

panel.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){select(g.dataset.go);els[g.dataset.go].focus({preventScroll:true});return}
  if(e.target.closest('[data-close]')){const prev=sel;select(null);if(prev)els[prev].focus({preventScroll:true})}
});
canvas.addEventListener('click',()=>{if(sel)select(null)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sel)select(null)});
window.addEventListener('resize',()=>{document.body.style.paddingBottom=(sel&&narrow())?panel.offsetHeight+'px':''});

let start='iso';
const h=(location.hash||'').slice(1);
if(KEYS.includes(h)) start=h;
else{try{const s=localStorage.getItem('hyperhydr-tab');if(KEYS.includes(s))start=s}catch(_){}}
mount(start);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
window.addEventListener('load',draw);
})();
</script>
<script>
/* viewer bridge: two-finger pinch is sent to the reader, zoom keeps the point under the fingers in place, theme follows the reader */
(function(){
  if (window.parent === window) return;
  var z = 1, pinch = null, focal = null, lastW = innerWidth, lastH = innerHeight;
  function send(m){ try { parent.postMessage(m, '*'); } catch (e) {} }
  addEventListener('message', function(e){
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.__viewer === 'zoom' && typeof d.z === 'number') z = d.z;
    if (d.__viewer === 'theme') {
      if (d.theme) document.documentElement.setAttribute('data-theme', d.theme);
      else document.documentElement.removeAttribute('data-theme');
    }
  });
  function dist(t){ var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.sqrt(dx*dx + dy*dy); }
  function mid(t){ return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 }; }
  document.addEventListener('touchstart', function(e){
    if (e.touches.length === 2) { pinch = { d: dist(e.touches) * z, z: z }; focal = mid(e.touches); e.preventDefault(); }
  }, { passive: false });
  document.addEventListener('touchmove', function(e){
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    focal = mid(e.touches);
    var d = dist(e.touches) * z;
    if (pinch.d > 0) send({ __viewer: 'pinch', z: pinch.z * d / pinch.d });
  }, { passive: false });
  function end(e){
    if (pinch && e.touches.length < 2) {
      pinch = null; send({ __viewer: 'pinchend' });
      setTimeout(function(){ if (!pinch) focal = null; }, 300);
    }
  }
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', end);
  ['gesturestart', 'gesturechange'].forEach(function(t){ document.addEventListener(t, function(e){ e.preventDefault(); }); });
  /* trackpad pinch / ctrl + wheel on a computer */
  var wt = 0;
  addEventListener('wheel', function(e){
    if (!e.ctrlKey) return;
    e.preventDefault();
    focal = { x: e.clientX, y: e.clientY };
    send({ __viewer: 'pinch', z: z * Math.exp(-e.deltaY * 0.01) });
    clearTimeout(wt);
    wt = setTimeout(function(){ focal = null; send({ __viewer: 'pinchend' }); }, 400);
  }, { passive: false });
  addEventListener('resize', function(){
    var w = innerWidth, h = innerHeight, r = lastW / w, rh = lastH / h;
    var oldW = lastW, oldH = lastH;
    lastW = w; lastH = h;
    /* width and height change by the same factor only when the zoom changed (not on rotation) */
    if (Math.abs(r - 1) < 0.01 || Math.abs(r - rh) > 0.04 * r) return;
    var f = focal || { x: oldW / 2, y: oldH / 2 };
    var dx = f.x - f.x / r, dy = f.y - f.y / r;
    window.scrollBy(0, dy);
    var el = document.elementFromPoint(f.x / r, f.y / r);
    while (el && el !== document.body && el !== document.documentElement) {
      if (el.scrollWidth > el.clientWidth + 1) {
        var ox = getComputedStyle(el).overflowX;
        if (ox === 'auto' || ox === 'scroll') { el.scrollLeft += dx; break; }
      }
      el = el.parentElement;
    }
    if (focal) focal = { x: f.x / r, y: f.y / r };
  });
  send({ __viewer: 'ready' });
})();
</script>
