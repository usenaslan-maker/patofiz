lead:'Артерия қабырғасының қабынуы саңылауды тарылтып, бітейді. Схема симптомдардың (2-сұрақ), жағымсыз салдарлардың (3-сұрақ) және жасушалық зақымның (4-сұрақ) патогенезін көрсетеді.',

cond:'56 жастағы ер адам тез шаршауға, жүргенде балтыр бұлшықетінің ауыруына (тоқтағанда басылады — «ауық-ауық ақсау»), аяқтарының мұздауына, ұйып қалуына, жыбырлауына және тыныштықта шаншуына (парестезиялар) шағымданды. Тексергенде: табаны бозарған, терісі құрғақ, суық, тырнақтары сынғыш; екі аяқтың табан сыртындағы және балтырдың артқы артерияларында тамыр соғуы анықталмайды. Алдын ала диагнозы: бітелістік эндартериит.',
qa:[
['Шеткері қанайналымының қандай бұзылыстары туралы айтылған?',
'<p><b>Созылмалы обтурациялық (бітелістік) ишемия</b> — аяқ артерияларының қабынулық тарылуы мен бітелуі; оған <b>ангиоспастикалық</b> құрамдас қосылады. Жүктеме кезінде <b>салыстырмалы ишемия</b> («ауық-ауық ақсау»), ал тыныштықтағы парестезиялар ишемияның тереңдегенін көрсетеді (Фонтейн бойынша II–III саты).</p>'],
['Берілген симптомдардың патогенезін түсіндіріңіз',
'<ul><li><b>Жүргенде балтырдың ауыруы, тоқтағанда басылуы</b> — бұлшықет жұмысында O₂ қажеттілігі бірнеше есе артады, ал тарылған артерия қан ағысын көбейте алмайды (жұмыстық гиперемия жоқ). Анаэробты гликолизден лактат, H⁺, сондай-ақ K⁺, брадикинин, аденозин жиналып, ноцицепторларды тітіркендіреді. Тоқтағанда қажеттілік азайып, метаболиттер шайылады.</li><li><b>Тез шаршау</b> — бұлшықетте АТФ пен креатинфосфат тез таусылады, ацидоз жиырылуды әлсіретеді.</li><li><b>Аяқтың мұздауы, табанның бозаруы</b> — жылы артериялық қан аз келеді, жұмыс істейтін қылтамырлар азаяды, зат алмасу мен жылу түзілуі төмендейді.</li><li><b>Ұйып қалу, жыбырлау, тыныштықта шаншу</b> — ишемиялық нейропатия: жүйке талшықтарын қоректендіретін тамырлардың (vasa nervorum) жеткіліксіздігінен серпін түзілуі мен өткізілуі бұзылады.</li><li><b>Құрғақ тері, сынғыш тырнақ</b> — трофиканың бұзылуы: тер және май бездерінің, тырнақ матриксінің гипоксиясы, кератин түзілуінің бұзылуы.</li><li><b>Тамыр соғуының жоқтығы</b> — проксималь бөлімде артерия саңылауы бітелген, пульс толқыны дистальға жетпейді.</li></ul>'],
['Науқастағы қанайналым бұзылыстарының мүмкін болатын жағымсыз әсерлері қандай?',
'<ul><li>Тыныштықтағы тұрақты ауыру (сыни ишемия), ұйқының бұзылуы.</li><li>Бұлшықеттер, тері, тері асты шелінің атрофиясы; түктердің түсуі.</li><li>Трофикалық жаралар (саусақ ұшында, өкшеде) — болмашы жарақаттан кейін де жазылмайды.</li><li>Құрғақ гангрена; инфекция қосылса — дымқыл гангрена, сепсис; ақыры аяқ ампутациясы.</li><li>Тарылған жерде тромбоз — жедел ишемия.</li></ul>'],
['Зақымдану патогенезін түсіндіріңіз',
'<p>Ишемия → O₂ жетіспейді → тотығу фосфорлануы тоқтайды → <b>АТФ ↓</b>. Одан әрі:</p><ul><li>Na⁺/K⁺-АТФаза әлсірейді → жасушаға Na⁺ пен су кіреді → жасуша ісінеді.</li><li>Ca²⁺-АТФаза әлсірейді, Na⁺/Ca²⁺ алмастырғыш кері жұмыс істейді → цитозолда <b>Ca²⁺ ↑</b> → фосфолипаза A₂, кальпаиндер, эндонуклеазалар белсенеді → мембрана мен цитоқаңқа бұзылады.</li><li>Анаэробты гликолиз → лактат, <b>ацидоз</b> → лизосома мембранасы тұрақсызданып, гидролазалар шығады (аутолиз).</li><li>Зақымданған митохондриялар оттегінің белсенді түрлерін түзеді → липидтердің асқын тотығуы → мембраналар зақымы.</li><li>Ақыры жасушалардың <b>некрозы</b> (және апоптозы) → трофикалық жара, гангрена.</li></ul><p>Тұйық шеңбер: ишемия → эндотелий зақымы → тромбоз → бітелу ұлғаяды → ишемия тереңдейді.</p>']
]},

'<p><b>Жергілікті (балтырдағы) веналық гиперемия</b> — көктамырлық ағып кетудің жедел бұзылуы. Варикозды көктамырда қақпақшалар жеткіліксіз, ағыс баяу, қабырға өзгерген. Жүрген кезде бұлшықет помпасы қанды кері айдап (рефлюкс), веналық қысым күрт өседі және (немесе) варикозды түйінде тромб түзіліп, ағып кетуді уақытша бөгейді.</p>'],

qa:[
['Эмболия көздері',
'<ul><li><b>Майлы эмбол (ең ықтимал)</b> — ұзын жілік сүйектерінің (сан, асықты жілік) сары кемігіндегі май жасушалары; сынық неғұрлым көп әрі ірі болса, қауіп соғұрлым жоғары. Белгілер жарақаттан бірнеше сағаттан 72 сағатқа дейін пайда болады.</li><li><b>Тромбоэмбол</b> — аяқтың терең көктамырларындағы тромб (жарақат, иммобилизация, гиперкоагуляция). Тромбтың түзілуіне әдетте бірнеше күн керек, сондықтан бірнеше сағатта майлы эмболия ықтималырақ; бірақ ауыр жарақатта тромбоз ерте басталуы мүмкін.</li><li>Сирек: <b>тін эмболиясы</b> (жаншылған тін, сүйек кемігінің бөлшектері), <b>ауа эмболиясы</b> (ірі көктамыр зақымданса).</li></ul>'],
['Эмболдардың қанға түсу тетіктері',
'<p><b>Майлы эмболия:</b></p><ul><li><b>Механикалық теория</b>: сынықта кемік ішілік қысым көктамыр қысымынан асады; сүйек кемігінің синустары сүйек тініне бекіген, жыртылғанда жабылмайды — май тамшылары көктамырларға сорылады → төменгі қуыс көктамыр → оң жүрек → өкпе артериясы. Диаметрі 8–10 мкм-ден үлкен тамшылар өкпе қылтамырларында тоқтайды.</li><li><b>Биохимиялық теория</b>: стресс → катехоламиндер → липолиз ↑; С-реактивті нәруыз хиломикрондар мен липопротеидтерді біріктіріп, ірі май тамшыларын түзеді. Өкпеде липаза майды ыдыратып, <b>бос май қышқылдары</b> түзеді → эндотелий мен пневмоциттер зақымы, сурфактант бұзылады → өкпе ісінуі, ЖРДС.</li><li>Ұсақ тамшылар өкпе қылтамырларынан немесе ашық сопақ тесік арқылы үлкен шеңберге өтеді → ми, тері (петехиялар), бүйрек эмболиясы.</li></ul><p><b>Тромбоэмболия:</b> Вирхов үштігі — тамыр зақымы (жарақат), ағыстың баяулауы (иммобилизация, ісіну), гиперкоагуляция (тіндік фактор, стресс) → терең көктамыр тромбозы → тромб бөлшегі үзіліп, оң жүрек арқылы өкпе артериясына түседі.</p>'],
['Өкпе артериясы эмболиясының патогенезі',
'<ul><li><b>Механикалық бітелу</b> → өкпе тамырларының кедергісі ↑ → <b>өкпелік гипертензия</b> → оң қарыншаға жүктеме → жедел өкпелік жүрек → оң қарынша кеңейіп, қарыншааралық перде солға ығысады → сол қарынша толуы ↓ → жүрекшығарым ↓ → гипотензия, шок.</li><li><b>Рефлекстер</b>: пульмо-коронарлық (коронар артерияларының спазмы), пульмо-васкулярлық (басқа өкпе тамырларының тарылуы), <b>Парин рефлексі</b> (брадикардия, үлкен шеңбер тамырларының кеңеюі → АҚ ↓), бронхоспазм.</li><li><b>Гуморальдық әсер</b>: эмбол бетіндегі тромбоциттерден серотонин, тромбоксан A₂, гистамин → тамыр мен бронх тарылуы.</li><li><b>Газ алмасу</b>: өлі кеңістік ↑, вентиляция–перфузия сәйкессіздігі, шунт → <b>гипоксемия</b> → ентігу, цианоз, тахикардия.</li><li><b>Тұйық шеңбер</b>: оң қарынша жеткіліксіздігі → жүрекшығарым мен АҚ ↓ → коронарлық перфузия ↓ → оң қарынша ишемиясы → жеткіліксіздік тереңдейді.</li></ul>']

qa:[

'<p><b>Декомпрессиялық (кессон) ауру</b> және <b>газ эмболиясы</b>. Тереңдікте жоғары қысымда (әр 10 м сайын +1 атм) тыныс газдары, әсіресе азот, қан мен тіндерде көп ериді (Генри заңы). Тез көтерілгенде сыртқы қысым кенет төмендеп, еріген азот газ күйіне өтеді — қан мен тіндерде көпіршіктер түзіледі (ашылған газдалған сусын сияқты).</p><p>Сонымен бірге тынысты ұстап көтерілгенде өкпедегі газ кеңейіп (Бойль заңы), альвеолалар жыртылуы мүмкін — <b>өкпе баротравмасы</b>. Ауа өкпе көктамырлары арқылы сол жүрекке, одан ми артерияларына түседі — <b>артериялық газ эмболиясы</b>.</p>'],
['Естен танудың себебі мен даму тетіктері қандай?',
'<p><b>Себебі</b> — ми артерияларының газ эмболиясы → мидың жедел ишемиясы.</p><ul><li><b>Артериялық газ эмболиясы</b>: өкпе баротравмасынан түскен ауа немесе азот көпіршіктері (веналық көпіршіктер өкпе сүзгісінен немесе ашық сопақ тесіктен өткенде) ми артерияларын бітейді → нейрондар гипоксиясы → бірнеше минут ішінде есінен тану, құрысу, сал.</li><li><b>Кіші шеңбердің газ эмболиясы</b>: көп веналық көпіршіктер өкпе артериясын бітеп, өкпелік гипертензия мен оң жүрек жүктемесін тудырады; жаппай болса, оң жүректе «газ тығыны» түзіліп, жүрекшығарым күрт азаяды → ми перфузиясы ↓.</li><li><b>Көпіршік–қан шекарасы</b>: тромбоциттер мен комплемент белсенеді, эндотелий зақымданады → өткізгіштік ↑, плазма шығып, қан қоюланады → микроциркуляция нашарлап, көпіршіктер одан әрі ұсталады (тұйық шеңбер).</li><li>Тіндік көпіршіктер (жұлын, буын, бұлшықет) — сал, буын ауыруы, тері қышуы мен «мәрмәр» тері.</li></ul><p><b>Емдік нүкте:</b> барокамерада рекомпрессия (көпіршіктер кішірейіп, газ қайта ериді) және 100% оттегі (азотты шығаруды жылдамдатады); горизонталь қалып, инфузия.</p>']

    L+=`<div class="sec"><h3>Әдісі қысқаша</h3><p>${A.method}</p></div>`;
    L+=`<div class="sec"><h3>Не байқалады</h3><ul>${A.obs.map(o=>`<li>${o}</li>`).join('')}</ul></div>`;
    L+=`<div class="sec" style="max-width:none"><h3>Дәптерге сурет</h3><div class="fig">${A.fig}</div><p class="figcap">${A.figcap}</p></div>`;
    L+=`<div class="sec"><h3>Қорытынды</h3>${A.concl}</div>`;
  }else{
    L+=`<p class="cond">${A.cond}</p><div class="qa">`;
    A.qa.forEach(([q,a],i)=>{L+=`<div><div class="q"><span class="qn">${i+1}</span><span>${q}</span></div><div class="a">${a}</div></div>`});
    L+='</div>';
  }
  L+='</div>';
  const R=`<div><div class="chain"><p class="eyebrow">Патогенез тізбегі (дәптерге)</p><ol>${chainHTML(S.chain)}</ol>${S.chainNote?`<p class="chain-note">${esc(S.chainNote)}</p>`:''}</div></div>`;
  ansEl.innerHTML=L+R;
}

function renderTable(){
  let h='<thead><tr><th scope="col">Тапсырма</th><th scope="col">Бұзылыс түрі</th><th scope="col">Басты буын</th><th scope="col">Тұйық шеңбер</th><th scope="col">Гипоксия, салдары</th></tr></thead><tbody>';
  KEYS.forEach(k=>{
    const s=SCHEMES[k].sum;
    h+=`<tr${k===cur?' class="cur"':''}><th scope="row"><button type="button" class="rowbtn" data-k="${k}">${esc(SCHEMES[k].tab)}</button></th>`+s.map(x=>`<td>${esc(x)}</td>`).join('')+'</tr>';
  });
  cmpEl.innerHTML=h+'</tbody>';
}
cmpEl.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b){mount(b.dataset.k);document.getElementById('tab-'+b.dataset.k).scrollIntoView({block:'center'});document.getElementById('tab-'+b.dataset.k).focus({preventScroll:true})}});

function pathD(pts,rad){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const p0=pts[i-1],p=pts[i],p1=pts[i+1];
    const li=Math.hypot(p[0]-p0[0],p[1]-p0[1]),lo=Math.hypot(p1[0]-p[0],p1[1]-p[1]);
    if(!li||!lo){d+=` L${p[0]},${p[1]}`;continue}
    const r=Math.min(rad,li/2,lo/2);
    const di=[(p[0]-p0[0])/li,(p[1]-p0[1])/li],dout=[(p1[0]-p[0])/lo,(p1[1]-p[1])/lo];
    d+=` L${p[0]-di[0]*r},${p[1]-di[1]*r} Q${p[0]},${p[1]} ${p[0]+dout[0]*r},${p[1]+dout[1]*r}`;
  }
  const L=pts[pts.length-1];return d+` L${L[0]},${L[1]}`;
}

function draw(){
  if(!N)return;
  const rows=Math.max(...N.map(n=>n.r))+1, rh=new Array(rows).fill(0);
  N.forEach(n=>{rh[n.r]=Math.max(rh[n.r],els[n.id].offsetHeight)});
  const top=[];let y=TOP;
  for(let r=0;r<rows;r++){top[r]=y;y+=(rh[r]||44)+GAP}
  N.forEach(n=>{els[n.id].style.top=top[n.r]+'px'});
  const H=y-GAP+28; canvas.style.height=H+'px';
  const R={};
  N.forEach(n=>{const el=els[n.id];const l=el.offsetLeft,t=top[n.r],w=el.offsetWidth,h=el.offsetHeight;
    R[n.id]={l,t,w,h,r:l+w,b:t+h,cx:l+w/2,cy:t+h/2}});
  svg.setAttribute('width',CW); svg.setAttribute('height',H); svg.setAttribute('viewBox',`0 0 ${CW} ${H}`);
  let out='';
  E.forEach((e,i)=>{
    const raw=e.p(R); let pts=raw.map(p=>p.slice());
    const a=pts[pts.length-2],z=pts[pts.length-1];
    const len=Math.hypot(z[0]-a[0],z[1]-a[1]);const dx=(z[0]-a[0])/len,dy=(z[1]-a[1])/len;
    let extra='';
    if(e.k==='inh'){
      const bx=z[0]-dx*3,by=z[1]-dy*3; pts[pts.length-1]=[bx,by];
      extra=`<line class="bar" x1="${bx-dy*6}" y1="${by+dx*6}" x2="${bx+dy*6}" y2="${by-dx*6}" stroke-width="2"/>`;
    }else{
      pts[pts.length-1]=[z[0]-dx*8,z[1]-dy*8];
      const bx=z[0]-dx*9,by=z[1]-dy*9;
      extra=`<path class="hd" d="M${z[0]},${z[1]} L${bx-dy*4.5},${by+dx*4.5} L${bx+dy*4.5},${by-dx*4.5} Z"/>`;
    }
    let lab='',best=0,bi=0;
    for(let j=0;j<raw.length-1;j++){const l=Math.hypot(raw[j+1][0]-raw[j][0],raw[j+1][1]-raw[j][1]);if(l>best){best=l;bi=j}}
    if(e.lb&&best>=e.lb.length*8+24){
      const p=raw[bi],q=raw[bi+1];
      lab=Math.abs(p[1]-q[1])<1
        ?`<text class="elabel" x="${(p[0]+q[0])/2}" y="${p[1]-8}" text-anchor="middle">${esc(e.lb)}</text>`
        :`<text class="elabel" x="${p[0]+8}" y="${(p[1]+q[1])/2+4}" text-anchor="start">${esc(e.lb)}</text>`;
    }
    out+=`<g class="edge e-${e.k}" data-i="${i}"><path class="ln" d="${pathD(pts,8)}"/>${extra}${lab}</g>`;
  });
  (S.markers||[]).forEach((m,i)=>{
    const [cx,cy0]=m(R),cy=cy0-10,r=15;
    const a0=-50*Math.PI/180,a1=a0+300*Math.PI/180;
    const sx=cx+r*Math.cos(a0),sy=cy+r*Math.sin(a0),ex=cx+r*Math.cos(a1),ey=cy+r*Math.sin(a1);
    const tx=-Math.sin(a1),ty=Math.cos(a1),hb=[ex-tx*8,ey-ty*8];
    out+=`<g class="loopmark" data-l="${i}"><path class="loop-ic" d="M${sx},${sy} A${r},${r} 0 1 1 ${ex-tx*3},${ey-ty*3}"/>`+
      `<path class="loop-hd" d="M${ex+tx*2},${ey+ty*2} L${hb[0]-ty*4.5},${hb[1]+tx*4.5} L${hb[0]+ty*4.5},${hb[1]-tx*4.5} Z"/>`+
      `<text class="loop-lb" x="${cx}" y="${cy+r+20}" text-anchor="middle">тұйық шеңбер</text></g>`;
  });
  svg.innerHTML=out;
  applyFade();
}

function applyFade(){
  const s=sel?byId[sel]:null;
  N.forEach(n=>{
    const el=els[n.id];
    el.setAttribute('aria-pressed',String(n.id===sel));
    el.classList.toggle('faded',!!s&&n.dir!==s.dir&&n.id!==s.id);
  });
  svg.querySelectorAll('.edge').forEach(g=>{
    const e=E[+g.dataset.i];
    const keep=!s||e.f===sel||e.to===sel||(byId[e.f].dir===s.dir&&byId[e.to].dir===s.dir);
    g.classList.toggle('faded',!keep);
  });
  svg.querySelectorAll('.loopmark').forEach(g=>{
    const ids=(S.loops||[])[+g.dataset.l]||[];
    g.classList.toggle('faded',!!s&&!ids.includes(sel));
  });
}
const narrow=()=>window.matchMedia('(max-width:1099px)').matches;
function chip(id,suffix){
  const n=byId[id];
  return `<button type="button" class="chip" data-go="${id}" style="--d:var(--d-${n.dir})">${esc(n.t)}${suffix?' ('+suffix+')':''}</button>`;
}
const kindNote=k=>k==='inh'?'тежейді':k==='cross'?'айқасқан':'';
function renderPanel(){
  const n=sel?byId[sel]:null;
  if(!n){
    panel.style.setProperty('--pd','var(--t-main)');
    let h=`<div class="p-top"><h2>${esc(S.full)}</h2><button type="button" class="panel-close" data-close>Жабу</button></div>`;
    S.overview.forEach(([hd,p])=>{h+=`<div class="p-sec"><h3>${esc(hd)}</h3><p>${esc(p)}</p></div>`});
    h+=`<div class="p-sec"><h3>Схеманы оқу</h3><p>Түйінді басыңыз: таңдалған бағыт қалады, қалғандары бозарады. Бос жерді басу немесе Esc таңдауды алып тастайды.</p></div>`;
    panel.innerHTML=h; return;
  }
  panel.style.setProperty('--pd',`var(--d-${n.dir})`);
  const inc=E.filter(e=>e.to===n.id).map(e=>chip(e.f,kindNote(e.k)));
  const out=E.filter(e=>e.f===n.id).map(e=>chip(e.to,kindNote(e.k)));
  let h=`<div class="p-top"><h2>${esc(n.t)}</h2><button type="button" class="panel-close" data-close>Жабу</button></div>
    <div class="p-dir"><span class="tag" style="--d:var(--d-${n.dir})">${DIRS[n.dir].g}</span>${DIRS[n.dir].name}</div>
    <div class="p-type"><span class="dot" style="--t:var(${TYPES[n.type].v})"></span>${TYPES[n.type].full}</div>`;
  n.s.forEach((txt,i)=>{
    h+=i===5?`<div class="p-sec"><h3>${SEC[i]}</h3><p class="term-txt">(${esc(txt)})</p></div>`
            :`<div class="p-sec"><h3>${SEC[i]}</h3><p>${esc(txt)}</p></div>`;
  });
  if(inc.length||out.length){
    h+=`<div class="p-sec"><h3>Байланыстар</h3>`;
    if(inc.length) h+=`<div class="chip-lb">Алдыңғы буын</div><div class="chips">${inc.join('')}</div>`;
    if(out.length) h+=`<div class="chip-lb">Келесі буын</div><div class="chips">${out.join('')}</div>`;
    h+=`</div>`;
  }
  panel.innerHTML=h; panel.scrollTop=0;
}
function ensureVisible(id){
  const el=els[id];
  let nr=el.getBoundingClientRect(),cr=scroller.getBoundingClientRect();
  if(nr.left<cr.left+16||nr.right>cr.right-16) scroller.scrollLeft+=(nr.left+nr.width/2)-(cr.left+cr.width/2);
  if(narrow()){
    nr=el.getBoundingClientRect();
    const sheetTop=window.innerHeight-panel.offsetHeight;
    if(nr.bottom>sheetTop-12||nr.top<12) window.scrollBy(0,nr.top-72);
  }
}
function select(id){
  sel=id; applyFade(); renderPanel();
  panel.classList.toggle('open',!!id);
  document.body.style.paddingBottom=(id&&narrow())?panel.offsetHeight+'px':'';
  if(id) ensureVisible(id);
}

function mount(key){
  cur=key; S=SCHEMES[key]; N=S.nodes; E=S.edges; byId={}; N.forEach(n=>byId[n.id]=n);
  canvas.querySelectorAll('.node').forEach(b=>b.remove());
  els={};
  N.forEach(n=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='node'+(n.type==='main'?' main':'');
    b.style.left=(20+n.c*236)+'px';
    b.style.setProperty('--d',`var(--d-${n.dir})`);
    b.setAttribute('aria-pressed','false');
    b.title=DIRS[n.dir].name+' · '+TYPES[n.type].full;
    b.innerHTML=`<span class="meta"><span class="ty"><span class="dot" style="--t:var(${TYPES[n.type].v})"></span>${TYPES[n.type].short}</span><span class="tag">${DIRS[n.dir].g}</span></span><span class="ttl">${esc(n.t)}</span><span class="term">(${esc(n.term)})</span>`;
    b.addEventListener('click',e=>{e.stopPropagation();select(sel===n.id?null:n.id)});
    canvas.appendChild(b); els[n.id]=b;
  });
  KEYS.forEach(k=>document.getElementById('tab-'+k).setAttribute('aria-selected',String(k===key)));
  renderAns();
  {const tb=document.getElementById('tab-'+key),tp=tb.parentElement;if(tp.scrollWidth>tp.clientWidth){const l=tb.getBoundingClientRect().left-tp.getBoundingClientRect().left+tp.scrollLeft;if(l<tp.scrollLeft||l+tb.offsetWidth>tp.scrollLeft+tp.clientWidth)tp.scrollLeft=Math.max(0,l-16)}}
  leadEl.textContent=S.lead+' Түйінді басыңыз — түсіндірме ашылады. Esc таңдауды алып тастайды.';
  renderTable();
  sel=null; draw(); select(null); scroller.scrollLeft=0;
  try{localStorage.setItem('pc-practice-tab',key)}catch(_){}
}

panel.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){select(g.dataset.go);els[g.dataset.go].focus({preventScroll:true});return}
  if(e.target.closest('[data-close]')){const prev=sel;select(null);if(prev)els[prev].focus({preventScroll:true})}
});
canvas.addEventListener('click',()=>{if(sel)select(null)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sel)select(null)});
window.addEventListener('resize',()=>{document.body.style.paddingBottom=(sel&&narrow())?panel.offsetHeight+'px':''});

let start=KEYS[0];
const h=(location.hash||'').slice(1);
if(KEYS.includes(h)) start=h;
else{try{const s=localStorage.getItem('pc-practice-tab');if(KEYS.includes(s))start=s}catch(_){}}
mount(start);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
window.addEventListener('load',draw);
})();
</script>

<script>
/* viewer bridge: two-finger pinch is sent to the reader, zoom keeps the point under the fingers in place, theme follows the reader */
(function(){
  if (window.parent === window) return;
  var z = 1, pinch = null, focal = null, lastW = innerWidth, lastH = innerHeight;
  function send(m){ try { parent.postMessage(m, '*'); } catch (e) {} }
  addEventListener('message', function(e){
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.__viewer === 'zoom' && typeof d.z === 'number') z = d.z;
    if (d.__viewer === 'theme') {
      if (d.theme) document.documentElement.setAttribute('data-theme', d.theme);
      else document.documentElement.removeAttribute('data-theme');
    }
  });
  function dist(t){ var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.sqrt(dx*dx + dy*dy); }
  function mid(t){ return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 }; }
  document.addEventListener('touchstart', function(e){
    if (e.touches.length === 2) { pinch = { d: dist(e.touches) * z, z: z }; focal = mid(e.touches); e.preventDefault(); }
  }, { passive: false });
  document.addEventListener('touchmove', function(e){
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    focal = mid(e.touches);
    var d = dist(e.touches) * z;
    if (pinch.d > 0) send({ __viewer: 'pinch', z: pinch.z * d / pinch.d });
  }, { passive: false });
  function end(e){
    if (pinch && e.touches.length < 2) {
      pinch = null; send({ __viewer: 'pinchend' });
      setTimeout(function(){ if (!pinch) focal = null; }, 300);
    }
  }
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', end);
  ['gesturestart', 'gesturechange'].forEach(function(t){ document.addEventListener(t, function(e){ e.preventDefault(); }); });
  /* trackpad pinch / ctrl + wheel on a computer */
  var wt = 0;
  addEventListener('wheel', function(e){
    if (!e.ctrlKey) return;
    e.preventDefault();
    focal = { x: e.clientX, y: e.clientY };
    send({ __viewer: 'pinch', z: z * Math.exp(-e.deltaY * 0.01) });
    clearTimeout(wt);
    wt = setTimeout(function(){ focal = null; send({ __viewer: 'pinchend' }); }, 400);
  }, { passive: false });
  addEventListener('resize', function(){
    var w = innerWidth, h = innerHeight, r = lastW / w, rh = lastH / h;
    var oldW = lastW, oldH = lastH;
    lastW = w; lastH = h;
    /* width and height change by the same factor only when the zoom changed (not on rotation) */
    if (Math.abs(r - 1) < 0.01 || Math.abs(r - rh) > 0.04 * r) return;
    var f = focal || { x: oldW / 2, y: oldH / 2 };
    var dx = f.x - f.x / r, dy = f.y - f.y / r;
    window.scrollBy(0, dy);
    var el = document.elementFromPoint(f.x / r, f.y / r);
    while (el && el !== document.body && el !== document.documentElement) {
      if (el.scrollWidth > el.clientWidth + 1) {
        var ox = getComputedStyle(el).overflowX;
        if (ox === 'auto' || ox === 'scroll') { el.scrollLeft += dx; break; }
      }
      el = el.parentElement;
    }
    if (focal) focal = { x: f.x / r, y: f.y / r };
  });
  send({ __viewer: 'ready' });
})();
</script>
